[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
filterwarnings = [
    "error",
    # pyrogram.sync вызывает asyncio.get_event_loop() на импорте, вне
    # работающего цикла событий — предупреждение из самого asyncio, но
    # триггерит его код pyrogram, поэтому глушим по модулю pyrogram.sync.
    "ignore:There is no current event loop:DeprecationWarning:pyrogram.sync",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["F401", "F821", "ARG002", "C901", "PLR0912", "PLR0913", "PLR0915", "RUF100", "E402"]

[tool.ruff.lint.per-file-ignores]
# Ввоз журнальных модулей стоит после `logging.basicConfig` нарочно: буфер
# окна и заслон секретов вешаются на уже собранные обработчики, а собраны они
# строкой выше. Поставь ввоз наверх — заслон встанет до обработчиков и
# пропустит первые записи с токенами.
"main.py" = ["E402"]

[tool.ruff.lint.mccabe]
max-complexity = 10
