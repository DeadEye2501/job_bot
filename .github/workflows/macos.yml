name: macOS

on:
  # Ручной запуск — собрать мак-бандл артефактом без нового релиза.
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      PIPENV_PIPFILE: macos/Pipfile
      # HTTPS у llama.cpp выключен: вшитый в него cpp-httplib не собирается с
      # OpenSSL 4 из Homebrew раннера, а HTTPS нужен только для скачивания
      # модели по ссылке — приложение читает .gguf с диска.
      CMAKE_ARGS: -DGGML_METAL=on -DLLAMA_OPENSSL=OFF
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          architecture: arm64

      - name: Зависимости
        run: |
          pip install pipenv
          [ -f macos/Pipfile.lock ] || pipenv lock
          pipenv install --dev --deploy

      # Lock-файл мака собирается здесь, а не на Windows: так он попадает в
      # руки и коммитится, а версии pyobjc закрепляются по нему.
      - uses: actions/upload-artifact@v4
        with:
          name: Pipfile.lock
          path: macos/Pipfile.lock

      - name: Тесты двойников
        # Красная фаза видна целиком: тест, чей модуль ещё не написан, не
        # заслоняет остальные.
        # Замок единственной копии сторожит общий тест, а не мак-копия его: он
        # зависит только от `tmp_path` и идёт без общего стенда `tests/`, чей
        # сторож каталога данных на маке падает.
        run: |
          pipenv run python -m pytest macos/tests -q -p no:cacheprovider --continue-on-collection-errors
          pipenv run python -m pytest "tests/backend/test_single_instance.py::test_a_second_copy_is_refused" -q -p no:cacheprovider --noconftest

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Фронт
        run: cd client/web && npm ci && npm run build

      - name: Сборка JobBot.app
        run: |
          bash macos/make_icns.sh
          pipenv run python -m PyInstaller JobBot-macos.spec --clean --noconfirm

      # Ловит то, чего тесты двойников не видят: пропущенный hiddenimport,
      # бэкенд ключницы, падение Cocoa на старте собранного бандла. Домашний
      # каталог настоящий: ключница мака живёт в нём, и с подменённым
      # бэкенд не нашёл бы её.
      - name: Проверка запуска
        run: |
          log="$HOME/Library/Application Support/JobBot/jobbot.log"
          dist/JobBot.app/Contents/MacOS/JobBot &
          app=$!
          sleep 30
          cat "$log"
          kill -0 "$app"
          kill "$app"
          grep -q "окно открывается" "$log"
          ! grep -q Traceback "$log"

      # Тесты гоняют сторожа из исходников, а в бандле он запускается иначе —
      # той же программой с флагом. Ошибку в нём не увидел бы никто: журнала
      # сторож не пишет.
      - name: Сторож в бандле
        run: |
          sleep 60 &
          victim=$!
          echo "$victim" | dist/JobBot.app/Contents/MacOS/JobBot --tie-watch
          status=0
          wait "$victim" || status=$?
          [ "$status" -eq 137 ]

      - name: Архив
        run: ditto -c -k --keepParent dist/JobBot.app JobBot-macos.zip

      # Подпись происхождения: `gh attestation verify JobBot-macos.zip -R <репозиторий>`
      # показывает, что архив собран здесь из этого коммита.
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: JobBot-macos.zip

      - uses: actions/upload-artifact@v4
        with:
          name: JobBot-macos
          path: JobBot-macos.zip

      - name: В релиз
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        # Повторный прогон того же релиза заменяет файл, а не падает на нём.
        run: gh release upload "${{ github.event.release.tag_name }}" JobBot-macos.zip --clobber
