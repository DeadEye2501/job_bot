[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
timezone = UTC

# Keep this file ASCII: alembic reads it in the locale encoding, and on Windows
# with cp1252 a Cyrillic byte breaks the app at startup.
# sqlalchemy.url comes from config.get_database_url() in alembic/env.py.

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
