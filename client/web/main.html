  function renderContacts() {
    // Preserve list / detail scroll across re-renders — clicking a row
    // (or any state change) re-creates the panes via innerHTML wipe and
    // would otherwise jump the user back to the top mid-scroll.
    const oldList = mainSlot.querySelector('.cnt-list');
    const oldDetail = mainSlot.querySelector('.cnt-detail-pane');
    const savedListScroll = oldList ? oldList.scrollTop : 0;
    const savedDetailScroll = oldDetail ? oldDetail.scrollTop : 0;

    // Snapshot фокуса любого input/textarea с data-role в `cnt-*`-семействе,
    // чтобы внешний re-render (health tick, push-сигнал, прогресс ingestion)
    // не выкидывал каретку из поля поиска или из add-modal'и. Зеркалит
    // паттерн `savedPickerFocus` в renderVacancies.
    const focused = document.activeElement;
    const savedContactsFocus = (
        focused
        && (focused.tagName === 'INPUT' || focused.tagName === 'TEXTAREA')
        && focused.dataset
        && focused.dataset.role
        && focused.dataset.role.startsWith('cnt-')
      )
      ? {
          role: focused.dataset.role,
          selStart: focused.selectionStart,
          selEnd: focused.selectionEnd,
        }
      : null;

    const tabs = [
      { id: 'hr',         label: 'HR' },
      { id: 'companies',  label: 'Компании' },
      { id: 'channels',   label: 'Каналы' },
      { id: 'blacklist',  label: 'Blacklist' },
    ];
    const active = appState.contacts.tab || 'hr';
    const isMaster = active === 'hr' || active === 'companies' || active === 'channels';
    let body;
    if (active === 'hr') {
      if (!appState.contacts.hr.loaded && api) {
        requestContactsHrList();
      }
      // Auto-fetch detail when something selected us into this tab
      // (deep-link from vacancies) but we haven't loaded the HR yet.
      const selId = appState.contacts.selectedHrId;
      const dst = appState.contacts.hr;
      if (selId != null
          && !dst.detailLoading
          && (!dst.detail || dst.detail.id !== selId)
          && dst.detailFor !== selId
          && api) {
        requestContactsHrDetail(selId);
      }
      if (selId != null
          && !dst.messagesLoading
          && dst.messagesFor !== selId
          && api) {
        requestContactsHrMessages(selId);
      }
      if (selId != null
          && !dst.vacanciesLoading
          && dst.vacanciesFor !== selId
          && api) {
        requestContactsHrVacancies(selId);
      }
      body = renderContactsHr();
    } else if (active === 'companies') {
      if (!appState.contacts.company.loaded && api) {
        requestContactsCompanyList();
      }
      const selId = appState.contacts.selectedCompanyId;
      const dst = appState.contacts.company;
      if (selId != null
          && !dst.detailLoading
          && (!dst.detail || dst.detail.id !== selId)
          && dst.detailFor !== selId
          && api) {
        requestContactsCompanyDetail(selId);
      }
      if (selId != null
          && !dst.vacanciesLoading
          && dst.vacanciesFor !== selId
          && api) {
        requestContactsCompanyVacancies(selId);
      }
      if (selId != null
          && !dst.hrsLoading
          && dst.hrsFor !== selId
          && api) {
        requestContactsCompanyHrs(selId);
      }
      body = renderContactsCompany();
    } else if (active === 'blacklist') {
      if (!appState.contacts.blacklist.loaded && api) {
        requestContactsBlacklistList();
      }
      body = renderContactsBlacklist();
    } else if (active === 'channels') {
      if (!appState.contacts.channels.loaded && api) {
        requestContactsChannelList();
      }
      const dst = appState.contacts.channels;
      if (dst.selectedId != null
          && !dst.detailLoading
          && (!dst.detail || dst.detail.id !== dst.selectedId)
          && dst.detailFor !== dst.selectedId
          && api) {
        requestContactsChannelDetail(dst.selectedId);
      }
      if (dst.selectedId != null
          && !dst.vacanciesLoading
          && dst.vacanciesFor !== dst.selectedId
          && api) {
        requestContactsChannelVacancies(dst.selectedId);
      }
      body = renderContactsChannels();
    } else {
      body = `<div class="placeholder-content">Раздел «Контакты / ${escapeHtml(tabs.find(t => t.id === active)?.label || active)}» — экран ещё не реализован</div>`;
    }
    mainSlot.innerHTML = `
      <div class="section section-contacts${isMaster ? ' is-hr' : ''}">
        <nav class="top-tabs">
          ${tabs.map(t => `<div class="tab ${t.id === active ? 'active' : ''}" data-tab="${t.id}">${t.label}</div>`).join('')}
        </nav>
        <div class="section-body">${body}</div>
      </div>
    `;
    mainSlot.querySelectorAll('.top-tabs .tab').forEach(el => {
      el.addEventListener('click', () => {
        appState.contacts.tab = el.dataset.tab;
        renderSection();
      });
    });
    const newList = mainSlot.querySelector('.cnt-list');
    if (newList && savedListScroll) newList.scrollTop = savedListScroll;
    const newDetail = mainSlot.querySelector('.cnt-detail-pane');
    if (newDetail && savedDetailScroll) newDetail.scrollTop = savedDetailScroll;
    if (active === 'hr') attachContactsHrHandlers();
    else if (active === 'companies') attachContactsCompanyHandlers();
    else if (active === 'channels') attachContactsChannelHandlers();
    else if (active === 'blacklist') attachContactsBlacklistHandlers();

    if (savedContactsFocus) {
      const sel = `[data-role="${savedContactsFocus.role}"]`;
      const el = mainSlot.querySelector(sel);
      if (el) {
        el.focus();
        try {
          el.setSelectionRange(
            savedContactsFocus.selStart ?? el.value.length,
            savedContactsFocus.selEnd ?? el.value.length,
          );
        } catch (_) { /* selectionRange throws on number/checkbox; safe */ }
      }
    }
  }

  function attachContactsHrHandlers() {
    const st = appState.contacts.hr;

    // Chat input — preserve focus + caret + draft across re-renders. Send
    // on Enter (Shift+Enter inserts newline). Disabled state already set
    // via attribute on render; we only attach handlers when present.
    const chatInput = mainSlot.querySelector('[data-role="cnt-chat-input"]');
    const sendBtn = mainSlot.querySelector('[data-action="cnt-chat-send"]');
    if (chatInput && st.chatInputFocus && st.detail && st.chatInputFocus.hrId === st.detail.id) {
      chatInput.focus();
      try {
        chatInput.setSelectionRange(st.chatInputFocus.start, st.chatInputFocus.end);
      } catch (_) { /* nbd */ }
    }
    if (chatInput) {
      chatInput.addEventListener('input', () => {
        if (!st.detail) return;
        st.chatDraft = chatInput.value;
        st.chatDraftFor = st.detail.id;
        st.chatInputFocus = {
          hrId: st.detail.id,
          start: chatInput.selectionStart,
          end: chatInput.selectionEnd,
        };
        const sendingHere = (st.detail && st.chatSendingFor === st.detail.id);
        if (sendBtn) sendBtn.disabled = !chatInput.value.trim() || sendingHere;
      });
      chatInput.addEventListener('keydown', (e) => {
        // IME composition: e.isComposing (modern), keyCode 229 (legacy WebKit)
        // — Enter while assembling Cyrillic/CJK glyph должен НЕ отправлять.
        if (e.isComposing || e.keyCode === 229) return;
        if (e.key === 'Enter' && !e.shiftKey && !e.ctrlKey && !e.metaKey && !e.altKey) {
          e.preventDefault();
          submitChatMessage();
        }
      });
    }
    if (sendBtn) {
      sendBtn.addEventListener('click', () => submitChatMessage());
    }

    const attachBtn = mainSlot.querySelector('[data-action="cnt-chat-attach"]');
    if (attachBtn) {
      attachBtn.addEventListener('click', () => {
        if (!st.detail || !api) return;
        api.contacts_pick_and_send_hr_media(st.detail.id);
      });
    }

    // Click outside the popover closes it. Same pattern as vac-detail —
    // pane-level click handler, ignore clicks inside .more-wrap.
    const detailPane = mainSlot.querySelector('.cnt-detail-pane');
    if (detailPane) {
      detailPane.addEventListener('click', (e) => {
        if (!st.morePopoverOpen) return;
        if (e.target.closest('.more-wrap')) return;
        st.morePopoverOpen = false;
        renderSection();
      });
    }

    // More-vert popover (Слить / Blacklist / Удалить).
    mainSlot.querySelectorAll('[data-action="cnt-hr-more-toggle"]').forEach(el => {
      el.addEventListener('click', (e) => {
        e.stopPropagation();
        st.morePopoverOpen = !st.morePopoverOpen;
        renderSection();
      });
    });
    mainSlot.querySelectorAll('[data-action="cnt-hr-merge"]').forEach(el => {
      el.addEventListener('click', () => {
        st.morePopoverOpen = false;
        if (!st.detail || !api) { renderSection(); return; }
        openContactsHrMergePicker(st.detail.id);
      });
    });

    // --- Merge picker handlers ---
    const mp = st.mergePicker;
    if (mp.open) {
      const searchInput = mainSlot.querySelector('[data-role="cnt-merge-search"]');
      if (searchInput) {
        searchInput.focus();
        try {
          const len = searchInput.value.length;
          searchInput.setSelectionRange(len, len);
        } catch (_) { /* nbd */ }
        searchInput.addEventListener('input', () => {
          mp.search = searchInput.value;
          if (mp.searchTimer) clearTimeout(mp.searchTimer);
          mp.searchTimer = setTimeout(() => {
            mp.searchTimer = null;
            mp.loading = true;
            renderSection();
            api.request_contacts_hr_merge_picker(JSON.stringify({
              absorbed_id: mp.absorbedId,
              search: mp.search,
            }));
          }, 200);
        });
      }
      mainSlot.querySelectorAll('[data-action="cnt-merge-close"]').forEach(el => {
        el.addEventListener('click', (e) => {
          e.stopPropagation();
          closeContactsHrMergePicker();
          renderSection();
        });
      });
      mainSlot.querySelectorAll('[data-action="cnt-merge-select"]').forEach(el => {
        el.addEventListener('click', () => {
          const id = parseInt(el.dataset.id, 10);
          if (!Number.isFinite(id)) return;
          mp.selectedId = (mp.selectedId === id) ? null : id;
          renderSection();
        });
      });
      mainSlot.querySelectorAll('[data-action="cnt-merge-apply"]').forEach(el => {
        el.addEventListener('click', async () => {
          if (mp.selectedId == null || mp.saving || !api) return;
          const survivor = mp.list.find(r => r.id === mp.selectedId);
          const survivorLabel = survivor
            ? (survivor.name || (survivor.telegram_username ? '@' + survivor.telegram_username : `HR #${survivor.id}`))
            : '?';
          const survivorHasTg = !!(survivor && survivor.telegram_user_id != null);
          const chatLine = survivorHasTg
            ? `Переписка текущего HR будет удалена — остаётся только переписка «${survivorLabel}».`
            : `У «${survivorLabel}» нет Telegram-аккаунта — переедут переписка и аккаунт текущего HR.`;
          const ok = await showModal({
            message: `Слить текущего HR в «${survivorLabel}»?\n\nВакансии перейдут к выбранному. ${chatLine}\n\nТекущий HR будет удалён. Действие необратимо.`,
            type: 'confirm',
            danger: true,
            okLabel: 'Слить',
          });
          if (!ok) return;
          mp.saving = true;
          renderSection();
          api.contacts_merge_hr(JSON.stringify({
            absorbed_id: mp.absorbedId,
            survivor_id: mp.selectedId,
          }));
        });
      });
    }
    mainSlot.querySelectorAll('[data-action="cnt-hr-blacklist"]').forEach(el => {
      el.addEventListener('click', () => {
        st.morePopoverOpen = false;
        renderSection();
        if (!st.detail || !api) return;
        api.contacts_add_hr_to_blacklist(st.detail.id);
      });
    });
    mainSlot.querySelectorAll('[data-action="cnt-hr-unblacklist"]').forEach(el => {
      el.addEventListener('click', () => {
        st.morePopoverOpen = false;
        renderSection();
        if (!st.detail || !api) return;
        api.contacts_remove_hr_from_blacklist(st.detail.id);
      });
    });
    mainSlot.querySelectorAll('[data-action="cnt-hr-delete"]').forEach(el => {
      el.addEventListener('click', async () => {
        st.morePopoverOpen = false;
        renderSection();
        if (!st.detail || !api) return;
        const id = st.detail.id;
        const label = (st.detail.name && st.detail.name.trim())
          || (st.detail.username ? '@' + st.detail.username : `HR #${id}`);
        const ok = await showModal({
          message: `Удалить HR «${label}»?\n\nВся переписка удалится. Связанные вакансии останутся, но без HR.`,
          type: 'confirm',
          danger: true,
          okLabel: 'Удалить',
        });
        if (!ok) return;
        api.contacts_delete_hr(id);
      });
    });

    mainSlot.querySelectorAll('[data-action="cnt-open-vacancy"]').forEach(el => {
      el.addEventListener('click', () => {
        const id = parseInt(el.dataset.vacancyId, 10);
        if (!Number.isFinite(id)) return;
        appState.vacancies.selectedId = id;
        appState.vacancies.detail = null;
        appState.vacancies.detailLoading = true;
        if (api) api.request_vacancy_detail(id);
        setActiveSection('vacancies');
      });
    });

    // Notes textarea — debounced autosave to backend; preserve focus + caret
    // across re-renders triggered by background list/detail refreshes.
    // saveNow reads st.notesFor + st.notesDraft at fire time; if the user
    // switched HR mid-debounce, st.notesFor still points to the originally
    // targeted HR (set in onInput).
    const notesEl = mainSlot.querySelector('[data-role="cnt-hr-notes"]');
    if (notesEl && st.detail) {
      if (st.notesFocus && st.notesFocus.hrId === st.detail.id) {
        notesEl.focus();
        try {
          notesEl.setSelectionRange(st.notesFocus.start, st.notesFocus.end);
        } catch (_) { /* nbd */ }
      }
      attachNotesAutosave({
        el: notesEl,
        onInput: el => {
          if (!st.detail) return;
          st.notesDraft = el.value;
          st.notesFor = st.detail.id;
          st.notesFocus = {
            hrId: st.detail.id,
            start: el.selectionStart,
            end: el.selectionEnd,
          };
        },
        saveNow: () => {
          if (!api || st.notesFor == null) return;
          api.contacts_update_hr(JSON.stringify({
            hr_id: st.notesFor,
            notes: st.notesDraft || '',
          }));
        },
        debounceMs: 600,
        flushOnBlur: true,
        getTimer: () => st.notesSaveTimer,
        setTimer: t => { st.notesSaveTimer = t; },
      });
    }

    // Chat-body scroll: stick to bottom when user is at-or-near it (typical
    // chat behavior — new messages auto-scroll), preserve mid-history
    // scrollTop otherwise so a re-render doesn't yank reading position.
    // Tail-load with unread messages first scrolls to the first unread row.
    const chatBody = mainSlot.querySelector('[data-role="cnt-chat-body"]');
    if (chatBody) {
      if (st.scrollToFirstUnread) {
        st.scrollToFirstUnread = false;
        const firstUnread = chatBody.querySelector('[data-unread="true"]');
        if (firstUnread) {
          firstUnread.scrollIntoView({ block: 'start' });
        } else {
          chatBody.scrollTop = chatBody.scrollHeight;
        }
      } else if (st.chatScrollFor === st.messagesFor && st.chatScrollTop != null) {
        chatBody.scrollTop = st.chatScrollTop;
      } else {
        chatBody.scrollTop = chatBody.scrollHeight;
      }
      chatBody.addEventListener('scroll', () => {
        const atBottom =
          chatBody.scrollHeight - chatBody.scrollTop - chatBody.clientHeight < 40;
        if (atBottom) {
          st.chatScrollTop = null;
          st.chatScrollFor = null;
        } else {
          st.chatScrollTop = chatBody.scrollTop;
          st.chatScrollFor = st.messagesFor;
        }
        // Load older when the user nears the top.
        if (chatBody.scrollTop < 40 && st.hasMoreOlder && !st.olderLoading) {
          requestContactsHrMessages(st.messagesFor, { mode: 'older' });
        }
      });
      const olderBtn = chatBody.querySelector('[data-action="cnt-load-older"]');
      if (olderBtn) {
        olderBtn.addEventListener('click', () => {
          requestContactsHrMessages(st.messagesFor, { mode: 'older' });
        });
      }
    }

    // Infinite scroll — fire append when user nears the bottom of the list.
    const listEl = mainSlot.querySelector('.cnt-list');
    if (listEl) {
      listEl.addEventListener('scroll', () => {
        if (!st.hasMore || st.loadingMore || st.replacing) return;
        if (listEl.scrollTop + listEl.clientHeight < listEl.scrollHeight - 150) return;
        requestContactsHrList({ mode: 'append' });
      });
    }

    // Search input — preserve focus + caret across re-renders triggered by
    // list refreshes, then debounce the actual server-side query.
    const searchInput = mainSlot.querySelector('[data-role="cnt-hr-search"]');
    const clearBtn = mainSlot.querySelector('[data-action="cnt-hr-search-clear"]');
    if (searchInput) {
      if (st.searchFocus) {
        searchInput.focus();
        try {
          searchInput.setSelectionRange(st.searchFocus.start, st.searchFocus.end);
        } catch (_) { /* nbd */ }
        st.searchFocus = null;
      }
      searchInput.addEventListener('input', (e) => {
        st.searchDraft = e.target.value;
        st.searchFocus = { start: e.target.selectionStart, end: e.target.selectionEnd };
        if (clearBtn) clearBtn.classList.toggle('hidden', !st.searchDraft);
        if (st.searchTimer) clearTimeout(st.searchTimer);
        st.searchTimer = setTimeout(() => {
          st.searchTimer = null;
          requestContactsHrList();
        }, 250);
      });
    }
    if (clearBtn) {
      clearBtn.addEventListener('click', () => {
        st.searchDraft = '';
        if (st.searchTimer) { clearTimeout(st.searchTimer); st.searchTimer = null; }
        // Re-render synchronously so the input + button visually clear before
        // the bridge response — otherwise the old text lingers ~50-150ms.
        renderSection();
        const refocus = mainSlot.querySelector('[data-role="cnt-hr-search"]');
        if (refocus) refocus.focus();
        requestContactsHrList();
      });
    }

    mainSlot.querySelectorAll('.cnt-hr-row').forEach(el => {
      el.addEventListener('click', () => {
        const id = Number(el.dataset.hrId);
        // No-op when the user re-clicks the already-selected row — saves a
        // round-trip and avoids flashing the «Загрузка…» placeholder.
        if (appState.contacts.selectedHrId === id && st.detail && st.detail.id === id) return;
        // Flush a pending notes-save BEFORE switching: saveNow reads
        // st.notesFor / st.notesDraft, которые ещё указывают на текущего HR;
        // если этого не сделать, debounced таймер в фоне выстрелит после
        // переключения и запишет черновик нового HR в ноутс старого.
        if (st.notesSaveTimer) {
          clearTimeout(st.notesSaveTimer);
          st.notesSaveTimer = null;
          if (api && st.notesFor != null) {
            api.contacts_update_hr(JSON.stringify({
              hr_id: st.notesFor,
              notes: st.notesDraft || '',
            }));
          }
        }
        appState.contacts.selectedHrId = id;
        st.detail = null;
        st.detailFor = id;
        st.detailLoading = true;
        st.messages = [];
        st.messagesFor = id;
        st.messagesLoading = true;
        st.oldestLoadedId = null;
        st.oldestLoadedSentAt = null;
        st.hasMoreOlder = false;
        st.markReadFor = null;
        st.notesDraft = '';
        st.notesFor = null;
        st.notesFocus = null;
        if (st.markReadTimer) { clearTimeout(st.markReadTimer); st.markReadTimer = null; }
        renderSection();
        requestContactsHrDetail(id);
        requestContactsHrMessages(id);
      });
    });

    // Form blur-save: each input commits its column when the user moves
    // focus away. No debounce — typing is local-only until blur, then
    // exactly one bridge call per field. Focus + caret + draft value are
    // restored across re-renders so concurrent list/detail responses don't
    // wipe the user's mid-typed edit.
    const nameInput = mainSlot.querySelector('[data-role="cnt-hr-name"]');
    const userInput = mainSlot.querySelector('[data-role="cnt-hr-username"]');

    function restoreFormFocus(input, key) {
      if (!input || !st.formFocus || st.formFocus.role !== key) return;
      if (st.formFocus.value != null) input.value = st.formFocus.value;
      input.focus();
      try {
        input.setSelectionRange(st.formFocus.start, st.formFocus.end);
      } catch (_) { /* nbd */ }
      // NB: don't clear st.formFocus here — multiple renders can fire in
      // the same tick (detail-loaded + list-refreshed responses to one
      // update). Blur is the sole authoritative clear point.
    }
    restoreFormFocus(nameInput, 'cnt-hr-name');
    restoreFormFocus(userInput, 'cnt-hr-username');

    function trackFormInput(input, key) {
      if (!input) return;
      input.addEventListener('input', () => {
        st.formFocus = {
          role: key,
          value: input.value,
          start: input.selectionStart,
          end: input.selectionEnd,
        };
      });
      input.addEventListener('blur', () => {
        // The blur itself is the commit signal — drop the focus stash so the
        // next render doesn't re-focus this field after a response.
        st.formFocus = null;
      });
    }
    trackFormInput(nameInput, 'cnt-hr-name');
    trackFormInput(userInput, 'cnt-hr-username');

    if (nameInput) {
      nameInput.addEventListener('blur', () => {
        if (!st.detail) return;
        const next = nameInput.value.trim();
        const cur = (st.detail.name || '').trim();
        if (next === cur) return;
        api.contacts_update_hr(JSON.stringify({ hr_id: st.detail.id, name: next }));
      });
    }
    if (userInput) {
      userInput.addEventListener('blur', () => {
        if (!st.detail) return;
        let next = userInput.value.trim();
        if (next.startsWith('@')) next = next.slice(1).trim();
        const cur = (st.detail.username || '').trim();
        if (next === cur) return;
        api.contacts_update_hr(JSON.stringify({ hr_id: st.detail.id, telegram_username: next }));
      });
    }

    mainSlot.querySelectorAll('[data-action="cnt-open-tg"]').forEach(el => {
      el.addEventListener('click', (e) => {
        e.stopPropagation();
        const username = el.dataset.username;
        if (api && username) api.open_external_url('https://t.me/' + username);
      });
    });

    mainSlot.querySelectorAll('[data-action="cnt-open-company"]').forEach(el => {
      el.addEventListener('click', (e) => {
        e.stopPropagation();
        const id = Number(el.dataset.companyId);
        if (Number.isFinite(id) && typeof gotoContactsCompany === 'function') {
          gotoContactsCompany(id);
        }
      });
    });

    const addOpen = mainSlot.querySelector('[data-action="cnt-add-open"]');
    if (addOpen) {
      addOpen.addEventListener('click', () => {
        st.addModal.open = true;
        st.addModal.saving = false;
        st.addModal.error = null;
        st.addModal.draft = { name: '', telegram_username: '', telegram_user_id: '', notes: '' };
        renderSection();
        const first = mainSlot.querySelector('[data-role="cnt-add-name"]');
        if (first) first.focus();
      });
    }

    if (st.addModal.open) {
      mainSlot.querySelectorAll('[data-action="cnt-add-close"]').forEach(el => {
        el.addEventListener('click', (e) => {
          // Backdrop fires too — only close if click was directly on it,
          // not bubbling up from the modal box.
          if (el.classList.contains('modal-backdrop') && e.target !== el) return;
          e.stopPropagation();
          st.addModal.open = false;
          st.addModal.error = null;
          renderSection();
        });
      });

      const nameEl   = mainSlot.querySelector('[data-role="cnt-add-name"]');
      const userEl   = mainSlot.querySelector('[data-role="cnt-add-username"]');
      const userIdEl = mainSlot.querySelector('[data-role="cnt-add-user-id"]');
      const notesEl  = mainSlot.querySelector('[data-role="cnt-add-notes"]');
      if (nameEl)   nameEl.addEventListener('input',   e => { st.addModal.draft.name = e.target.value; reRenderAddSaveBtn(); });
      if (userEl)   userEl.addEventListener('input',   e => { st.addModal.draft.telegram_username = e.target.value; reRenderAddSaveBtn(); });
      if (userIdEl) userIdEl.addEventListener('input', e => { st.addModal.draft.telegram_user_id = e.target.value; reRenderAddSaveBtn(); });
      if (notesEl)  notesEl.addEventListener('input',  e => { st.addModal.draft.notes = e.target.value; });

      const saveBtn = mainSlot.querySelector('[data-action="cnt-add-save"]');
      if (saveBtn) {
        saveBtn.addEventListener('click', () => {
          if (st.addModal.saving || saveBtn.disabled) return;
          st.addModal.saving = true;
          st.addModal.error = null;
          renderSection();
          api.contacts_create_hr(JSON.stringify({
            name: st.addModal.draft.name.trim(),
            telegram_username: st.addModal.draft.telegram_username.trim(),
            telegram_user_id: st.addModal.draft.telegram_user_id.trim(),
            notes: st.addModal.draft.notes.trim(),
          }));
        });
      }
    }
  }

  // === Contacts / Companies (06) =====================================

  const CONTACTS_CO_PAGE_SIZE = 30;

  function requestContactsCompanyList(opts) {
    if (!api) return;
    const st = appState.contacts.company;
    const mode = (opts && opts.mode) || 'replace';
    if (mode === 'append') {
      st.loadingMore = true;
    } else {
      st.requestEpoch = (st.requestEpoch || 0) + 1;
      st.replacing = true;
    }
    let offset, limit;
    if (mode === 'append') {
      offset = st.list.length;
      limit = CONTACTS_CO_PAGE_SIZE;
    } else if (mode === 'refresh') {
      offset = 0;
      limit = Math.min(200, Math.max(CONTACTS_CO_PAGE_SIZE, st.list.length || CONTACTS_CO_PAGE_SIZE));
    } else {
      offset = 0;
      limit = CONTACTS_CO_PAGE_SIZE;
    }
    api.request_contacts_company_list(JSON.stringify({
      search: st.searchDraft || '',
      mode,
      offset,
      limit,
      epoch: st.requestEpoch,
    }));
  }

  function onContactsCompanyListLoaded(payload) {
    let p;
    try { p = JSON.parse(payload); } catch { return; }
    if (!p) return;
    const st = appState.contacts.company;
    if (!p.ok) {
      st.replacing = false;
      st.loadingMore = false;
      st.hasMore = false;
      st.loaded = true;
      return;
    }
    if (p.epoch != null && p.epoch !== st.requestEpoch) return;
    const mode = p.mode || 'replace';
    const newRows = (p.companies || []).map(c => ({
      id: c.id,
      name: c.name,
      website: c.website,
      aliases: c.aliases || [],
      vacCount: c.vacancy_count,
      blacklisted: !!c.is_blacklisted,
    }));
    if (mode === 'append') {
      const known = new Set(st.list.map(r => r.id));
      st.list = st.list.concat(newRows.filter(r => !known.has(r.id)));
      st.loadingMore = false;
    } else {
      st.list = newRows;
      st.replacing = false;
      st.loadingMore = false;
    }
    st.loaded = true;
    st.search = p.search || '';
    st.hasMore = !!p.has_more;
    if (appState.section === 'contacts' && appState.contacts.tab === 'companies') {
      renderSection();
    }
  }

  function requestContactsCompanyDetail(companyId) {
    if (!api || companyId == null) return;
    const st = appState.contacts.company;
    st.detailFor = companyId;
    st.detailLoading = true;
    api.request_contacts_company_detail(companyId);
  }

  function onContactsCompanyDetailLoaded(payload) {
    let p;
    try { p = JSON.parse(payload); } catch { return; }
    const st = appState.contacts.company;
    if (!p) return;
    if (!p.ok) {
      if (p.company_id != null && p.company_id === st.detailFor) {
        st.detail = null;
        st.detailLoading = false;
      }
      return;
    }
    if (p.company_id !== st.detailFor) return;
    st.detail = {
      id: p.company_id,
      name: p.name,
      website: p.website,
      aliases: p.aliases || [],
      notes: p.notes,
      vacCount: p.vacancy_count,
      hrCount: p.hr_count,
      blacklistValue: p.blacklist_value || null,
    };
    if (st.notesFor === p.company_id && (st.notesDraft || '') === (p.notes || '')) {
      st.notesFor = null;
      st.notesDraft = '';
    }
    st.detailLoading = false;
    if (appState.section === 'contacts' && appState.contacts.tab === 'companies') {
      renderSection();
    }
  }

  function requestContactsCompanyVacancies(companyId) {
    if (!api || companyId == null) return;
    const st = appState.contacts.company;
    st.vacanciesFor = companyId;
    st.vacanciesLoading = true;
    api.request_contacts_company_vacancies(companyId);
  }

  function onContactsCompanyVacanciesLoaded(payload) {
    let p;
    try { p = JSON.parse(payload); } catch { return; }
    if (!p || !p.ok) return;
    const st = appState.contacts.company;
    if (p.company_id !== st.vacanciesFor) return;
    st.vacancies = (p.vacancies || []).map(v => ({
      id: v.id,
      title: v.title,
      status: v.status,
      score: v.score,
      createdAt: v.created_at ? new Date(v.created_at) : null,
    }));
    st.vacanciesLoading = false;
    if (appState.section === 'contacts' && appState.contacts.tab === 'companies') {
      renderSection();
    }
  }

  function requestContactsCompanyHrs(companyId) {
    if (!api || companyId == null) return;
    const st = appState.contacts.company;
    st.hrsFor = companyId;
    st.hrsLoading = true;
    api.request_contacts_company_hrs(companyId);
  }

  function onContactsCompanyHrsLoaded(payload) {
    let p;
    try { p = JSON.parse(payload); } catch { return; }
    if (!p || !p.ok) return;
    const st = appState.contacts.company;
    if (p.company_id !== st.hrsFor) return;
    st.hrs = (p.hrs || []).map(h => ({
      id: h.id,
      name: h.name,
      username: h.telegram_username,
      vacCount: h.vacancy_count,
      avatar: h.avatar || null,
    }));
    st.hrsLoading = false;
    if (appState.section === 'contacts' && appState.contacts.tab === 'companies') {
      renderSection();
    }
  }

  function companyInitials(co) {
    const n = (co && co.name) || '';
    const parts = String(n).trim().split(/\s+/).filter(Boolean);
    if (!parts.length) return '?';
    if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
    return (parts[0][0] + parts[1][0]).toUpperCase();
  }

  function renderContactsCompanyRow(co) {
    const selected = appState.contacts.selectedCompanyId === co.id;
    const subParts = [];
    if (co.website) subParts.push(escapeHtml(co.website));
    const aliases = (co.aliases || []).filter(Boolean);
    if (aliases.length) subParts.push(`алиасы: ${escapeHtml(aliases.join(', '))}`);
    const sub = subParts.length ? subParts.join(' · ') : '<span class="muted">без сайта</span>';
    const vacHtml = co.vacCount > 0
      ? `<span class="cnt-co-count">${co.vacCount}</span>`
      : '';
    const blacklistHtml = co.blacklisted
      ? `<span class="cnt-hr-bl" title="В blacklist"><span class="material-symbols-outlined">block</span></span>`
      : '';
    const trailing = (vacHtml || blacklistHtml)
      ? `<div class="cnt-hr-trailing">${blacklistHtml}${vacHtml}</div>`
      : '<span></span>';
    return `
      <div class="cnt-hr-row${selected ? ' selected' : ''}${co.blacklisted ? ' blacklisted' : ''}" data-co-id="${co.id}">
        <span class="cnt-avatar"><span class="material-symbols-outlined">domain</span></span>
        <div class="cnt-hr-info">
          <div class="cnt-hr-name">${escapeHtml(co.name || '— без названия —')}</div>
          <div class="cnt-hr-sub">${sub}</div>
        </div>
        ${trailing}
      </div>
    `;
  }

  function renderContactsCompanyDetailHead(co) {
    const websiteHtml = co.website
      ? `<a class="tg-link" data-action="cnt-co-open-website" data-website="${escapeAttr(co.website)}" title="Открыть сайт">${escapeHtml(co.website)}</a>`
      : `<span class="tg-muted">сайт не указан</span>`;
    const blacklistChip = co.blacklistValue
      ? `<span class="cnt-det-meta-chip blacklist" title="${escapeAttr('В blacklist: ' + co.blacklistValue)}"><span class="material-symbols-outlined">block</span>В blacklist</span>`
      : '';
    return `
      <div class="cnt-det-head">
        <span class="cnt-det-avatar"><span class="material-symbols-outlined">domain</span></span>
        <div class="cnt-det-head-info">
          <div class="cnt-det-name">${escapeHtml(co.name || '— без названия —')}</div>
          <div class="cnt-det-sub">${websiteHtml}</div>
          <div class="cnt-det-meta-row">
            <span class="cnt-det-meta-chip"><span class="material-symbols-outlined">work</span>${co.vacCount} ${pluralRu(co.vacCount, 'вакансия', 'вакансии', 'вакансий')}</span>
            <span class="cnt-det-meta-chip"><span class="material-symbols-outlined">people</span>${co.hrCount} HR</span>
            ${blacklistChip}
          </div>
        </div>
        <div class="more-wrap actions-menu">
          <button class="icon-btn" data-action="cnt-co-more-toggle" type="button" title="Действия">
            <span class="material-symbols-outlined">more_vert</span>
          </button>
          ${renderContactsCompanyMorePopover(co)}
        </div>
      </div>
    `;
  }

  function renderContactsCompanyMorePopover(co) {
    if (!appState.contacts.company.morePopoverOpen) return '';
    const blItem = co.blacklistValue
      ? `<button class="menu-item" data-action="cnt-co-unblacklist" type="button" title="Убрать из blacklist">
          <span class="material-symbols-outlined">restart_alt</span>
          <span>Убрать из blacklist</span>
        </button>`
      : `<button class="menu-item" data-action="cnt-co-blacklist" type="button" title="Добавить в blacklist">
          <span class="material-symbols-outlined">block</span>
          <span>Добавить в blacklist</span>
        </button>`;
    return `
      <div class="more-popover">
        <button class="menu-item" data-action="cnt-co-merge" type="button" title="Слить с другой компанией">
          <span class="material-symbols-outlined">merge</span>
          <span>Слить с другой компанией</span>
        </button>
        ${blItem}
        <hr class="menu-divider">
        <button class="menu-item danger" data-action="cnt-co-delete" type="button" title="Удалить компанию">
          <span class="material-symbols-outlined">delete</span>
          <span>Удалить</span>
        </button>
      </div>
    `;
  }

  function renderContactsCompanyDetailAliases(co) {
    return `
      <div class="cnt-det-section">
        <div class="aliases" data-role="cnt-co-aliases">${renderAliases(co.aliases || [])}</div>
      </div>
    `;
  }

  function renderContactsCompanyDetailForm(co) {
    return `
      <div class="cnt-form-grid">
        <input class="cnt-input" type="text" data-role="cnt-co-name" maxlength="120" placeholder="Название" value="${escapeAttr(co.name || '')}">
        <input class="cnt-input" type="text" data-role="cnt-co-website" maxlength="200" placeholder="Сайт / домен" value="${escapeAttr(co.website || '')}">
      </div>
    `;
  }

  function renderContactsCompanyDetailNotes(co) {
    const st = appState.contacts.company;
    const value = (st.notesFor === co.id) ? (st.notesDraft || '') : (co.notes || '');
    return `
      <div class="cnt-det-section">
        <textarea class="notes-area" data-role="cnt-co-notes" maxlength="2000" placeholder="Заметки о компании…">${escapeHtml(value)}</textarea>
      </div>
    `;
  }

  function renderContactsCompanyDetailHrs(co) {
    const st = appState.contacts.company;
    if (st.hrsFor !== co.id) {
      return `<div class="cnt-det-section"><div class="cnt-vacs-empty">Загрузка…</div></div>`;
    }
    if (!st.hrs.length) {
      return `<div class="cnt-det-section"><div class="cnt-vacs-empty">HR-контактов нет.</div></div>`;
    }
    const rows = st.hrs.map(hr => {
      const initials = hrInitials({ name: hr.name, username: hr.username });
      const meta = [];
      if (hr.username) meta.push(`@${escapeHtml(hr.username)}`);
      meta.push(`${hr.vacCount} ${pluralRu(hr.vacCount, 'вакансия', 'вакансии', 'вакансий')}`);
      const label = (hr.name && hr.name.trim())
        || (hr.username ? `@${hr.username}` : `HR #${hr.id}`);
      const avatarHtml = hr.avatar
        ? `<img class="hr-mini-avatar" src="${escapeAttr(hr.avatar)}" alt="">`
        : `<span class="hr-mini-avatar">${escapeHtml(initials)}</span>`;
      return `
        <div class="hr-mini-row" data-action="cnt-co-open-hr" data-hr-id="${hr.id}">
          ${avatarHtml}
          <div>
            <div class="hr-mini-name">${escapeHtml(label)}</div>
            <span class="hr-mini-meta">${meta.join(' · ')}</span>
          </div>
          <span class="material-symbols-outlined" style="font-size: 14px; color: var(--text-tertiary)">arrow_forward</span>
        </div>
      `;
    }).join('');
    return `<div class="cnt-det-section"><div class="hrs-mini">${rows}</div></div>`;
  }

  function renderContactsCompanyDetailVacancies(co) {
    const st = appState.contacts.company;
    if (st.vacanciesFor !== co.id) {
      return `<div class="cnt-det-section"><div class="cnt-vacs-empty">Загрузка…</div></div>`;
    }
    if (!st.vacancies.length) {
      return `<div class="cnt-det-section"><div class="cnt-vacs-empty">Связанных вакансий нет.</div></div>`;
    }
    const rows = st.vacancies.map(v => {
      const cls = statusToClass(v.status || 'New');
      const score = (v.score == null) ? '' : `<span class="vac-mini-score">${v.score}</span>`;
      const when = v.createdAt ? fmtShortAgo(v.createdAt) : '';
      const title = v.title && v.title.trim() ? v.title : '— без названия —';
      return `
        <div class="vac-mini-row" data-action="cnt-co-open-vacancy" data-vacancy-id="${v.id}">
          <span class="status-dot ${cls}"></span>
          ${score}
          <span class="vac-mini-title">${escapeHtml(title)}</span>
          <span class="vac-mini-when">${escapeHtml(when)}</span>
        </div>
      `;
    }).join('');
    return `<div class="cnt-det-section"><div class="vacs-mini">${rows}</div></div>`;
  }

  function renderContactsCompanyDetail() {
    const st = appState.contacts.company;
    if (appState.contacts.selectedCompanyId == null) {
      return `<div class="cnt-detail-empty">Выберите компанию в списке слева</div>`;
    }
    if (st.detailLoading && (!st.detail || st.detail.id !== appState.contacts.selectedCompanyId)) {
      return `<div class="cnt-detail-empty">Загрузка…</div>`;
    }
    if (!st.detail || st.detail.id !== appState.contacts.selectedCompanyId) {
      return `<div class="cnt-detail-empty">Компания не найдена</div>`;
    }
    return renderContactsCompanyDetailHead(st.detail)
      + renderContactsCompanyDetailForm(st.detail)
      + renderContactsCompanyDetailAliases(st.detail)
      + renderContactsCompanyDetailNotes(st.detail)
      + renderContactsCompanyDetailHrs(st.detail)
      + renderContactsCompanyDetailVacancies(st.detail);
  }

  function renderContactsCompanyMergePicker() {
    const p = appState.contacts.company.mergePicker;
    if (!p.open) return '';
    const body = renderPickerListBody({
      loading: p.loading,
      items: p.list,
      search: p.search,
      emptyText: 'Других компаний нет',
      renderRow: r => renderCompanyPickerRow(r, null, p.selectedId, { action: 'cnt-co-merge-select' }),
    });
    return renderPickerModal({
      prefix: 'cnt-co-merge',
      icon: 'merge',
      title: 'Слить с другой компанией',
      searchPlaceholder: 'Поиск по названию, сайту, алиасам...',
      searchValue: p.search,
      body,
      applyAction: 'cnt-co-merge-apply',

      applyLabel: p.saving ? 'Сливаю…' : 'Слить',

    if (mp.searchTimer) { clearTimeout(mp.searchTimer); mp.searchTimer = null; }
    mp.open = false;
    mp.loading = false;
    mp.search = '';

    mp.selectedId = null;
    mp.saving = false;

  function attachContactsCompanyHandlers() {
    const st = appState.contacts.company;

    // Row click → select.
    mainSlot.querySelectorAll('.cnt-hr-row[data-co-id]').forEach(el => {
      el.addEventListener('click', () => {
        const id = parseInt(el.dataset.coId, 10);
        if (!Number.isFinite(id)) return;
        if (appState.contacts.selectedCompanyId === id) return;
        appState.contacts.selectedCompanyId = id;
        st.detail = null;
        st.detailFor = null;
        st.vacancies = [];
        st.vacanciesFor = null;
        st.hrs = [];
        st.hrsFor = null;
        renderSection();
      });
    });

    // Search input — preserve focus + caret across re-renders, debounce 200ms.
    const searchInput = mainSlot.querySelector('[data-role="cnt-co-search"]');
    const clearBtn = mainSlot.querySelector('[data-action="cnt-co-search-clear"]');
    if (searchInput) {
      if (st.searchFocus) {
        searchInput.focus();
        try {
          searchInput.setSelectionRange(st.searchFocus.start, st.searchFocus.end);
        } catch (_) { /* nbd */ }
        st.searchFocus = null;
      }
      searchInput.addEventListener('input', () => {
        st.searchDraft = searchInput.value;
        st.searchFocus = {
          start: searchInput.selectionStart,
          end: searchInput.selectionEnd,
        };
        if (clearBtn) clearBtn.classList.toggle('hidden', !searchInput.value);
        if (st.searchTimer) clearTimeout(st.searchTimer);
        st.searchTimer = setTimeout(() => {
          st.searchTimer = null;
          requestContactsCompanyList();
        }, 200);
      });
    }
    if (clearBtn) {
      clearBtn.addEventListener('click', (e) => {
        e.preventDefault();
        st.searchDraft = '';
        if (st.searchTimer) { clearTimeout(st.searchTimer); st.searchTimer = null; }
        const refocus = mainSlot.querySelector('[data-role="cnt-co-search"]');
        if (refocus) {
          refocus.value = '';
          refocus.focus();
          st.searchFocus = { start: 0, end: 0 };
        }
        requestContactsCompanyList();
      });
    }

    // Infinite scroll — append next page on near-bottom.
    const listEl = mainSlot.querySelector('.cnt-list');
    if (listEl) {
      listEl.addEventListener('scroll', () => {
        if (!st.hasMore || st.loadingMore || st.replacing) return;
        if (listEl.scrollTop + listEl.clientHeight < listEl.scrollHeight - 150) return;
        requestContactsCompanyList({ mode: 'append' });
      });
    }

    // Add modal — open + form binding + submit.
    mainSlot.querySelectorAll('[data-action="cnt-co-add-open"]').forEach(el => {
      el.addEventListener('click', () => {
        st.addModal.open = true;
        st.addModal.saving = false;
        st.addModal.error = null;
        st.addModal.draft = { name: '', website: '', aliases: '', notes: '' };
        renderSection();
        const focusEl = mainSlot.querySelector('[data-role="cnt-co-add-name"]');
        if (focusEl) focusEl.focus();
      });
    });
    mainSlot.querySelectorAll('[data-action="cnt-co-add-close"]').forEach(el => {
      el.addEventListener('click', (e) => {
        e.stopPropagation();
        st.addModal.open = false;
        st.addModal.error = null;
        renderSection();
      });
    });
    if (st.addModal.open) {
      const bind = (role, key) => {
        const el = mainSlot.querySelector(`[data-role="${role}"]`);
        if (!el) return;
        el.addEventListener('input', () => {
          st.addModal.draft[key] = el.value;
          const submitBtn = mainSlot.querySelector('[data-action="cnt-co-add-submit"]');
          if (submitBtn) submitBtn.disabled = st.addModal.saving || !String(st.addModal.draft.name || '').trim();
        });
      };
      bind('cnt-co-add-name', 'name');
      bind('cnt-co-add-website', 'website');
      bind('cnt-co-add-aliases', 'aliases');
      bind('cnt-co-add-notes', 'notes');
      const submit = mainSlot.querySelector('[data-action="cnt-co-add-submit"]');
      if (submit) {
        submit.addEventListener('click', () => {
          if (!api || st.addModal.saving) return;
          if (!String(st.addModal.draft.name || '').trim()) return;
          st.addModal.saving = true;
          st.addModal.error = null;
          renderSection();
          api.contacts_create_company(JSON.stringify({
            name: st.addModal.draft.name.trim(),
            website: st.addModal.draft.website.trim(),
            aliases: st.addModal.draft.aliases.trim(),
            notes: st.addModal.draft.notes.trim(),
          }));
        });
      }
    }

    // Form: name + website inline edits → debounced update.
    const nameEl = mainSlot.querySelector('[data-role="cnt-co-name"]');
    const websiteEl = mainSlot.querySelector('[data-role="cnt-co-website"]');
    [[nameEl, 'name'], [websiteEl, 'website']].forEach(([el, key]) => {
      if (!el || !st.detail) return;
      el.addEventListener('change', () => {
        if (!api) return;
        const value = el.value.trim();
        if (key === 'name' && !value) {
          // Name is required — revert to current.
          el.value = st.detail.name || '';
          return;
        }
        api.contacts_update_company(JSON.stringify({
          company_id: st.detail.id,
          [key]: value,
        }));
      });
    });

    // Notes textarea — same pattern as HR.
    const notesEl = mainSlot.querySelector('[data-role="cnt-co-notes"]');
    if (notesEl && st.detail) {
      if (st.notesFocus && st.notesFocus.companyId === st.detail.id) {
        notesEl.focus();
        try { notesEl.setSelectionRange(st.notesFocus.start, st.notesFocus.end); } catch (_) {}
      }
      attachNotesAutosave({
        el: notesEl,
        onInput: el => {
          if (!st.detail) return;
          st.notesDraft = el.value;
          st.notesFor = st.detail.id;
          st.notesFocus = {
            companyId: st.detail.id,
            start: el.selectionStart,
            end: el.selectionEnd,
          };
        },
        saveNow: () => {
          if (!api || st.notesFor == null) return;
          api.contacts_update_company(JSON.stringify({
            company_id: st.notesFor,
            notes: st.notesDraft || '',
          }));
        },
        debounceMs: 600,
        getTimer: () => st.notesSaveTimer,
        setTimer: t => { st.notesSaveTimer = t; },
      });
    }

    // HR / Vacancy mini-row clicks → deep-link.
    mainSlot.querySelectorAll('[data-action="cnt-co-open-hr"]').forEach(el => {
      el.addEventListener('click', () => {
        const id = parseInt(el.dataset.hrId, 10);
        if (!Number.isFinite(id)) return;
        gotoContactsHr(id);
      });
    });
    mainSlot.querySelectorAll('[data-action="cnt-co-open-vacancy"]').forEach(el => {
      el.addEventListener('click', () => {
        const id = parseInt(el.dataset.vacancyId, 10);
        if (!Number.isFinite(id)) return;
        appState.vacancies.selectedId = id;
        appState.vacancies.detail = null;
        appState.vacancies.detailLoading = true;
        if (api) api.request_vacancy_detail(id);
        setActiveSection('vacancies');
      });
    });
    mainSlot.querySelectorAll('[data-action="cnt-co-open-website"]').forEach(el => {
      el.addEventListener('click', (e) => {
        e.preventDefault();
        const url = el.dataset.website;
        if (api && url) {
          let final = url;
          if (!/^https?:\/\//i.test(final)) final = 'https://' + final;
          api.open_external_url(final);
        }
      });
    });

    // Aliases editor — uses shared renderAliases / wireAliasesIn / startAliasInput
    // helpers (originally written for skills). Burst edits (delete two
    // chips quickly, then add one) collapse into a single update_company
    // call via a 300 ms trailing debounce on st.aliasesSaveTimer; keeps
    // the list-refresh chatter down.
    const aliasesEl = mainSlot.querySelector('[data-role="cnt-co-aliases"]');
    if (aliasesEl && st.detail) {
      const co = st.detail;
      wireAliasesIn(aliasesEl, co, () => {
        if (!api) return;
        if (st.aliasesSaveTimer) clearTimeout(st.aliasesSaveTimer);
        st.aliasesSaveTimer = setTimeout(() => {
          st.aliasesSaveTimer = null;
          api.contacts_update_company(JSON.stringify({
            company_id: co.id,
            aliases: co.aliases.slice(),
          }));
        }, 300);
      });
    }

    // Click outside the more popover or merge backdrop closes them.
    const detailPane = mainSlot.querySelector('.cnt-detail-pane');
    if (detailPane) {
      detailPane.addEventListener('click', (e) => {
        if (!st.morePopoverOpen) return;
        if (e.target.closest('.more-wrap')) return;
        st.morePopoverOpen = false;
        renderSection();
      });
    }

    // More-vert popover.
    mainSlot.querySelectorAll('[data-action="cnt-co-more-toggle"]').forEach(el => {
      el.addEventListener('click', (e) => {
        e.stopPropagation();
        st.morePopoverOpen = !st.morePopoverOpen;
        renderSection();
      });
    });
    mainSlot.querySelectorAll('[data-action="cnt-co-merge"]').forEach(el => {
      el.addEventListener('click', () => {
        st.morePopoverOpen = false;
        if (!st.detail || !api) { renderSection(); return; }
        openContactsCompanyMergePicker(st.detail.id);
      });
    });
    mainSlot.querySelectorAll('[data-action="cnt-co-blacklist"]').forEach(el => {
      el.addEventListener('click', () => {
        st.morePopoverOpen = false;
        renderSection();
        if (!st.detail || !api) return;
        api.contacts_add_company_to_blacklist(st.detail.id);
      });
    });
    mainSlot.querySelectorAll('[data-action="cnt-co-unblacklist"]').forEach(el => {
      el.addEventListener('click', () => {
        st.morePopoverOpen = false;
        renderSection();
        if (!st.detail || !api) return;
        api.contacts_remove_company_from_blacklist(st.detail.id);
      });
    });
    mainSlot.querySelectorAll('[data-action="cnt-co-delete"]').forEach(el => {
      el.addEventListener('click', async () => {
        st.morePopoverOpen = false;
        renderSection();
        if (!st.detail || !api) return;
        const id = st.detail.id;
        const label = st.detail.name || `Компания #${id}`;
        const ok = await showModal({
          message: `Удалить компанию «${label}»?\n\nСвязанные вакансии останутся, но без компании. Действие необратимо.`,
          type: 'confirm',
          danger: true,
          okLabel: 'Удалить',
        });
        if (!ok) return;
        api.contacts_delete_company(id);
      });
    });

    // Merge picker handlers.
    const mp = st.mergePicker;
    if (mp.open) {
      const searchInput = mainSlot.querySelector('[data-role="cnt-co-merge-search"]');
      if (searchInput) {
        searchInput.focus();
        try {
          const len = searchInput.value.length;
          searchInput.setSelectionRange(len, len);
        } catch (_) { /* nbd */ }
        searchInput.addEventListener('input', () => {
          mp.search = searchInput.value;
          if (mp.searchTimer) clearTimeout(mp.searchTimer);
          mp.searchTimer = setTimeout(() => {
            mp.searchTimer = null;
            mp.loading = true;
            renderSection();
            api.request_contacts_company_merge_picker(JSON.stringify({
              absorbed_id: mp.absorbedId,
              search: mp.search,
            }));
          }, 200);
        });
      }
      mainSlot.querySelectorAll('[data-action="cnt-co-merge-close"]').forEach(el => {
        el.addEventListener('click', (e) => {
          e.stopPropagation();
          closeContactsCompanyMergePicker();
          renderSection();
        });
      });
      mainSlot.querySelectorAll('[data-action="cnt-co-merge-select"]').forEach(el => {
        el.addEventListener('click', () => {
          const id = parseInt(el.dataset.id, 10);
          if (!Number.isFinite(id)) return;
          mp.selectedId = (mp.selectedId === id) ? null : id;
          renderSection();
        });
      });
      mainSlot.querySelectorAll('[data-action="cnt-co-merge-apply"]').forEach(el => {
        el.addEventListener('click', async () => {
          if (mp.selectedId == null || mp.saving || !api) return;
          const survivor = mp.list.find(r => r.id === mp.selectedId);
          const survivorLabel = survivor ? (survivor.name || `Компания #${survivor.id}`) : '?';
          const absorbedLabel = (st.detail && st.detail.name) || 'текущей компании';
          const ok = await showModal({
            message: `Слить «${absorbedLabel}» в «${survivorLabel}»?\n\nВакансии перейдут к выбранной. Алиасы объединятся (имя текущей попадёт в алиасы). Заметки склеятся через разделитель. Сайт берётся из выбранной (если пуст — из текущей). Текущая компания будет удалена. Действие необратимо.`,
            type: 'confirm',
            danger: true,
            okLabel: 'Слить',
          });
          if (!ok) return;
          mp.saving = true;
          renderSection();
          api.contacts_merge_company(JSON.stringify({
            absorbed_id: mp.absorbedId,
            survivor_id: mp.selectedId,
          }));
        });
      });
    }
  }

  function onContactsCompanyActionDone(payload) {
    let p;
    try { p = JSON.parse(payload); } catch { return; }
    if (!p) return;
    const st = appState.contacts.company;
    const addModal = st.addModal;
    if (!p.ok) {
      if (p.action === 'merge_company') {
        const mp = st.mergePicker;
        mp.saving = false;
        if (typeof showToast === 'function') showToast(p.error || 'Не удалось слить.');
        if (appState.section === 'contacts' && appState.contacts.tab === 'companies') {
          renderSection();
        }
      } else if (addModal.open && addModal.saving) {
        addModal.saving = false;
        addModal.error = p.error || 'Не удалось сохранить.';
        if (appState.section === 'contacts' && appState.contacts.tab === 'companies') {
          renderSection();
        }
      } else if (typeof showToast === 'function') {
        showToast(p.error || 'Ошибка');
      }
      return;
    }
    if (p.action === 'create_company') {
      addModal.saving = false;
      addModal.open = false;
      addModal.error = null;
      addModal.draft = { name: '', website: '', aliases: '', notes: '' };
      if (p.created_id != null) {
        appState.contacts.selectedCompanyId = Number(p.created_id);
      }
      st.searchDraft = '';
      st.search = '';
      renderSection();  // close the modal visibly before the list call returns
      requestContactsCompanyList();
    } else if (p.action === 'update_company') {
      const id = Number(p.company_id);
      const fields = Array.isArray(p.fields) ? p.fields : [];
      // Detail re-fetch is only needed when the server canonicalises a value
      // we can't predict (name / website strip, aliases server-side dedup —
      // but JS already dedupes aliases locally). Skipping it for notes/
      // aliases-only updates avoids clobbering a name/website input the
      // user is mid-typing in (no blur yet → no draft → re-render would
      // overwrite their unsaved keystrokes with the server value).
      const needsDetailReload = fields.some(f => f === 'name' || f === 'website');
      if (needsDetailReload && Number.isFinite(id)) requestContactsCompanyDetail(id);
      // Notes don't appear in the list-row sub-line; skip the list refresh
      // for notes-only updates. Aliases ARE shown there (alongside name +
      // website), so any aliases change still triggers a refresh.
      const listVisible = fields.some(f => f === 'name' || f === 'website' || f === 'aliases');
      if (listVisible) {
        requestContactsCompanyList({ mode: 'refresh' });
      }
      if (fields.includes('notes')) {
        const ta = mainSlot.querySelector('[data-role="cnt-co-notes"]');
        if (ta) {
          ta.classList.add('saved-flash');
          setTimeout(() => ta.classList.remove('saved-flash'), 400);
        }
      }
    } else if (p.action === 'blacklist') {
      let msg;
      if (p.was_inactive) msg = `Возвращена в blacklist: ${p.value}`;
      else if (p.existed) msg = `Уже в blacklist: ${p.value}`;
      else msg = `Добавлена в blacklist: ${p.value}`;
      if (typeof showToast === 'function') showToast(msg);
      const id = Number(p.company_id);
      if (Number.isFinite(id)) requestContactsCompanyDetail(id);
      requestContactsCompanyList({ mode: 'refresh' });
    } else if (p.action === 'unblacklist') {
      if (typeof showToast === 'function') {
        showToast(p.updated ? 'Убрана из blacklist' : 'В blacklist не было');
      }
      const id = Number(p.company_id);
      if (Number.isFinite(id)) requestContactsCompanyDetail(id);
      requestContactsCompanyList({ mode: 'refresh' });
    } else if (p.action === 'merge_company') {
      const mp = st.mergePicker;
      mp.saving = false;
      closeContactsCompanyMergePicker();
      const survivor = Number(p.survivor_id);
      if (Number.isFinite(survivor)) {
        appState.contacts.selectedCompanyId = survivor;
        st.detail = null;
        st.detailFor = null;
        st.vacancies = [];
        st.vacanciesFor = null;
        st.hrs = [];
        st.hrsFor = null;
        if (st.notesSaveTimer) { clearTimeout(st.notesSaveTimer); st.notesSaveTimer = null; }
        st.notesDraft = '';
        st.notesFor = null;
      }
      renderSection();  // close the merge modal + show survivor selection immediately
      requestContactsCompanyList({ mode: 'refresh' });
      if (typeof showToast === 'function') showToast('Компании слиты');
    } else if (p.action === 'delete_company') {
      const id = Number(p.company_id);
      if (Number.isFinite(id) && appState.contacts.selectedCompanyId === id) {
        appState.contacts.selectedCompanyId = null;
        st.detail = null;
        st.detailFor = null;
        st.vacancies = [];
        st.vacanciesFor = null;
        st.hrs = [];
        st.hrsFor = null;
        if (st.notesSaveTimer) { clearTimeout(st.notesSaveTimer); st.notesSaveTimer = null; }
        st.notesDraft = '';
        st.notesFor = null;
      }
      renderSection();  // visually drop the deleted detail before list reload
      requestContactsCompanyList({ mode: 'refresh' });
      if (typeof showToast === 'function') showToast('Компания удалена');
    }
  }

  // === Contacts / Channels (07) — slice 1: live list-pane ===============

  function requestContactsChannelList() {
    if (!api) return;
    const st = appState.contacts.channels;
    st.requestEpoch = (st.requestEpoch || 0) + 1;
    api.request_contacts_channel_list(JSON.stringify({
      search: st.searchDraft || '',
      epoch: st.requestEpoch,
    }));
  }

  function onContactsChannelListLoaded(payload) {
    let p;
    try { p = JSON.parse(payload); } catch { return; }
    if (!p) return;
    const st = appState.contacts.channels;
    if (!p.ok) {
      st.loaded = true;
      return;
    }
    if (p.epoch != null && p.epoch !== st.requestEpoch) return;
    st.list = (p.channels || []).map(c => ({
      id: c.id,
      username: c.username,
      title: c.title,
      isActive: !!c.is_active,
      vacCount: c.vacancy_count,
      avatar: c.avatar || null,
      blacklisted: !!c.is_blacklisted,
    }));
    st.loaded = true;
    st.search = p.search || '';
    if (appState.section === 'contacts' && appState.contacts.tab === 'channels') {
      renderSection();
    }
  }

  function renderContactsChannelRow(ch) {
    const st = appState.contacts.channels;
    const selected = st.selectedId === ch.id;
    const avatarHtml = ch.avatar
      ? `<img class="cnt-avatar" src="${escapeAttr(ch.avatar)}" alt="">`
      : `<span class="cnt-avatar"><span class="material-symbols-outlined">tag</span></span>`;
    const titleHtml = ch.title
      ? `<div class="cnt-hr-name">${escapeHtml(ch.title)}</div>`
      : (ch.username
          ? `<div class="cnt-hr-name">@${escapeHtml(ch.username)}</div>`
          : `<div class="cnt-hr-name muted">— без названия —</div>`);
    const usernameHtml = ch.username
      ? `<span class="at">@${escapeHtml(ch.username)}</span>`
      : `<span class="muted">без @username</span>`;
    const countHtml = ch.vacCount > 0
      ? `<span class="cnt-co-count">${ch.vacCount}</span>`
      : '';
    const blacklistHtml = ch.blacklisted
      ? `<span class="cnt-hr-bl" title="В blacklist"><span class="material-symbols-outlined">block</span></span>`
      : '';
    const inFlight = st.toggling && st.toggling.has(ch.id);
    // Канал в blacklist'е залочен в выключенном состоянии — UI ВСЕГДА
    // рисует toggle как off (даже если в БД is_active=true из-за дрейфа
    // данных), disabled, и с курсором not-allowed. Бэк отвергает любые
    // попытки re-enable. Снимать блокировку можно только удалением
    // записи из blacklist'а.
    const toggleDisabled = inFlight || ch.blacklisted;
    const toggleChecked = ch.isActive && !ch.blacklisted;
    const toggleTitle = ch.blacklisted ? ' title="В blacklist — снимите запись, чтобы включить"' : '';
    const toggleClass = ch.blacklisted ? ' bl-locked' : '';
    const toggleHtml = `<input type="checkbox" class="toggle-cb${toggleClass}" data-action="cnt-ch-toggle" data-channel-id="${ch.id}"${toggleChecked ? ' checked' : ''}${toggleDisabled ? ' disabled' : ''}${toggleTitle}>`;
    // Класс `blacklisted` → text-tertiary стилизация имени, как у HR/Company.
    // disabled (is_active=false) тоже пишем в `blacklisted` чтобы тушить
    // имя — историческое использование класса в каналах. Сохраняем оба
    // источника dimming'а.
    const dim = !ch.isActive || ch.blacklisted;
    return `
      <div class="cnt-hr-row${selected ? ' selected' : ''}${dim ? ' blacklisted' : ''}" data-channel-id="${ch.id}">
        ${avatarHtml}
        <div class="cnt-hr-info">
          ${titleHtml}
          <div class="cnt-hr-sub">${usernameHtml}</div>
        </div>
        <div class="cnt-hr-trailing">${blacklistHtml}${countHtml}${toggleHtml}</div>
      </div>
    `;
  }

  // Voronka order — мой UI рендерит и бар, и легенду в одной последовательности.
  // Значения совпадают с ``VacancyStatus.value`` на бэкенде, так что
  // ``stats.status_counts`` берётся по этим ключам без преобразований.
  const CHANNEL_STATUS_ORDER = [
    'New', 'Applied', 'Answered', 'Test', 'Invitation',
    'In Progress', 'Offer', 'Decline', 'Ghosting', 'Scam', 'Not Fit',
  ];
  // Цвет — единый источник для bar-сегментов и legend-точек.
  // Дублирует .status-dot.<class> в CSS, но статусы в .status-dot
  // тегаются классами через statusToClass() — здесь ключи — сами values
  // статуса, чтобы JS-маппинг был тривиальным.
  const CHANNEL_STATUS_COLOR = {
    'New':         '#ffffff',
    'Applied':     '#0a84ff',
    'Answered':    '#5ac8fa',
    'Test':        '#5ce6c0',
    'Invitation':  '#34c759',
    'In Progress': '#64f20c',
    'Offer':       '#af52de',
    'Decline':     '#ff453a',
    'Ghosting':    '#ffd60a',
    'Scam':        '#ff9f0a',
    'Not Fit':     '#48484a',
  };

  function renderContactsChannelStats(stats) {
    if (!stats) return '';
    const fmtPct = (v) => v == null ? '—' : `${v}%`;
    const tiles = `
      <div class="ch-stats-grid">
        <div class="ch-stat">
          <span class="ch-stat-num">${stats.vacancies_per_day}</span>
          <span class="ch-stat-label">Вакансий в день</span>
        </div>
        <div class="ch-stat">
          <span class="ch-stat-num fit">${fmtPct(stats.fit_percent)}</span>
          <span class="ch-stat-label">Подходящих вакансий</span>
        </div>
        <div class="ch-stat">
          <span class="ch-stat-num apply">${fmtPct(stats.apply_percent)}</span>
          <span class="ch-stat-label">Откликов из подходящих</span>
        </div>
        <div class="ch-stat">
          <span class="ch-stat-num response">${fmtPct(stats.response_percent)}</span>
          <span class="ch-stat-label">Ответов на отклики</span>
        </div>
      </div>
    `;
    const total = stats.total || 0;
    if (!total) {
      return `
        <div class="cnt-det-section">
          ${tiles}
          <div class="ch-stats-empty">Из этого канала ещё не пришло вакансий</div>
        </div>
      `;
    }
    const segs = CHANNEL_STATUS_ORDER.map(status => {
      const count = stats.status_counts[status] || 0;
      if (!count) return '';
      const pct = (count / total) * 100;
      const color = CHANNEL_STATUS_COLOR[status];
      return `<div class="ch-bar-seg" style="background: ${color}; width: ${pct}%" title="${escapeAttr(status)} ${count}"></div>`;
    }).filter(Boolean).join('');
    const legend = CHANNEL_STATUS_ORDER.map(status => {
      const count = stats.status_counts[status] || 0;
      if (!count) return '';
      const color = CHANNEL_STATUS_COLOR[status];
      return `<span class="legend-item"><span class="legend-dot" style="background: ${color}"></span>${escapeHtml(status)} ${count}</span>`;
    }).filter(Boolean).join('');
    return `
      <div class="cnt-det-section">
        ${tiles}
        <div class="ch-bar">${segs}</div>
        <div class="ch-bar-legend">${legend}</div>
      </div>
    `;
  }

  function renderContactsChannelMorePopover() {
    const st = appState.contacts.channels;
    if (!st.morePopoverOpen) return '';
    // «Прогнать сейчас» гейтим на хелсчеке (DB/TG/CHT/EMB) — операция

    const healthOk = healthInitialized && isAllHealthy();

          <span class="material-symbols-outlined">restart_alt</span>
          <span>Убрать из blacklist</span>
        </button>`
      : `<button class="menu-item" data-action="cnt-ch-blacklist" type="button" title="Добавить в blacklist">
          <span class="material-symbols-outlined">block</span>
          <span>Добавить в blacklist</span>
        </button>`;
    return `
      <div class="more-popover">
        <button class="menu-item" data-action="cnt-ch-poll-now" type="button" title="${escapeAttr(blockedTip)}"${pollDisabled ? ' disabled' : ''}>
          <span class="material-symbols-outlined">refresh</span>
          <span>Прогнать сейчас</span>
        </button>
        <button class="menu-item" data-action="cnt-ch-reset-cursor" type="button" title="Сбросить last_processed_msg_id">
          <span class="material-symbols-outlined">restart_alt</span>
          <span>Сбросить курсор</span>
        </button>
        ${blItem}
        <hr class="menu-divider">
        <button class="menu-item danger" data-action="cnt-ch-delete" type="button" title="Удалить канал">
          <span class="material-symbols-outlined">delete</span>
          <span>Удалить канал</span>
        </button>
      </div>
    `;
  }

  function renderContactsChannelDetailHead(d) {
    const avatarHtml = d.avatar
      ? `<img class="cnt-det-avatar" src="${escapeAttr(d.avatar)}" alt="">`
      : `<span class="cnt-det-avatar"><span class="material-symbols-outlined">tag</span></span>`;

    const tgHtml = d.username

  function renderContactsChannelDetailVacancies(d) {
    const st = appState.contacts.channels;
    // vacanciesFor выставляется в `requestContactsChannelVacancies` СРАЗУ
    // (до прихода ответа), поэтому одного `vacanciesFor !== d.id` мало —
    // в окне между «request fired» и «response arrived» он уже совпадает,
    // но вакансий ещё нет, и без `vacanciesLoading`-гарда render выдавал
    // ложное «нет вакансий» (чаще всего при первом клике, когда detail
    // ответ приходит раньше vacancies-ответа).
    if (st.vacanciesFor !== d.id || st.vacanciesLoading) {
      return `<div class="cnt-det-section"><div class="cnt-vacs-empty">Загрузка…</div></div>`;
    }
    if (!st.vacancies.length) {
      return `<div class="cnt-det-section"><div class="cnt-vacs-empty">Из этого канала ещё нет вакансий.</div></div>`;
    }
    const parsed = st.vacancies.filter(v => v.title && v.title.trim());
    if (!parsed.length) {
      return `<div class="cnt-det-section"><div class="cnt-vacs-empty">Из этого канала ещё нет вакансий.</div></div>`;
    }
    const rows = parsed.map(v => {
      const cls = statusToClass(v.status || 'New');
      const score = (v.score == null) ? '' : `<span class="vac-mini-score">${v.score}</span>`;
      const when = v.createdAt ? fmtShortAgo(v.createdAt) : '';
      return `
        <div class="vac-mini-row" data-action="cnt-ch-open-vacancy" data-vacancy-id="${v.id}">
          <span class="status-dot ${cls}"></span>
          ${score}
          <span class="vac-mini-title">${escapeHtml(v.title)}</span>
          <span class="vac-mini-when">${escapeHtml(when)}</span>
        </div>
      `;
    }).join('');
    const moreHint = st.vacanciesLoadingMore
      ? `<div class="ch-vacs-loading-more">Загрузка…</div>`
      : '';
    return `
      <div class="cnt-det-section">
        <div class="vacs-mini">${rows}</div>
        ${moreHint}
      </div>
    `;
  }

  function renderContactsChannelDetail() {
    const st = appState.contacts.channels;
    if (st.selectedId == null) {
      return `<div class="cnt-detail-empty">Выберите канал в списке</div>`;
    }
    if (st.detailLoading || !st.detail || st.detail.id !== st.selectedId) {
      return `<div class="cnt-detail-empty">Загрузка…</div>`;
    }
    return `
      ${renderContactsChannelDetailHead(st.detail)}
      ${renderContactsChannelStats(st.detail.stats)}
      ${renderContactsChannelDetailVacancies(st.detail)}
    `;
  }

  const CHANNEL_VAC_PAGE_SIZE = 50;

  function requestContactsChannelVacancies(channelId, opts) {
    if (!api || channelId == null) return;
    const st = appState.contacts.channels;
    const mode = (opts && opts.mode) || 'replace';
    if (mode === 'append') {
      st.vacanciesLoadingMore = true;
    } else {
      st.vacanciesFor = channelId;
      st.vacanciesLoading = true;
    }
    const offset = mode === 'append' ? st.vacancies.length : 0;
    api.request_contacts_channel_vacancies(JSON.stringify({
      channel_id: channelId,
      limit: CHANNEL_VAC_PAGE_SIZE,
      offset,
      mode,
    }));
  }

  function onContactsChannelVacanciesLoaded(payload) {
    let p;
    try { p = JSON.parse(payload); } catch { return; }
    if (!p) return;
    const st = appState.contacts.channels;
    if (!p.ok) {
      // Generic-error path: чистим оба loading-флага, чтобы не висел спиннер.
      if (st.vacanciesLoading || st.vacanciesLoadingMore) {
        st.vacanciesLoading = false;
        st.vacanciesLoadingMore = false;
        if (appState.section === 'contacts' && appState.contacts.tab === 'channels') {
          renderSection();
        }
      }
      return;
    }
    if (p.channel_id !== st.vacanciesFor) {
      // Stale-drop: ответ принадлежит другому каналу (юзер успел кликнуть
      // другой ряд / push-refresh обогнал старый запрос). РАНЬШЕ просто
      // return — но загрузочные флаги оставались выставленными, и гейт в
      // renderContacts ниже (`!vacanciesLoading`) больше никогда не пускал
      // новый запрос: список застревал пустым навсегда.
      st.vacanciesLoading = false;
      st.vacanciesLoadingMore = false;
      return;
    }
    const mode = p.mode || 'replace';
    const newRows = (p.vacancies || []).map(v => ({
      id: v.id,
      title: v.title || '',
      status: v.status,
      score: v.score,
      createdAt: v.created_at ? new Date(v.created_at) : null,
    }));
    if (mode === 'append') {
      // Дедуп по id — append-страница может частично пересечь существующие
      // строки, если пока loadingMore был in-flight на бэке вставилась новая
      // вакансия и сдвинула offset.
      const known = new Set(st.vacancies.map(r => r.id));
      st.vacancies = st.vacancies.concat(newRows.filter(r => !known.has(r.id)));
      st.vacanciesLoadingMore = false;
    } else {
      st.vacancies = newRows;
      st.vacanciesLoading = false;
    }
    st.vacanciesHasMore = !!p.has_more;
    if (appState.section === 'contacts' && appState.contacts.tab === 'channels') {
      renderSection();
    }
  }

  function requestContactsChannelDetail(channelId) {
    if (!api || channelId == null) return;
    const st = appState.contacts.channels;
    st.detailFor = channelId;
    st.detailLoading = true;
    api.request_contacts_channel_detail(channelId);
  }

  function onContactsChannelDetailLoaded(payload) {
    let p;
    try { p = JSON.parse(payload); } catch { return; }
    if (!p) return;
    const st = appState.contacts.channels;
    if (!p.ok) {
      // Очищаем loading-флаг, даже если в payload не пришёл channel_id
      // (generic exception path в bridge): иначе спиннер виснет навсегда.
      // st.detail трогаем только если ошибка относится к текущему ряду.
      if (st.detailLoading) {
        st.detailLoading = false;
        if (p.channel_id != null && p.channel_id === st.detailFor) {
          st.detail = null;
        }
        if (appState.section === 'contacts' && appState.contacts.tab === 'channels') {
          renderSection();
        }
      }
      return;
    }
    if (p.channel_id !== st.detailFor) return;  // stale; user clicked another row
    st.detail = {
      id: p.channel_id,
      username: p.username,
      title: p.title,
      isActive: !!p.is_active,
      avatar: p.avatar || null,
      stats: p.stats || null,
      blacklistValue: p.blacklist_value || null,
    };
    st.detailLoading = false;
    if (appState.section === 'contacts' && appState.contacts.tab === 'channels') {
      renderSection();
    }
  }

  function renderContactsChannelAddModal() {
    const m = appState.contacts.channels.addModal;
    if (!m.open) return '';
    const d = m.draft;
    const saveDisabled = m.saving || !String(d.input || '').trim();
    return `
      <div class="modal-backdrop" data-action="cnt-ch-add-close">
        <div class="vac-picker-modal creating" onclick="event.stopPropagation()">
          <div class="modal-head">
            <span class="material-symbols-outlined">add_circle</span>
            <div class="modal-title">Добавить канал</div>
            <button type="button" class="modal-close" data-action="cnt-ch-add-close" title="Закрыть" aria-label="Закрыть">
              <span class="material-symbols-outlined">close</span>
            </button>
          </div>
          <div class="picker-create-pane">
            <input type="text" data-role="cnt-ch-add-input" maxlength="200" placeholder="@username канала или t.me/..." value="${escapeAttr(d.input || '')}">
            <div class="cnt-add-hint">Название и аватар подгрузятся из Telegram автоматически.</div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn" data-action="cnt-ch-add-close">Отмена</button>
            <button type="button" class="btn primary" data-action="cnt-ch-add-submit"${saveDisabled ? ' disabled' : ''}>${m.saving ? 'Добавляю…' : 'Добавить'}</button>
          </div>
        </div>
      </div>
    `;

  function renderContactsChannels() {
    const st = appState.contacts.channels;
    let listContent;
    if (!st.loaded && !st.list.length) {
      listContent = `<div class="cnt-list-empty">Загрузка…</div>`;
    } else if (!st.list.length) {
      listContent = st.search
        ? `<div class="cnt-list-empty">Ничего не найдено по запросу «${escapeHtml(st.search)}»</div>`
        : `<div class="cnt-list-empty">Каналов пока нет</div>`;

    }

      <div class="cnt-layout">
        <section class="cnt-list-pane">
