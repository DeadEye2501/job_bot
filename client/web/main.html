              </div>
              <div class="session-row">
                <span class="session-info">${sessionLine}</span>
                <div style="display: flex; gap: 6px;">
                  <button class="btn" data-action="settings-tg-relogin" type="button"><span class="material-symbols-outlined">${tg.has_session ? 'sync' : 'login'}</span>${tg.has_session ? 'Перелогиниться' : 'Войти'}</button>
                  ${tg.has_session ? `<button class="btn danger" data-action="settings-tg-logout" type="button"><span class="material-symbols-outlined">logout</span>Выйти из сессии</button>` : ''}
                </div>
              </div>
            </div>
          </div>

          ${_renderChatSection()}
          ${_renderEmbedSection()}
          ${_renderPipelineSection()}
          ${_renderDangerSection()}
        </div>
      </div>
    `;
  }

  function _renderDangerSection() {
    return `
      <div class="section danger-section">
        <div class="section-title">
          <span class="material-symbols-outlined">warning</span>
          Опасная зона
        </div>
        <div class="danger-row">
          <div>
            <div class="text">Удалить все данные</div>
            <div class="sub">Полное безвозвратное удаление всех данных приложения: база, сессия Telegram, медиафайлы. Приложение закроется, при следующем запуске откроется визард.</div>
          </div>
          <button class="btn danger" data-action="settings-delete-all" type="button"><span class="material-symbols-outlined">delete_forever</span>Удалить всё</button>
        </div>
      </div>
    `;
  }

  function _renderPipelineSection() {
    const st = appState.system.settings;
    const p = st.pipeline || { scoring_threshold: 10, poll_interval_sec: 1800, backfill_limit: 15, dm_backfill_limit: 50, send_locked: true };
    const SCORE_MAX = 20;
    const score = Number.isFinite(p.scoring_threshold) ? p.scoring_threshold : 10;
    const scoreClamped = Math.max(0, Math.min(SCORE_MAX, score));
    const scorePct = (scoreClamped / SCORE_MAX) * 100;
    const sendLocked = p.send_locked !== false;
    return `
      <div class="section">
        <div class="section-title">
          <span class="material-symbols-outlined">tune</span>
          Пайплайн
        </div>
        <div class="pipeline-row">
          <div>
            <div class="pipeline-label">Score threshold</div>
            <div class="slider-row">
              <input type="range" class="slider" data-field="pipeline.scoring_threshold" min="0" max="${SCORE_MAX}" value="${scoreClamped}" style="--pct: ${scorePct}%;">
              <span class="slider-num" data-role="pipeline-score-num">${scoreClamped}</span>
            </div>
          </div>
          <div>
            <div class="pipeline-label">Интервал опроса</div>
            <div class="with-unit">
              <input class="input" type="number" min="10" max="86400" data-field="pipeline.poll_interval_sec" value="${escapeAttr(String(p.poll_interval_sec))}">
              <span class="unit">сек</span>
            </div>
          </div>
          <div>
            <div class="pipeline-label">Сообщений за цикл</div>
            <div class="with-unit">
              <input class="input" type="number" min="1" max="500" data-field="pipeline.backfill_limit" value="${escapeAttr(String(p.backfill_limit))}">
              <span class="unit">шт</span>
            </div>
          </div>
          <div>
            <div class="pipeline-label">DM-сообщений на HR</div>
            <div class="with-unit">
              <input class="input" type="number" min="1" max="500" data-field="pipeline.dm_backfill_limit" value="${escapeAttr(String(p.dm_backfill_limit))}">
              <span class="unit">шт</span>
            </div>
          </div>
          <div>
            <div class="pipeline-label" title="Когда включено, исходящие DM не уходят в Telegram (dev-режим — для локального теста пайплайна без реальной отправки)">Симуляция отправки</div>
            <div class="with-toggle">
              <input type="checkbox" class="pipeline-toggle" data-field="pipeline.send_locked"${sendLocked ? ' checked' : ''}>
            </div>
          </div>
        </div>
      </div>
    `;
  }

  function attachSystemSettingsHandlers() {
    // Eye-toggle через прямой DOM-mutate, без ререндера, чтобы значения,
    // которые юзер уже напечатал в полях, не потерялись.
    mainSlot.querySelectorAll('[data-action="settings-secret-toggle"]').forEach(btn => {
      btn.addEventListener('click', () => {
        const target = btn.dataset.target;
        const inp = mainSlot.querySelector(`[data-secret="${target}"]`);
        const icon = btn.querySelector('.material-symbols-outlined');
        if (!inp || !icon) return;
        const visible = inp.type === 'text';
        inp.type = visible ? 'password' : 'text';
        icon.textContent = visible ? 'visibility' : 'visibility_off';
        btn.title = visible ? 'Показать' : 'Скрыть';
      });
    });
    // Чекбокс «использовать те же креды как у чата». Не меняем embed-creds
    // в state — derived-флаг управляет видимостью полей и чтением creds
    // на probe-time. Сохранение в БД произойдёт когда дойдёт до Save-bar
    // (отдельный слайс).
    const sameCb = mainSlot.querySelector('[data-action="settings-embed-same"]');
    if (sameCb) {
      sameCb.addEventListener('change', () => {
        const st = appState.system.settings;
        st.embedSameAsChat = sameCb.checked;
        if (!sameCb.checked) {
          const chatBaseInp = mainSlot.querySelector('[data-field="chat.base_url"]');
          const chatKeyInp  = mainSlot.querySelector('[data-field="chat.api_key"]');
          if (!st.embed) st.embed = { base_url: '', api_key: '', model: '' };
          if (chatBaseInp) st.embed.base_url = chatBaseInp.value.trim();
          if (chatKeyInp)  st.embed.api_key  = chatKeyInp.value;
        }
        _llmModelsLastFetch.embed = '';
        st.embedModels = [];
        st.embedProbe = { status: 'idle', model: '', latencyMs: 0, error: '' };
        // Autosave: на момент клика DOM-инпуты embed.base_url/api_key
        // могут не существовать (если только что переключились в same).
        // Берём creds из chat-DOM (они и есть «новые» embed-creds в обоих
        // случаях toggle), модель — из embed-DOM (этот инпут есть всегда).
        // Параллельно сохраняем chat — юзер мог отредактировать chat-поля
        // и не сделать blur перед кликом на чекбокс; без flush'а DB
        // получит chat ≠ embed несмотря на same=true.
        const chatCreds = _readChatFromDom();
        const modelInp = mainSlot.querySelector('[data-field="embed.model"]');
        _saveSettings({
          chat: chatCreds,
          embed: {
            base_url: chatCreds.base_url,
            api_key:  chatCreds.api_key,
            model: modelInp ? modelInp.value.trim() : '',
          },
        });
        renderSection();
      });
    }
    // Pipeline app-settings: slider — на change (release), number — на blur.
    const scoreSlider2 = mainSlot.querySelector('[data-field="pipeline.scoring_threshold"]');
    if (scoreSlider2) {
      scoreSlider2.addEventListener('change', () => {
        _saveSettings({ app: { scoring_threshold: scoreSlider2.value } });
      });
    }
    const sendLockedToggle = mainSlot.querySelector('[data-field="pipeline.send_locked"]');
    if (sendLockedToggle) {
      sendLockedToggle.addEventListener('change', () => {
        // Optimistic state update: следующий ререндер из push'а БД-патча
        // не должен «откатить» галочку, пока ответ не пришёл.
        if (!appState.system.settings.pipeline) appState.system.settings.pipeline = {};
        appState.system.settings.pipeline.send_locked = sendLockedToggle.checked;
        _saveSettings({ app: { send_locked: sendLockedToggle.checked } });
      });
    }
    const deleteAllBtn = mainSlot.querySelector('[data-action="settings-delete-all"]');
    if (deleteAllBtn) {
      deleteAllBtn.addEventListener('click', async () => {
        const ok = await showModal({
          message: 'Удалить ВСЕ данные приложения?\n\nБудет стёрта база, сессия Telegram, медиафайлы. Приложение закроется. Откатить нельзя.',
          type: 'confirm',
          danger: true,
          okLabel: 'Удалить всё',
        });
        if (!ok || !api) return;
        deleteAllBtn.disabled = true;
        if (typeof showToast === 'function') showToast('Удаляем данные…');
        api.request_delete_all_data();
      });
    }
    [
      'pipeline.poll_interval_sec',
      'pipeline.backfill_limit',
      'pipeline.dm_backfill_limit',
    ].forEach(field => {
      const inp = mainSlot.querySelector(`[data-field="${field}"]`);
      if (!inp) return;
      inp.addEventListener('blur', () => {
        const key = field.split('.')[1];
        const min = parseInt(inp.min, 10);
        const max = parseInt(inp.max, 10);
        const parsed = parseInt(inp.value, 10);
        if (!Number.isFinite(parsed)) {
          // Невалидный ввод — восстанавливаем последнее сохранённое значение.
          const prev = (appState.system.settings.pipeline || {})[key];
          if (Number.isFinite(prev)) inp.value = String(prev);
          return;
        }
        const clamped = Math.max(min, Math.min(max, parsed));
        if (clamped !== parsed) inp.value = String(clamped);
        _saveSettings({ app: { [key]: clamped } });
      });
    });
    // На blur полей base_url/api_key — обновляем datalist + autosave.
    // Дополнительно: если embed.same_as_chat, blur по chat-полям должен
    // обновить и embed-datalist + сохранить embed-секцию (creds копируются).
    // ВАЖНО про blur-листенеры ниже: при переключении таба `renderSection()`
    // сносит mainSlot.innerHTML до того, как blur успевает сработать. Браузер
    // FIRE'ит blur на detached input'е, наш handler пытается прочитать
    // mainSlot.querySelector('[data-field="chat.api_key"]') — а там уже DOM
    // другой секции. Возвращается null → fallback '' → _saveSettings({chat:
    // {base_url:'', api_key:'', model:''}}) ЗАТИРАЕТ creds в БД и в appState.
    // Гард: если фокусированный input уже отсоединён, blur был частью
    // tab-switch'а, save игнорим. Состояние creds останется тем, что было
    // до начала редактирования — пусть юзер вернётся и нажмёт ещё раз.
    ['chat.base_url', 'chat.api_key'].forEach(field => {
      const inp = mainSlot.querySelector(`[data-field="${field}"]`);
      if (!inp) return;
      inp.addEventListener('blur', () => {
        if (!inp.isConnected) return;
        _llmFetchModels('chat');
        const patch = { chat: _readChatFromDom() };
        if (appState.system.settings.embedSameAsChat) {
          _llmFetchModels('embed');
          patch.embed = _readEmbedFromDom();
        }
        _saveSettings(patch);
      });
    });
    ['embed.base_url', 'embed.api_key'].forEach(field => {
      const inp = mainSlot.querySelector(`[data-field="${field}"]`);
      if (!inp) return;
      inp.addEventListener('blur', () => {
        if (!inp.isConnected) return;
        _llmFetchModels('embed');
        _saveSettings({ embed: _readEmbedFromDom() });
      });
    });
    // model-инпуты в chat/embed: blur-save (и embed тоже сохраняем при
    // any chat-blur выше — на случай если same_as_chat).
    const chatModelInp = mainSlot.querySelector('[data-field="chat.model"]');
    if (chatModelInp) {
      chatModelInp.addEventListener('blur', () => {
        if (!chatModelInp.isConnected) return;
        const patch = { chat: _readChatFromDom() };
        if (appState.system.settings.embedSameAsChat) {
          patch.embed = _readEmbedFromDom();
        }
        _saveSettings(patch);
      });
    }
    const embedModelInp = mainSlot.querySelector('[data-field="embed.model"]');
    if (embedModelInp) {
      embedModelInp.addEventListener('blur', () => {
        if (!embedModelInp.isConnected) return;
        _saveSettings({ embed: _readEmbedFromDom() });
      });
    }
    // Любое редактирование creds сбрасывает probe-плашку — иначе она
    // продолжает показывать старый «model · ms» / «Проверка…», когда
    // юзер уже успел поменять модель/URL. Ререндер не делаем (потеряли
    // бы фокус инпута), плашку убираем точечно через DOM.
    // 'busy' тоже сбрасываем: если ответ потом прилетит, onLlmProbeDone
    // увидит status !== 'busy' и не оживит плашку (см. routing-логику).
    [
      'chat.base_url', 'chat.api_key', 'chat.model',
      'embed.base_url', 'embed.api_key', 'embed.model',
    ].forEach(field => {
      const inp = mainSlot.querySelector(`[data-field="${field}"]`);
      if (!inp) return;
      const kind = field.split('.')[0];
      inp.addEventListener('input', () => {
        const probe = appState.system.settings[kind + 'Probe'];
        if (probe.status !== 'idle') {
          probe.status = 'idle';
          probe.model = '';
          probe.latencyMs = 0;
          probe.error = '';
          const pill = mainSlot.querySelector(`[data-role="${kind}-probe-pill"]`);
          if (pill) pill.remove();
          // Re-enable «Проверить» — без этого кнопка остаётся disabled
          // навсегда: probe.status сбрасывается на 'idle', но disabled
          // attribute живёт в DOM с момента предыдущего рендера. Поздний
          // ответ через onLlmProbeDone увидит status !== 'busy' и не
          // ререндерит — кнопка торчит disabled до полного re-render'а.
          const probeBtn = mainSlot.querySelector(
            `[data-action="settings-llm-probe"][data-kind="${kind}"]`
          );
          if (probeBtn) {
            probeBtn.disabled = false;
            probeBtn.innerHTML = '<span class="material-symbols-outlined">network_check</span>Проверить';
          }
        }
      });
    });
    // Авто-фетч при заходе на экран если base_url есть, а список пуст.
    ['chat', 'embed'].forEach(kind => {
      const cfg = appState.system.settings[kind];
      if (cfg && cfg.base_url && !appState.system.settings[kind + 'Models'].length) {
        _llmFetchModels(kind);
      }
    });
    // Score-threshold slider: live-обновляем пилл и градиент-fill, без ререндера.
    const scoreSlider = mainSlot.querySelector('[data-field="pipeline.scoring_threshold"]');
    if (scoreSlider) {
      const num = mainSlot.querySelector('[data-role="pipeline-score-num"]');
      const update = () => {
        const v = scoreSlider.value;
        scoreSlider.style.setProperty('--pct', ((v - scoreSlider.min) / (scoreSlider.max - scoreSlider.min) * 100) + '%');
        if (num) num.textContent = v;
      };
      scoreSlider.addEventListener('input', update);
    }
    mainSlot.querySelectorAll('[data-action="settings-llm-probe"]').forEach(btn => {
      btn.addEventListener('click', () => {
        const kind = btn.dataset.kind; // 'chat' | 'embed'
        const { base_url, api_key } = _llmReadCreds(kind);
        const modelInp = mainSlot.querySelector(`[data-field="${kind}.model"]`);
        const model = modelInp ? modelInp.value.trim() : '';
        if (!base_url || !model) {
          if (typeof showToast === 'function') {
            showToast('Заполните base_url и модель', { variant: 'danger' });
          }
          return;
        }
        const probe = appState.system.settings[kind + 'Probe'];
        if (!probe) return;
        probe.status = 'busy';
        probe.error = '';
        renderSection();
        api.request_llm_probe(JSON.stringify({ kind, base_url, api_key, model }));
      });
    });
    const reloginBtn = mainSlot.querySelector('[data-action="settings-tg-relogin"]');
    if (reloginBtn) {
      reloginBtn.addEventListener('click', () => {
        // Читаем значения из инпутов основной TG-секции — дублировать
        // их в модалке нет смысла.
        const apiIdInp = mainSlot.querySelector('[data-field="tg.api_id"]');
        const apiHashInp = mainSlot.querySelector('[data-field="tg.api_hash"]');
        const phoneInp = mainSlot.querySelector('[data-field="tg.phone"]');
        const api_id = apiIdInp ? apiIdInp.value.trim() : '';
        const api_hash = apiHashInp ? apiHashInp.value.trim() : '';
        const phone = phoneInp ? phoneInp.value.trim() : '';
        if (!api_id || !api_hash || !phone) {
          if (typeof showToast === 'function') {
            showToast('Заполните api_id, api_hash и телефон', { variant: 'danger' });
          }
          return;
        }
        const st = appState.system.settings;
        st.login = {
          open: true,
          step: 'code',
          draft: { api_id, api_hash, phone, code: '', password: '' },
          error: '',
          busy: true,
        };
        renderSection();
        api.telegram_send_code(JSON.stringify({ api_id, api_hash, phone }));
      });
    }
    // Live-bind полей модалки в state.draft (чтобы значения не терялись
    // при перерисовке после prev render).
    mainSlot.querySelectorAll('[data-field^="login."]').forEach(inp => {
      inp.addEventListener('input', () => {
        const key = inp.dataset.field.split('.')[1];
        appState.system.settings.login.draft[key] = inp.value;
      });
    });
    const cancelBtn = mainSlot.querySelector('[data-action="login-cancel"]');
    if (cancelBtn) {
      cancelBtn.addEventListener('click', () => {
        appState.system.settings.login.open = false;
        // Закрываем backend-state тоже: отключаем временный pyrogram-клиент
        // и сбрасываем phone_code_hash. Иначе следующая попытка login упрётся
        // в «уже отправили код» / висящий сокет.
        if (api && api.cancel_telegram_login) api.cancel_telegram_login();
        renderSection();
      });
    }
    const confirmCodeBtn = mainSlot.querySelector('[data-action="login-confirm-code"]');
    if (confirmCodeBtn) {
      confirmCodeBtn.addEventListener('click', () => {
        const m = appState.system.settings.login;
        const code = (m.draft.code || '').trim();
        if (!code) { m.error = 'Введите код.'; renderSection(); return; }
        m.error = '';
        m.busy = true;
        renderSection();
        api.telegram_confirm_code(JSON.stringify({ code }));
      });
    }
    const confirmPwdBtn = mainSlot.querySelector('[data-action="login-confirm-password"]');
    if (confirmPwdBtn) {
      confirmPwdBtn.addEventListener('click', () => {
        const m = appState.system.settings.login;
        const password = m.draft.password || '';
        if (!password) { m.error = 'Введите пароль.'; renderSection(); return; }
        m.error = '';
        m.busy = true;
        renderSection();
        api.telegram_confirm_password(JSON.stringify({ password }));
      });
    }
    const logoutBtn = mainSlot.querySelector('[data-action="settings-tg-logout"]');
    if (logoutBtn) {
      logoutBtn.addEventListener('click', async () => {
        const ok = await showModal({
          message: 'Выйти из текущей Telegram-сессии?\n\nБот остановится, серверная сессия будет отозвана. Чтобы продолжить — войдите заново.',
          type: 'confirm',
          danger: true,
          okLabel: 'Выйти',
        });
        if (!ok || !api) return;
        logoutBtn.disabled = true;
        api.request_telegram_logout();
      });
    }
  }

  function onTelegramSendCodeDone(payload) {
    const m = appState.system.settings.login;
    // Юзер закрыл модалку, пока запрос летел — не трогаем UI/state.
    if (!m.open) return;
    let p; try { p = JSON.parse(payload); } catch { return; }
    m.busy = false;
    if (!p || !p.ok) {
      const msg = p && p.error ? p.error : 'Не удалось отправить код';
      m.open = false;
      if (typeof showToast === 'function') showToast(msg, { variant: 'danger' });
    } else {
      m.error = '';
      m.step = 'code';
    }
    if (appState.section === 'system' && appState.system.tab === 'settings') {
      renderSection();
    }
  }
  function onTelegramConfirmCodeDone(payload) {
    const m = appState.system.settings.login;
    if (!m.open) return;
    let p; try { p = JSON.parse(payload); } catch { return; }
    m.busy = false;
    if (!p || !p.ok) {
      m.error = p && p.error ? p.error : 'Не удалось проверить код';
      renderSection();
      return;
    }
    if (p.need_password) {
      m.error = '';
      m.step = 'password';
      renderSection();
      return;
    }
    if (p.done) _onTelegramLoginSuccess();
  }
  function onTelegramConfirmPasswordDone(payload) {
    const m = appState.system.settings.login;
    if (!m.open) return;
    let p; try { p = JSON.parse(payload); } catch { return; }
    m.busy = false;
    if (!p || !p.ok) {
      m.error = p && p.error ? p.error : 'Не удалось войти';
      renderSection();
      return;
    }
    if (p.done) _onTelegramLoginSuccess();
  }
  function _onTelegramLoginSuccess() {
    const st = appState.system.settings;
    st.login = {
      open: false, step: 'code',
      draft: { api_id: '', api_hash: '', phone: '', code: '', password: '' },
      error: '', busy: false,
    };
    if (typeof showToast === 'function') showToast('Вошли в Telegram');
    st.loaded = false;
    if (appState.section === 'system' && appState.system.tab === 'settings') {
      requestSystemSettings();
    }
  }

  function onSystemTelegramLogoutDone(payload) {
    let p;
    try { p = JSON.parse(payload); } catch { return; }
    if (!p || !p.ok) {
      if (typeof showToast === 'function') {
        showToast(p.error || 'Не удалось выйти из сессии', { variant: 'danger' });
      }
      return;
    }
    if (typeof showToast === 'function') showToast('Сессия Telegram завершена');
    // Refetch — пилюля и кнопки переключатся в "Нет сессии".
    appState.system.settings.loaded = false;
    if (appState.section === 'system' && appState.system.tab === 'settings') {
      requestSystemSettings();
    }
  }

  function attachSystemLogsHandlers() {
    const st = appState.system.logs;
    mainSlot.querySelectorAll('[data-action="logs-level"]').forEach(el => {
      el.addEventListener('click', () => {
        const v = el.dataset.level;
        if (!v) return;
        if (st.selectedLevels.has(v)) {
          // Не даём выключить последний — иначе пустой список без явной причины.
          if (st.selectedLevels.size > 1) st.selectedLevels.delete(v);
        } else {
          st.selectedLevels.add(v);
        }
        renderSection();
      });
    });
    const autoRefreshBox = mainSlot.querySelector('[data-action="logs-autorefresh"]');
    if (autoRefreshBox) {
      autoRefreshBox.addEventListener('change', () => {
        st.autoRefresh = autoRefreshBox.checked;
        // Если включили обратно — сразу подгрузим, чтобы догнать пропущенное.
        if (st.autoRefresh) requestSystemLogs();
      });
    }

  // SVG-сегменты для donut'а: 11 status-цветов, отдельная <circle>
  // на каждый сегмент. Каждый segment — stroke-dasharray "arc, gap" +
  // transform rotate(startAngle). Параметры круга:
  //   r=42, stroke-width=14, viewBox 100x100, circumference ≈ 263.89.
  const STATS_DONUT_R = 42;
  const STATS_DONUT_C = 2 * Math.PI * STATS_DONUT_R;
  const STATS_DONUT_COLORS = {
    'New':         '#ffffff',
    'Applied':     '#0a84ff',
    'Answered':    '#5ac8fa',
    'Test':        '#5ce6c0',
    'Invitation':  '#64f20c',
    'In Progress': '#34c759',
    'Offer':       '#af52de',
    'Decline':     '#ff453a',
    'Ghosting':    '#ffd60a',
    'Scam':        '#ff9f0a',
    'Not Fit':     '#48484a',
  };
  const STATS_DONUT_ORDER = [
    'New', 'Applied', 'Answered', 'Test', 'Invitation', 'In Progress',
    'Offer', 'Decline', 'Ghosting', 'Scam', 'Not Fit',
  ];

  function _statsBuildDonutSegments(counts, total) {
    if (!total) return '';
    let cumPct = 0;
    const parts = [];
    for (const status of STATS_DONUT_ORDER) {
      const cnt = counts[status] || 0;
      if (cnt <= 0) continue;
      const arcLen = (cnt / total) * STATS_DONUT_C;
      const gap = STATS_DONUT_C - arcLen;
      const startAngle = -90 + cumPct * 360;
      cumPct += cnt / total;
      const color = STATS_DONUT_COLORS[status] || '#48484a';
      parts.push(
        `<circle cx="50" cy="50" r="${STATS_DONUT_R}" fill="none" `
        + `stroke="${color}" stroke-width="14" `
        + `stroke-dasharray="${arcLen.toFixed(2)} ${gap.toFixed(2)}" `
        + `transform="rotate(${startAngle.toFixed(2)} 50 50)"/>`
      );
    }
    return parts.join('');
  }

  function _statsScItem(status) {
    const cls = status.toLowerCase().replace(/\s+/g, '-');
    const count = ((appState.stats.breakdown || {}).counts || {})[status] || 0;

  function _statsFormatSeconds(sec) {
    if (sec == null) return '—';
    if (sec < 60) return `${Math.round(sec)} с`;
    if (sec < 3600) return `${Math.round(sec / 60)} мин`;
    if (sec < 86400) {
      const h = Math.floor(sec / 3600);
      const m = Math.round((sec - h * 3600) / 60);
      return m > 0 ? `${h} ч ${m} мин` : `${h} ч`;
    }
    const d = Math.floor(sec / 86400);
    const h = Math.round((sec - d * 86400) / 3600);
    return h > 0 ? `${d} д ${h} ч` : `${d} д`;
  }

  function renderStatsToolbar() {
    const cur = appState.stats.period;

    const pills = order.map(k => {

      return `<button type="button" class="stats-period-pill${cls}" data-period="${k}">${escapeHtml(STATS_PERIOD_LABELS[k])}</button>`;
    }).join('');
    const st = appState.stats;
    const loading = st.kpiLoading || st.breakdownLoading || st.hrResponsesLoading || st.skillsLoading || st.channelsLoading;
    const spin = loading ? ' spinning' : '';
    const refresh = `<button type="button" class="stats-refresh-btn${spin}" data-action="stats-refresh" title="Обновить"><span class="material-symbols-outlined">sync</span></button>`;
    return `<div class="stats-toolbar">${pills}${refresh}</div>`;

  function renderStats() {
    const st = appState.stats;
    if (api) {
      if (st.kpi == null && !st.kpiLoading) requestStatsKpi();
      if (st.breakdown == null && !st.breakdownLoading) requestStatsBreakdown();
      if (st.hrResponses == null && !st.hrResponsesLoading) requestStatsHrResponses();
      if (st.skills == null && !st.skillsLoading) requestStatsSkills();
      if (st.channels == null && !st.channelsLoading) requestStatsChannelsPipeline();
    }
    mainSlot.innerHTML = `
      <div class="section">
        <div class="section-body">
          ${renderStatsToolbar()}
          <div class="stats-grid">
            ${renderStatsKpiCards()}
            ${renderStatsCountersCard()}
            ${renderStatsHrResponsesCard()}
            ${renderStatsSkillsCard()}
            ${renderStatsChannelsPipelineCard()}
          </div>
        </div>
      </div>
    `;
    mainSlot.querySelectorAll('[data-period]').forEach(btn => {
      btn.addEventListener('click', () => {
        const next = btn.dataset.period;
        if (next === appState.stats.period) return;
        appState.stats.period = next;
        // Сброс per-period кешей чтобы карточки показали loading-skeleton,
        // а не stale-данные предыдущего period'а до прихода новых ответов.
        const s = appState.stats;
        s.kpi = null; s.breakdown = null; s.hrResponses = null;
        s.skills = null; s.channels = null;
        renderSection();
        requestAllStatsForPeriod();
      });
    });
    const refreshBtn = mainSlot.querySelector('[data-action="stats-refresh"]');
    if (refreshBtn) {
      refreshBtn.addEventListener('click', () => {
        const s = appState.stats;
        s.kpi = null; s.breakdown = null; s.hrResponses = null;
        s.skills = null; s.channels = null;
        renderSection();
        requestAllStatsForPeriod();
      });
    }
    // Клик по строке статуса → переход на список вакансий с применённым
    // single-status фильтром. Перетираем filtersApplied целиком (а не
    // дополняем): пользовательский intent "хочу увидеть вакансии этого
    // статуса", любые ранее активные фильтры (грейд/локация/диапазон) тут
    // не нужны.
    mainSlot.querySelectorAll('[data-action="stats-status-jump"]').forEach(el => {
      el.addEventListener('click', () => {
        const code = el.dataset.status;
        if (!code) return;
        const f = createFilterDefaults();
        f.statuses = [code];
        appState.vacancies.filtersApplied = f;
        appState.vacancies.filtersDraft = null;
        // Сброс search и selectedId — открываем чистый список с фильтром.
        appState.vacancies.search = '';
        appState.vacancies.searchDraft = '';
        appState.vacancies.selectedId = null;
        appState.vacancies.detail = null;
        appState.vacancies.allList = [];
        appState.vacancies.list = [];
        appState.vacancies.loaded = false;
        setActiveSection('vacancies');
      });
    });
    // Клик по строке в карточке «Каналы» → переход на вкладку
    // Контакты/Каналы с открытым этим каналом. Делегация: ловим клик в
    // любую из 11 ячеек строки (все имеют data-channel-id).
    mainSlot.querySelectorAll('.stats-ch-grid .stats-ch-row').forEach(el => {
      const chId = Number(el.dataset.channelId);
      if (!Number.isFinite(chId)) return;
      // Подсветка целой строки при ховере на любую ячейку.
      const peers = mainSlot.querySelectorAll(
        `.stats-ch-grid .stats-ch-row[data-channel-id="${chId}"]`
      );
      el.addEventListener('mouseenter', () => {
        peers.forEach(p => p.classList.add('is-hover'));
      });
      el.addEventListener('mouseleave', () => {
        peers.forEach(p => p.classList.remove('is-hover'));
      });
      el.addEventListener('click', () => gotoContactsChannel(chId));
    });
  }

  function renderProfile() {
    const tabs = [
      { id: 'cv',          label: 'CV' },
      { id: 'skills',      label: 'Skills' },
      { id: 'experience',  label: 'Experience' },
    ];
    const active = appState.tab;

      <div class="section section-profile">
        <nav class="top-tabs">

        appState.tab = el.dataset.tab;

  function renderSegRow(field, options, selected) {
    const set = new Set(selected || []);
    const segs = options.map(o => `
      <div class="seg${set.has(o.value) ? ' active' : ''}"
           data-field="${field}"
           data-value="${escapeAttr(o.value)}">${escapeHtml(o.label)}</div>
    `).join('');
    return `<div class="seg-row" data-field="${field}">${segs}</div>`;
  }

  function readSegRow(field) {
    const nodes = document.querySelectorAll(
      `.seg-row[data-field="${field}"] .seg.active`
    );
    return Array.from(nodes).map(n => n.dataset.value);
  }

  // Уровни CEFR + native, в порядке от высшего к младшему — так удобнее
  // выбирать нативный/высокий уровень одним кликом сверху.
  const LANG_LEVELS = ['native', 'C2', 'C1', 'B2', 'B1', 'A2', 'A1'];

  // Универсальный кастомный селект (см. CSS .cdd*). value кладётся в
  // dataset.value корня — readSegRow/readLangRows читают его оттуда.
  function renderCustomDropdown(extraClass, options, value) {
    const opts = options.map(o => {
      const v = typeof o === 'string' ? o : o.value;
      const lbl = typeof o === 'string' ? o : o.label;
      return `<div class="cdd-option${v === value ? ' active' : ''}" data-value="${escapeAttr(v)}">${escapeHtml(lbl)}</div>`;
    }).join('');
    const selected = options.find(o => (typeof o === 'string' ? o : o.value) === value);
    const label = selected ? (typeof selected === 'string' ? selected : selected.label) : '';
    return `
      <div class="cdd ${extraClass}" data-value="${escapeAttr(value)}">
        <button type="button" class="cdd-btn">
          <span class="cdd-label">${escapeHtml(label)}</span>
          <span class="material-symbols-outlined">expand_more</span>
        </button>
        <div class="cdd-panel">${opts}</div>
      </div>
    `;
  }

  function renderLangRow(language, level) {
    return `
      <div class="lang-row">
        <input class="input lang-name" maxlength="50" placeholder="Язык" value="${escapeAttr(language || '')}">
        ${renderCustomDropdown('lang-level', LANG_LEVELS, level)}
        <span class="lang-remove" title="удалить">×</span>
      </div>
    `;
  }

  function renderLanguagesBlock(languages) {
    const rows = (languages || []).map(l =>
      renderLangRow(l.language, l.level)
    ).join('');
    return `
      <div class="span-2">
        <div class="lang-list" id="lang-list">${rows}</div>
        <div class="lang-add" id="lang-add">+ Добавить язык</div>
      </div>
    `;
  }

  function readLangRows() {
    return Array.from(
      document.querySelectorAll('#lang-list .lang-row')
    ).map(row => ({
      language: row.querySelector('.lang-name').value.trim(),
      level: row.querySelector('.lang-level').dataset.value || 'B2',
    }));
  }

  // Текущий payload формы — отдельная функция, чтобы и автосохранение,

  function saveProfileNow() {
    if (!api) return;
    if (appState.profileAutosaveTimer != null) {
      clearTimeout(appState.profileAutosaveTimer);
      appState.profileAutosaveTimer = null;
    }
    appState.saveError = '';
    api.save_profile(JSON.stringify(buildProfilePayload()));

  function scheduleProfileAutosave() {
    if (appState.profileAutosaveTimer != null) {
      clearTimeout(appState.profileAutosaveTimer);
    }
    appState.profileAutosaveTimer = setTimeout(() => {
      appState.profileAutosaveTimer = null;
      saveProfileNow();
    }, 800);
  }

  function wireProfileCv() {
    const fieldIds = ['first-name','last-name','title','email','phone','telegram','github','location','education','preferences'];
    const inputs = fieldIds.map(f => $('f-' + f)).filter(Boolean);
    inputs.forEach((input) => {
      // Любой ввод → дебаунс 800мс. dirty взводим, чтобы onProfileChanged
      // не затёр локальные правки серверным state'ом, пока мы их не
      // докоммитили.
      input.addEventListener('input', () => {
        appState.dirty = true;
        scheduleProfileAutosave();
      });
      // Уход фокуса → коммитим немедленно. Это даёт ту же гарантию,
      // что и у заметок на экране вакансии: щёлкнул куда угодно — сохранилось.
      input.addEventListener('blur', () => {
        if (!appState.dirty) return;
        saveProfileNow();
      });
      // Ctrl+Enter / Cmd+Enter — явный шорткат «сохранить сейчас».
      input.addEventListener('keydown', (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
          e.preventDefault();
          if (!appState.dirty) return;
          saveProfileNow();
        }
      });
    });

    // Сегменты (грейд, формат работы) — клик переключает active и сохраняет
    // через тот же дебаунс, что и текстовые поля.
    document.querySelectorAll('.seg-row .seg').forEach(seg => {
      seg.addEventListener('click', () => {
        seg.classList.toggle('active');
        appState.dirty = true;
        scheduleProfileAutosave();
      });
    });

    // Языки — добавление/удаление/редактирование через делегирование,
    // потому что строки появляются/исчезают динамически без re-render.
    const langList = $('lang-list');
    const langAdd = $('lang-add');
    if (langList) {
      langList.addEventListener('click', (e) => {
        if (e.target.classList.contains('lang-remove')) {
          e.target.closest('.lang-row').remove();
          appState.dirty = true;
          scheduleProfileAutosave();
        }
      });
      langList.addEventListener('input', (e) => {
        if (e.target.matches('.lang-name')) {
          appState.dirty = true;
          scheduleProfileAutosave();
        }
      });
      // Кастомный дропдаун уровня — события 'cdd-change' всплывают наверх.
      langList.addEventListener('cdd-change', (e) => {
        if (e.target.classList.contains('lang-level')) {
          appState.dirty = true;
          scheduleProfileAutosave();
        }
      });
    }
    if (langAdd) {
      langAdd.addEventListener('click', () => {
        // Новые строки по умолчанию B2 — нейтральный средний уровень.
        // Пустая строка не сохраняется (фильтруется на бридже),
        // но остаётся в DOM, пока пользователь её не заполнит.
        langList.insertAdjacentHTML('beforeend', renderLangRow('', 'B2'));
        // Сразу фокус в новый input — приятнее набирать.
        const last = langList.lastElementChild;
        if (last) last.querySelector('.lang-name').focus();
      });
    }

    $('cv-replace').addEventListener('click', async () => {
      if (!api) return;
      let r;
      try { r = JSON.parse(await api.pick_cv_file_main()); } catch { return; }
      if (!r.ok) return;
      api.replace_cv(JSON.stringify({ path: r.path }));
    });
    const openBtn = $('cv-open');
    if (openBtn) openBtn.addEventListener('click', () => {
      if (api) api.open_cv_file();
    });
  }

  // ---- Profile / Skills ----------------------------------------------

  function renderProfileSkills() {
    const skills = appState.skills;
    if (!appState.skillsLoaded) {
      return '<div class="placeholder-content">Загрузка…</div>';
    }
    // Group by category preserving order of first appearance
    const groups = [];
    const groupIdx = new Map();
    for (const s of skills) {
      const key = s.category || 'Общее';
      if (!groupIdx.has(key)) {
        groupIdx.set(key, groups.length);
        groups.push({ name: key, items: [] });
      }
      groups[groupIdx.get(key)].items.push(s);
    }
    const totalSkills = skills.length;
    const totalCats = groups.length;

    const groupsHtml = groups.map((g, gi) => {
      const collapsed = appState.collapsedCats.has(g.name);
      const rows = g.items.map(s => renderSkillRow(s)).join('');
      return `
        <div class="cat-section${collapsed ? ' collapsed' : ''}" data-cat="${escapeAttr(g.name)}">
          <div class="cat-header">
            <span class="material-symbols-outlined" data-action="cat-toggle">expand_more</span>
            <input class="cat-name-input" data-action="cat-rename" maxlength="64" value="${escapeAttr(g.name)}">
            <span class="cat-spacer"></span>
            <span class="cat-add" data-action="cat-add"><span class="material-symbols-outlined">add</span>Навык</span>
            <span class="cat-delete" data-action="cat-delete" title="Удалить категорию"><span class="material-symbols-outlined">delete</span></span>
          </div>
          ${rows}
        </div>
      `;
    }).join('');

    const errorRow = appState.saveError
      ? `<div class="autosave-error"><span class="save-status">${escapeHtml(appState.saveError)}</span></div>`
      : '';

    return `
      <div class="page-head">
        <div class="page-title">Профиль / Skills <span class="page-title-meta">${totalSkills} навыков, ${totalCats} ${pluralRu(totalCats, 'категория','категории','категорий')}</span></div>
      </div>
      <div id="skills-list">${groupsHtml}</div>
      <div class="new-cat" id="skills-new-cat">+ Новая категория</div>
      ${errorRow}
    `;

  function renderSkillRow(s) {
    const pct = (s.level / 10) * 100;
    return `
      <div class="skill-row" data-skill-id="${escapeAttr(s.id ?? '')}">
        <input class="skill-name-input" data-field="name" maxlength="64" value="${escapeAttr(s.name)}">
        <div class="level">

          <span class="level-num">${s.level}/10</span>

        <div class="aliases" data-field="aliases">${renderAliases(s.aliases)}</div>
        <div class="skill-actions">

        </div>

  function renderAliases(aliases) {
    const chips = (aliases || []).map((a, i) =>
      `<span class="chip">${escapeHtml(a)} <span class="x" data-alias-idx="${i}">×</span></span>`
    ).join('');
