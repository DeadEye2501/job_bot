<script>
  const SECTION_LABELS = {
    profile:   'Профиль',
    vacancies: 'Вакансии',
    contacts:  'Контакты',
    stats:     'Статистика',
    system:    'Система',
  };
  const MODE_CYCLE = ['Off', 'DM Only', 'Full'];

  const $ = (id) => document.getElementById(id);
  const frame = $('frame');
  const mainSlot = $('main-slot');
  const sidebarToggle = $('sidebar-toggle');
  const sidebarToggleIcon = $('sidebar-toggle-icon');
  const refreshBtn = $('refresh');
  const progressWrap = $('progress-wrap');
  const progressCaption = $('progress-caption');
  const chBar    = $('ch-bar');
  const chFill   = $('ch-fill');
  const msgBar   = $('msg-bar');
  const msgFill  = $('msg-fill');
  const refreshIcon = $('refresh-icon');

  const progressState = {
    channel: { label: '', cur: 0, tot: 0 },
    message: { label: '', cur: 0, tot: 0 },
  };
  const modeBtn = $('mode');
  const unreadBtn = $('unread');
  const unreadCountEl = $('unread-count');

  let api = null;
  let currentMode = 'Off';

  // --- Sidebar -----------------------------------------------------------

  function setSidebarExpanded(expanded) {
    frame.classList.toggle('sidebar-expanded', expanded);
    sidebarToggleIcon.textContent = expanded ? 'chevron_left' : 'chevron_right';
    sidebarToggle.title = expanded ? 'Свернуть меню' : 'Развернуть меню';
  }
  sidebarToggle.addEventListener('click', () => {
    setSidebarExpanded(!frame.classList.contains('sidebar-expanded'));
  });

  // App-level UI state
  const appState = {
    section: 'profile',
    tab: 'cv',
    profile: null,
    cv_meta: null,  // { name, size, exists } | null
    dirty: false,
    saveError: '',
    // Тикеры дебаунса автосохранения для каждой формы профиля.
    // Сохранение поведения как у заметок вакансии: input → таймер 800мс →
    // save_*, blur/Ctrl+Enter — коммит немедленно с отменой таймера.
    profileAutosaveTimer: null,
    skillsAutosaveTimer: null,
    experienceAutosaveTimer: null,
    // Skills tab
    skills: [],            // [{id, category, name, level, aliases:[]}]
    skillsLoaded: false,
    collapsedCats: new Set(),
    // Experience tab
    experience: [],        // [{id, company, ...}]
    experienceLoaded: false,
    skillsIndex: [],       // for Experience skill picker
    expandedExp: new Set(),  // experience ids that are expanded
    pickerOpenFor: null,   // exp id with open skill-picker, or null
    // Vacancies section
    vacancies: {
      allList: [], list: [], loaded: false, _lastPayload: null,
      // Источники для дропдаунов в фильтре. Идут с бэка независимо от
      // активных фильтров (см. list_vacancy_filter_options) — иначе после
      // применения любого фильтра списки каналов / компаний схлопывались бы
      // до того, что осталось в результирующем срезе.
      filterOptions: { channels: [], companies: [] },
      // Курсорная пагинация: грузим первую страницу при входе/смене
      // фильтра/сорта/поиска, дозагружаем по скроллу. hasMore сбрасывается
      // когда бэк отдаёт меньше limit — список закончился.
      hasMore: false, loadingMore: false,
      scoreThreshold: null,
      // Request-epoch guard: every replace/refresh dispatch инкрементит
      // requestEpoch и помечает replacing=true. Бэк эхом возвращает epoch;
      // если ответ приходит со stale значением — дропаем (например, append
      // в полёте, пользователь сменил фильтр → replace бампит epoch →
      // прилетевший append отбрасывается, не примешивает чужие строки).
      requestEpoch: 0, replacing: false,
      search: '', searchDraft: '', searchTimer: null,
      sortBy: 'newest', sortMenuOpen: false,
      filterOpen: false,
      filtersApplied: null,
      filtersDraft: null,
      filterUi: {
        channelsOpen: false,
        channelsSearch: '',
        companiesSearch: '',
        companiesOpen: false,
        scrollToBottom: false,
      },
      selectedId: null, detail: null, detailLoading: false,
      // Notes editor (slice 5, §3.8). notesDraft mirrors what's currently in
      // the textarea — null means "user hasn't typed anything yet, render
      // detail.notes". notesLastSaved is the last value we know is persisted
      // (server-confirmed); we don't re-POST when draft equals it. The timer
      // is the in-flight 800ms debounce id.
      notesDraft: null,
      notesLastSaved: null,
      notesPendingTimer: null,
      statusPopoverOpen: false,
      statusDraft: null,
      statusCommentDraft: '',
      statusSaving: false,
      // Always-on inline-edit для history.explanation в timeline'е. Каждая
      // строка истории — textarea (видимая рамка только на hover/focus, как
      // .list-input в Experience). Драфты хранятся по history_id, чтобы
      // push-induced re-render detail'а не затёр недосохранённый ввод.
      // Таймеры — debounce-сейв через 500мс простоя; блюр флашит сразу.
      historyExplanationDrafts: {},
      historyExplanationTimers: {},
      morePopoverOpen: false,
      rawModalOpen: false,
      rawModalScrollTop: null,
      // HR / Company pickers (§5, §6). selectedId is the row the user
      // clicked but hasn't committed yet; current vs. selected are
      // independent so we can detect "nothing actually changed" and disable
      // the «Связать» button. createDraft mirrors the inline-create form
      // values; saving guards against double-clicks while the link request
      // is in flight.
      hrPicker: {
        open: false, loading: false, list: [],
        search: '', searchTimer: null,
        currentId: null, selectedId: null,
        creating: false,
        createDraft: { name: '', telegram_username: '', telegram_user_id: '', notes: '' },
        saving: false,
      },
      companyPicker: {
        open: false, loading: false, list: [],
        search: '', searchTimer: null,
        currentId: null, selectedId: null,
        creating: false,
        createDraft: { name: '', website: '', aliases: '', notes: '' },
        saving: false,
      },
    },
    // Contacts section (HR / Компании / Blacklist). Скелет — табы есть,
    // тела ещё нет. Deep-link'и из деталей вакансии (selectedHrId /
    // selectedCompanyId) лягут сюда, когда экран будет наполнен.
    contacts: {
      tab: 'hr',
      selectedHrId: null,
      selectedCompanyId: null,
      hr: {
        loaded: false,
        list: [],
        search: '',
        searchDraft: '',
        searchTimer: null,
        // Detail-pane state. ``detail`` is null until fetched. ``detailFor``
        // tracks which HR id the in-flight / completed payload is for, so
        // the renderer can show "Загрузка…" and ignore stale responses.
        detail: null,
        detailFor: null,
        detailLoading: false,
        // Chat history for the selected HR. Same stale-id guard pattern
        // as detail. ``hasMoreOlder`` / ``oldestLoadedId`` drive paginated
        // load-older when the user scrolls to the top of the chat body.
        // ``scrollToFirstUnread`` is a one-shot flag set on tail loads so
        // the renderer scrolls to the first unread incoming row before
        // falling back to the bottom.
        messages: [],
        messagesFor: null,
        messagesLoading: false,
        hasMoreOlder: false,
        oldestLoadedId: null,
        oldestLoadedSentAt: null,
        olderLoading: false,
        scrollToFirstUnread: false,
        // Monotonic counter — bumped on every tail load so an older-page
        // response that arrived after a tail reset is dropped (otherwise
        // the older page would prepend onto a fresh tail and duplicate).
        // The request payload echoes the epoch back; older responses with
        // a stale epoch are dropped in onContactsHrMessagesLoaded.
        messagesEpoch: 0,
        markReadFor: null,
        markReadTimer: null,
        chatScrollTop: null,
        chatScrollFor: null,
        chatInputFocus: null,
        // Notes textarea — local draft + debounce timer + focus restore so a
        // background re-render (incoming message, list refresh) doesn't wipe
        // a half-typed edit. notesFor pins the draft to a specific HR.
        notesDraft: '',
        notesFor: null,
        notesSaveTimer: null,
        notesFocus: null,
        // Vacancies mini-list under the chat. ``vacanciesFor`` drops stale
        // responses when the user clicks another HR mid-flight.
        vacancies: [],
        vacanciesFor: null,
        vacanciesLoading: false,
        // More-vert popover in the HR detail head (Слить / Blacklist /
        // Удалить). Single-flight by design — toggling another action
        // (e.g. confirm dialog) closes it.
        morePopoverOpen: false,
        // Merge picker — sibling of vacancies' hrPicker, but for merging
        // an absorbed HR into a survivor. Reuses .vac-picker-modal CSS;
        // separate state so vacancies + contacts don't fight.
        mergePicker: {
          open: false,
          loading: false,
          search: '',
          searchTimer: null,
          list: [],
          selectedId: null,
          saving: false,
          absorbedId: null,
        },
        // Infinite-scroll bookkeeping: mirrors appState.vacancies.
        // hasMore — true пока бэк отдаёт ровно `limit` строк (потенциально
        //   есть следующая страница). loadingMore — append уже летит, не
        //   шлём второй. replacing — replace/refresh в полёте, любой
        //   append с устаревшим offset'ом игнорим. requestEpoch бампится
        //   на replace/refresh, чтобы дропать ответы старых эпох.
        hasMore: false,
        loadingMore: false,
        replacing: false,
        requestEpoch: 0,
        addModal: {
          open: false,
          saving: false,
          draft: { name: '', telegram_username: '', telegram_user_id: '', notes: '' },
          error: null,
        },
        // Chat input draft + send-in-flight state. Draft is preserved across
        // re-renders so background list/detail refreshes don't wipe a
        // mid-typed message.
        chatDraft: '',
        chatDraftFor: null,
        chatSendingFor: null,
      },
      // Companies tab — mirrors the HR list-pane state shape (loaded /
      // list / search / pagination guards / addModal / morePopoverOpen /
      // mergePicker), plus per-detail caches (vacancies, hrs, notes draft).
      company: {
        loaded: false,
        list: [],
        search: '',
        searchDraft: '',
        searchTimer: null,
        searchFocus: null,
        detail: null,
        detailFor: null,
        detailLoading: false,
        vacancies: [],
        vacanciesFor: null,
        vacanciesLoading: false,
        hrs: [],
        hrsFor: null,
        hrsLoading: false,
        morePopoverOpen: false,
        notesDraft: '',
        notesFor: null,
        notesSaveTimer: null,
        notesFocus: null,
        aliasesSaveTimer: null,
        hasMore: false,
        loadingMore: false,
        replacing: false,
        requestEpoch: 0,
        addModal: {
          open: false,
          saving: false,
          draft: { name: '', website: '', aliases: '', notes: '' },
          error: null,
        },
        mergePicker: {
          open: false,
          loading: false,
          search: '',
          searchTimer: null,
          list: [],
          selectedId: null,
          saving: false,
          absorbedId: null,
        },
      },
      // Blacklist tab — плоский список (обычно <100 строк), фильтрация
      // локальная: search + kindFilter ('all'|'keyword'|'hr'|'company'|
      // 'channel'). Без пагинации.
      blacklist: {
        loaded: false,
        list: [],
        searchDraft: '',
        searchTimer: null,
        kindFilter: 'all',
        // ids рядов с in-flight toggle-запросом — checkbox disabled
        // пока ответ не пришёл, чтобы не было double-fire.
        toggling: new Set(),
        // Debounce-таймеры для inline-edit value/reason. Map<"id:field"
        // → timeoutId>, чтобы каждое поле сохранялось независимо.
        editTimers: new Map(),
        // Add-modal: open/saving/draft/focus + combobox-кеш кандидатов
        // по типу. `candidates` — Map<kind → list> (kind=keyword пустой).
        // `dropdownOpen` — отдельный для kind!=keyword combobox'а.
        addModal: {
          open: false,
          saving: false,
          draft: { kind: 'keyword', value: '', reason: '' },
          focus: false,
          candidates: { keyword: [], hr: [], company: [], channel: [] },
          candidatesLoaded: { keyword: true, hr: false, company: false, channel: false },
          dropdownOpen: false,
        },
      },
      // Channels tab — простой список без бесконечного скролла:
      // каналов в проекте обычно десятки, не тысячи. Сабсет полей HR/Company
      // pattern: loaded/list/search + searchDraft/searchTimer/searchFocus +
      // requestEpoch для дропа stale-ответов на гонке поиска.
      channels: {
        loaded: false,
        list: [],
        search: '',
        searchDraft: '',
        searchTimer: null,
        searchFocus: null,
        requestEpoch: 0,
        // Set of channel ids whose on/off toggle has an in-flight request —
        // checkbox is disabled until the action_done signal returns, so a
        // user can't double-fire the toggle while the bridge is awaiting.
        toggling: new Set(),
        // Master-тоггл «вкл/выкл всех каналов» в тулбаре. ``togglingAll``
        // блокирует двойные клики пока bridge bulk-update не вернулся.
        // ``toggleAllRollback`` — снимок старых состояний для отката
        // optimistic-update'а на ошибке (id → было is_active).
        togglingAll: false,
        toggleAllRollback: null,
        // Detail pane state: ``selectedId`` drives the row's `.selected`
        // marker; ``detail`` is the loaded payload, ``detailFor`` pins it
        // to a channel id so stale responses can be dropped.
        selectedId: null,
        detail: null,
        detailFor: null,
        detailLoading: false,
        // Mini-list of vacancies under stats. ``vacanciesFor`` drops
        // stale responses when user clicks another channel mid-flight.
        // hasMore / loadingMore — guards для бесконечного скролла внутри
        // блока (max-height + overflow scroll).
        vacancies: [],
        vacanciesFor: null,
        vacanciesLoading: false,
        vacanciesHasMore: false,
        vacanciesLoadingMore: false,
        // Add-channel modal: open/saving/error/draft. ``focus`` set when
        // the modal opens so the input gets keyboard focus on render.
        addModal: {
          open: false,
          saving: false,
          error: null,
          draft: { input: '' },
          focus: false,
        },
        // More-vert popover в detail-pane (Прогнать / Сбросить курсор /
        // Удалить). Single-flight; outside-click и Esc закрывают.
        morePopoverOpen: false,
      },
    },
    // System screen — tabs Логи / LLM-вызовы / Настройки.
    // Слайс реализует только Логи; остальные — placeholder'ы.
    system: {
      tab: 'settings',
      logs: {
        loaded: false,
        records: [],
        levelCounts: {},   // {DEBUG: int, INFO: int, WARNING: int, ERROR: int}
        total: 0,
        // Мульти-выбор уровней; DEBUG по умолчанию выключен — обычно шум.
        // Backend всегда отдаёт все записи; фильтр применяется в renderSystemLogs.
        selectedLevels: new Set(['ERROR', 'WARNING', 'INFO']),
        // Авто-обновление: при выключении игнорим push-сигналы — иначе
        // ререндер скроллит список и юзер не может пролистать вниз.
        autoRefresh: true,
        expanded: new Set(),
      },
      settings: {
        loaded: false,
        tg: null,           // {api_id, api_hash, phone, has_password, has_session, username}
        chat: null,         // {base_url, api_key, model}
        chatModels: [],     // loaded LLMs from LM Studio /api/v0/models — feeds datalist
        // Probe-state: после клика по «Проверить» хранит результат.
        // status ∈ {'idle','busy','ok','err'}.
        chatProbe: { status: 'idle', model: '', latencyMs: 0, error: '' },
        embed: null,        // {base_url, api_key, model}
        embedModels: [],    // loaded embeddings models — feeds datalist
        embedProbe: { status: 'idle', model: '', latencyMs: 0, error: '' },
        // Если creds эмбеддингов совпадают с чатом — показываем компактный
        // блок (только модель). Снято — показывается base_url/api_key.
        // Дериватив: вычисляется в onSystemSettingsLoaded из (chat, embed).
        embedSameAsChat: true,
        pipeline: null,     // {scoring_threshold, poll_interval_sec, backfill_limit}
        // Re-auth модалка: step 'creds'|'code'|'password', плюс черновик
        // полей и состояние ошибки/спиннера.
        login: {
          open: false,
          // step ∈ {'code', 'password'} — creds-форма не в модалке, а в основной TG-секции.
          step: 'code',
          draft: { api_id: '', api_hash: '', phone: '', code: '', password: '' },
          error: '',
          busy: false,
        },
      },
    },
    // Statistics screen — toolbar period selector + KPI cards (slice 1).
    // Будет расширяться: funnel/status counters/top lists/heatmap/etc.
    stats: {
      period: 'month',
      kpi: null,
      kpiLoading: false,
      breakdown: null,        // {period, counts: {status: int}}
      breakdownLoading: false,
      hrResponses: null,      // {period, by_weekday[7], median_seconds, no_response_pct, applied_count, responded_count}
      hrResponsesLoading: false,
      skills: null,           // {period, min_count, skills: [{label, count, mine}]}
      skillsLoading: false,
      channels: null,         // {period, channels: [{id, label, total, trash, not_fit, fit, sent, answered, invite_plus, decline, conv_*}]}
      channelsLoading: false,
    },
  };
  // Esc closes active vacancy popovers/modal (§8 behavior). Keep it global so
  // focus location (textarea/button/popover) doesn't matter.
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return;
    if (appState.section === 'vacancies') {
      const st = appState.vacancies;
      const anyOpen = st.statusPopoverOpen || st.morePopoverOpen || st.rawModalOpen
        || st.hrPicker.open || st.companyPicker.open || st.filterOpen || st.sortMenuOpen;
      if (!anyOpen) return;
      st.statusPopoverOpen = false;
      st.morePopoverOpen = false;
      st.rawModalOpen = false;
      st.sortMenuOpen = false;
      closeFilterPopover();
      closeHrPicker();
      closeCompanyPicker();
      renderSection();
    } else if (appState.section === 'contacts') {
      if (appState.contacts.tab === 'hr') {
        const cst = appState.contacts.hr;
        const m = cst.addModal;
        if (m && m.open) {
          m.open = false;
          m.error = null;
          renderSection();
        } else if (cst.mergePicker && cst.mergePicker.open) {
          closeContactsHrMergePicker();
          renderSection();
        } else if (cst.morePopoverOpen) {
          cst.morePopoverOpen = false;
          renderSection();
        }
      } else if (appState.contacts.tab === 'companies') {
        const cst = appState.contacts.company;
        const m = cst.addModal;
        if (m && m.open) {
          m.open = false;
          m.error = null;
          renderSection();
        } else if (cst.mergePicker && cst.mergePicker.open) {
          closeContactsCompanyMergePicker();
          renderSection();
        } else if (cst.morePopoverOpen) {
          cst.morePopoverOpen = false;
          renderSection();
        }
      } else if (appState.contacts.tab === 'channels') {
        const cst = appState.contacts.channels;
        const m = cst.addModal;
        if (m && m.open && !m.saving) {
          m.open = false;
          m.error = null;
          m.draft = { input: '' };
          renderSection();
        } else if (cst.morePopoverOpen) {
          cst.morePopoverOpen = false;
          renderSection();
        }
      } else if (appState.contacts.tab === 'blacklist') {
        const bm = appState.contacts.blacklist.addModal;
        if (bm && bm.open && !bm.saving) {
          bm.open = false;
          bm.dropdownOpen = false;
          bm.draft = { kind: 'keyword', value: '', reason: '' };
          renderSection();
        }
      }
    }
  });

  function applySectionSwitch(section) {
    document.querySelectorAll('.nav-group').forEach((el) => {
      el.classList.toggle('active', el.dataset.section === section);
    });
    // Уход с вакансий: схлопываем все поповеры/модалки секции, чтобы при
    // возврате не открылись «сами по себе» из state. Notes-state и
    // selectedId оставляем — это нормальная сессионная память.
    if (appState.section === 'vacancies' && section !== 'vacancies') {
      closeVacancyPopovers();
      closeRawModal();
      closeHrPicker();
      closeCompanyPicker();
      appState.vacancies.sortMenuOpen = false;
      closeFilterPopover();
    }
    appState.section = section;
    appState.dirty = false;
    appState.saveError = '';
    if (section === 'profile') appState.tab = appState.tab || 'cv';
    renderSection();
    stopVacanciesRefreshTimer();
    if (section === 'profile' && api) {
      // Only fetch the data the visible tab actually needs.
      if (appState.tab === 'cv') api.request_profile();
      else if (appState.tab === 'skills') api.request_skills();
      else if (appState.tab === 'experience') api.request_experience();
    } else if (section === 'vacancies' && api) {
      // Сбрасываем флаги пагинации до отправки запроса: если из прошлого
      // визита остался hasMore=true или loadingMore=true, scroll-handler
      // мог бы дёрнуть append на ещё-не-загруженный список.
      appState.vacancies.loaded = false;
      appState.vacancies.hasMore = false;
      appState.vacancies.loadingMore = false;
      appState.vacancies.replacing = false;
      appState.vacancies.searchDraft = appState.vacancies.search;
      api.request_vacancies(buildVacanciesQuery());
      // Re-fetch the previously-selected vacancy's detail so a re-entry
      // doesn't show stale fields (status/notes might have changed via DM
      // classifier or another tab while the user was off the section).
      if (appState.vacancies.selectedId != null) {
        appState.vacancies.detail = null;
        appState.vacancies.detailLoading = true;
        api.request_vacancy_detail(appState.vacancies.selectedId);
      }
      startVacanciesRefreshTimer();
    } else if (section === 'stats' && api) {
      // Re-entry refresh: stats are derived from vacancies/messages that
      // may have changed while user was off the section. Без сброса кеша
      // экран показывал stale-данные до ручного переключения периода.
      const s = appState.stats;
      s.kpi = null; s.breakdown = null; s.hrResponses = null;
      s.skills = null; s.channels = null;
      requestAllStatsForPeriod();
    } else if (section === 'contacts' && appState.contacts.tab === 'hr' && api) {
      // Re-entry refresh: incoming DM classifier may have written new rows /
      // unread counts while user was off the section. Match vacancies'
      // re-fetch policy. Pagination flags reset before the request fires.
      const hst = appState.contacts.hr;
      hst.loaded = false;
      hst.hasMore = false;
      hst.loadingMore = false;
      hst.replacing = false;
      requestContactsHrList();
      if (appState.contacts.selectedHrId != null) {
        hst.detail = null;
        hst.detailLoading = true;
        requestContactsHrDetail(appState.contacts.selectedHrId);
        hst.messages = [];
        hst.messagesLoading = true;
        requestContactsHrMessages(appState.contacts.selectedHrId);
      }
    }
  }

  async function setActiveSection(section) {
    if (section === appState.section) return;
    // С автосохранением: blur активного инпута сработает раньше клика
    // по nav-group, успев отправить debounced/blur save. Никакого
    // подтверждения «сбросить изменения» больше не нужно — данные
    // никогда не теряются на переходе.
    applySectionSwitch(section);
  }
  // Initial section is set synchronously below — use applySectionSwitch
  // directly because there's nothing to dirty-check on first render.
  document.querySelectorAll('.nav-group').forEach((el) => {
    el.addEventListener('click', () => setActiveSection(el.dataset.section));
  });

  // Deep-link helpers. Сидируем целевой id ДО смены секции, чтобы будущий
  // экран контактов/чата мог сразу подхватить «открыть HR #N» / «компанию
  // #M» из стейта. applySectionSwitch вызовет renderSection, и render-
  // функция секции прочитает этот id.
  function gotoContactsHr(hrId) {
    appState.contacts.tab = 'hr';
    appState.contacts.selectedHrId = hrId != null ? Number(hrId) : null;
    appState.contacts.selectedCompanyId = null;
    if (appState.section !== 'contacts') applySectionSwitch('contacts');
    else renderSection();
  }
  function gotoContactsCompany(companyId) {
    appState.contacts.tab = 'companies';
    appState.contacts.selectedHrId = null;
    appState.contacts.selectedCompanyId = companyId != null ? Number(companyId) : null;
    if (appState.section !== 'contacts') applySectionSwitch('contacts');
    else renderSection();
  }
  function gotoContactsChannel(channelId) {
    appState.contacts.tab = 'channels';
    appState.contacts.selectedHrId = null;
    appState.contacts.selectedCompanyId = null;
    appState.contacts.channels.selectedId = channelId != null ? Number(channelId) : null;
    if (appState.section !== 'contacts') applySectionSwitch('contacts');
    else renderSection();
  }
  // ---- Section router --------------------------------------------------

  // Стабильный «путь» до input/textarea внутри профиля или вакансии —
  // нужен, чтобы переносить фокус и текущее значение через innerHTML wipe
  // в renderSection. Без этого автосохранение по blur стабильно сбрасывает
  // фокус и (при гонке save → server reply) перетирает то, что пользователь
  // успел набрать в соседнем поле.
  function _getFormElementPath(el) {
    if (!el) return null;
    if (el.id) return `#${CSS.escape(el.id)}`;
    const skillRow = el.closest && el.closest('.skill-row');
    if (skillRow && skillRow.dataset.skillId
        && el.classList && el.classList.contains('skill-name-input')) {
      return `.skill-row[data-skill-id="${CSS.escape(skillRow.dataset.skillId)}"] .skill-name-input`;
    }
    const expCard = el.closest && el.closest('.exp-card');
    if (expCard && expCard.dataset.expId) {
      const field = el.dataset && el.dataset.field;
      const listItem = el.closest('.list-item');
      const listBlock = el.closest('.list-block');
      if (field) {
        return `.exp-card[data-exp-id="${CSS.escape(expCard.dataset.expId)}"] [data-field="${CSS.escape(field)}"]`;
      }
      if (listItem && listBlock && listBlock.dataset.field) {
        return `.exp-card[data-exp-id="${CSS.escape(expCard.dataset.expId)}"] .list-block[data-field="${CSS.escape(listBlock.dataset.field)}"] .list-item[data-item-idx="${CSS.escape(listItem.dataset.itemIdx)}"] .list-input`;
      }
    }
    return null;
  }

  // Per-section scroll memory: при выходе из секции запоминаем scrollTop,
  // при возврате — восстанавливаем. Без этого юзер крутит длинный список
  // вакансий, переключается в Settings, возвращается — и оказывается
  // снова наверху.
  const _sectionScrolls = {};
  let _lastRenderedSection = null;

  function renderSection() {
    // Preserve scroll position of the page-body across re-renders so a
    // partial state change (opening a skill picker, adding a list item)
    // doesn't kick the user back to the top. Settings uses .sys-settings
    // as its own overflow:auto wrapper instead of .section-body — without
    // it any push-driven re-render scrolls the screen to the top.
    const oldBody = mainSlot.querySelector('.section-body, .sys-settings');
    const oldScroll = oldBody ? oldBody.scrollTop : 0;
    // При смене секции — запоминаем уходящий scroll в _sectionScrolls,
    // а в этом рендере используем сохранённое значение для НОВОЙ секции
    // (если возвращаемся в неё, иначе 0). При re-render'е той же секции
    // оставляем поведение «продолжить скролл» как было.
    if (_lastRenderedSection !== null && _lastRenderedSection !== appState.section) {
      _sectionScrolls[_lastRenderedSection] = oldScroll;
    }
    const savedScroll = (_lastRenderedSection !== appState.section)
      ? (_sectionScrolls[appState.section] || 0)
      : oldScroll;

    // Скролл внутри дропдаунов фильтра (каналы / компании) тоже надо
    // сохранять: тоггл чекбокса вызывает renderSection() для пересчёта
    // счётчиков «Выбрано: N», и без снапшота список улетает наверх.
    const popoverScrolls = {};
    mainSlot.querySelectorAll(
      '[data-role="filter-channels-wrap"] .vac-filter-channel-list, [data-role="filter-companies-wrap"] .vac-filter-channel-list'
    ).forEach((el) => {
      const wrap = el.closest('[data-role]');
      if (wrap) popoverScrolls[wrap.dataset.role] = el.scrollTop;
    });

    // Снимаем «снимок» всех input/textarea, у которых есть стабильный
    // путь, плюс позицию каретки активного элемента. После innerHTML wipe
    // подкатываем сохранённые значения обратно — это спасает от потери
    // символов, набранных в одном поле, пока автосохранение в другом
    // мотает round-trip к бэку. Снапшот имеет смысл только если есть
    // незакоммиченный черновик (dirty=true): без этого условия первый
    // ответ request_profile перетирает только что отрисованные данные
    // пустыми значениями, которые лежали в пустых инпутах до реплая.
    const inputSnapshot = new Map(); // path → string
    if (appState.section === 'profile' && appState.dirty) {
      mainSlot.querySelectorAll('input, textarea').forEach((el) => {
        if (el.type === 'checkbox' || el.type === 'radio' || el.type === 'range') return;
        const p = _getFormElementPath(el);
        if (p) inputSnapshot.set(p, el.value);
      });
    }
    let focusInfo = null;
    const active = document.activeElement;
    if (active && mainSlot.contains(active) &&
        (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA')) {
      const p = _getFormElementPath(active);
      if (p) {
        let selStart = null, selEnd = null;
        try { selStart = active.selectionStart; selEnd = active.selectionEnd; } catch (_) {}
        focusInfo = { path: p, selStart, selEnd };
      }
    }

    // Tear down flatpickr instances on inputs we're about to throw away —
    // each instance leaks document-level listeners until destroy() is called.
    mainSlot.querySelectorAll('.input-date-text').forEach((inp) => {
      if (inp._flatpickr) {
        try { inp._flatpickr.destroy(); } catch (_) {}
      }
    });
    // Same for any pending outside-click closer for the experience skill
    // picker: re-render orphans it.
    detachExpPickerCloser();

    if (appState.section === 'profile') {
      renderProfile();
    } else if (appState.section === 'vacancies') {
      renderVacancies();
    } else if (appState.section === 'contacts') {
      renderContacts();
    } else if (appState.section === 'stats') {
      renderStats();
    } else if (appState.section === 'system') {
      renderSystem();
    } else {
      const label = SECTION_LABELS[appState.section] || appState.section;
      mainSlot.innerHTML =
        `<div class="placeholder-content">Раздел «${escapeHtml(label)}» — экран ещё не реализован</div>`;
    }
    // Push-subscription для логов гейтит backend emit'ы. Вызываем
    // безусловно на каждый renderSection, чтобы любая навигация
    // (system→vacancies, system→contacts/...) корректно снимала
    // подписку — раньше она снималась только при попадании в else-
    // ветку placeholder'а.
    if (typeof _syncLogsSubscription === 'function') _syncLogsSubscription();

    const newBody = mainSlot.querySelector('.section-body, .sys-settings');
    if (newBody && savedScroll) newBody.scrollTop = savedScroll;

    for (const role of Object.keys(popoverScrolls)) {
      const list = mainSlot.querySelector(`[data-role="${role}"] .vac-filter-channel-list`);
      if (list) list.scrollTop = popoverScrolls[role];
    }

    // Восстанавливаем values только для тех инпутов, чьи DOM-«пути»
    // нашлись в новом дереве — и только если значение реально расходится
    // (иначе бы трогали setSelectionRange там, где не надо).
    if (inputSnapshot.size > 0) {
      inputSnapshot.forEach((value, path) => {
        try {
          const el = mainSlot.querySelector(path);
          if (el && el.value !== value) {
            el.value = value;
          }
        } catch (_) { /* ignore */ }
      });
    }

    if (focusInfo) {
      try {
        const newEl = mainSlot.querySelector(focusInfo.path);
        if (newEl) {
          newEl.focus();
          if (focusInfo.selStart != null && focusInfo.selEnd != null) {
            try { newEl.setSelectionRange(focusInfo.selStart, focusInfo.selEnd); }
            catch (_) { /* для type=number/email range может бросить — игнор */ }
          }
        }
      } catch (_) { /* ignore — потеряем фокус, но не упадём */ }
    }
    _lastRenderedSection = appState.section;
  }

  // === Experience skill-picker outside-click closer ====================
  // Hoisted so we never stack multiple document-level listeners across
  // re-renders.
  let _expPickerCloser = null;
  function detachExpPickerCloser() {
    if (_expPickerCloser) {
      document.removeEventListener('click', _expPickerCloser);
      _expPickerCloser = null;
    }
  }
  function attachExpPickerCloser() {
    detachExpPickerCloser();
    _expPickerCloser = (ev) => {
      if (ev.target.closest('.skill-picker') ||
          ev.target.closest('[data-action="exp-add-skill"]')) return;
      appState.pickerOpenFor = null;
      detachExpPickerCloser();
      renderSection();
    };
    setTimeout(() => document.addEventListener('click', _expPickerCloser), 0);
  }

  // === Vacancies sort/filter popover outside-click closer ==============
  // Hoisted: re-attaching on every renderSection() would stack listeners
  // on the (long-lived) mainSlot node forever. Detach-then-attach keeps
  // exactly one live listener.
  let _vacPopoverCloser = null;
  function detachVacPopoverCloser() {
    if (_vacPopoverCloser && mainSlot) {
      mainSlot.removeEventListener('click', _vacPopoverCloser);
      _vacPopoverCloser = null;
    }
  }
  function attachVacPopoverCloser() {
    if (!mainSlot) return;
    detachVacPopoverCloser();
    _vacPopoverCloser = (e) => {
      const st = appState.vacancies;
      const inSort = e.target.closest('[data-role="vac-sort-menu"]') || e.target.closest('[data-action="vac-sort-toggle"]');
      const inFilter = e.target.closest('[data-role="vac-filter-popover"]') || e.target.closest('[data-action="vac-filter-toggle"]');
      let changed = false;
      if (st.sortMenuOpen && !inSort) { st.sortMenuOpen = false; changed = true; }
      if (st.filterOpen && !inFilter) { closeFilterPopover(); changed = true; }
      if (st.filterOpen && inFilter) {
        if (st.filterUi.channelsOpen && !e.target.closest('[data-role="filter-channels-wrap"]')) {
          st.filterUi.channelsOpen = false;
          changed = true;
        }
        if (st.filterUi.companiesOpen && !e.target.closest('[data-role="filter-companies-wrap"]')) {
          st.filterUi.companiesOpen = false;
          changed = true;
        }
      }
      if (changed) renderSection();
    };
    mainSlot.addEventListener('click', _vacPopoverCloser);
  }

  // === Vacancies ========================================================
  // Slice 2: list pane wired to repository.list_vacancies via the bridge.
  // Status-string normalization: "In Progress" -> "in-progress" so the
  // CSS class for .status-dot.<status> matches.

  function statusToClass(s) {
    return (s || 'New').toLowerCase().replace(/\s+/g, '-');
  }

  function formatRelative(iso) {
    if (!iso) return '—';
    const ts = Date.parse(iso);
    if (Number.isNaN(ts)) return '—';
    const diffMs = Math.max(0, Date.now() - ts);
    const min = Math.floor(diffMs / 60000);
    if (min < 1)   return 'только что';
    if (min < 60)  return `${min} мин назад`;
    const hr = Math.floor(min / 60);
    if (hr < 24)   return `${hr} ч`;
    const day = Math.floor(hr / 24);
    if (day < 7)   return `${day} д`;
    const wk = Math.floor(day / 7);
    if (wk < 5)    return `${wk} нед`;
    const mo = Math.floor(day / 30);
    return `${mo} мес`;
  }

  function transformVacancyForList(v) {

  const VAC_SORT_LABELS = {

    score_desc: 'Сначала высокие баллы',
    score_asc: 'Сначала низкие баллы',
    status_active_first: 'Сначала активные статусы',
    status_new_first: 'Сначала новые статусы',
  };

  const FILTER_DEFAULTS = Object.freeze({
    statuses: [],
    channels: [],
    companies: [],
    scoreMin: '',
    scoreMax: '',
    salaryMin: '',
    salaryMax: '',
    grade: '',
    remote: 'all',
    hrContact: 'all',
    datePreset: 'all',
    dateFrom: '',
    dateTo: '',
  });

  function createFilterDefaults() {
    return {
      statuses: [],
      channels: [],
      companies: [],
      scoreMin: '',
      scoreMax: '',
      salaryMin: '',
      salaryMax: '',
      grade: '',
      remote: 'all',
      hrContact: 'all',
      datePreset: 'all',
      dateFrom: '',
      dateTo: '',
    };

  function cloneFilters(src) {
    const s = src || FILTER_DEFAULTS;
    return {
      statuses: Array.isArray(s.statuses) ? s.statuses.slice() : [],
      channels: Array.isArray(s.channels) ? s.channels.slice() : [],
      companies: Array.isArray(s.companies) ? s.companies.slice() : [],
      scoreMin: s.scoreMin ?? '',
      scoreMax: s.scoreMax ?? '',
      salaryMin: s.salaryMin ?? '',
      salaryMax: s.salaryMax ?? '',
      grade: s.grade ?? '',
      remote: s.remote ?? 'all',
      hrContact: s.hrContact ?? 'all',
      datePreset: s.datePreset ?? 'all',
      dateFrom: s.dateFrom ?? '',
      dateTo: s.dateTo ?? '',
    };
  }

  function getFiltersApplied() {
    const st = appState.vacancies;
    if (!st.filtersApplied) st.filtersApplied = createFilterDefaults();
    return st.filtersApplied;
  }
  function getFiltersDraft() {
    const st = appState.vacancies;
    if (!st.filtersDraft) st.filtersDraft = cloneFilters(getFiltersApplied());
    return st.filtersDraft;
  }

  function countActiveFilterSections(filters) {
    const f = filters || FILTER_DEFAULTS;
    let n = 0;
    if (f.statuses.length) n++;
    if (f.channels.length) n++;
    if (f.companies.length) n++;
    if (String(f.scoreMin || '').trim() || String(f.scoreMax || '').trim()) n++;
    if (String(f.salaryMin || '').trim() || String(f.salaryMax || '').trim()) n++;
    if (f.grade) n++;
    if (f.remote !== 'all') n++;
    if (f.hrContact !== 'all') n++;
    if (f.datePreset !== 'all' || f.dateFrom || f.dateTo) n++;
    return n;
  }

  // Размер страницы пагинации. PAGE_SIZE строк подгружаются на каждый scroll
  // к низу списка. Дальше можно тюнить — слишком маленький дёргает бэк часто,
  // слишком большой делает первый рендер тяжёлым.
  const VAC_PAGE_SIZE = 20;

  // Сборка JSON-payload'а для request_vacancies. Сортировка, поиск и все
  // фильтры (включая salary range и date range) теперь живут на бэке.
  // ``opts.mode``: ``'replace'`` (default) сбрасывает список и грузит
  // первую страницу — для смены фильтра / сорта / поиска / входа в секцию;
  // ``'append'`` тянет следующую страницу с offset = текущий размер списка
  // — для infinite scroll; ``'refresh'`` перегружает столько строк, сколько
  // уже загружено, не сдвигая позицию скролла — для polling и точечных
  // refetch'ей после ручных действий (смена статуса, удаление и т.п.).
  function buildVacanciesQuery(opts) {
    const st = appState.vacancies;
    const f = getFiltersApplied();
    const search = String(st.search || '').trim();
    const mode = (opts && opts.mode) || 'replace';
    // Эпоху бампим только на replace/refresh — это они «сбрасывают мир» и
    // делают любые ещё-не-прилетевшие append'ы устаревшими. Append держит
    // текущую эпоху: он часть того же набора фильтров/сорта.
    if (mode === 'append') {
      st.loadingMore = true;
    } else {
      st.requestEpoch = (st.requestEpoch || 0) + 1;
      st.replacing = true;
    }
    const payload = {
      sort: st.sortBy || 'newest',
      search: search || undefined,
      mode,
      epoch: st.requestEpoch,
    };
    if (f.statuses && f.statuses.length) payload.statuses = f.statuses.slice();
    if (f.channels && f.channels.length) payload.channels = f.channels.slice();
    if (f.companies && f.companies.length) payload.companies = f.companies.slice();
    if (String(f.scoreMin).trim() !== '') {
      const n = Number(f.scoreMin);
      if (!Number.isNaN(n)) payload.score_min = n;
    }
    if (String(f.scoreMax).trim() !== '') {
      const n = Number(f.scoreMax);
      if (!Number.isNaN(n)) payload.score_max = n;
    }
    if (String(f.salaryMin).trim() !== '') {
      const n = Number(f.salaryMin);
      if (!Number.isNaN(n)) payload.salary_min = n;
    }
    if (String(f.salaryMax).trim() !== '') {
      const n = Number(f.salaryMax);
      if (!Number.isNaN(n)) payload.salary_max = n;
    }
    if (f.grade) payload.grade = f.grade;
    if (f.remote && f.remote !== 'all') payload.remote = f.remote;
    if (f.hrContact && f.hrContact !== 'all') payload.hr_contact = f.hrContact;
    // Date range: бэк работает в UTC, фронт считает локальные границы
    // и шлёт ISO-строки (toISOString → 'Z'). Backend парсит fromisoformat
    // и сравнивает с activity_ts (tz-aware).
    if (f.datePreset && f.datePreset !== 'all') {
      const nowMs = Date.now();
      if (f.datePreset === 'today') {
        const start = new Date(); start.setHours(0, 0, 0, 0);
        const end = new Date(start); end.setHours(23, 59, 59, 999);
        payload.date_from = start.toISOString();
        payload.date_to = end.toISOString();
      } else if (f.datePreset === 'week') {
        payload.date_from = new Date(nowMs - 7 * 24 * 60 * 60 * 1000).toISOString();
      } else if (f.datePreset === 'month') {
        payload.date_from = new Date(nowMs - 30 * 24 * 60 * 60 * 1000).toISOString();
      } else if (f.datePreset === 'range') {
        if (f.dateFrom) {
          payload.date_from = new Date(`${f.dateFrom}T00:00:00`).toISOString();
        }
        if (f.dateTo) {
          payload.date_to = new Date(`${f.dateTo}T23:59:59`).toISOString();
        }
      }
    }
    // Salary filter — пост-фетч в бэке (regex по строке vacancy.salary),
    // поэтому пагинация при активном salary не работает: limit мог бы
    // отрезать ещё не отфильтрованные строки. Когда salary активен —
    // не шлём limit/offset, бэк отдаёт весь срез одной страницей.
    const hasSalaryFilter = (payload.salary_min !== undefined) || (payload.salary_max !== undefined);
    if (!hasSalaryFilter) {
      if (mode === 'append') {
        payload.offset = appState.vacancies.allList.length;
        payload.limit = VAC_PAGE_SIZE;
      } else if (mode === 'refresh') {
        payload.offset = 0;
        // Кап ~200, чтобы polling раз в 5 сек не таскал безгранично весь
        // подгруженный хвост (юзер может проскроллить в тысячу строк и
        // уйти в другой таб — не хочется гонять такой payload каждые 5 сек).
        const n = appState.vacancies.allList.length || VAC_PAGE_SIZE;
        payload.limit = Math.min(200, Math.max(VAC_PAGE_SIZE, n));
      } else {
        payload.offset = 0;
        payload.limit = VAC_PAGE_SIZE;
      }
    }
    return JSON.stringify(payload);
  }

  function applyVacancyView() {
    // Все фильтры, поиск и сортировка — на бэке. Серверный ответ уже
    // правильный набор и порядок; локальный шаг только копирует его в
    // st.list, чтобы render-код продолжал читать из st.list как раньше.
    appState.vacancies.list = appState.vacancies.allList.slice();
  }

  function getAllChannels() {
    const list = (appState.vacancies.filterOptions && appState.vacancies.filterOptions.channels) || [];
    return list.slice().sort((a, b) => String(a).localeCompare(String(b), 'ru'));
  }

  function getAllCompanies() {
    const list = (appState.vacancies.filterOptions && appState.vacancies.filterOptions.companies) || [];
    return list.slice().sort((a, b) => String(a).localeCompare(String(b), 'ru'));
  }

    const st = appState.vacancies;
    st.filterOpen = false;
    st.filtersDraft = null;
    st.filterUi.channelsOpen = false;
    st.filterUi.channelsSearch = '';
    st.filterUi.companiesSearch = '';
    st.filterUi.companiesOpen = false;
    st.filterUi.scrollToBottom = false;

    const st = appState.vacancies;
    st.filterOpen = true;
    st.filtersDraft = cloneFilters(getFiltersApplied());

    st.filterUi.channelsSearch = '';
    st.filterUi.companiesSearch = '';

    st.filterUi.scrollToBottom = false;

  function toggleFilterStatus(status) {
    const d = getFiltersDraft();
    const idx = d.statuses.indexOf(status);
    if (idx >= 0) d.statuses.splice(idx, 1);
    else d.statuses.push(status);
  }

  function toggleFilterChannel(channel) {
    const d = getFiltersDraft();
    const idx = d.channels.indexOf(channel);
    if (idx >= 0) d.channels.splice(idx, 1);
    else d.channels.push(channel);
  }
  function toggleFilterCompany(name) {
    const d = getFiltersDraft();
    const idx = d.companies.findIndex((c) => c.toLowerCase() === String(name || '').toLowerCase());
    if (idx >= 0) d.companies.splice(idx, 1);
    else if (name) d.companies.push(name);
  }

    const st = appState.vacancies;
    st.filtersApplied = cloneFilters(getFiltersDraft());

    if (api) api.request_vacancies(buildVacanciesQuery());
    renderSection();

    const st = appState.vacancies;
    st.filtersDraft = createFilterDefaults();

    if (api) api.request_vacancies(buildVacanciesQuery());
    renderSection();

  function renderVacRow(v) {
    const visible = v.stack.slice(0, 3);
    const more = v.stack.length - visible.length;
    const thr = appState.vacancies.scoreThreshold;
    let scoreCls = 'vac-score';
    if (v.score != null && typeof thr === 'number') {
      if (v.score < thr) scoreCls = 'vac-score score-bad';
      else if (v.score < thr * 1.5) scoreCls = 'vac-score score-warn';
    }
    const scoreChip = (v.score != null)
      ? `<span class="${scoreCls}">${v.score}</span>`
      : '';
    const isSelected = appState.vacancies.selectedId === v.id;
    return `
      <div class="vac-row${isSelected ? ' selected' : ''}" data-id="${v.id}">
        <div class="vac-row-head">
          <span class="status-dot ${v.status}"></span>
          ${scoreChip}
          <span class="vac-title">${escapeHtml(v.title)}</span>
        </div>
        <div class="vac-meta">
          <span class="v-co">${escapeHtml(v.company)}</span><span class="sep">·</span>${escapeHtml(v.grade)}<span class="sep">·</span>${escapeHtml(v.salary)}<span class="sep">·</span><span class="when">${escapeHtml(v.when)}</span>
        </div>
        <div class="vac-stack">
          ${visible.map(s => `<span class="mini-chip${s.matched ? ' matched' : ''}">${escapeHtml(s.name)}</span>`).join('')}
          ${more > 0 ? `<span class="mini-chip more">+${more}</span>` : ''}
        </div>
      </div>

  const REMOTE_LABELS = { remote: 'Удалёнка', hybrid: 'Гибрид', office: 'Офис' };
  const GRADE_LABELS  = { junior: 'Junior', middle: 'Middle', senior: 'Senior', lead: 'Lead' };
  const STATUS_ORDER = [
    'New',
    'Applied',
    'Answered',
    'Test',
    'Invitation',
    'In Progress',
    'Offer',

    'Ghosting',

    'Not Fit',

    'Answered': 'Answered',

    'Invitation': 'Invitation',
    'In Progress': 'In Progress',

      : ` class="hr-name is-link" data-action="link-company-from-name" data-prefill="${escapeAttr(d.company_name)}" title="Связать с компанией"`;

  // Timeline (§3.9): merges vacancy_status_history + vacancy_event into a
  // single descending-by-time feed. Returns '' when both sources are empty
  // — caller skips rendering the section in that case (no captain-obvious
  // empty header).
  // Бэкенд пишет skip_reason'ы с техническими префиксами ("llm: …",
  // "trash: …", "score 4 < 5", "blacklist: …"); UI их перетирает в
  // человекочитаемый русский. Возвращает '' если нечего показывать.
  function formatTimelineSkipReason(raw) {
    if (!raw) return '';
    const s = String(raw);
    const lower = s.toLowerCase();
    if (lower.startsWith('llm: ')) return _ensureTrailingPeriod(s.slice(5));
    if (lower.startsWith('trash: ')) return _ensureTrailingPeriod('Мусор: ' + s.slice(7));
    if (lower.startsWith('blacklist: ')) return _ensureTrailingPeriod('Blacklist: ' + s.slice(11));
    if (lower.startsWith('empty: ')) return 'Пустая вакансия.';
    const m = s.match(/^score\s+(-?\d+)\s*<\s*(-?\d+)$/i);
    if (m) return `Оценка ${m[1]} ниже порога ${m[2]}.`;
    if (s === 'unparseable') return 'Не удалось разобрать.';
    return _ensureTrailingPeriod(s);
  }

  // Если строка уже заканчивается терминальной пунктуацией (.!?…:) —
  // оставляем как есть; иначе добавляем точку. Применяется к
  // пользовательски-видимым timeline-текстам, чтобы LLM-комменты с
  // точками и наши захардкоженные подписи смотрелись единообразно.
  function _ensureTrailingPeriod(s) {
    if (!s) return s;
    const trimmed = s.trimEnd();
    if (!trimmed) return trimmed;
    if (/[.!?…:]$/.test(trimmed)) return trimmed;
    return trimmed + '.';
  }

  function renderTimeline(detail) {
    const history = (detail.history || []).map(h => ({
      kind: 'history',
      id: h.id,
      ts: h.changed_at,
      status: h.status,
      explanation: h.explanation,
      applied: h.applied,
    }));
    const events = (detail.events || []).map(e => ({
      kind: 'event',
      ts: e.created_at,
      eventKind: e.kind,
      payload: e.payload || {},
    }));
    const all = [...history, ...events];
    if (all.length === 0) return '';
    // DESC by timestamp; when ts is missing or equal, history wins (it's
    // the user-visible event, status change). Date.parse on ISO returns
    // NaN for null — treat NaN as -Infinity so missing-ts rows sink to
    // the bottom rather than randomly jumping to the top.
    all.sort((a, b) => {
      const ta = Date.parse(a.ts);
      const tb = Date.parse(b.ts);
      const va = Number.isNaN(ta) ? -Infinity : ta;
      const vb = Number.isNaN(tb) ? -Infinity : tb;
      if (vb !== va) return vb - va;
      if (a.kind !== b.kind) return a.kind === 'history' ? -1 : 1;
      return 0;
    });
    // Префильтр скрытых событий ДО `.map`, чтобы `idx === 0`
    // означало именно первый ВИДИМЫЙ ряд. Иначе, когда самое свежее
    // событие — скрытое, current-glow не достаётся никому:
    // idx=0 рендерит '', а idx=1 (видимый) уже не current.
    // Скрываем:
    //   - auto_send с ok=true: дублирует applied_sent + Applied-history;
    //   - applied_sent целиком: дублирует Applied-history-row («Applied:
    //     Авто-отправка отклика.» / «Applied: Ручная отправка.»),
    //     причём с обрезанным «N симв..» хвостом, который полезен только
    //     dev-аудиту, не юзеру. Аудит-данные остаются в БД, в UI их нет.
    const visible = all.filter(it => {
      if (it.kind !== 'event') return true;
      if (it.eventKind === 'auto_send' && it.payload && it.payload.ok === true) return false;
      if (it.eventKind === 'applied_sent') return false;
      return true;
    });
    const items = visible.map((it, idx) => {
      const isCurrent = idx === 0;
      const when = formatRelative(it.ts);
      const titleAttr = it.ts ? ` title="${escapeAttr(it.ts)}"` : '';
      let dotCls = '';
      let textHtml = '';
      if (it.kind === 'history') {
        // Цвет точки = цвет статуса ТОЛЬКО когда запись реально сменила
        // статус (applied=true). Comment-only (applied=false) → пустой
        // dotCls → дефолтный серый из `.tl-dot { background: var(--text-muted) }`.
        dotCls = it.applied ? (' ' + statusToClass(it.status)) : '';
        // Редактируемы только записи source=user — те, что юзер руками
        // создал через UI-смену статуса. Всё остальное (auto-send,
        // классификация HR-реплая) — source=system, текст сгенерирован
        // кодом или LLM, юзеру там трогать нечего.
        const isAuto = it.source !== 'user';
        // Always-on inline-edit. Драфт (если пользователь сейчас печатает)
        // имеет приоритет над server-value, чтобы push-rerender'ы не
        // подменяли текст под рукой. Placeholder = «без комментария» —
        // muted/italic через CSS.
        const drafts = appState.vacancies.historyExplanationDrafts || {};
        const draftVal = Object.prototype.hasOwnProperty.call(drafts, it.id)
          ? drafts[it.id]
          : null;
        const value = draftVal != null ? draftVal : (it.explanation || '');
        if (isAuto) {
          // Inline-рендер (как у parsed/auto_send/linked_*): wrap идёт
          // по словам, вторая строка ложится под label, а не под body
          // (таблично выровненный «висячий» отступ выглядел грязно).
          // Editable-ветка ниже всё ещё держит .tl-history-row — там
          // flex нужен под textarea, который inline не wrap'ается.
          textHtml = `<span class="status-name">${escapeHtml(it.status || '')}:</span> `
            + `<span class="tl-event">${escapeHtml(value)}</span>`;
        } else {
          textHtml = `<span class="tl-history-row">`
            + `<span class="status-name">${escapeHtml(it.status || '')}:</span>`
            + `<textarea class="tl-explanation-input" data-role="tl-explanation" data-history-id="${it.id}" rows="1" maxlength="2000" placeholder="без комментария.">${escapeHtml(value)}</textarea>`
            + `</span>`;
        }
      } else if (it.eventKind === 'ingested') {
        const ch = it.payload.channel
          ? `@${it.payload.channel}`
          : 'неизвестного канала';
        const msgIdAttr = it.payload.msg_id != null
          ? ` title="msg #${escapeAttr(String(it.payload.msg_id))}"`
          : '';
        textHtml = `<span class="tl-event"${msgIdAttr}>Поступила из канала ${escapeHtml(ch)}.</span>`;
      } else if (it.eventKind === 'parsed') {
        // Юзера интересует итоговый комментарий (skip_reason после
        // нормализации) — счётчик «Распознано N полей» и префикс
        // «Парсинг:» технические, режем. Если skip_reason'а нет —
        // вакансия прошла фильтры, подставляем «Без замечаний», чтобы
        // строка не висела голым статусом.
        const skipReason = formatTimelineSkipReason(it.payload.skip_reason)
          || 'Без замечаний.';
        const statusName = it.payload.status
          ? `<span class="status-name">${escapeHtml(it.payload.status)}:</span>`
          : '';
        // Точка совпадает с цветом статуса вакансии после парса —
        // иначе «New: Без замечаний.» рендерилось серой точкой,
        // несовпадающей с собственным badge'ом «New» на шапке.
        if (it.payload.status) {
          dotCls = ' ' + statusToClass(it.payload.status);
        }
        textHtml = `${statusName} <span class="tl-event">${escapeHtml(skipReason)}</span>`;
      } else if (it.eventKind === 'auto_send') {
        // VacancyEvent kind="auto_send" — каждая попытка авто-отправки.
        // Успешные попытки префильтрованы выше (см. `visible`), сюда
        // доходят только провалы; показываем причину, по которой
        // авто-отправка не сработала.
        const reason = it.payload.reason || 'unknown';
        const reasonLabels = {
          'profile_empty': 'профиль пуст',
          'cover_letter_failed': 'письмо не прошло проверку',
          'cv_missing': 'CV-файл не найден',
          'race': 'статус успел измениться',
          'blocked': 'отправка заблокирована',
          'telegram_error': 'Telegram отказался',
          'flood_wait': 'Telegram держит FloodWait',
        };
        const label = reasonLabels[reason] || reason;
        textHtml = `<span class="tl-event">Авто-отправка: ${escapeHtml(label)}.</span>`;
      } else if (it.eventKind === 'linked_hr') {
        const prev = it.payload.previous_name
          ? escapeHtml(it.payload.previous_name)
          : (it.payload.previous_id != null ? `#${escapeHtml(String(it.payload.previous_id))}` : 'не привязан');
        const next = it.payload.new_name
          ? escapeHtml(it.payload.new_name)
          : (it.payload.new_id != null ? `#${escapeHtml(String(it.payload.new_id))}` : 'не привязан');
        textHtml = `<span class="tl-event">HR: ${prev} → ${next}.</span>`;
      } else if (it.eventKind === 'linked_company') {
        const prev = it.payload.previous_name
          ? escapeHtml(it.payload.previous_name)
          : (it.payload.previous_id != null ? `#${escapeHtml(String(it.payload.previous_id))}` : 'не привязана');
        const next = it.payload.new_name
          ? escapeHtml(it.payload.new_name)
          : (it.payload.new_id != null ? `#${escapeHtml(String(it.payload.new_id))}` : 'не привязана');
        textHtml = `<span class="tl-event">Компания: ${prev} → ${next}.</span>`;
      } else {
        // Unknown event kinds shouldn't exist today (only ingested/parsed
        // are written), but render defensively so a future kind doesn't
        // silently disappear from the timeline.
        textHtml = `<span class="tl-event">${escapeHtml(it.eventKind || 'event')}</span>`;
      }
      return `
        <div class="tl-item${isCurrent ? ' current' : ''}">
          <span class="tl-dot${dotCls}"></span>
          <span class="tl-text">${textHtml}</span>
          <span class="tl-when"${titleAttr}>${escapeHtml(when)}</span>
        </div>
      `;
    }).join('');
    return `<div class="det-section"><div class="timeline">${items}</div></div>`;
  }

  function renderStatusPopover(detail) {
    const st = appState.vacancies;
    const currentStatus = detail.status || 'New';

      // radio → status-dot → подпись. Иначе селекшен-точка съезжает.
      return `
        <label class="status-option">
          <input type="radio" name="status-draft" value="${escapeAttr(status)}"${checked}>
          <span class="status-dot ${cls}"></span>
          <span>${escapeHtml(STATUS_LABELS[status] || status)}</span>

      ? `<span class="raw-meta-chip"><span class="material-symbols-outlined">schedule</span>${escapeHtml(formatTimestamp(postedIso))}</span>`

    const lenChip = `<span class="raw-meta-chip"><span class="material-symbols-outlined">straighten</span>${n} ${pluralRu(n, 'символ', 'символа', 'символов')}</span>`;

  // Pickers «Связать с HR / компанией» (§5, §6). Both modals share the
  // same chrome (header, search, list, create-form, footer); only row
  // rendering and field labels differ. Selecting a row sets selectedId
  // (uncommitted); the actual UPDATE runs on «Связать» click.
  function nameInitials(name) {
    if (!name) return '';
    const parts = String(name).trim().split(/\s+/).filter(Boolean);
    if (parts.length === 0) return '';
    if (parts.length === 1) return parts[0].slice(0, 1).toUpperCase();
    return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
  }

  function renderHrPickerRow(row, currentId, selectedId, opts) {
    const action = (opts && opts.action) || 'hr-picker-select';
    const currentLabel = (opts && opts.currentLabel) || 'текущий';
    const isCurrent = currentId != null && row.id === currentId;
    const isSelected = selectedId != null && row.id === selectedId;
    const initials = nameInitials(row.name);
    const avatar = row.avatar
      ? `<img class="hr-avatar" src="${escapeAttr(row.avatar)}" alt="">`
      : (initials
          ? `<span class="hr-avatar">${escapeHtml(initials)}</span>`
          : `<span class="hr-avatar"><span class="material-symbols-outlined">person</span></span>`);
    const username = row.telegram_username
      ? (row.telegram_username.startsWith('@') ? row.telegram_username : `@${row.telegram_username}`)
      : '';
    const subParts = [];

  // Debounced autosave wiring for any `.notes-area` textarea — keeps the
  // input/blur/keydown plumbing in one place. Caller owns the actual save
  // call (saveNow) and the timer slot in its state object (so external
  // flushes — e.g. flushing before swapping HR rows — still work).
  function attachNotesAutosave({
    el,
    onInput,            // (el) => void — caller updates draft, focus, etc.
    saveNow,            // () => void — fires the actual API call
    debounceMs,
    flushOnBlur = false,
    flushOnCtrlEnter = false,
    getTimer,           // () => number | null
    setTimer,           // (number | null) => void
  }) {
    if (!el) return;
    const cancel = () => {
      const t = getTimer();
      if (t != null) {
        clearTimeout(t);
        setTimer(null);
      }
    };
    el.addEventListener('input', () => {
      if (onInput) onInput(el);
      cancel();
      setTimer(setTimeout(() => {
        setTimer(null);
        saveNow();
      }, debounceMs));
    });
    if (flushOnBlur) {
      el.addEventListener('blur', () => { cancel(); saveNow(); });
    }
    if (flushOnCtrlEnter) {
      el.addEventListener('keydown', (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
          e.preventDefault();
          cancel();
          saveNow();
        }
      });
    }
  }

  function renderPickerModal({

      ? `<div class="picker-create">

  function renderVacDetail() {
    const state = appState.vacancies;
    if (state.selectedId == null) {
      return `<div class="vac-detail-empty">Выберите вакансию слева</div>`;
    }
    if (state.detailLoading || state.detail == null) {
      return `<div class="vac-detail-empty">Загрузка…</div>`;
    }
    const d = state.detail;

    const chips = [];
    if (d.score != null) {
      const thr = (typeof d.score_threshold === 'number') ? d.score_threshold : null;
      let scoreCls = 'score';
      if (thr != null) {
        if (d.score < thr) scoreCls = 'score score-bad';
        else if (d.score < thr * 1.5) scoreCls = 'score score-warn';
      }
      chips.push(`<span class="info-chip ${scoreCls}">Score: ${d.score}</span>`);
    }
    if (d.grade) {
      const gradeLabel = GRADE_LABELS[d.grade] || d.grade;
      chips.push(`<span class="info-chip">${escapeHtml(gradeLabel)}</span>`);
    }
    if (d.salary)   chips.push(`<span class="info-chip">${escapeHtml(d.salary)}</span>`);
    if (d.remote) {
      const remoteLabel = REMOTE_LABELS[d.remote] || d.remote;
      chips.push(`<span class="info-chip">${escapeHtml(remoteLabel)}</span>`);
    }
    if (d.location) chips.push(`<span class="info-chip">${escapeHtml(d.location)}</span>`);
    if (d.channel_username) {
      // Click → opens the original Telegram post in the OS Telegram client
      // (or browser fallback). source_url is set by the ingestion pipeline
      // as https://t.me/{channel}/{msg_id}.
      const linkable = d.source_url ? ' linkable' : '';
      const sourceAttr = d.source_url
        ? ` data-action="open-source" data-url="${escapeAttr(d.source_url)}"`
        : '';
      chips.push(`<span class="info-chip${linkable}"${sourceAttr} title="Перейти к посту в канале"><span class="material-symbols-outlined">tag</span>${escapeHtml(d.channel_username)}</span>`);
    }
    const whenIso = d.posted_at || d.created_at;
    const when = formatRelative(whenIso);
    if (when && when !== '—') {
      const titleAttr = whenIso ? ` title="${escapeAttr(whenIso)}"` : '';
      chips.push(`<span class="info-chip"${titleAttr}><span class="material-symbols-outlined">schedule</span>${escapeHtml(when)}</span>`);
    }

    const stack = d.stack || [];
    const stackHtml = stack
      .map(s => `<span class="stack-chip${s.matched ? ' matched' : ''}">${escapeHtml(s.name)}</span>`)
      .join('');

    // Slice 5 (§3.8): notes-area is uncontrolled — its value comes from
    // notesDraft when the user has typed (drafts survive list-polling
    // re-renders), otherwise from the server's detail.notes.
    const notesValue = appState.vacancies.notesDraft != null
      ? appState.vacancies.notesDraft
      : (d.notes ?? '');

    const statusClass = statusToClass(d.status || 'New');
    const statusLabel = STATUS_LABELS[d.status] || d.status || 'New';
    const statusOpenCls = appState.vacancies.statusPopoverOpen ? ' popover-open' : '';
    return `
      <div class="det-head">
        <div class="status-wrap${statusOpenCls}">
          <button class="status-badge" data-action="status-toggle" type="button">
            <span class="status-dot ${statusClass}"></span>
            <span class="label">${escapeHtml(statusLabel)}</span>
            <span class="material-symbols-outlined" style="color:#64f20c;">expand_more</span>
          </button>
          ${renderStatusPopover(d)}
        </div>
        <div class="det-title">${escapeHtml(d.title || '—')}</div>
        <div class="more-wrap actions-menu">
          <button class="icon-btn" data-action="more-toggle" type="button" title="Действия">
            <span class="material-symbols-outlined">more_vert</span>
          </button>
          ${renderMorePopover(d)}
        </div>
      </div>
      ${chips.length ? `<div class="det-info">${chips.join('')}</div>` : ''}
      ${stack.length ? `<div class="det-section"><div class="det-stack">${stackHtml}</div></div>` : ''}
      ${d.description ? `<div class="det-section"><p>${escapeHtml(d.description)}</p></div>` : ''}
      <div class="det-section">
        <div class="contact-pair">
          ${renderHrBlock(d.hr)}
          ${renderCompanyBlock(d)}
        </div>
      </div>
      <div class="det-section">
        <textarea class="notes-area" placeholder="Заметки по вакансии…">${escapeHtml(notesValue)}</textarea>
      </div>
      ${renderTimeline(d)}
    `;
  }

  // Send the current draft to the backend if it differs from the last
  // server-confirmed value. Synchronous; the response arrives asynchronously
  // via vacancy_notes_saved.
  function saveNotes() {
    const st = appState.vacancies;
    if (st.selectedId == null) return;
    const draft = st.notesDraft;
    if (draft == null) return;
    // Compare with whitespace-only collapsed to "": backend normalizes
    // whitespace-only notes to NULL (then echoes null → lastSaved becomes
    // ''). Without this, draft="   " vs lastSaved="" would re-trigger a save
    // on every debounce in a loop.
    const norm = (s) => (s == null || !String(s).trim()) ? '' : String(s);
    if (norm(draft) === norm(st.notesLastSaved)) return;
    if (!api) return;
    api.update_vacancy_notes(JSON.stringify({
      vacancy_id: st.selectedId,
      notes: draft,
    }));
  }

  function saveStatusChange() {
    const st = appState.vacancies;
    if (st.selectedId == null || st.detail == null) return;
    if (!api || st.statusSaving) return;
    const nextStatus = st.statusDraft || st.detail.status || 'New';
    const explanation = st.statusCommentDraft || '';
    st.statusSaving = true;
    renderSection();
    api.change_vacancy_status(JSON.stringify({
      vacancy_id: st.selectedId,
      status: nextStatus,
      explanation,
    }));
  }

  const HISTORY_EXPLANATION_DEBOUNCE_MS = 500;

  function _autosizeHistoryExplanation(el) {
    if (!el) return;
    el.style.height = 'auto';
    el.style.height = el.scrollHeight + 'px';
  }

  function _sendHistoryExplanationSave(historyId) {
    const st = appState.vacancies;
    if (!api || st.selectedId == null) return;
    const drafts = st.historyExplanationDrafts || {};
    if (!Object.prototype.hasOwnProperty.call(drafts, historyId)) return;
    const value = drafts[historyId];
    api.update_status_history_explanation(JSON.stringify({
      vacancy_id: st.selectedId,
      history_id: historyId,
      explanation: value,
    }));
  }

  function flushHistoryExplanationSave(historyId) {
    const st = appState.vacancies;
    const timers = st.historyExplanationTimers || {};
    if (timers[historyId] != null) {
      clearTimeout(timers[historyId]);
      delete timers[historyId];
    }
    _sendHistoryExplanationSave(historyId);
  }

  function flushAllHistoryExplanationSaves() {
    // Вызывается при свапе вакансии и перед detail re-fetch'ем — чтобы
    // pending-debounce не выстрелил позже на старом vacancy_id.
    const st = appState.vacancies;
    const timers = st.historyExplanationTimers || {};
    Object.keys(timers).forEach(id => flushHistoryExplanationSave(parseInt(id, 10)));
  }

  function resetHistoryExplanationEditor() {
    // Полный сброс — на row swap. Не флашим: предполагаем что caller уже
    // вызвал flushAllHistoryExplanationSaves если нужно сохранить.
    const st = appState.vacancies;
    const timers = st.historyExplanationTimers || {};
    Object.values(timers).forEach(t => { if (t != null) clearTimeout(t); });
    st.historyExplanationDrafts = {};
    st.historyExplanationTimers = {};
  }

  function attachVacRowClickHandlers() {
    mainSlot.querySelectorAll('.vac-row').forEach(el => {
      el.addEventListener('click', () => {
        const id = parseInt(el.dataset.id, 10);
        if (Number.isNaN(id)) return;
        if (appState.vacancies.selectedId === id) return;
        // Flush any pending draft for the previous vacancy before swapping
        // selection — otherwise an 800ms debounce would target the wrong id
        // (or get cancelled and the typing would silently go missing).
        if (appState.vacancies.notesPendingTimer != null) {
          clearTimeout(appState.vacancies.notesPendingTimer);
          appState.vacancies.notesPendingTimer = null;
          saveNotes();
        }
        resetNotesEditor();
        closeVacancyPopovers();
        // Pending history-explanation savesы флашим до свапа — иначе
        // debounce выстрелит позже на новом vacancy_id (selectedId уже
        // другой → бэк попытается обновить чужую history-row).
        flushAllHistoryExplanationSaves();
        resetHistoryExplanationEditor();
        closeRawModal();
        closeHrPicker();
        closeCompanyPicker();
        appState.vacancies.selectedId = id;
        appState.vacancies.detail = null;
        appState.vacancies.detailLoading = true;

      el.addEventListener('click', (e) => {
        e.stopPropagation();
        let url = (el.dataset.url || '').trim();
        if (!url) return;
        // company_website — LLM-извлечённый текст из чужого поста: ему
        // нельзя доверять. Пропускаем только http(s); всё остальное —
        // включая `javascript:`, `data:`, `file:` и scheme-relative
        // `//host/path` — насильно переписываем в https://, срезая
        // потенциальную вредоносную схему. В БД часто хранится голый
        // домен («example.com») — этот же путь добавит схему.
        if (!/^https?:\/\//i.test(url)) {
          url = 'https://' + url.replace(/^\/*/, '').replace(/^[a-z][a-z0-9+.-]*:\/*/i, '');

    if (statusComment) {
      statusComment.addEventListener('input', () => {
        appState.vacancies.statusCommentDraft = statusComment.value;
      });
      statusComment.addEventListener('keydown', (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
          e.preventDefault();
          saveStatusChange();
        } else if (e.key === 'Escape') {
          e.preventDefault();
          resetStatusEditor();
          renderSection();
        }
      });
    }

    // Always-on inline-edit timeline-комментариев. Каждая history-строка —
    // textarea, hover/focus меняют рамку. Input → debounce save 500мс +
    // autosize; Blur → flush save сразу; Ctrl/⌘+Enter → flush.
    pane.querySelectorAll('[data-role="tl-explanation"]').forEach(ta => {
      _autosizeHistoryExplanation(ta);
      ta.addEventListener('input', () => {
        const id = parseInt(ta.dataset.historyId, 10);
        if (!Number.isFinite(id)) return;
        const st = appState.vacancies;
        st.historyExplanationDrafts[id] = ta.value;
        _autosizeHistoryExplanation(ta);
        const timers = st.historyExplanationTimers;
        if (timers[id] != null) clearTimeout(timers[id]);
        timers[id] = setTimeout(() => {
          delete timers[id];
          _sendHistoryExplanationSave(id);
        }, HISTORY_EXPLANATION_DEBOUNCE_MS);
      });
      ta.addEventListener('blur', () => {
        const id = parseInt(ta.dataset.historyId, 10);
        if (!Number.isFinite(id)) return;
        const st = appState.vacancies;
        if (!Object.prototype.hasOwnProperty.call(st.historyExplanationDrafts, id)) {
          return;
        }
        flushHistoryExplanationSave(id);
      });
      ta.addEventListener('keydown', (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
          e.preventDefault();
          const id = parseInt(ta.dataset.historyId, 10);
          if (Number.isFinite(id)) flushHistoryExplanationSave(id);
        }
      });
    });

    // Slice 5 (§3.8): notes editor. Save on blur and Ctrl+Enter; debounce
    // 800ms while typing. The textarea is re-created on every renderVacancies
    // call (innerHTML wipe), so we re-bind every render — old listeners die
    // with the old node. ``notesPendingTimer`` lives on appState because
    // row-swap (line ~4583) must flush a pending save before switching.
    attachNotesAutosave({
      el: pane.querySelector('.notes-area'),
      onInput: el => { appState.vacancies.notesDraft = el.value; },
      saveNow: saveNotes,
      debounceMs: 800,
      flushOnBlur: true,
      flushOnCtrlEnter: true,
      getTimer: () => appState.vacancies.notesPendingTimer,
      setTimer: t => { appState.vacancies.notesPendingTimer = t; },
    });
  }

  // Pickers: search has 200ms debounce (matches the §1.1 search-input
  // pattern). Re-rendering on every keystroke would re-create the input
  // and snap focus, so we mutate the search string in state without a
  // re-render until the user pauses typing — then a new request_*_picker
  // call replaces the list (loading=true intermediate state).
  const PICKER_SEARCH_DEBOUNCE_MS = 200;

        // user can drop down to "no change" without closing the modal.
        p.selectedId = (p.selectedId === id) ? null : id;
        renderSection();
      });
    });

    mainSlot.querySelectorAll('[data-action="hr-create-toggle"]').forEach((el) => {
      el.addEventListener('click', (e) => {
        e.preventDefault();

    const nameInput = mainSlot.querySelector('[data-role="hr-create-name"]');
    if (nameInput) {
      nameInput.addEventListener('input', () => {
        appState.vacancies.hrPicker.createDraft.name = nameInput.value;
        syncHrCreateSubmitState();
      });
    }
    const usernameInput = mainSlot.querySelector('[data-role="hr-create-username"]');
    if (usernameInput) {
      usernameInput.addEventListener('input', () => {
        // Strip the leading @ — backend stores raw username; trim here so
        // copy-pasted "@foo" doesn't end up as "@@foo" later.
        let v = usernameInput.value;
        if (v.startsWith('@')) v = v.slice(1);
        appState.vacancies.hrPicker.createDraft.telegram_username = v;
        syncHrCreateSubmitState();
      });
    }
    const userIdInput = mainSlot.querySelector('[data-role="hr-create-user-id"]');
    if (userIdInput) {
      userIdInput.addEventListener('input', () => {
        // Numeric-only for telegram_user_id; silently drop garbage so the
        // backend int(...) cast doesn't throw on submit.
        appState.vacancies.hrPicker.createDraft.telegram_user_id =
          userIdInput.value.replace(/[^0-9]/g, '');
        syncHrCreateSubmitState();
      });
    }
    const notesInput = mainSlot.querySelector('[data-role="hr-create-notes"]');
    if (notesInput) {
      notesInput.addEventListener('input', () => {
        appState.vacancies.hrPicker.createDraft.notes = notesInput.value;
      });
    }
    syncHrCreateSubmitState();

    mainSlot.querySelectorAll('[data-action="hr-create-submit"]').forEach((el) => {
      el.addEventListener('click', (e) => {
        e.preventDefault();
        const p = appState.vacancies.hrPicker;
        if (p.saving) return;
        const d = p.createDraft;
        const name = (d.name || '').trim();
        const usernameRaw = (d.telegram_username || '').trim();
        const username = usernameRaw.startsWith('@') ? usernameRaw.slice(1) : usernameRaw;
        const userId = (d.telegram_user_id || '').trim();
        if (!name && !username && !userId) {
          showToast('Укажите хотя бы имя или @username');
          return;
        }
        const id = appState.vacancies.selectedId;
        if (id == null || !api) return;
        p.saving = true;
        renderSection();
        api.picker_create_hr(JSON.stringify({
          vacancy_id: id,
          search: p.search || '',
          name,
          telegram_username: username,
          telegram_user_id: userId,
          notes: (d.notes || '').trim() || null,
        }));
      });
    });

    const search = mainSlot.querySelector('[data-role="hr-picker-search"]');
    if (search) {
      // Restore caret/focus across the renderSection-driven innerHTML wipe —
      // otherwise typing 2 chars fast resets selection between debounces.
      const p = appState.vacancies.hrPicker;
      if (p._refocusSearch) {
        search.focus();
        try { search.setSelectionRange(p._refocusSearch, p._refocusSearch); } catch {}
        p._refocusSearch = null;
      }
      search.addEventListener('input', () => {
        const p = appState.vacancies.hrPicker;
        p.search = search.value;
        if (p.searchTimer) clearTimeout(p.searchTimer);
        p.searchTimer = setTimeout(() => {
          p.searchTimer = null;
          p._refocusSearch = search.value.length;
          refreshHrPicker(p.search);
        }, PICKER_SEARCH_DEBOUNCE_MS);
      });
    }

    mainSlot.querySelectorAll('[data-action="hr-picker-apply"]').forEach((el) => {
      el.addEventListener('click', (e) => {
        e.preventDefault();
        if (el.disabled) return;
        const p = appState.vacancies.hrPicker;
        const vid = appState.vacancies.selectedId;
        if (vid == null || !api) return;
        if (p.selectedId == null || p.selectedId === p.currentId) return;
        p.saving = true;
        renderSection();
        api.link_vacancy_hr(JSON.stringify({
          vacancy_id: vid,
          hr_id: p.selectedId,
        }));
      });
    });
  }

  function attachVacListScrollHandler() {
    const list = mainSlot.querySelector('.vac-list');
    if (!list) return;
    // innerHTML wipe в renderSection уносит старый <div class="vac-list"> с
    // его слушателем в GC — здесь мы навешиваем слушатель на свежий узел,
    // ничего не накапливается.
    list.addEventListener('scroll', () => {
      const st = appState.vacancies;
      // Не лезем в append, пока активна другая операция: replacing — в полёте
      // replace/refresh, который перетряхивает весь allList; loadingMore —
      // другой append уже летит. Без этих гардов append может уйти со
      // смещением, валидным для устаревшего набора фильтров.
      if (!st.hasMore || st.loadingMore || st.replacing) return;
      // ~150px заранее, чтобы запрос успел вернуться до того как юзер
      // упрётся в самый низ.
      if (list.scrollTop + list.clientHeight < list.scrollHeight - 150) return;
      if (api) api.request_vacancies(buildVacanciesQuery({ mode: 'append' }));
    });
  }

      searchInput.addEventListener('input', () => {
