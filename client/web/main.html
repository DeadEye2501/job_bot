        if (clearBtn) clearBtn.classList.toggle('hidden', !st.searchDraft);
        if (st.searchTimer != null) clearTimeout(st.searchTimer);
        st.searchTimer = setTimeout(() => {
          st.searchTimer = null;
          if (st.search === st.searchDraft) return;
          st.search = st.searchDraft;
          if (api) api.request_vacancies(buildVacanciesQuery());
        }, 250);
      });
    }
    if (clearBtn) {
      clearBtn.addEventListener('click', (e) => {
        e.preventDefault();
        if (st.searchTimer != null) {
          clearTimeout(st.searchTimer);
          st.searchTimer = null;
        }
        const wasSet = st.searchDraft !== '' || st.search !== '';
        st.searchDraft = '';
        st.search = '';
        if (wasSet && api) api.request_vacancies(buildVacanciesQuery());
        renderSection();
        const input = mainSlot.querySelector('[data-role="vac-search"]');
        if (input) input.focus();
      });
    }
    mainSlot.querySelectorAll('[data-action="vac-sort-toggle"]').forEach((el) => {
      el.addEventListener('click', (e) => {
        e.preventDefault();
        e.stopPropagation();
        const next = !st.sortMenuOpen;
        st.sortMenuOpen = next;
        if (next && st.filterOpen) closeFilterPopover();
        renderSection();
      });
    });
    mainSlot.querySelectorAll('[data-action="vac-filter-toggle"]').forEach((el) => {
      el.addEventListener('click', (e) => {
        e.preventDefault();
        e.stopPropagation();
        if (st.filterOpen) closeFilterPopover();
        else openFilterPopover();
        st.sortMenuOpen = false;
        renderSection();
      });
    });
    mainSlot.querySelectorAll('[data-action="vac-sort-set"]').forEach((el) => {
      el.addEventListener('click', (e) => {
        e.preventDefault();
        e.stopPropagation();
        const next = el.dataset.sort || 'newest';
        if (next === st.sortBy) {
          st.sortMenuOpen = false;
          renderSection();
          return;
        }
        st.sortBy = next;
        st.sortMenuOpen = false;
        // Бэк теперь сам сортирует — дёргаем повторный запрос вместо
        // локальной пересортировки. До прихода ответа показываем уже
        // отрисованный список (он останется в неправильном порядке на
        // секунду, но это лучше, чем мигнуть «Загрузка…»).
        if (api) api.request_vacancies(buildVacanciesQuery());
        renderSection();
      });
    });
    attachVacPopoverCloser();
    mainSlot.querySelectorAll('[data-action="filter-close"], [data-action="filter-cancel"]').forEach((el) => {
      el.addEventListener('click', (e) => {
        e.preventDefault();
        closeFilterPopover();
        renderSection();
      });
    });
    mainSlot.querySelectorAll('[data-action="filter-apply"]').forEach((el) => {
      el.addEventListener('click', (e) => {
        e.preventDefault();
        applyFilterDraft();
        renderSection();
      });
    });
    mainSlot.querySelectorAll('[data-action="filter-reset"]').forEach((el) => {
      el.addEventListener('click', (e) => {
        e.preventDefault();
        resetFiltersAndApply();
        renderSection();
      });
    });
    mainSlot.querySelectorAll('[data-action="filter-status-toggle"]').forEach((el) => {
      el.addEventListener('click', (e) => {
        e.preventDefault();
        toggleFilterStatus(el.dataset.status || '');
        renderSection();
      });
    });
    const channelSearch = mainSlot.querySelector('[data-action="filter-channel-search"]');
    if (channelSearch) {
      channelSearch.addEventListener('input', () => {
        st.filterUi.channelsSearch = channelSearch.value;
        renderSection();
      });
    }
    mainSlot.querySelectorAll('[data-action="filter-channels-toggle"]').forEach((el) => {
      el.addEventListener('click', (e) => {
        e.preventDefault();
        st.filterUi.channelsOpen = !st.filterUi.channelsOpen;
        if (st.filterUi.channelsOpen) st.filterUi.companiesOpen = false;
        renderSection();
      });
    });
    mainSlot.querySelectorAll('[data-action="filter-channel-toggle"]').forEach((el) => {
      el.addEventListener('change', () => {
        toggleFilterChannel(el.dataset.channel || '');
        renderSection();
      });
    });
    const companySearch = mainSlot.querySelector('[data-action="filter-company-search"]');
    if (companySearch) {
      companySearch.addEventListener('input', () => {
        st.filterUi.companiesSearch = companySearch.value;
        renderSection();
      });
    }
    mainSlot.querySelectorAll('[data-action="filter-companies-toggle"]').forEach((el) => {
      el.addEventListener('click', (e) => {
        e.preventDefault();
        st.filterUi.companiesOpen = !st.filterUi.companiesOpen;
        if (st.filterUi.companiesOpen) st.filterUi.channelsOpen = false;
        renderSection();
      });
    });
    mainSlot.querySelectorAll('[data-action="filter-company-toggle"]').forEach((el) => {
      el.addEventListener('change', () => {
        toggleFilterCompany(el.dataset.company || '');
        renderSection();
      });
    });
    const scoreMin = mainSlot.querySelector('[data-action="filter-score-min"]');
    if (scoreMin) scoreMin.addEventListener('input', () => { getFiltersDraft().scoreMin = scoreMin.value; });
    const scoreMax = mainSlot.querySelector('[data-action="filter-score-max"]');
    if (scoreMax) scoreMax.addEventListener('input', () => { getFiltersDraft().scoreMax = scoreMax.value; });
    const salaryMin = mainSlot.querySelector('[data-action="filter-salary-min"]');
    if (salaryMin) salaryMin.addEventListener('input', () => { getFiltersDraft().salaryMin = salaryMin.value; });
    const salaryMax = mainSlot.querySelector('[data-action="filter-salary-max"]');
    if (salaryMax) salaryMax.addEventListener('input', () => { getFiltersDraft().salaryMax = salaryMax.value; });
    mainSlot.querySelectorAll('[data-action="filter-grade"]').forEach((el) => {
      el.addEventListener('click', (e) => {
        e.preventDefault();
        getFiltersDraft().grade = el.dataset.value ?? '';
        renderSection();
      });
    });
    mainSlot.querySelectorAll('[data-action="filter-remote"]').forEach((el) => {
      el.addEventListener('click', (e) => {
        e.preventDefault();
        getFiltersDraft().remote = el.dataset.value || 'all';
        renderSection();
      });
    });
    mainSlot.querySelectorAll('[data-action="filter-hr-contact"]').forEach((el) => {
      el.addEventListener('click', (e) => {
        e.preventDefault();
        getFiltersDraft().hrContact = el.dataset.value || 'all';
        renderSection();
      });
    });
    mainSlot.querySelectorAll('[data-action="filter-date-preset"]').forEach((el) => {
      el.addEventListener('click', (e) => {
        e.preventDefault();
        const next = el.dataset.value || 'all';
        getFiltersDraft().datePreset = next;
        st.filterUi.scrollToBottom = (next === 'range');
        renderSection();
      });
    });
    const dateFrom = mainSlot.querySelector('[data-action="filter-date-from"]');
    const dateTo = mainSlot.querySelector('[data-action="filter-date-to"]');
    const bindFilterDatePicker = (inp, key) => {
      if (!inp || typeof flatpickr !== 'function') return;
      const iso = String(getFiltersDraft()[key] || '').trim();
      let defaultDate = null;
      if (iso) {
        const parts = iso.split('-');
        if (parts.length === 3) {
          const y = Number(parts[0]);
          const m = Number(parts[1]);
          const d = Number(parts[2]);
          if (Number.isFinite(y) && Number.isFinite(m) && Number.isFinite(d)) {
            defaultDate = new Date(y, m - 1, d);
          }
        }
      }
      flatpickr(inp, {
        dateFormat: 'd.m.Y',
        locale: 'ru',
        allowInput: true,
        monthSelectorType: 'static',
        disableMobile: true,
        defaultDate,
        onChange: (selectedDates) => {
          if (!selectedDates || selectedDates.length === 0) {
            getFiltersDraft()[key] = '';
            return;
          }
          const d = selectedDates[0];
          const yyyy = d.getFullYear();
          const mm = String(d.getMonth() + 1).padStart(2, '0');
          const dd = String(d.getDate()).padStart(2, '0');
          getFiltersDraft()[key] = `${yyyy}-${mm}-${dd}`;
        },
      });
    };
    bindFilterDatePicker(dateFrom, 'dateFrom');
    bindFilterDatePicker(dateTo, 'dateTo');
  }

  function renderVacancies() {
    // Save the list AND detail scroll positions before innerHTML replacement —
    // renderSection's generic .section-body restorer doesn't know about
    // these panes, so we handle them locally. Without the detail save, the
    // 5s polling timer would snap the user to the top mid-read.
    const oldList = mainSlot.querySelector('.vac-list');
    const oldDetail = mainSlot.querySelector('.vac-detail-pane');
    const oldFilterBody = mainSlot.querySelector('.vac-filter-body');
    const savedListScroll = oldList ? oldList.scrollTop : 0;
    const savedDetailScroll = oldDetail ? oldDetail.scrollTop : 0;
    const savedFilterScroll = oldFilterBody ? oldFilterBody.scrollTop : 0;

    // Slice 5 (§3.8): preserve notes textarea focus and caret position across
    // the innerHTML wipe. Without this, the 5s vacancy-list polling timer
    // would yank the cursor away mid-keystroke. The .value itself is already
    // preserved through appState.vacancies.notesDraft → renderVacDetail.
    const oldNotes = mainSlot.querySelector('.notes-area');
    const savedNotesFocus = oldNotes && document.activeElement === oldNotes
      ? { selStart: oldNotes.selectionStart, selEnd: oldNotes.selectionEnd }
      : null;

    // Pickers + list-search: то же самое для search-bar и create-form инпутов
    // модалок, плюс для тулбарного поиска вакансий (data-role="vac-search"),
    // чтобы 5-секундный polling и локальные re-render'ы не выкидывали
    // фокус из поля ввода.
    const focused = document.activeElement;
    const savedPickerFocus = (focused && focused.dataset && focused.dataset.role
      && (/^(hr|company)-/.test(focused.dataset.role)
          || focused.dataset.role === 'vac-search'
          || focused.dataset.role === 'filter-channel-search'
          || focused.dataset.role === 'filter-company-search'))
      ? { role: focused.dataset.role,
          selStart: focused.selectionStart,
          selEnd: focused.selectionEnd }
      : null;

    const state = appState.vacancies;
    let listContent;
    if (!state.loaded) {
      listContent = `<div class="vac-list-empty">Загрузка…</div>`;
    } else if (state.list.length === 0) {
      if (state.search) {
        listContent = `
          <div class="vac-list-empty">
            <span class="material-symbols-outlined">search_off</span>
            <span>Ничего не найдено по запросу «${escapeHtml(state.search)}».</span>
          </div>`;
      } else {
        listContent = `
          <div class="vac-list-empty">
            <span class="material-symbols-outlined">inbox</span>
            <span>Вакансий пока нет.<br>Включите бота в нижнем баре, чтобы начать сбор.</span>
          </div>`;
      }
    } else {
      listContent = state.list.map(renderVacRow).join('');
    }
    const sortMenu = state.sortMenuOpen
      ? `
          <div class="vac-sort-menu" data-role="vac-sort-menu">
            ${Object.entries(VAC_SORT_LABELS).map(([key, label]) => `
              <button type="button" class="vac-sort-option${state.sortBy === key ? ' active' : ''}" data-action="vac-sort-set" data-sort="${key}">${escapeHtml(label)}</button>
            `).join('')}
          </div>`
      : '';
    const filterActive = countActiveFilterSections(getFiltersApplied()) > 0;

    mainSlot.innerHTML = `
      <div class="vacancies-layout">
        <section class="vac-list-pane">
          <div class="vac-list-toolbar">
            <label class="vac-search-box">
              <span class="material-symbols-outlined">search</span>
              <input type="text" data-role="vac-search" placeholder="Поиск" value="${escapeAttr(state.searchDraft || '')}">
              <button type="button" class="vac-search-clear${state.searchDraft ? '' : ' hidden'}" data-action="vac-search-clear" title="Очистить поиск">
                <span class="material-symbols-outlined">close</span>
              </button>
            </label>
            <button type="button" class="vac-toolbar-btn" data-action="vac-sort-toggle" title="Сортировка: ${escapeAttr(VAC_SORT_LABELS[state.sortBy] || VAC_SORT_LABELS.newest)}">
              <span class="material-symbols-outlined">swap_vert</span>
            </button>
            <button type="button" class="vac-toolbar-btn${filterActive ? ' active' : ''}" data-action="vac-filter-toggle" title="Фильтры">
              <span class="material-symbols-outlined">filter_list</span>
            </button>
            ${sortMenu}
            ${renderFilterPopover()}
          </div>
          <div class="vac-list">${listContent}</div>
        </section>
        <section class="vac-detail-pane">${renderVacDetail()}</section>
      </div>
      ${
        state.detail && state.rawModalOpen
          ? renderRawTextModal(state.detail)
          : ''
      }
      ${renderHrPicker()}
      ${renderCompanyPicker()}
    `;

    const newList = mainSlot.querySelector('.vac-list');
    if (newList && savedListScroll) newList.scrollTop = savedListScroll;
    const newDetail = mainSlot.querySelector('.vac-detail-pane');
    if (newDetail && savedDetailScroll) newDetail.scrollTop = savedDetailScroll;
    const newFilterBody = mainSlot.querySelector('.vac-filter-body');
    if (newFilterBody) {
      if (state.filterUi.scrollToBottom) {
        newFilterBody.scrollTop = newFilterBody.scrollHeight;
        state.filterUi.scrollToBottom = false;
      } else if (savedFilterScroll) {
        newFilterBody.scrollTop = savedFilterScroll;
      }
    }
    if (savedNotesFocus) {
      const newNotes = mainSlot.querySelector('.notes-area');
      if (newNotes) {
        newNotes.focus();
        try {
          newNotes.setSelectionRange(savedNotesFocus.selStart, savedNotesFocus.selEnd);
        } catch (_) { /* selectionStart/End can throw on detached nodes */ }
      }
    }
    if (savedPickerFocus) {
      const sel = `[data-role="${savedPickerFocus.role}"]`;
      const el = mainSlot.querySelector(sel);
      if (el) {
        el.focus();
        try {
          el.setSelectionRange(savedPickerFocus.selStart ?? el.value.length,
                               savedPickerFocus.selEnd ?? el.value.length);
        } catch (_) { /* selectionRange throws on number/checkbox; safe to ignore */ }
      }
    }
    attachVacRowClickHandlers();
    attachVacListToolbarHandlers();
    attachVacListScrollHandler();
    attachVacDetailHandlers();
    attachHrPickerHandlers();
    attachCompanyPickerHandlers();
    // Match the raw-text modal specifically (not the picker backdrops, which
    // share the .modal-backdrop class) so its handlers don't double-bind to
    // the wrong modal when multiple are technically open at once.
    const rawBackdrop = mainSlot.querySelector('.vac-raw-modal')?.closest('.modal-backdrop');
    const rawModal = rawBackdrop || null;
    if (rawModal) {
      // Background re-renders (poll cycles, status saves) replace the modal's
      // DOM via innerHTML wipe and would scroll the body back to the top. Save
      // scrollTop on user scroll, restore it after each render.
      const rawBody = rawModal.querySelector('.modal-body');
      if (rawBody) {
        if (state.rawModalScrollTop != null) {
          rawBody.scrollTop = state.rawModalScrollTop;
        }
        rawBody.addEventListener('scroll', () => {
          state.rawModalScrollTop = rawBody.scrollTop;
        });
      }
      rawModal.querySelectorAll('[data-action="raw-close"]').forEach((el) => {
        el.addEventListener('click', (e) => {
          e.preventDefault();
          closeRawModal();
          renderSection();
        });
      });
      const copyBtn = rawModal.querySelector('[data-action="raw-copy"]');
      if (copyBtn) {
        copyBtn.addEventListener('click', async (e) => {
          e.preventDefault();
          e.stopPropagation();
          const rawText = (state.detail && state.detail.raw_text) || '';
          if (!rawText) {
            showToast('Нечего копировать');
            return;
          }
          const okToast   = () => showToast('Скопировано');
          const failToast = () => showToast('Не удалось скопировать');
          // QWebChannel оборачивает @Slot в объект, и `typeof` не всегда
          // возвращает 'function'. Проверяем просто на наличие — если
          // вызов кинет TypeError, перехватим в catch.
          if (api && api.copy_to_clipboard) {
            try {
              api.copy_to_clipboard(rawText);
              okToast();
              return;
            } catch (_) { /* пробуем браузерные API ниже */ }
          }
          try {
            await navigator.clipboard.writeText(rawText);
            okToast();
          } catch (_) {
            try {
              const ta = document.createElement('textarea');
              ta.value = rawText;
              ta.setAttribute('readonly', '');
              ta.style.position = 'fixed';
              ta.style.left = '-9999px';
              document.body.appendChild(ta);
              ta.select();
              const ok = document.execCommand('copy');
              document.body.removeChild(ta);
              if (ok) okToast();
              else failToast();
            } catch {
              failToast();
            }
          }
        });
      }
      const rerunBtn = rawModal.querySelector('[data-action="raw-rerun"]');
      if (rerunBtn) {
        rerunBtn.addEventListener('click', (e) => {
          e.preventDefault();
          const id = appState.vacancies.selectedId;
          if (id == null || !api) return;
          closeRawModal();
          api.rerun_vacancy_pipeline(JSON.stringify({ vacancy_id: id }));
          renderSection();
        });
      }
    }
  }

  function onVacancyDetailChanged(payload) {
    let p;
    try { p = JSON.parse(payload); } catch { return; }
    if (!p.ok) {
      console.error('vacancy detail load failed:', p.error);
      showToast(p.error || 'Не удалось загрузить вакансию');
      // Clear stale selection if the row was deleted underneath us.
      if (p.id != null && appState.vacancies.selectedId === p.id) {
        resetNotesEditor();
        resetStatusEditor();
        closeHrPicker();
        closeCompanyPicker();
        appState.vacancies.selectedId = null;
        appState.vacancies.detail = null;
        appState.vacancies.detailLoading = false;
        if (appState.section === 'vacancies') renderSection();
      }
      return;
    }
    // Drop stale responses: rapid clicks A → B can have A's reply arrive
    // after B's. Apply only if the row that's currently selected matches
    // the payload — otherwise the user is no longer looking at this one.
    const incomingId = p.vacancy && p.vacancy.id;
    if (incomingId !== appState.vacancies.selectedId) return;
    appState.vacancies.detail = p.vacancy;
    appState.vacancies.detailLoading = false;
    // Slice 5: adopt the server's notes as the save-baseline ONLY when the
    // user has nothing in flight. If they're typing (notesDraft != null),
    // their optimistic value wins until the next save round-trip.
    if (appState.vacancies.notesDraft == null) {
      appState.vacancies.notesLastSaved = p.vacancy.notes ?? '';
    }
    if (appState.section === 'vacancies') renderSection();
  }

  function onVacanciesChanged(payload) {
    // Cheap dedupe: the polling timer fires every few seconds; skip the
    // re-render when the payload is byte-identical to the previous one.
    // BUT only when we were already showing the list — otherwise a
    // re-entry from another section (which resets `loaded=false`) would
    // get stuck on "Загрузка…" if the DB hasn't changed since last visit.
    const dupe = (payload === appState.vacancies._lastPayload);
    appState.vacancies._lastPayload = payload;

    let p;
    try { p = JSON.parse(payload); } catch { return; }
    const st = appState.vacancies;
    // Epoch guard. Любой ответ со stale значением (предыдущий append, чей
    // запрос пользователь уже обогнал сменой фильтра/сорта) дропаем целиком —
    // не трогаем ни allList, ни флаги. Текущий цикл (replacing/loadingMore)
    // продолжит ждать матчующий ответ.
    const incomingEpoch = Number.isFinite(p.epoch) ? p.epoch : null;
    if (incomingEpoch != null && incomingEpoch < (st.requestEpoch || 0)) return;
    if (!p.ok) {
      console.error('vacancies load failed:', p.error);
      // Polling гонит этот хендлер каждые 5 сек: если бэкенд стабильно
      // отвечает ошибкой, toast'им только при смене текста, чтобы не
      // спамить стопкой одинаковых тостов раз в 5 секунд.
      const errKey = p.error || '__nomsg__';
      if (st._lastErrorKey !== errKey) {
        showToast(p.error || 'Не удалось загрузить список вакансий');
        st._lastErrorKey = errKey;
      }
      st.allList = [];
      st.list = [];
      st.loaded = true;
      st.hasMore = false;
      st.loadingMore = false;
      st.replacing = false;
      if (appState.section === 'vacancies') renderSection();
      return;
    }
    st._lastErrorKey = null;
    const incomingMode = p.mode || 'replace';
    const newRows = (p.vacancies || []).map(transformVacancyForList);
    if (incomingMode === 'append') {
      // Отфильтровываем дубликаты по id — на границе страниц при insert/delete
      // в бэк-данных смежные offset'ы могут перекрываться на одну строку.
      const known = new Set(st.allList.map((v) => v.id));
      const filtered = newRows.filter((v) => !known.has(v.id));
      st.allList = st.allList.concat(filtered);
      st.loadingMore = false;
    } else {
      st.allList = newRows;
      st.replacing = false;
      // Свежий replace/refresh инвалидирует любой ещё-не-прилетевший append
      // (его epoch уже устарел и он будет дропнут выше) — гасим флаг,
      // чтобы scroll-handler смог инициировать новую дозагрузку.
      st.loadingMore = false;
    }
    st.hasMore = !!p.has_more;
    if (typeof p.score_threshold === 'number') {
      st.scoreThreshold = p.score_threshold;
    }
    if (p.filter_options && typeof p.filter_options === 'object') {
      appState.vacancies.filterOptions = {
        channels: Array.isArray(p.filter_options.channels) ? p.filter_options.channels.slice() : [],
        companies: Array.isArray(p.filter_options.companies) ? p.filter_options.companies.slice() : [],
      };
    }
    applyVacancyView();
    const wasAlreadyLoaded = appState.vacancies.loaded;
    appState.vacancies.loaded = true;
    // Сознательно НЕ сбрасываем выделение, если выбранная строка пропала
    // из текущего среза списка: replace-ответы прилетают и при смене
    // фильтра/поиска/сортировки, и тогда строка просто отфильтрована, а не
    // удалена. Master/detail-UI (Gmail, Linear) ведут себя так же — деталь-
    // панель остаётся. Реальное удаление обрабатывается явно: своя кнопка
    // delete (см. onVacancyActionDone) и фейл следующего действия по строке
    // (notes/status/detail) — там уже есть toast и точечный сброс.
    if (dupe && wasAlreadyLoaded) return;
    if (appState.section === 'vacancies') renderSection();
  }

  function onVacancyNotesSaved(payload) {
    let p;
    try { p = JSON.parse(payload); } catch { return; }
    if (!p.ok) {
      console.error('vacancy notes save failed:', p.error);
      showToast(p.error || 'Не удалось сохранить заметку');
      return;
    }
    // Ignore late replies for a vacancy the user has already swapped away
    // from — the new selection has its own notesLastSaved baseline.
    if (p.vacancy_id !== appState.vacancies.selectedId) return;
    // Adopt the value the BACKEND just confirmed as our save-baseline (echoed
    // in p.notes — DB-normalized: whitespace-only → null). DO NOT use the
    // current notesDraft here: if the user typed anything between sending
    // this save and receiving the reply, draft is now ahead of what we sent,
    // and using draft as baseline would mark those new characters as
    // "already saved" and drop them on the next debounce. (Reviewer caught
    // this — silent data loss on every burst of typing.)
    appState.vacancies.notesLastSaved = p.notes ?? '';
    // 400ms green border flash on the textarea (§3.8). The flash class adds
    // border-color: var(--accent); the .notes-area transition (0.4s) handles
    // the fade-out automatically once the class is removed.
    const ta = mainSlot.querySelector('.vac-detail-pane .notes-area');

  function onVacancyStatusSaved(payload) {

  function onVacancyHistoryExplanationSaved(payload) {
    let p;
    try { p = JSON.parse(payload); } catch { return; }
    if (!p) return;
    if (!p.ok) {
      console.error('history explanation save failed:', p.error);
      showToast(p.error || 'Не удалось сохранить комментарий');
      return;
    }
    const st = appState.vacancies;
    const id = p.history_id;
    if (id == null) return;
    const drafts = st.historyExplanationDrafts || {};
    const draftVal = Object.prototype.hasOwnProperty.call(drafts, id) ? drafts[id] : null;
    const savedVal = (p.explanation == null) ? '' : String(p.explanation);
    // Drop draft если saved-value совпадает с тем, что в textarea — больше
    // не нужно держать локальный override. Иначе оставляем (юзер дописал
    // ещё что-то после отправки).
    if (draftVal != null && draftVal === savedVal) {
      delete drafts[id];
    }
    // Sync local detail.history[i].explanation, чтобы следующий re-render
    // подхватил canonical value (если drop'нули draft).
    if (st.detail && Array.isArray(st.detail.history)) {
      const row = st.detail.history.find(h => h.id === id);
      if (row) row.explanation = p.explanation == null ? null : String(p.explanation);
    }
    // Visual flash акцентом — без re-render'а, чтобы не сбить фокус.
    const ta = mainSlot.querySelector(`textarea[data-role="tl-explanation"][data-history-id="${id}"]`);
    if (ta) {

  function onHrPickerLoaded(payloadJson) {

    try { p = JSON.parse(payloadJson); } catch { return; }
    const st = appState.vacancies;
    if (!st.hrPicker.open) return;

      // Создание упало (валидация / уник-конфликт): остаёмся в форме,

      // «Связать» не пыталось линковать невидимую строку.
      const stillThere = st.hrPicker.list.some(r => r.id === st.hrPicker.selectedId);

  // Real-time refresh для вкладки «Вакансии» — push-сигнал
  // `vacancies_list_changed` приходит от бэка после каждого commit'а,
  // меняющего Vacancy (parse, delete, DM-classifier). Заменяет старый
  // 5-сек setInterval, который сжигал LLM/DB на простое. Debounce 200мс,
  // чтобы burst push'ей в начале цикла не превратился в N re-fetch'ей.
  function onVacanciesListChanged() {
    if (_onVacanciesListChangedTimer) clearTimeout(_onVacanciesListChangedTimer);
    _onVacanciesListChangedTimer = setTimeout(() => {
      _onVacanciesListChangedTimer = null;
      if (appState.section === 'vacancies' && api) {
        api.request_vacancies(buildVacanciesQuery({ mode: 'refresh' }));
      } else if (appState.vacancies) {
        // Не на вкладке — пометим как stale, при следующем открытии
        // секции запрос свежих данных уже сидит в applySectionSwitch.
        appState.vacancies.loaded = false;
      }
    }, PUSH_DEBOUNCE_MS);
  }
  // Совместимость со старыми вызовами стартёра/стоппера таймера в
  // applySectionSwitch — теперь noop, обновление push'ом.
  function startVacanciesRefreshTimer() {}
  function stopVacanciesRefreshTimer() {}

  // === Contacts / HR (05) — slice 1: live list-pane =====================

  function hrInitials(hr) {
    return hr.name
      ? hr.name.trim().split(/\s+/).map(s => s[0]).slice(0, 2).join('').toUpperCase()
      : '?';
  }

  const CONTACTS_HR_PAGE_SIZE = 30;

  function requestContactsHrList(opts) {
    if (!api) return;
    const st = appState.contacts.hr;
    const mode = (opts && opts.mode) || 'replace';
    if (mode === 'append') {
      st.loadingMore = true;
    } else {
      st.requestEpoch = (st.requestEpoch || 0) + 1;
      st.replacing = true;
    }
    let offset, limit;
    if (mode === 'append') {
      offset = st.list.length;
      limit = CONTACTS_HR_PAGE_SIZE;
    } else if (mode === 'refresh') {
      offset = 0;
      limit = Math.min(200, Math.max(CONTACTS_HR_PAGE_SIZE, st.list.length || CONTACTS_HR_PAGE_SIZE));
    } else {
      offset = 0;
      limit = CONTACTS_HR_PAGE_SIZE;
    }
    api.request_contacts_hr_list(JSON.stringify({
      search: st.searchDraft || '',
      mode,
      offset,
      limit,
      epoch: st.requestEpoch,
    }));
  }

  function onContactsHrListLoaded(payload) {
    let p;
    try { p = JSON.parse(payload); } catch { return; }
    if (!p) return;
    const st = appState.contacts.hr;
    // Backend error path — clear in-flight flags or scroll-trigger / search
    // re-fire are gated forever (vacancies' equivalent does the same).
    if (!p.ok) {
      st.replacing = false;
      st.loadingMore = false;
      st.hasMore = false;
      st.loaded = true;
      return;
    }
    // Drop stale epoch (filter/search/sort changed mid-flight).
    if (p.epoch != null && p.epoch !== st.requestEpoch) return;
    const mode = p.mode || 'replace';
    const newRows = (p.hrs || []).map(h => ({
      id: h.id,
      name: h.name,
      username: h.telegram_username,
      company: h.last_company_name,
      vacCount: h.vacancy_count,
      unread: h.unread_count || 0,
      blacklisted: !!h.is_blacklisted,
      avatar: h.avatar || null,
    }));
    if (mode === 'append') {
      // Dedup by id — concurrent appends/refreshes can produce overlapping
      // offsets when rows shift between requests.
      const known = new Set(st.list.map(r => r.id));
      st.list = st.list.concat(newRows.filter(r => !known.has(r.id)));
      st.loadingMore = false;
    } else {
      // replace / refresh — wipe and load.
      st.list = newRows;
      st.replacing = false;
      st.loadingMore = false;
    }
    st.loaded = true;
    st.search = p.search || '';
    st.hasMore = !!p.has_more;
    if (appState.section === 'contacts' && appState.contacts.tab === 'hr') {
      renderSection();
    }
  }

  function requestContactsHrDetail(hrId) {
    if (!api || hrId == null) return;

    st.detailFor = hrId;
    st.detailLoading = true;

    mp.open = false;

    mp.search = '';

    mp.saving = false;

  function onContactsHrMergePickerLoaded(payload) {

  function requestContactsHrVacancies(hrId) {

    st.vacanciesFor = hrId;
    st.vacanciesLoading = true;
    api.request_contacts_hr_vacancies(hrId);
  }

  function onContactsHrVacanciesLoaded(payload) {
    let p;
    try { p = JSON.parse(payload); } catch { return; }
    if (!p || !p.ok) return;
    const st = appState.contacts.hr;
    if (p.hr_id !== st.vacanciesFor) return;  // stale
    st.vacancies = (p.vacancies || []).map(v => ({
      id: v.id,
      title: v.title,

      createdAt: v.created_at ? new Date(v.created_at) : null,

  function requestContactsHrMessages(hrId, opts) {
    if (!api || hrId == null) return;
    const st = appState.contacts.hr;
    const mode = (opts && opts.mode) || 'tail';
    if (mode === 'tail') {
      st.messagesFor = hrId;
      st.messagesLoading = true;
      st.olderLoading = false;
      st.scrollToFirstUnread = true;
      st.messagesEpoch += 1;
    } else if (mode === 'older') {
      if (st.olderLoading || !st.hasMoreOlder) return;
      st.olderLoading = true;
    }
    api.request_contacts_hr_messages(JSON.stringify({
      hr_id: hrId,
      mode,
      epoch: st.messagesEpoch,
      before_id: mode === 'older' ? (st.oldestLoadedId || null) : null,
      // Composite-cursor: catch-up может бэкаппить старые DM-ы офлайн-периода
      // ПОСЛЕ ингеста live-сообщений, тогда у "более старого по времени"
      // ряда id выше, и `id < before_id` либо пропускает строки, либо даёт
      // дубли. Шлём ещё `sent_at` оldest-загруженного — бэк сравнивает по
      // паре (sent_at, id).
      before_sent_at: mode === 'older' && st.oldestLoadedSentAt
        ? st.oldestLoadedSentAt.toISOString()
        : null,
    }));
  }

  // Trailing-edge debounce для read-receipt'ов: HR открывая чат может
  // мгновенно прочитать пачку наших старых исходящих → 10 receipt'ов
  // за миллисекунду. Без debounce — 10 renderSection'ов и 10 пересборок
  // st.messages copy-on-write'ом. Накапливаем maxId, применяем один раз.
  let _onReadReceiptTimer = null;
  const _onReadReceiptPending = new Map(); // hrId → maxTgId
  function onContactsHrReadReceipt(p) {
    if (!p || !p.ok) return;
    const hrId = Number(p.hr_id);
    const maxId = Number(p.max_tg_id);
    if (!Number.isFinite(hrId) || !Number.isFinite(maxId)) return;
    const prev = _onReadReceiptPending.get(hrId);
    if (prev == null || maxId > prev) {
      _onReadReceiptPending.set(hrId, maxId);
    }
    if (_onReadReceiptTimer) clearTimeout(_onReadReceiptTimer);
    _onReadReceiptTimer = setTimeout(() => {
      _onReadReceiptTimer = null;
      const pending = new Map(_onReadReceiptPending);
      _onReadReceiptPending.clear();
      _flushReadReceipts(pending);
    }, PUSH_DEBOUNCE_MS);
  }

  function _flushReadReceipts(pending) {
    const st = appState.contacts.hr;
    const maxId = pending.get(st.messagesFor);
    if (maxId == null || !st.messages.length) return;
    const now = new Date();
    let touched = false;
    // Копируем message-объекты перед мутацией (frontend review M5):
    // если кто-то ещё держит ссылку на тот же объект, они не увидят
    // неконсистентного сдвига. Сегодня других ссылок нет, но защита
    // почти бесплатна.
    const next = st.messages.map(m => {
      if (m.incoming || m.readAt) return m;
      if (m.tgMessageId == null || m.tgMessageId > maxId) return m;
      touched = true;
      return { ...m, readAt: now };
    });
    if (!touched) return;
    st.messages = next;
    if (appState.section === 'contacts' && appState.contacts.tab === 'hr') {
      renderSection();
    }
  }

  // Trailing-edge debounce для двух push-сигналов про DM: и
  // «новое сообщение пришло», и «HR прочитал N сообщений сразу» при
  // burst'е улетают пачкой. Без debounce каждый дёргал re-fetch
  // detail+messages, в результате — N последовательных round-trip'ов
  // в БД на одного юзера. 200мс схлопывает burst в один re-fetch.
  let _onMessagesArrivedTimer = null;
  let _onMessagesArrivedHrId = null;
  function onContactsHrMessagesArrived(payload) {
    let p;
    try { p = JSON.parse(payload); } catch { return; }
    if (!p || !p.ok) return;
    const hrId = Number(p.hr_id);
    if (!Number.isFinite(hrId)) return;
    _onMessagesArrivedHrId = hrId;
    if (_onMessagesArrivedTimer) clearTimeout(_onMessagesArrivedTimer);
    _onMessagesArrivedTimer = setTimeout(() => {
      _onMessagesArrivedTimer = null;
      const id = _onMessagesArrivedHrId;
      _onMessagesArrivedHrId = null;
      // List + detail — cheap refreshes; bump unread bubble в row и
      // head chip даже если юзер на другом HR.
      requestContactsHrList({ mode: 'refresh' });
      if (id != null && appState.contacts.selectedHrId === id) {
        const st = appState.contacts.hr;
        st.markReadFor = null;
        if (st.markReadTimer) { clearTimeout(st.markReadTimer); st.markReadTimer = null; }
        requestContactsHrDetail(id);
        requestContactsHrMessages(id);
      }
    }, PUSH_DEBOUNCE_MS);
  }

  function onContactsHrMessagesLoaded(payload) {
    let p;
    try { p = JSON.parse(payload); } catch { return; }
    const st = appState.contacts.hr;
    if (!p || !p.ok) {
      if (p && p.hr_id === st.messagesFor) {
        st.messagesLoading = false;
        st.olderLoading = false;
      }
      return;
    }
    if (p.hr_id !== st.messagesFor) return;  // stale (different HR)
    // Stale-epoch guard для ОБЕИХ веток. Tail-запросы бампят messagesEpoch;
    // ответ со старой эпохой — это либо предыдущий tail (новый уже летит,
    // его и ждём), либо older, прилетевший после сбрасывающего tail-реквеста.
    // В обоих случаях надо дропнуть, чтобы не затереть свежее состояние.
    if (p.epoch !== st.messagesEpoch) {
      if (p.mode === 'older') st.olderLoading = false;
      return;
    }
    const mapped = (p.messages || []).map(m => ({
      id: m.id,
      tgMessageId: m.tg_message_id,
      incoming: !!m.is_incoming,
      text: m.text,
      sentAt: m.sent_at ? new Date(m.sent_at) : null,
      readAt: m.read_at ? new Date(m.read_at) : null,
      edited: !!m.is_edited,
      deleted: !!m.is_deleted,
      mediaKind: m.media_kind || null,
      mediaPath: m.media_path || null,
      mediaName: m.media_name || null,
    }));
    if (p.mode === 'older') {
      // Older page: prepend, preserve viewport so the user's reading
      // position doesn't jump.
      st.olderLoading = false;
      st.hasMoreOlder = !!p.has_more;
      const chatBody = mainSlot.querySelector('[data-role="cnt-chat-body"]');
      const prevH = chatBody ? chatBody.scrollHeight : 0;
      const prevT = chatBody ? chatBody.scrollTop : 0;
      st.messages = [...mapped, ...st.messages];
      if (mapped.length) {
        st.oldestLoadedId = mapped[0].id;
        st.oldestLoadedSentAt = mapped[0].sentAt;
      }
      if (appState.section === 'contacts' && appState.contacts.tab === 'hr') {
        renderSection();
        const newBody = mainSlot.querySelector('[data-role="cnt-chat-body"]');
        if (newBody) newBody.scrollTop = newBody.scrollHeight - prevH + prevT;
      }
      return;
    }
    st.messages = mapped;
    st.messagesLoading = false;
    st.hasMoreOlder = !!p.has_more;
    st.oldestLoadedId = mapped.length ? mapped[0].id : null;
    st.oldestLoadedSentAt = mapped.length ? mapped[0].sentAt : null;
    if (appState.section === 'contacts' && appState.contacts.tab === 'hr') {
      renderSection();
    }
  }

  function maybeMarkChatRead() {
    const st = appState.contacts.hr;
    if (!st.detail || st.detail.unread <= 0) return;
    if (appState.contacts.selectedHrId !== st.detail.id) return;
    if (appState.section !== 'contacts' || appState.contacts.tab !== 'hr') return;
    const hrId = st.detail.id;
    if (st.markReadFor === hrId) return;  // already triggered for this load
    st.markReadFor = hrId;
    if (st.markReadTimer) clearTimeout(st.markReadTimer);
    st.markReadTimer = setTimeout(() => {
      st.markReadTimer = null;
      if (api) api.contacts_mark_hr_read(hrId);
    }, 800);
  }

  function onContactsHrDetailLoaded(payload) {
    let p;
    try { p = JSON.parse(payload); } catch { return; }
    const st = appState.contacts.hr;
    if (!p) return;
    if (!p.ok) {
      // Stale row on server (deleted in another tab) — clear selection.
      if (p.hr_id != null && p.hr_id === st.detailFor) {
        st.detail = null;
        st.detailLoading = false;
      }
      return;
    }
    // Drop stale: user clicked another row mid-flight.
    if (p.hr_id !== st.detailFor) return;
    st.detail = {
      id: p.hr_id,
      name: p.name,
      username: p.telegram_username,
      telegramUserId: p.telegram_user_id,
      notes: p.notes,
      vacCount: p.vacancy_count,
      lastCompanyId: p.last_company_id,
      lastCompanyName: p.last_company_name,
      unread: p.unread_count,
      blacklistValue: p.blacklist_value || null,
      avatar: p.avatar || null,
    };
    // Notes sync: if the server now reflects exactly what the local draft
    // holds, drop the draft so future edits start from the canonical value.
    // If the draft is ahead (user typed more after the save fired), leave
    // it alone — the next debounce tick will catch up.
    if (st.notesFor === p.hr_id && (st.notesDraft || '') === (p.notes || '')) {
      st.notesFor = null;
      st.notesDraft = '';
    }
    st.detailLoading = false;
    if (appState.section === 'contacts' && appState.contacts.tab === 'hr') {
      renderSection();
    }
    maybeMarkChatRead();
  }

  function onContactsHrActionDone(payload) {
    let p;
    try { p = JSON.parse(payload); } catch { return; }
    if (!p) return;
    const addModal = appState.contacts.hr.addModal;
    // Failure path. Errors carry an `action` field for chat sends so we
    // can clear the in-flight flag and re-enable the input. Other errors
    // route by «is the create modal mid-save?» — its dedicated red text.
    // Anything else surfaces as a toast.
    if (!p.ok) {
      if (p.action === 'send_message' || p.action === 'send_media') {
        const st = appState.contacts.hr;
        const erroredHr = Number(p.hr_id);
        if (
          p.action === 'send_message'
          && Number.isFinite(erroredHr)
          && st.chatSendingFor === erroredHr
        ) {
          st.chatSendingFor = null;
        }
        if (typeof showToast === 'function') showToast(p.error || 'Не удалось отправить.');
        if (appState.section === 'contacts' && appState.contacts.tab === 'hr') {
          renderSection();
        }
      } else if (p.action === 'merge_hr') {
        const mp = appState.contacts.hr.mergePicker;
        mp.saving = false;
        if (typeof showToast === 'function') showToast(p.error || 'Не удалось слить.');
        if (appState.section === 'contacts' && appState.contacts.tab === 'hr') {
          renderSection();
        }
      } else if (addModal.open && addModal.saving) {
        addModal.saving = false;
        addModal.error = p.error || 'Не удалось сохранить.';
        if (appState.section === 'contacts' && appState.contacts.tab === 'hr') {
          renderSection();
        }
      } else if (typeof showToast === 'function') {
        showToast(p.error || 'Ошибка');
      }
      return;
    }
    if (p.action === 'create_hr') {
      addModal.saving = false;
      addModal.open = false;
      addModal.error = null;
      addModal.draft = { name: '', telegram_username: '', telegram_user_id: '', notes: '' };
      if (p.created_id != null) {
        appState.contacts.selectedHrId = Number(p.created_id);
      }
      // Clear any active search filter so the new HR is guaranteed to show
      // up in the list — otherwise a non-matching name leaves the user
      // staring at an unchanged list while the detail pane jumps to a new id.
      appState.contacts.hr.searchDraft = '';
      appState.contacts.hr.search = '';
      requestContactsHrList();
    } else if (p.action === 'update_hr') {
      // Detail re-fetch is for canonicalised values (e.g. stripped «@»).
      // Skip on notes-only updates so a name/@username input the user is
      // mid-typing in doesn't get clobbered by the re-render.
      const id = Number(p.hr_id);
      const fields = Array.isArray(p.fields) ? p.fields : [];
      const needsDetailReload = fields.some(f => f === 'name' || f === 'telegram_username');
      if (needsDetailReload && Number.isFinite(id)) requestContactsHrDetail(id);
      const listVisible = fields.some(f => f === 'name' || f === 'telegram_username');
      if (listVisible) requestContactsHrList({ mode: 'refresh' });
      // Same green-border flash as vacancies notes save, when notes were
      // among the saved fields. CSS class is shared (.notes-area.saved-flash).
      if (Array.isArray(p.fields) && p.fields.includes('notes')) {
        const ta = mainSlot.querySelector('[data-role="cnt-hr-notes"]');
        if (ta) {
          ta.classList.add('saved-flash');
          setTimeout(() => ta.classList.remove('saved-flash'), 400);
        }
      }
    } else if (p.action === 'mark_read') {
      // Drop the unread badge from the row + the chip in the head.
      const id = Number(p.hr_id);
      if (Number.isFinite(id)) requestContactsHrDetail(id);
      requestContactsHrList({ mode: 'refresh' });
    } else if (p.action === 'send_message') {
      // Clear draft + sending flag, force scroll-to-bottom so the user sees
      // their just-sent bubble, refetch chat history. Guard всё это по
      // hr_id из ack'а — если пользователь успел переключиться на другого HR,
      // то его черновик/скролл/фокус трогать нельзя; в актуальной чате
      // (если он не та же) ничего не меняем, только ребилд истории.
      const st = appState.contacts.hr;
      const ackHrId = Number(p.hr_id);
      if (Number.isFinite(ackHrId) && st.chatSendingFor === ackHrId) {
        st.chatSendingFor = null;
      }
      const isCurrent = (
        Number.isFinite(ackHrId)
        && appState.contacts.selectedHrId === ackHrId
      );
      // Чистим черновик отправленного сообщения ВСЕГДА, если он принадлежит
      // ack-HR — даже когда пользователь успел переключиться на другого:
      // иначе при возврате он увидит уже отправленный текст в инпуте.
      // chatScrollFor / chatScrollTop / chatInputFocus трогаем только
      // когда ack-HR == текущему — иначе мы бы аннулировали скролл и
      // фокус в чате, в котором пользователь сейчас активно работает.
      if (Number.isFinite(ackHrId) && st.chatDraftFor === ackHrId) {
        st.chatDraft = '';
        st.chatDraftFor = null;
      }
      if (isCurrent) {
        st.chatInputFocus = null;
        st.chatScrollFor = null;  // forces scroll-to-bottom on next render
        st.chatScrollTop = null;
      }
      if (Number.isFinite(ackHrId)) requestContactsHrMessages(ackHrId);
    } else if (p.action === 'send_media') {
      // Media-send ack — сброс scroll-якоря и refetch только если ack
      // относится к выбранному HR; никогда не трогаем chatDraft (paperclip
      // не блокирует ввод текста, пользователь мог одновременно печатать).
      const st = appState.contacts.hr;
      const ackHrId = Number(p.hr_id);
      const isCurrent = (
        Number.isFinite(ackHrId)
        && appState.contacts.selectedHrId === ackHrId
      );
      if (isCurrent) {
        st.chatScrollFor = null;
        st.chatScrollTop = null;
      }
      if (Number.isFinite(ackHrId)) requestContactsHrMessages(ackHrId);
    } else if (p.action === 'blacklist') {
      let msg;
      if (p.was_inactive) msg = `Возвращён в blacklist: ${p.value}`;
      else if (p.existed) msg = `Уже в blacklist: ${p.value}`;
      else msg = `Добавлен в blacklist: ${p.value}`;
      if (typeof showToast === 'function') showToast(msg);
      const id = Number(p.hr_id);
      if (Number.isFinite(id)) requestContactsHrDetail(id);
      requestContactsHrList({ mode: 'refresh' });
    } else if (p.action === 'unblacklist') {
      if (typeof showToast === 'function') {
        showToast(p.updated ? 'Убран из blacklist' : 'В blacklist не было');
      }
      const id = Number(p.hr_id);
      if (Number.isFinite(id)) requestContactsHrDetail(id);
      requestContactsHrList({ mode: 'refresh' });
    } else if (p.action === 'merge_hr') {
      const mp = appState.contacts.hr.mergePicker;
      mp.saving = false;
      closeContactsHrMergePicker();
      // Switch selection to the survivor — that's where all the data lives
      // now. Clear caches so the chat / vacancies / notes refetch.
      const survivor = Number(p.survivor_id);
      if (Number.isFinite(survivor)) {
        appState.contacts.selectedHrId = survivor;
        const st = appState.contacts.hr;
        st.detail = null;
        st.detailFor = null;
        st.messages = [];
        st.messagesFor = null;
        st.vacancies = [];
        st.vacanciesFor = null;
        // Cancel any in-flight notes debounce: the autosave's saveNow reads
        // st.notesFor at fire time and would otherwise silently drop the
        // user's last keystrokes once we null it below.
        if (st.notesSaveTimer) { clearTimeout(st.notesSaveTimer); st.notesSaveTimer = null; }
        st.notesDraft = '';
        st.notesFor = null;
      }
      requestContactsHrList({ mode: 'refresh' });
      if (typeof showToast === 'function') showToast('HR слиты');
    } else if (p.action === 'delete_hr') {
      // Drop selection + clear all per-HR caches; refresh list so the row
      // disappears immediately.
      const id = Number(p.hr_id);
      if (Number.isFinite(id) && appState.contacts.selectedHrId === id) {
        appState.contacts.selectedHrId = null;
        const st = appState.contacts.hr;
        st.detail = null;
        st.detailFor = null;
        st.messages = [];
        st.messagesFor = null;
        st.vacancies = [];
        st.vacanciesFor = null;
        // Cancel any in-flight notes debounce — see merge_hr branch above.
        if (st.notesSaveTimer) { clearTimeout(st.notesSaveTimer); st.notesSaveTimer = null; }
        st.notesDraft = '';
        st.notesFor = null;
      }
      requestContactsHrList({ mode: 'refresh' });
      if (typeof showToast === 'function') showToast('HR удалён');
    }
  }

  function renderContactsHrRow(hr) {
    const selected = appState.contacts.selectedHrId === hr.id;
    const initials = hrInitials(hr);
    const nameHtml = hr.name
      ? `<div class="cnt-hr-name">${escapeHtml(hr.name)}</div>`

    const companyHtml = hr.company
      ? `<span class="company">${escapeHtml(hr.company)}</span>`
      : `<span class="muted">без компании</span>`;
    const unreadHtml = hr.unread > 0
      ? `<span class="cnt-hr-unread">${hr.unread}</span>`
      : '';
    const blacklistHtml = hr.blacklisted
      ? `<span class="cnt-hr-bl" title="В blacklist"><span class="material-symbols-outlined">block</span></span>`

  // Short relative-time label for the HR vacancies mini-list. Returns
  // "только что" / "5 м" / "2 ч" / "3 д" / "2 нед" / "5 мес" / "2 года".
  function fmtShortAgo(d) {
    if (!d) return '';
    const diff = Math.max(0, (Date.now() - d.getTime()) / 1000);
    if (diff < 60) return 'только что';
    const m = Math.floor(diff / 60);
    if (m < 60) return `${m} м`;
    const h = Math.floor(m / 60);
    if (h < 24) return `${h} ч`;
    const days = Math.floor(h / 24);
    if (days < 14) return `${days} д`;
    if (days < 60) return `${Math.floor(days / 7)} нед`;
    if (days < 365) return `${Math.floor(days / 30)} мес`;
    return `${Math.floor(days / 365)} ${pluralRu(Math.floor(days / 365), 'год', 'года', 'лет')}`;
  }

  function renderContactsHrDetailVacancies(hr) {
    const st = appState.contacts.hr;
    if (st.vacanciesFor !== hr.id) {
      return `<div class="cnt-det-section"><div class="cnt-vacs-empty">Загрузка…</div></div>`;
    }
    if (!st.vacancies.length) {
      return `<div class="cnt-det-section"><div class="cnt-vacs-empty">Связанных вакансий нет.</div></div>`;
    }
    const rows = st.vacancies.map(v => {
      const cls = statusToClass(v.status || 'New');
      const score = (v.score == null) ? '' : `<span class="vac-mini-score">${v.score}</span>`;
      const when = v.createdAt ? fmtShortAgo(v.createdAt) : '';
      const title = v.title && v.title.trim() ? v.title : '— без названия —';
      return `
        <div class="vac-mini-row" data-action="cnt-open-vacancy" data-vacancy-id="${v.id}">
          <span class="status-dot ${cls}"></span>
          ${score}
          <span class="vac-mini-title">${escapeHtml(title)}</span>
          <span class="vac-mini-when">${escapeHtml(when)}</span>
        </div>
      `;
    }).join('');
    return `<div class="cnt-det-section"><div class="vacs-mini">${rows}</div></div>`;
  }

  function renderContactsHrDetailNotes(hr) {
    const st = appState.contacts.hr;
    // While the user is typing in this HR's notes field, prefer the local
    // draft so a background detail refresh (incoming msg, list reload)
    // doesn't wipe their in-flight edit.
    const value = (st.notesFor === hr.id) ? (st.notesDraft || '') : (hr.notes || '');
    return `
      <div class="cnt-det-section">
        <textarea class="notes-area" data-role="cnt-hr-notes" maxlength="2000" placeholder="Личные заметки по этому HR…">${escapeHtml(value)}</textarea>
      </div>
    `;
  }

  // Russian short-form day labels for chat-day separators.
  const CNT_MONTHS_RU = ['янв', 'фев', 'мар', 'апр', 'мая', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];

  function fmtChatDay(d) {
    const now = new Date();
    const sameDay = d.getFullYear() === now.getFullYear()
      && d.getMonth() === now.getMonth()
      && d.getDate() === now.getDate();
    if (sameDay) return 'Сегодня';
    const yest = new Date(now); yest.setDate(now.getDate() - 1);
    const isYest = d.getFullYear() === yest.getFullYear()
      && d.getMonth() === yest.getMonth()
      && d.getDate() === yest.getDate();
    if (isYest) return 'Вчера';
    const sameYear = d.getFullYear() === now.getFullYear();
    return sameYear
      ? `${d.getDate()} ${CNT_MONTHS_RU[d.getMonth()]}`
      : `${d.getDate()} ${CNT_MONTHS_RU[d.getMonth()]} ${d.getFullYear()}`;
  }

  function fmtChatTime(d) {
    return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
  }

  function renderContactsHrDetailChat(hr) {
    const st = appState.contacts.hr;
    let bodyHtml;
    if (st.messagesLoading && st.messages.length === 0) {
      bodyHtml = `<div class="cnt-chat-empty">Загрузка переписки…</div>`;
    } else if (st.messages.length === 0) {
      bodyHtml = `<div class="cnt-chat-empty">Переписки пока нет.</div>`;
    } else {
      let lastDayKey = null;
      const parts = [];
      const olderHint = st.olderLoading
        ? `<div class="cnt-chat-older">Загрузка…</div>`
        : (st.hasMoreOlder ? `<div class="cnt-chat-older" data-action="cnt-load-older">Загрузить старее</div>` : '');
      if (olderHint) parts.push(olderHint);
      for (const m of st.messages) {
        if (!m.sentAt) continue;
        const dayKey = `${m.sentAt.getFullYear()}-${m.sentAt.getMonth()}-${m.sentAt.getDate()}`;
        if (dayKey !== lastDayKey) {
          parts.push(`<div class="cnt-chat-day">${escapeHtml(fmtChatDay(m.sentAt))}</div>`);
          lastDayKey = dayKey;
        }
        const side = m.incoming ? 'them' : 'me';
        const marker = m.deleted
          ? ` <span class="cnt-bubble-edited">(удалено)</span>`
          : (m.edited ? ` <span class="cnt-bubble-edited">(изм.)</span>` : '');
        // Read receipt: outgoing rows only. ✓✓ when HR has read it
        // (read_at populated by UpdateReadHistoryOutbox), else single ✓.
        const tick = (!m.incoming && !m.deleted)
          ? ` <span class="cnt-bubble-tick${m.readAt ? ' read' : ''}">${m.readAt ? '✓✓' : '✓'}</span>`
          : '';
        const textCls = m.deleted ? 'cnt-bubble-text deleted' : 'cnt-bubble-text';
        let mediaHtml = '';
        const safePath = safeMediaHref(m.mediaPath);
        if (m.mediaKind === 'photo' && safePath) {
          mediaHtml = `<a class="cnt-bubble-photo" href="${escapeAttr(safePath)}" target="_blank" rel="noopener"><img src="${escapeAttr(safePath)}" alt="photo"></a>`;
        } else if (m.mediaKind === 'document' && safePath) {
          const name = m.mediaName || safePath.split(/[\\/]/).pop() || 'документ';
          mediaHtml = `<a class="cnt-bubble-doc" href="${escapeAttr(safePath)}" target="_blank" rel="noopener"><span class="material-symbols-outlined">description</span><span>${escapeHtml(name)}</span></a>`;
        } else if (m.mediaKind && !m.mediaPath) {
          mediaHtml = `<div class="cnt-bubble-text" style="color:var(--text-tertiary);font-style:italic;">[${m.mediaKind}]</div>`;
        }
        const textHtml = (m.text || '').length || !mediaHtml
          ? `<div class="${textCls}">${escapeHtml(m.text || '')}${marker}</div>`
          : (marker ? `<div class="${textCls}">${marker}</div>` : '');
        const unreadAttr = (m.incoming && !m.readAt && !m.deleted) ? ' data-unread="true"' : '';
        parts.push(`
          <div class="cnt-bubble ${side}${m.deleted ? ' deleted' : ''}"${unreadAttr}>
            <div class="cnt-bubble-content">
              ${mediaHtml}
              ${textHtml}
            </div>
            <div class="cnt-bubble-time">${escapeHtml(fmtChatTime(m.sentAt))}${tick}</div>
          </div>
        `);
      }
      bodyHtml = parts.join('');
    }

    // Send-input is enabled only when we have *something* to send to —
    // user_id (preferred) or username fallback. Otherwise the field stays
    // visible but disabled with a hint, so the user can see why.
    const isBlacklisted = !!hr.blacklistValue;
    const hasTgContact = !!(hr.telegramUserId || (hr.username && hr.username.trim()));
    const canSend = hasTgContact && !isBlacklisted;
    const draftFor = st.chatDraftFor === hr.id ? (st.chatDraft || '') : '';
    // Lock input while a send is in flight so the ack-handler's draft reset
    // can't race over a half-typed next message. Per-HR — отправка к другому
    // HR не должна блокировать ввод в этом чате.
    const sendingHere = (st.chatSendingFor === hr.id);
    const inputLocked = !canSend || sendingHere;
    const disabledAttr = inputLocked ? ' disabled' : '';
    let hint = '';
    if (isBlacklisted) {
      hint = `<div class="cnt-chat-disabled-hint">HR в blacklist (${escapeHtml(hr.blacklistValue)}) — переписка отключена</div>`;
    } else if (!hasTgContact) {
      hint = `<div class="cnt-chat-disabled-hint">Невозможно отправить — нет Telegram-контакта</div>`;
    }
    const sendDisabled = !canSend || sendingHere || !draftFor.trim();
    const attachDisabled = inputLocked;
    return `
      <div class="cnt-chat-section">
        <div class="cnt-chat-body" data-role="cnt-chat-body">${bodyHtml}</div>
        <div class="cnt-chat-input-area">
          <button type="button" class="cnt-chat-attach" data-action="cnt-chat-attach" title="Прикрепить файл"${attachDisabled ? ' disabled' : ''}>
            <span class="material-symbols-outlined">attach_file</span>
          </button>
          <textarea class="cnt-chat-input" data-role="cnt-chat-input" placeholder="${sendingHere ? 'Отправка…' : 'Сообщение…'}" rows="1"${disabledAttr}>${escapeHtml(draftFor)}</textarea>
          <button type="button" class="cnt-chat-send" data-action="cnt-chat-send" title="Отправить (Enter)"${sendDisabled ? ' disabled' : ''}>
            <span class="material-symbols-outlined">send</span>
          </button>
        </div>
        ${hint}
      </div>
    `;
  }

  function renderContactsHrDetail() {
    const st = appState.contacts.hr;
    if (appState.contacts.selectedHrId == null) {
      return `<div class="cnt-detail-empty">Выберите HR в списке слева</div>`;
    }
    if (st.detailLoading && (!st.detail || st.detail.id !== appState.contacts.selectedHrId)) {
      return `<div class="cnt-detail-empty">Загрузка…</div>`;
    }
    if (!st.detail || st.detail.id !== appState.contacts.selectedHrId) {
      return `<div class="cnt-detail-empty">HR не найден</div>`;
    }
    return renderContactsHrDetailHead(st.detail)
      + renderContactsHrDetailForm(st.detail)
      + renderContactsHrDetailChat(st.detail)
      + renderContactsHrDetailNotes(st.detail)
      + renderContactsHrDetailVacancies(st.detail);
  }

  function renderContactsHrMergePicker() {

    if (!p.open) return '';
    const body = renderPickerListBody({
      loading: p.loading,
      items: p.list,
      search: p.search,
      emptyText: 'Других HR-контактов нет',
      renderRow: r => renderHrPickerRow(r, null, p.selectedId, { action: 'cnt-merge-select' }),

    return renderPickerModal({
      prefix: 'cnt-merge',
      icon: 'merge',

      searchPlaceholder: 'Поиск по имени, @username...',

      body,
      applyAction: 'cnt-merge-apply',
      applyClass: 'danger',
      applyLabel: p.saving ? 'Сливаю…' : 'Слить',
      applyDisabled: p.saving || p.selectedId == null,

    if (!m.open) return '';
    const d = m.draft;

      || (!String(d.name || '').trim()

          <div class="modal-head">

            <div class="modal-title">Новый HR</div>
            <button type="button" class="modal-close" data-action="cnt-add-close" title="Закрыть" aria-label="Закрыть">
              <span class="material-symbols-outlined">close</span>

          <div class="picker-create-pane">

            <input type="text" data-role="cnt-add-username" maxlength="64" placeholder="Telegram @username (без @)" value="${escapeAttr(d.telegram_username || '')}">
            <input type="text" inputmode="numeric" data-role="cnt-add-user-id" maxlength="20" placeholder="telegram_user_id (опционально)" value="${escapeAttr(d.telegram_user_id || '')}">
            <textarea data-role="cnt-add-notes" maxlength="2000" placeholder="Заметки">${escapeHtml(d.notes || '')}</textarea>

      </div>

  function renderContactsHr() {
    const st = appState.contacts.hr;
    let listContent;
    if (!st.loaded) {
      listContent = `<div class="cnt-list-empty">Загрузка…</div>`;
    } else if (st.list.length === 0) {
      listContent = st.searchDraft
        ? `<div class="cnt-list-empty">Никого не найдено по запросу «${escapeHtml(st.searchDraft)}».</div>`
        : `<div class="cnt-list-empty">HR'ов пока нет.<br>Нажмите кнопку добавления вверху, чтобы создать первого.</div>`;

        <section class="cnt-list-pane">

              <input type="text" data-role="cnt-hr-search" placeholder="Поиск по имени, @username..." value="${escapeAttr(st.searchDraft || '')}">
              <button type="button" class="vac-search-clear${st.searchDraft ? '' : ' hidden'}" data-action="cnt-hr-search-clear" title="Очистить поиск">
                <span class="material-symbols-outlined">close</span>
              </button>
