  }

  function buildSkillsPayload() {
    return {
      skills: appState.skills
        .filter(s => s.name && s.name.trim())
        .map(s => ({
          id: typeof s.id === 'number' ? s.id : null,
          category: s.category,
          name: s.name.trim(),
          level: s.level,
          aliases: s.aliases,
        })),
    };
  }

  function saveSkillsNow() {
    if (!api) return;
    if (appState.skillsAutosaveTimer != null) {
      clearTimeout(appState.skillsAutosaveTimer);
      appState.skillsAutosaveTimer = null;
    }
    appState.saveError = '';
    api.save_skills(JSON.stringify(buildSkillsPayload()));
  }

  function scheduleSkillsAutosave() {
    if (appState.skillsAutosaveTimer != null) {
      clearTimeout(appState.skillsAutosaveTimer);
    }
    appState.skillsAutosaveTimer = setTimeout(() => {
      appState.skillsAutosaveTimer = null;
      saveSkillsNow();
    }, 800);
  }

  function wireProfileSkills() {
    if (!api) return;
    if (!appState.skillsLoaded) { api.request_skills(); return; }

    // markDirty просто помечает локальные правки — надо, чтобы серверный
    // request_skills (который мы инициируем после save) не перетёр стейт
    // до прихода save_done.
    const markDirty = () => { appState.dirty = true; };

    const findSkill = (el) => {
      const row = el.closest('.skill-row');
      if (!row) return null;
      const id = row.dataset.skillId;
      return appState.skills.find(s => String(s.id ?? '') === id) || null;
    };
    const findCat = (el) => {
      const sec = el.closest('.cat-section');
      return sec ? sec.dataset.cat : null;
    };

    // Skill name — input → debounce, blur → commit now.
    mainSlot.querySelectorAll('.skill-name-input').forEach(inp => {
      inp.addEventListener('input', () => {
        const s = findSkill(inp); if (!s) return;
        s.name = inp.value;
        markDirty();
        scheduleSkillsAutosave();
      });
      inp.addEventListener('blur', () => {
        if (!appState.dirty) return;
        saveSkillsNow();
      });
      inp.addEventListener('keydown', (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
          e.preventDefault();
          if (appState.dirty) saveSkillsNow();
        }
      });
    });
    // Level slider — input event непрерывный (тянем мышь), отдельно ждём
    // change, чтобы не лупить save_skills на каждом px движения слайдера.
    mainSlot.querySelectorAll('input[type=range].slider').forEach(sl => {
      sl.addEventListener('input', () => {
        const s = findSkill(sl); if (!s) return;
        s.level = parseInt(sl.value, 10) || 1;
        const pct = (s.level / 10) * 100;
        sl.style.setProperty('--pct', pct + '%');
        const num = sl.parentElement.querySelector('.level-num');
        if (num) num.textContent = s.level + '/10';
        markDirty();
      });
      sl.addEventListener('change', () => {
        if (!appState.dirty) return;
        saveSkillsNow();
      });
    });
    // Alias delete — структурное изменение, коммитим сразу.
    mainSlot.querySelectorAll('.aliases .x').forEach(x => {
      x.addEventListener('click', (e) => {
        e.stopPropagation();
        const s = findSkill(x); if (!s) return;
        const idx = parseInt(x.dataset.aliasIdx, 10);
        s.aliases.splice(idx, 1);
        markDirty();
        const aliases = x.closest('.aliases');
        aliases.innerHTML = renderAliases(s.aliases);
        wireAliasesIn(aliases, s);
        saveSkillsNow();
      });
    });
    // Alias add — wiring внутрь startAliasInput: коммитит при Enter/blur.
    mainSlot.querySelectorAll('.chip-add[data-action="alias-add"]').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const s = findSkill(btn); if (!s) return;
        const aliases = btn.closest('.aliases');
        startAliasInput(aliases, s, () => { markDirty(); saveSkillsNow(); });
      });
    });
    // Cat add (skill) — добавление пустой строки навыка не имеет name,
    // поэтому payload-фильтр saveSkillsPayload его всё равно не включит.
    // Сохранение выполнится в момент, когда пользователь введёт имя
    // навыка (input + blur). Здесь только локальный re-render.
    mainSlot.querySelectorAll('.cat-add[data-action="cat-add"]').forEach(btn => {
      btn.addEventListener('click', () => {
        const cat = findCat(btn); if (cat == null) return;
        const newId = '__new_' + Math.random().toString(36).slice(2, 8);
        const newSkill = { id: newId, category: cat, name: '', level: 5, aliases: [] };
        const lastIdx = lastIndexOf(appState.skills, s => s.category === cat);
        if (lastIdx >= 0) appState.skills.splice(lastIdx + 1, 0, newSkill);
        else appState.skills.push(newSkill);
        renderSection();
      });
    });
    // Cat delete — целиком убирает категорию и её навыки → коммит сразу.
    mainSlot.querySelectorAll('.cat-delete[data-action="cat-delete"]').forEach(btn => {
      btn.addEventListener('click', async () => {
        const cat = findCat(btn); if (cat == null) return;
        const ok = await showModal({
          type: 'confirm',
          message: `Удалить категорию «${cat}» и все её навыки?`,
          okLabel: 'Удалить',
          danger: true,
        });
        if (!ok) return;
        if (!appState.skills.some(s => s.category === cat)) return;
        appState.skills = appState.skills.filter(s => s.category !== cat);
        appState.collapsedCats.delete(cat);
        markDirty();
        renderSection();
        saveSkillsNow();
      });
    });
    // Cat collapse — чисто UI-стейт, ничего не сохраняем.
    mainSlot.querySelectorAll('[data-action="cat-toggle"]').forEach(btn => {
      btn.addEventListener('click', () => {
        const cat = findCat(btn); if (cat == null) return;
        if (appState.collapsedCats.has(cat)) appState.collapsedCats.delete(cat);
        else appState.collapsedCats.add(cat);
        renderSection();
      });
    });
    // Cat rename — change на input коммитит (срабатывает по blur/Enter).
    mainSlot.querySelectorAll('.cat-name-input').forEach(inp => {
      inp.addEventListener('change', () => {
        const oldCat = findCat(inp); if (oldCat == null) return;
        const newCat = inp.value.trim() || 'Общее';
        if (newCat === oldCat) return;
        appState.skills.forEach(s => { if (s.category === oldCat) s.category = newCat; });
        markDirty();
        renderSection();
        saveSkillsNow();
      });
    });
    // Skill delete — структурное, коммитим сразу.
    mainSlot.querySelectorAll('[data-action="skill-delete"]').forEach(btn => {
      btn.addEventListener('click', () => {
        const s = findSkill(btn); if (!s) return;
        appState.skills = appState.skills.filter(x => x !== s);
        markDirty();
        renderSection();
        saveSkillsNow();
      });
    });
    // Новая категория — показывает пустую секцию. Сохраним только когда
    // в неё добавят навык с непустым именем.
    const newCat = $('skills-new-cat');
    if (newCat) newCat.addEventListener('click', async () => {
      const name = await showModal({
        type: 'prompt',
        message: 'Название новой категории:',
        defaultValue: '',
        okLabel: 'Создать',
      });
      if (!name) return;
      const newId = '__new_' + Math.random().toString(36).slice(2, 8);
      appState.skills.push({ id: newId, category: name, name: '', level: 5, aliases: [] });
      renderSection();
    });
  }

  // wireAliasesIn / startAliasInput operate on any object with an `aliases`
  // array (skills, companies, …). Pass `onCommit` to hook into the host's
  // save mechanism; defaults to the skills' dirty+save for backward compat.
  function wireAliasesIn(container, s, onCommit) {
    const commit = onCommit || (() => {
      appState.dirty = true;
      saveSkillsNow();
    });
    container.querySelectorAll('.x').forEach(x => {
      x.addEventListener('click', (e) => {
        e.stopPropagation();
        const idx = parseInt(x.dataset.aliasIdx, 10);
        s.aliases.splice(idx, 1);
        container.innerHTML = renderAliases(s.aliases);
        wireAliasesIn(container, s, commit);
        commit();
      });
    });
    const addBtn = container.querySelector('[data-action="alias-add"]');
    if (addBtn) addBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      startAliasInput(container, s, commit);
    });
  }

  function startAliasInput(container, owner, onCommit) {
    const addBtn = container.querySelector('[data-action="alias-add"]');
    if (!addBtn) return;
    const input = document.createElement('input');
    input.className = 'chip-input';
    input.placeholder = 'alias…';
    input.maxLength = 64;
    addBtn.replaceWith(input);
    input.focus();
    const commit = (save) => {
      const v = input.value.trim();
      // Case-insensitive dedup so "NumPy" + "numpy" don't both pile up.
      const exists = owner.aliases.some(
        (a) => a.trim().toLowerCase() === v.toLowerCase()
      );
      if (save && v && !exists) { owner.aliases.push(v); onCommit(); }
      container.innerHTML = renderAliases(owner.aliases);
      wireAliasesIn(container, owner, onCommit);
    };
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); commit(true); }
      else if (e.key === 'Escape') { e.preventDefault(); commit(false); }
    });
    input.addEventListener('blur', () => commit(true));
  }

  function lastIndexOf(arr, pred) {
    for (let i = arr.length - 1; i >= 0; i--) if (pred(arr[i])) return i;
    return -1;
  }

  function pluralRu(n, one, few, many) {
    const m10 = n % 10, m100 = n % 100;
    if (m10 === 1 && m100 !== 11) return one;
    if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return few;
    return many;
  }

  function onSkillsChanged(payloadJson) {
    let r;
    try { r = JSON.parse(payloadJson); } catch { return; }
    if (!r.ok) return;
    // If the user has uncommitted edits since this fetch was scheduled,
    // applying server data would clobber them. Drop the reply.
    if (appState.section === 'profile' && appState.tab === 'skills' && appState.dirty) return;
    appState.skills = r.skills.map(s => ({ ...s, aliases: s.aliases || [] }));
    appState.skillsLoaded = true;
    if (appState.section === 'profile' && appState.tab === 'skills') renderSection();
  }

  function onSkillsSaveDone(payloadJson) {
    let r;
    try { r = JSON.parse(payloadJson); } catch { return; }
    if (!r.ok) {
      appState.saveError = r.error || 'не удалось сохранить';
      if (appState.section === 'profile' && appState.tab === 'skills') {
        renderSection();
      }
      return;
    }
    appState.dirty = false;
    appState.saveError = '';
    if (api) api.request_skills();
  }

  // ---- Profile / Experience ------------------------------------------

  function renderProfileExperience() {
    if (!appState.experienceLoaded) {
      return '<div class="placeholder-content">Загрузка…</div>';
    }
    const exps = appState.experience;
    const total = exps.length;
    const cardsHtml = exps.map((e, idx) => renderExpCard(e, idx)).join('');
    const errorRow = appState.saveError
      ? `<div class="autosave-error"><span class="save-status">${escapeHtml(appState.saveError)}</span></div>`
      : '';
    return `
      <div class="page-head">
        <div class="page-title">Профиль / Experience <span class="page-title-meta">${total} ${pluralRu(total, 'место','места','мест')} работы</span></div>
      </div>
      <div id="exp-list">${cardsHtml}</div>
      <div class="new-exp" id="exp-new">+ Добавить место работы</div>
      ${errorRow}
    `;
  }

  function renderExpCard(e, _idx) {
    const expanded = appState.expandedExp.has(e.id);
    const period = formatPeriod(e.start_date, e.end_date);
    const summaryParts = [];
    summaryParts.push(`<strong>${escapeHtml(e.company || 'Без названия')}</strong>`);
    if (e.role) summaryParts.push(`· <span class="role">${escapeHtml(e.role)}</span>`);
    if (period) summaryParts.push(`<span class="period">${escapeHtml(period)}</span>`);
    const body = expanded ? renderExpBody(e) : '';
    return `
      <div class="exp-card${expanded ? '' : ' collapsed'}" data-exp-id="${escapeAttr(e.id ?? '')}">
        <div class="exp-header" data-action="exp-toggle">
          <span class="material-symbols-outlined">expand_more</span>
          <div class="exp-summary">${summaryParts.join(' ')}</div>
          <span class="exp-delete" data-action="exp-delete" title="Удалить место работы"><span class="material-symbols-outlined">delete</span></span>
        </div>
        ${body ? `<div class="exp-body">${body}</div>` : ''}
      </div>
    `;
  }

  function renderExpBody(e) {
    const isCurrent = !e.end_date;
    return `
      <div class="field-row">
        <input class="input" data-field="company" maxlength="255" placeholder="Компания" value="${escapeAttr(e.company || '')}">
        <input class="input" data-field="company_url" maxlength="255" placeholder="URL компании" value="${escapeAttr(e.company_url || '')}">
        <input class="input span-2" data-field="role" maxlength="120" placeholder="Должность" value="${escapeAttr(e.role || '')}">
        <div class="date-pair span-2">
          <input type="text" class="input-date-text" data-field="start_date" placeholder="дд.мм.гггг" maxlength="10" value="${escapeAttr(isoToDmy(e.start_date))}">
          <span style="color: var(--text-tertiary)">—</span>
          <input type="text" class="input-date-text" data-field="end_date" placeholder="дд.мм.гггг" maxlength="10" value="${escapeAttr(isoToDmy(e.end_date))}"${isCurrent ? ' disabled' : ''}>
          <label class="date-current"><input type="checkbox" data-field="end_current"${isCurrent ? ' checked' : ''}>по настоящее время</label>
        </div>
      </div>
      ${renderListBlock(e, 'achievements', 'Достижения', 'Добавить достижение')}
      ${renderListBlock(e, 'responsibilities', 'Обязанности', 'Добавить обязанность')}
      <div class="list-block">
        <div class="field-label"><span>Стек</span></div>
        <div class="skills-block" data-field="skill_names">${renderExpSkills(e)}</div>
      </div>
    `;
  }

  function renderListBlock(e, field, label, addLabel) {
    const items = (e[field] || []).map((text, i) => `
      <div class="list-item" data-item-idx="${i}">
        <span class="list-bullet">•</span>
        <textarea class="list-input" rows="1" maxlength="250">${escapeHtml(text)}</textarea>
        <button class="icon-btn" data-action="list-delete" title="Удалить"><span class="material-symbols-outlined">close</span></button>
      </div>
    `).join('');
    return `
      <div class="list-block" data-field="${field}">
        <div class="field-label">
          <span>${label}</span>
          <span class="list-add" data-action="list-add"><span class="material-symbols-outlined">add</span>${addLabel}</span>
        </div>
        ${items}
      </div>
    `;
  }

  function renderExpSkills(e) {
    const chips = (e.skill_names || []).map((name, i) =>
      `<span class="chip">${escapeHtml(name)} <span class="x" data-skill-name="${escapeAttr(name)}">×</span></span>`
    ).join('');
    const pickerOpen = appState.pickerOpenFor === e.id;
    const picker = pickerOpen ? renderSkillPicker(e) : '';
    return chips + `<span class="chip-add" data-action="exp-add-skill">+ навык${picker}</span>`;
  }

  function renderSkillPicker(e) {
    const taken = new Set((e.skill_names || []).map(n => n.toLowerCase()));
    // Group skills_index by category
    const groups = [];
    const idx = new Map();
    for (const s of appState.skillsIndex) {
      const key = s.category || 'Общее';
      if (!idx.has(key)) { idx.set(key, groups.length); groups.push({ name: key, items: [] }); }
      groups[idx.get(key)].items.push(s);
    }
    if (!groups.length) {
      return `<div class="skill-picker"><div class="skill-picker-empty">Нет навыков. Добавьте в Skills.</div></div>`;
    }
    const list = groups.map(g => {
      const items = g.items.map(s => {
        const disabled = taken.has(s.name.toLowerCase());
        return `<div class="skill-picker-item${disabled ? ' disabled' : ''}" data-skill-name="${escapeAttr(s.name)}" data-search="${escapeAttr(s.name.toLowerCase())}"><span>${escapeHtml(s.name)}</span><span class="lvl">${s.level}</span></div>`;
      }).join('');
      return `<div class="skill-picker-cat">${escapeHtml(g.name)}</div>${items}`;
    }).join('');
    return `
      <div class="skill-picker" id="skill-picker-${escapeAttr(e.id)}" onclick="event.stopPropagation()">
        <div class="skill-picker-search">
          <span class="material-symbols-outlined">search</span>
          <input placeholder="Поиск навыка..." data-action="picker-search" maxlength="64">
        </div>
        <div class="skill-picker-list">${list}</div>
      </div>
    `;
  }

  function buildExperiencePayload() {
    return {
      experience: appState.experience.map(e => ({
        company: (e.company || '').trim(),
        company_url: ((e.company_url || '') + '').trim() || null,
        role: (e.role || '').trim(),
        start_date: e.start_date,
        end_date: e.end_date,
        achievements: (e.achievements || []).map(s => s.trim()).filter(Boolean),
        responsibilities: (e.responsibilities || []).map(s => s.trim()).filter(Boolean),
        skill_names: e.skill_names || [],
      })),
    };
  }

  function saveExperienceNow() {
    if (!api) return;
    if (appState.experienceAutosaveTimer != null) {
      clearTimeout(appState.experienceAutosaveTimer);
      appState.experienceAutosaveTimer = null;
    }
    appState.saveError = '';
    api.save_experience(JSON.stringify(buildExperiencePayload()));
  }

  function scheduleExperienceAutosave() {
    if (appState.experienceAutosaveTimer != null) {
      clearTimeout(appState.experienceAutosaveTimer);
    }
    appState.experienceAutosaveTimer = setTimeout(() => {
      appState.experienceAutosaveTimer = null;
      saveExperienceNow();
    }, 800);
  }

  function wireProfileExperience() {
    if (!api) return;
    if (!appState.experienceLoaded) { api.request_experience(); return; }

    // dirty всё ещё нужен — onExperienceChanged смотрит на него, чтобы
    // не перетереть локальный черновик пока save_done не пришёл.
    const markDirty = () => { appState.dirty = true; };
    const findExp = (el) => {
      const card = el.closest('.exp-card');
      if (!card) return null;
      const id = card.dataset.expId;
      return appState.experience.find(e => String(e.id ?? '') === id) || null;
    };

    // Card collapse — чисто UI, ничего не пишем.
    mainSlot.querySelectorAll('[data-action="exp-toggle"]').forEach(h => {
      h.addEventListener('click', (ev) => {
        if (ev.target.closest('.exp-delete')) return;
        const e = findExp(h); if (!e) return;
        if (appState.expandedExp.has(e.id)) appState.expandedExp.delete(e.id);
        else appState.expandedExp.add(e.id);
        renderSection();
      });
    });
    // Delete experience — структурное, коммитим сразу.
    mainSlot.querySelectorAll('[data-action="exp-delete"]').forEach(btn => {
      btn.addEventListener('click', async (ev) => {
        ev.stopPropagation();
        const e = findExp(btn); if (!e) return;
        const expId = e.id;
        const expCompany = e.company;
        const ok = await showModal({
          type: 'confirm',
          message: `Удалить место работы «${expCompany || 'без названия'}»?`,
          okLabel: 'Удалить',
          danger: true,
        });
        if (!ok) return;
        const fresh = appState.experience.find(x => x.id === expId);
        if (!fresh) return;
        appState.experience = appState.experience.filter(x => x.id !== expId);
        appState.expandedExp.delete(expId);
        markDirty();
        renderSection();
        saveExperienceNow();
      });
    });
    // Field inputs (text inputs, dates) — input → debounce, blur → commit now.
    mainSlot.querySelectorAll('.exp-body [data-field]').forEach(inp => {
      const field = inp.dataset.field;
      if (['company','company_url','role'].includes(field)) {
        inp.addEventListener('input', () => {
          const e = findExp(inp); if (!e) return;
          e[field] = inp.value;
          markDirty();
          if (['company','role'].includes(field)) {
            const sum = inp.closest('.exp-card').querySelector('.exp-summary');
            if (sum) sum.innerHTML = expSummaryHtml(e);
          }
          scheduleExperienceAutosave();
        });
        inp.addEventListener('blur', () => {
          if (!appState.dirty) return;
          saveExperienceNow();
        });
        inp.addEventListener('keydown', (ev) => {
          if ((ev.ctrlKey || ev.metaKey) && ev.key === 'Enter') {
            ev.preventDefault();
            if (appState.dirty) saveExperienceNow();
          }
        });
      } else if (field === 'end_current') {
        // Чекбокс «по настоящее время» — структурное (мутирует end_date),
        // коммитим сразу.
        inp.addEventListener('change', () => {
          const e = findExp(inp); if (!e) return;
          const endInp = inp.closest('.date-pair').querySelector('[data-field="end_date"]');
          if (inp.checked) {
            e.end_date = null;
            endInp.disabled = true;
            if (endInp._flatpickr) {
              endInp._flatpickr.clear();
              endInp._flatpickr.set('clickOpens', false);
            } else {
              endInp.value = '';
            }
          } else {
            endInp.disabled = false;
            if (endInp._flatpickr) {
              endInp._flatpickr.set('clickOpens', true);
              endInp._flatpickr.open();
            } else {
              endInp.focus();
            }
          }
          markDirty();
          const sum = inp.closest('.exp-card').querySelector('.exp-summary');
          if (sum) sum.innerHTML = expSummaryHtml(e);
          saveExperienceNow();
        });
      }
    });
    // List items (achievements/responsibilities) — текст: input → debounce,
    // blur → commit; добавление/удаление — мгновенный коммит.
    mainSlot.querySelectorAll('.list-block').forEach(block => {
      const field = block.dataset.field;
      if (!['achievements','responsibilities'].includes(field)) return;
      block.querySelectorAll('.list-input').forEach(ta => {
        autoGrowTextarea(ta);
        ta.addEventListener('input', () => {
          autoGrowTextarea(ta);
          const e = findExp(ta); if (!e) return;
          const idx = parseInt(ta.parentElement.dataset.itemIdx, 10);
          e[field][idx] = ta.value;
          markDirty();
          scheduleExperienceAutosave();
        });
        ta.addEventListener('blur', () => {
          if (!appState.dirty) return;
          saveExperienceNow();
        });
        ta.addEventListener('keydown', (ev) => {
          if ((ev.ctrlKey || ev.metaKey) && ev.key === 'Enter') {
            ev.preventDefault();
            if (appState.dirty) saveExperienceNow();
          }
        });
      });
      block.querySelectorAll('[data-action="list-delete"]').forEach(btn => {
        btn.addEventListener('click', () => {
          const e = findExp(btn); if (!e) return;
          const idx = parseInt(btn.parentElement.dataset.itemIdx, 10);
          e[field].splice(idx, 1);
          markDirty();
          renderSection();
          saveExperienceNow();
        });
      });
      const addBtn = block.querySelector('[data-action="list-add"]');
      if (addBtn) addBtn.addEventListener('click', () => {
        const e = findExp(addBtn); if (!e) return;
        e[field] = e[field] || [];
        e[field].push('');
        // Не сохраняем сразу — пустая строка будет отфильтрована на бэке.
        // Сохранится на blur после ввода первого символа.
        renderSection();
      });
    });
    // Experience skill chips: delete — структурное, коммитим сразу.
    mainSlot.querySelectorAll('.skills-block .x[data-skill-name]').forEach(x => {
      x.addEventListener('click', (ev) => {
        ev.stopPropagation();
        const e = findExp(x); if (!e) return;
        const name = x.dataset.skillName;
        e.skill_names = (e.skill_names || []).filter(n => n !== name);
        markDirty();
        renderSection();
        saveExperienceNow();
      });
    });
    // Skill picker open
    mainSlot.querySelectorAll('[data-action="exp-add-skill"]').forEach(btn => {
      btn.addEventListener('click', (ev) => {
        ev.stopPropagation();
        const e = findExp(btn); if (!e) return;
        appState.pickerOpenFor = appState.pickerOpenFor === e.id ? null : e.id;
        renderSection();
      });
    });
    // Skill picker item click (delegated) — структурное, коммитим.
    mainSlot.querySelectorAll('.skill-picker-item:not(.disabled)').forEach(item => {
      item.addEventListener('click', (ev) => {
        ev.stopPropagation();
        const e = findExp(item); if (!e) return;
        const name = item.dataset.skillName;
        e.skill_names = (e.skill_names || []);
        if (!e.skill_names.includes(name)) e.skill_names.push(name);
        appState.pickerOpenFor = null;
        markDirty();
        renderSection();
        saveExperienceNow();
      });
    });
    // Picker search — match against data-search (skill name only) so a query
    // like "5" doesn't accidentally hit every level-5 skill.
    mainSlot.querySelectorAll('[data-action="picker-search"]').forEach(inp => {
      inp.addEventListener('input', () => {
        const q = inp.value.trim().toLowerCase();
        const list = inp.closest('.skill-picker').querySelector('.skill-picker-list');
        list.querySelectorAll('.skill-picker-item').forEach(it => {
          const key = it.dataset.search || '';
          it.style.display = key.includes(q) ? '' : 'none';
        });
        list.querySelectorAll('.skill-picker-cat').forEach(cat => {
          let next = cat.nextElementSibling;
          let any = false;
          while (next && !next.classList.contains('skill-picker-cat')) {
            if (next.style.display !== 'none') { any = true; break; }
            next = next.nextElementSibling;
          }
          cat.style.display = any ? '' : 'none';
        });
      });
    });
    // Click outside picker closes it
    if (appState.pickerOpenFor != null) attachExpPickerCloser();
    // New experience — добавляет пустую карточку. Сохранять сразу нет
    // смысла: бэк требует company/role/start_date, поэтому без полей он
    // вернёт ошибку. Реальный коммит произойдёт после ввода company на blur.
    const newBtn = $('exp-new');
    if (newBtn) newBtn.addEventListener('click', () => {
      const newId = '__new_' + Math.random().toString(36).slice(2, 8);
      const today = new Date().toISOString().slice(0, 10);
      const fresh = {
        id: newId, company: '', company_url: null, role: '',
        start_date: today, end_date: null,
        achievements: [], responsibilities: [], skill_names: [],
      };
      appState.experience.unshift(fresh);
      appState.expandedExp.add(newId);
      renderSection();
    });

    // Init flatpickr on every date input AFTER the rest of wiring is done.
    // flatpickr replaces the input's pop-up with a real dark-themed calendar
    // (the native QtWebEngine one renders broken).
    mainSlot.querySelectorAll('.input-date-text').forEach((inp) => {
      const field = inp.dataset.field;
      flatpickr(inp, {
        dateFormat: 'd.m.Y',
        locale: 'ru',
        allowInput: true,
        monthSelectorType: 'static',
        disableMobile: true,
        clickOpens: !inp.disabled,
        onChange: (selectedDates) => {
          const e = findExp(inp); if (!e) return;
          if (selectedDates.length === 0) {
            e[field] = field === 'end_date' ? null : '';
          } else {
            const d = selectedDates[0];
            const yyyy = d.getFullYear();
            const mm = String(d.getMonth() + 1).padStart(2, '0');
            const dd = String(d.getDate()).padStart(2, '0');
            e[field] = `${yyyy}-${mm}-${dd}`;
          }
          markDirty();
          const sum = inp.closest('.exp-card').querySelector('.exp-summary');
          if (sum) sum.innerHTML = expSummaryHtml(e);
          saveExperienceNow();
        },
      });
    });
  }

  function expSummaryHtml(e) {
    const period = formatPeriod(e.start_date, e.end_date);
    const parts = [`<strong>${escapeHtml(e.company || 'Без названия')}</strong>`];
    if (e.role) parts.push(`· <span class="role">${escapeHtml(e.role)}</span>`);
    if (period) parts.push(`<span class="period">${escapeHtml(period)}</span>`);
    return parts.join(' ');
  }

  function formatPeriod(startIso, endIso) {
    if (!startIso) return '';
    const s = formatMonthYear(startIso);
    const e = endIso ? formatMonthYear(endIso) : 'настоящее время';
    return `${s} — ${e}`;
  }
  function formatMonthYear(iso) {
    if (!iso) return '';
    const [y, m] = iso.split('-');
    return `${m}.${y}`;
  }
  function autoGrowTextarea(ta) {
    ta.style.height = 'auto';
    ta.style.height = (ta.scrollHeight) + 'px';
  }

  function onExperienceChanged(payloadJson) {
    let r;
    try { r = JSON.parse(payloadJson); } catch { return; }
    if (!r.ok) return;
    if (appState.section === 'profile' && appState.tab === 'experience' && appState.dirty) return;
    appState.experience = (r.experience || []).map(e => ({ ...e }));
    appState.skillsIndex = r.skills_index || [];
    appState.experienceLoaded = true;
    if (appState.section === 'profile' && appState.tab === 'experience') renderSection();
  }

  function onExperienceSaveDone(payloadJson) {
    let r;
    try { r = JSON.parse(payloadJson); } catch { return; }
    if (!r.ok) {
      appState.saveError = r.error || 'не удалось сохранить';
      if (appState.section === 'profile' && appState.tab === 'experience') {
        renderSection();
      }
      return;
    }
    appState.dirty = false;
    appState.saveError = '';
    if (api) api.request_experience();
  }

  function onProfileChanged(payloadJson) {
    let r;
    try { r = JSON.parse(payloadJson); } catch { return; }
    if (!r.ok) return;
    // С автосохранением: пока пользователь правит форму (dirty=true) и
    // мы ещё не отправили дебаунс — серверный state перетёр бы черновик
    // прямо в input. Дропаем такой ответ — то же поведение, что у skills
    // и experience. dirty снимется в onProfileSaveDone после успеха.
    if (appState.section === 'profile' && appState.tab === 'cv' && appState.dirty) {
      return;
    }
    appState.profile = r.profile;
    appState.cv_meta = r.cv_meta;
    if (appState.section === 'profile' && appState.tab === 'cv') {
      // Пропускаем полный re-render только когда пользователь СЕЙЧАС
      // взаимодействует с формой (фокус в input/textarea/кнопке-cdd).
      // Это покрывает «после save_done пока пользователь печатает» —
      // там значения уже актуальные и пере-innerHTML срывал бы фокус.
      // На первой загрузке / возврате на экран / внешнем изменении
      // фокуса в форме нет → делаем нормальный re-render.
      const ae = document.activeElement;
      const focusedInForm = !!(ae && mainSlot.contains(ae) && (
        ae.tagName === 'INPUT'
        || ae.tagName === 'TEXTAREA'
        || ae.classList.contains('cdd-btn')
      ));
      if (focusedInForm) {
        const ts = mainSlot.querySelector('.updated-ts');
        if (ts) {
          ts.textContent = r.profile && r.profile.updated_at
            ? 'обновлено ' + formatTimestamp(r.profile.updated_at)
            : '—';
        }
      } else {
        renderSection();
      }
    }
  }

  function onProfileSaveDone(payloadJson) {
    let r;
    try { r = JSON.parse(payloadJson); } catch { return; }
    if (!r.ok) {
      appState.saveError = r.error || 'не удалось сохранить';
      // Кнопок Сохранить больше нет — просто перерисуем экран, чтобы
      // показать .autosave-error выше pdf-row.
      if (appState.section === 'profile' && appState.tab === 'cv') {
        renderSection();
      }
      return;
    }
    // Успех: dirty гасим, ошибку чистим, тянем свежий профиль (updated_at).
    appState.dirty = false;
    appState.saveError = '';
    if (api) api.request_profile();
  }

  function onCvReplaceDone(payloadJson) {
    let r;
    try { r = JSON.parse(payloadJson); } catch { return; }
    if (!r.ok) return;
    appState.cv_meta = { name: r.name, size: r.size, exists: r.exists };
    if (appState.section === 'profile' && appState.tab === 'cv') renderSection();
  }

  // ---- Helpers ---------------------------------------------------------

  function escapeHtml(s) {
    return String(s ?? '').replace(/[&<>"']/g, (c) =>
      ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])
    );
  }
  function escapeAttr(s) { return escapeHtml(s); }

  // Local media-paths приходят из бэка (Pyrogram сохраняет в MEDIA_DIR).
  // Под обычным потоком там абсолютный path или file://-URL. Defensive
  // scheme guard на случай если будущий рефактор протянет в это поле
  // server-controlled данные: `escapeAttr` HTML-экранирует, но не
  // валидирует scheme — `javascript:`/`data:`/`vbscript:` прошли бы
  // насквозь. Срезаем их явно; всё остальное пропускаем как есть.
  function safeMediaHref(p) {
    const s = String(p ?? '').trim();
    if (!s) return '';
    if (/^(javascript|data|vbscript):/i.test(s)) return '';
    return s;
  }

  function showToast(message, opts) {
    // Backwards-compat: второй аргумент исторически был числом ms; теперь
    // принимает либо number, либо {ms, variant}. variant === 'danger' даёт
    // красную плашку для ошибок, без variant — серая info.
    let ms = 2800;
    let variant = null;
    if (typeof opts === 'number') {
      ms = opts;
    } else if (opts && typeof opts === 'object') {
      if (opts.ms != null) ms = opts.ms;
      if (opts.variant) variant = String(opts.variant);
    }
    let el = document.getElementById('app-toast');
    if (!el) {
      el = document.createElement('div');
      el.id = 'app-toast';
      el.setAttribute('role', 'status');
      document.body.appendChild(el);
    }
    el.className = 'app-toast' + (variant === 'danger' ? ' danger' : '');
    el.textContent = message;
    el.classList.add('visible');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => { el.classList.remove('visible'); }, ms);
  }

  // Custom modal — replaces native window.prompt / window.confirm so the
  // dialog matches our dark theme instead of QtWebEngine's stock chrome.
  // Stacking guard: если предыдущий showModal ещё не resolve'нулся (юзер
  // успел дважды кликнуть «Удалить» / два push'а из бэка пришли подряд),
  // второй вызов сразу resolve'ится в null — иначе keydown-handler'ы
  // обоих диалогов работают одновременно и Escape «зажирает» оба promise'а.
  let _modalOpen = false;
  function showModal({ message, type = 'confirm', defaultValue = '', okLabel, danger = false }) {
    if (_modalOpen) return Promise.resolve(null);
    _modalOpen = true;
    return new Promise((resolve) => {
      // Synchronous-throw recovery: если мы упадём ДО привязки close()
      // к onclick handler'ам (e.g. createElement OOM, escapeHtml exception),
      // _modalOpen остался бы true навсегда, и все последующие showModal
      // тихо resolve'ились бы в null. try/catch на construction phase.
      let backdrop;
      try {
        backdrop = document.createElement('div');
        backdrop.className = 'modal-backdrop';
      const inputHtml = type === 'prompt'
        ? `<input class="modal-input" id="__modal-input" maxlength="255" value="${escapeAttr(defaultValue)}">`
        : '';
      const okClass = danger ? 'btn danger' : 'btn primary';
      const okText = okLabel || (type === 'confirm' ? 'OK' : 'OK');
      backdrop.innerHTML = `
        <div class="modal-dialog">
          <div class="modal-message">${escapeHtml(message)}</div>
          ${inputHtml}
          <div class="modal-actions">
            <button class="btn" data-act="cancel">Отмена</button>
            <button class="${okClass}" data-act="ok">${escapeHtml(okText)}</button>
          </div>
        </div>
      `;
      document.body.appendChild(backdrop);
      const input = backdrop.querySelector('#__modal-input');
      if (input) { input.focus(); input.select(); }
      const close = (result) => {
        document.removeEventListener('keydown', onKey);
        backdrop.remove();
        _modalOpen = false;
        resolve(result);
      };
      const onKey = (e) => {
        if (e.key === 'Escape') { e.preventDefault(); close(null); }
        else if (e.key === 'Enter' && (input || type === 'confirm')) {
          e.preventDefault();
          close(input ? input.value.trim() : true);
        }
      };
      // querySelector wiring ДО addEventListener: иначе sync-throw на
      // одной из этих строк оставит keydown-handler привязанным навсегда.
      backdrop.querySelector('[data-act="cancel"]').onclick = () => close(null);
      backdrop.querySelector('[data-act="ok"]').onclick = () =>
        close(input ? input.value.trim() : true);
      backdrop.addEventListener('click', (e) => { if (e.target === backdrop) close(null); });
      document.addEventListener('keydown', onKey);
      } catch (err) {
        // Construction failed — освобождаем guard, чтобы следующий
        // showModal не оказался в permanent-locked состоянии.
        _modalOpen = false;
        if (backdrop && backdrop.parentNode) backdrop.parentNode.removeChild(backdrop);
        resolve(null);
      }
    });
  }

  // ISO yyyy-mm-dd → dd.mm.yyyy for display in the flatpickr-controlled input.
  function isoToDmy(iso) {
    if (!iso) return '';
    const [y, m, d] = iso.split('-');
    if (!y || !m || !d) return '';
    return `${d}.${m}.${y}`;
  }
  function formatBytes(bytes) {
    bytes = Number(bytes) || 0;
    if (bytes < 1024) return bytes + ' Б';
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(0) + ' КБ';
    return (bytes / (1024 * 1024)).toFixed(1) + ' МБ';
  }
  function formatTimestamp(iso) {
    if (!iso) return '—';
    try {
      const d = new Date(iso);
      const pad = (n) => String(n).padStart(2, '0');
      return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
    } catch { return iso; }
  }

  // --- Health ------------------------------------------------------------

  // Лейблы — те же, что в bottom-bar (.health-label), чтобы пользователю
  // в тултипе было сразу понятно, какой именно сервис висит.
  const HEALTH_KEYS = ['db', 'tg', 'chat', 'embed'];
  const HEALTH_KEY_LABELS = { db: 'DB', tg: 'TG', chat: 'CHT', embed: 'EMB' };
  const currentHealth = { db: false, tg: false, chat: false, embed: false };
  let healthInitialized = false;

  function isAllHealthy() {
    return HEALTH_KEYS.every((k) => currentHealth[k]);
  }

  function buildHealthBlockedTip() {
    if (!healthInitialized) return 'Проверка состояния систем…';
    const bad = HEALTH_KEYS
      .filter((k) => !currentHealth[k])
      .map((k) => HEALTH_KEY_LABELS[k]);
    if (bad.length === 0) return '';
    return `Бот заблокирован: для запуска все системы должны быть доступны. Сейчас недоступно: ${bad.join(', ')}.`;
  }

  function applyBotControlsLock() {
    const ok = healthInitialized && isAllHealthy();
    const blockedTip = buildHealthBlockedTip();
    modeBtn.classList.toggle('is-disabled', !ok);
    refreshBtn.classList.toggle('is-disabled', !ok);
    modeBtn.setAttribute('aria-disabled', ok ? 'false' : 'true');
    refreshBtn.setAttribute('aria-disabled', ok ? 'false' : 'true');
    if (!ok) {
      modeBtn.title = blockedTip;
      refreshBtn.title = blockedTip;
    } else {
      modeBtn.title = 'Режим работы — клик переключает';
      refreshBtn.title = refreshBtn.dataset.running === 'true'
        ? 'Остановить цикл'
        : 'Прогнать цикл прямо сейчас';
    }
  }

  function applyHealth(payload) {
    if (!payload || !payload.ok) return;
    for (const key of HEALTH_KEYS) {
      const el = document.querySelector(`.health[data-key="${key}"]`);
      if (!el) continue;
      el.dataset.state = payload[key] ? 'ok' : 'err';
      currentHealth[key] = !!payload[key];
    }
    healthInitialized = true;
    applyBotControlsLock();
    // Channels detail-pane more-popover gates «Прогнать сейчас» on health.
    // Раньше: full renderSection() — сбивал фокус, прокрутку и состояние
    // add-modal'и КАЖДЫЕ N секунд пока popover открыт. Теперь точечно:
    // toggle disabled-attribute + title на одной кнопке через прямой DOM.
    if (
      appState.section === 'contacts'
      && appState.contacts.tab === 'channels'
      && appState.contacts.channels.morePopoverOpen
    ) {
      const btn = document.querySelector(
        '.cnt-ch-pane [data-action="cnt-ch-poll-now"], '
        + '[data-action="cnt-ch-poll-now"]'
      );
      if (btn) {
        const ok = isAllHealthy();
        btn.disabled = !ok;
        btn.title = ok
          ? 'Запустить поллинг этого канала'
          : buildHealthBlockedTip();
      }
    }
    // Если бот сейчас в Full / DM Only, а хотя бы один хелсчек упал —
    // гасим режим в Off, чтобы основной цикл бота на следующей итерации
    // увидел Off и перестал поллить (а текущий in-flight poll, если есть,
    // дойдёт до конца сам и больше не запустится).
    if (!isAllHealthy() && currentMode !== 'Off' && api) {
      api.set_mode('Off');
    }
  }

  // Стартовое состояние: пока bridge не ответил по health, держим контролы
  // выключенными — иначе пользователь успеет ткнуть в Full ровно в тот
  // момент, когда хелсчеки ещё не успели прийти.
  applyBotControlsLock();

  // --- Unread badge ------------------------------------------------------

  function applyUnread(payload) {
    if (!payload || !payload.ok) return;
    const n = payload.count || 0;
    unreadCountEl.textContent = String(n);
    unreadBtn.dataset.hasUnread = n > 0 ? 'true' : 'false';
    // If the pop-up is open while count drops to 0, close it — nothing
    // left to show.
    if (n === 0) closeUnreadPopup();
    // Hot-refresh while open so the list mirrors the new state without
    // requiring a re-open.
    if (unreadPopupState.open) requestUnreadChats();
  }

  // --- Unread chats pop-up (TODO #4) -----------------------------------
  const unreadPopupHost = $('unread-popup-host');
  const unreadPopupState = { open: false, loading: false, list: [] };

  function requestUnreadChats() {
    if (!api) return;
    unreadPopupState.loading = true;
    renderUnreadPopup();
    api.request_unread_chats();
  }

  function onUnreadChatsLoaded(payload) {
    if (!payload || !payload.ok) {
      unreadPopupState.loading = false;
      unreadPopupState.list = [];
      renderUnreadPopup();
      return;
    }
    unreadPopupState.loading = false;
    unreadPopupState.list = payload.chats || [];
    renderUnreadPopup();
  }

  function closeUnreadPopup() {
    if (!unreadPopupState.open) return;
    unreadPopupState.open = false;
    renderUnreadPopup();
  }

  function renderUnreadPopup() {
    if (!unreadPopupState.open) {
      unreadPopupHost.innerHTML = '';
      return;
    }
    let body;
    if (unreadPopupState.loading && !unreadPopupState.list.length) {
      body = `<div class="unread-popup-empty">Загрузка…</div>`;
    } else if (!unreadPopupState.list.length) {
      body = `<div class="unread-popup-empty">Непрочитанных чатов нет.</div>`;
    } else {
      body = `<div class="unread-popup-list">${
        unreadPopupState.list.map((r) => {
          const label = (r.name && r.name.trim())
            || (r.telegram_username ? `@${r.telegram_username}` : `HR #${r.hr_id}`);
          const sub = (r.name && r.telegram_username)
            ? `<div class="unread-popup-sub">@${escapeHtml(r.telegram_username)}</div>`
            : '';
          return `
            <div class="unread-popup-row" data-action="unread-popup-pick" data-hr-id="${r.hr_id}">
              <div class="unread-popup-name">${escapeHtml(label)}${sub}</div>
              <div class="unread-popup-count">${r.unread_count}</div>
            </div>
          `;
        }).join('')
      }</div>`;
    }
    unreadPopupHost.innerHTML = `
      <div class="unread-popup-backdrop" data-action="unread-popup-close"></div>
      <div class="unread-popup" role="dialog" aria-label="Непрочитанные чаты">
        ${body}
      </div>
    `;
    unreadPopupHost.querySelector('[data-action="unread-popup-close"]')
      ?.addEventListener('click', closeUnreadPopup);
    unreadPopupHost.querySelectorAll('[data-action="unread-popup-pick"]').forEach((el) => {
      el.addEventListener('click', () => {
        const id = parseInt(el.dataset.hrId, 10);
        if (!Number.isFinite(id)) return;
        closeUnreadPopup();
        appState.contacts.tab = 'hr';
        appState.contacts.selectedHrId = id;
        setActiveSection('contacts');
        if (api) {
          requestContactsHrDetail(id);
          requestContactsHrMessages(id);
        }
      });
    });
  }

  unreadBtn.addEventListener('click', () => {
    if (unreadBtn.dataset.hasUnread !== 'true') return;
    if (unreadPopupState.open) {
      closeUnreadPopup();
      return;
    }
    unreadPopupState.open = true;
    requestUnreadChats();
  });

  // --- Mode toggle -------------------------------------------------------

  function applyMode(payload) {
    if (!payload || !payload.ok) return;
    const mode = payload.mode;
    if (!MODE_CYCLE.includes(mode)) return;
    currentMode = mode;
    modeBtn.dataset.mode = mode;
    modeBtn.querySelector('.mode-text').textContent = mode;
  }
  modeBtn.addEventListener('click', (e) => {
    if (!api) return;
    if (modeBtn.classList.contains('is-disabled')) {
      showToast(modeBtn.title || buildHealthBlockedTip() || 'Действие недоступно');
      return;
    }
    // Position-based pick: split the track into 3 equal zones; click inside
    // a zone selects the corresponding mode. Clicks left of the track snap
    // to Off, right of the track snap to Full.
    const track = modeBtn.querySelector('.mode-track');
    const rect = track.getBoundingClientRect();
    const x = e.clientX - rect.left;
    let next;
    if (x < rect.width / 3) next = MODE_CYCLE[0];
    else if (x < (2 * rect.width) / 3) next = MODE_CYCLE[1];
    else next = MODE_CYCLE[2];
    if (next === currentMode) return;
    api.set_mode(next);
  });

  // --- Refresh / progress ------------------------------------------------

  refreshBtn.addEventListener('click', () => {
    if (!api) return;
    if (refreshBtn.classList.contains('is-disabled')) {
      showToast(refreshBtn.title || buildHealthBlockedTip() || 'Действие недоступно');
      return;
    }
    if (refreshBtn.dataset.running === 'true') {
      api.stop_ingestion();
    } else {
      api.trigger_ingestion();
    }
  });

  function setRunning(running) {
    refreshBtn.dataset.running = running ? 'true' : 'false';
    refreshIcon.textContent = running ? 'stop' : 'play_arrow';
    // Тултип ставит applyBotControlsLock — он учитывает и состояние health,
    // и running. Без этого «Остановить цикл» перетёр бы blocked-tip, если бы
    // health упал прямо посреди цикла.
    applyBotControlsLock();
  }

  function paintBar(bar, fill, cur, tot, indet) {
    if (indet) {
      bar.dataset.indeterminate = 'true';
      fill.style.width = '';
      return;
    }
    bar.dataset.indeterminate = 'false';
    const pct = tot > 0 ? Math.min(100, (cur / tot) * 100) : 0;
    fill.style.width = pct + '%';
  }

  function renderCaption() {
    const c = progressState.channel;
    const m = progressState.message;
    const chPart = c.label
      ? `${c.label} (${c.cur}/${c.tot})`
      : (c.tot ? `Каналы (${c.cur}/${c.tot})` : '…');
    const msgPart = m.tot
      ? `Сообщение (${m.cur}/${m.tot})`
      : 'Сообщение (—)';
    progressCaption.textContent = `${chPart}, ${msgPart}`;
  }

  function onIngestionStarted() {
    progressWrap.classList.remove('hidden');
    progressState.channel = { label: '', cur: 0, tot: 0 };
    progressState.message = { label: '', cur: 0, tot: 0 };
    paintBar(chBar, chFill, 0, 0, true);
    paintBar(msgBar, msgFill, 0, 0, true);
    progressCaption.textContent = 'Запуск…';
    setRunning(true);
  }
  function onIngestionFinished(_payloadJson) {
    progressWrap.classList.add('hidden');
    setRunning(false);
    // Real-time refresh идёт через `contacts_lists_changed` push на каждый
    // parse-commit (см. handler ниже) — здесь ничего лишнего не делаем.
  }

  // Trailing-edge debounce: во время длинного poll-цикла push-сигналы
  // приходят очередями (parse-commit каждые ~30 сек, иногда чаще). Без
  // debounce каждый бы дёргал full re-fetch — сжигаем DB roundtrip'ы и
  // мерцаем UI. 200мс схлопывает burst в один запрос.
  let _onContactsListsChangedTimer = null;
  let _onVacanciesListChangedTimer = null;
  const PUSH_DEBOUNCE_MS = 200;

  function onContactsListsChanged() {
    if (_onContactsListsChangedTimer) clearTimeout(_onContactsListsChangedTimer);
    _onContactsListsChangedTimer = setTimeout(() => {
      _onContactsListsChangedTimer = null;
      _doContactsListsRefresh();
    }, PUSH_DEBOUNCE_MS);
  }

  function _doContactsListsRefresh() {
    // Real-time push из бэкенда: каждая обработанная вакансия мог через
    // find_or_create_* добавить/обновить HR или Company, и vacancy_count
    // канала тоже сдвинулся. Если юзер на соответствующей вкладке —
    // refetch сразу (плюс detail-mini-list, если открыт detail-pane);
    // иначе помечаем кэш stale, и при следующем открытии вкладки список
    // перезапросится.
    const onContacts = appState.section === 'contacts';
    const tab = appState.contacts && appState.contacts.tab;
    const c = appState.contacts || {};

    if (onContacts && tab === 'hr' && api) {
      requestContactsHrList({ mode: 'refresh' });
      const sel = c.selectedHrId;
      if (sel != null && c.hr && c.hr.detailFor === sel) {
        if (typeof requestContactsHrVacancies === 'function') requestContactsHrVacancies(sel);
      }
    } else if (c.hr) {
      c.hr.loaded = false;
    }

    if (onContacts && tab === 'companies' && api) {
      requestContactsCompanyList({ mode: 'refresh' });
      const sel = c.selectedCompanyId;
      if (sel != null && c.company && c.company.detailFor === sel) {
        if (typeof requestContactsCompanyVacancies === 'function') requestContactsCompanyVacancies(sel);
        if (typeof requestContactsCompanyHrs === 'function') requestContactsCompanyHrs(sel);
      }
    } else if (c.company) {
      c.company.loaded = false;
    }

    if (onContacts && tab === 'channels' && api) {
      requestContactsChannelList();
      const ch = c.channels;
      if (ch && ch.selectedId != null && ch.detailFor === ch.selectedId) {
        // Detail (статистика) — без вреда, всегда перезапрашиваем.
        requestContactsChannelDetail(ch.selectedId);
        // Mini-список вакансий — пушим refresh ТОЛЬКО если юзер ещё на
        // первой странице. Иначе replace-режим скинет позицию скролла и
        // подгруженные пачки, а юзер потеряет место в списке.
        if (ch.vacancies.length <= CHANNEL_VAC_PAGE_SIZE) {
          requestContactsChannelVacancies(ch.selectedId);
        }
      }
    } else if (c.channels) {
      c.channels.loaded = false;
    }

    if (onContacts && tab === 'blacklist' && api) {
      requestContactsBlacklistList();
    } else if (c.blacklist) {
      c.blacklist.loaded = false;
    }
  }
  function onProgressUpdate(payloadJson) {
    let p;
    try { p = JSON.parse(payloadJson); } catch { return; }
    const stage = p.stage;
    const cur = Math.max(0, p.current || 0);
    const tot = Math.max(0, p.total || 0);
    const label = p.label || '';
    if (stage === 'channel') {
      progressState.channel = { label, cur, tot };
      paintBar(chBar, chFill, cur, tot, false);
      renderCaption();
    } else if (stage === 'message') {
      progressState.message = { label, cur, tot };
      paintBar(msgBar, msgFill, cur, tot, false);
      renderCaption();
    } else if (stage === 'rerun') {
      // Single-vacancy rerun: бары держатся индетерминантными
      // (выставлены в onIngestionStarted), мы только меняем подпись
      // на текущую стадию («фетч поста / парсинг / валидация / …»).
      progressCaption.textContent = label || 'Прогон вакансии…';
    }
  }

  // --- Custom dropdown (.cdd) — global delegation -----------------------
  // Один обработчик на весь документ, один раз. Логика:
  //  - клик по .cdd-btn открывает свой .cdd, закрывая остальные;
  //  - клик по .cdd-option ставит value на корне .cdd, обновляет лейбл,
  //    закрывает панель и диспатчит bubbling-событие 'cdd-change' —
  //    вызывающий код слушает его как обычный change.
  //  - клик вне любого .cdd закрывает все открытые.
  document.addEventListener('click', (e) => {
    const btn = e.target.closest('.cdd-btn');
    if (btn) {
      const cdd = btn.closest('.cdd');
      const wasOpen = cdd.classList.contains('open');
      document.querySelectorAll('.cdd.open').forEach(c => c.classList.remove('open'));
      if (!wasOpen) cdd.classList.add('open');
      e.stopPropagation();
      return;
    }
    const opt = e.target.closest('.cdd-option');
    if (opt) {
      const cdd = opt.closest('.cdd');
      const newValue = opt.dataset.value;
      const oldValue = cdd.dataset.value;
      cdd.dataset.value = newValue;
      const label = cdd.querySelector('.cdd-btn .cdd-label');
      if (label) label.textContent = opt.textContent;
      cdd.querySelectorAll('.cdd-option').forEach(o =>
        o.classList.toggle('active', o === opt)
      );
      cdd.classList.remove('open');
      if (newValue !== oldValue) {
        cdd.dispatchEvent(new Event('cdd-change', { bubbles: true }));
      }
      e.stopPropagation();
      return;
    }
    // Клик вне любого дропдауна — закрываем все открытые.
    document.querySelectorAll('.cdd.open').forEach(c => c.classList.remove('open'));
  });

  // --- Bridge bootstrap --------------------------------------------------

  // Initial render (no data yet — fields will be empty until bridge replies).
  renderSection();

  if (typeof QWebChannel !== 'undefined' && typeof qt !== 'undefined') {
    new QWebChannel(qt.webChannelTransport, (channel) => {
      api = channel.objects.api;
      api.health_changed.connect((p) => { try { applyHealth(JSON.parse(p)); } catch {} });
      api.unread_changed.connect((p) => { try { applyUnread(JSON.parse(p)); } catch {} });
      api.mode_changed.connect((p)   => { try { applyMode(JSON.parse(p)); }   catch {} });
      api.ingestion_started.connect(onIngestionStarted);
      api.ingestion_finished.connect(onIngestionFinished);
      api.ingestion_action_done.connect((p) => {
        try {
          const r = JSON.parse(p);
          if (!r.ok && r.error) showToast(r.error, { variant: 'danger' });
        } catch {}
      });
      api.progress_update.connect(onProgressUpdate);
      api.profile_changed.connect(onProfileChanged);
      api.profile_save_done.connect(onProfileSaveDone);
      api.cv_replace_done.connect(onCvReplaceDone);
      api.skills_changed.connect(onSkillsChanged);
      api.skills_save_done.connect(onSkillsSaveDone);
      api.experience_changed.connect(onExperienceChanged);
      api.experience_save_done.connect(onExperienceSaveDone);
      api.vacancies_changed.connect(onVacanciesChanged);
      api.vacancy_detail_changed.connect(onVacancyDetailChanged);
      api.vacancy_notes_saved.connect(onVacancyNotesSaved);
      api.vacancy_status_saved.connect(onVacancyStatusSaved);
      api.vacancy_history_explanation_saved.connect(onVacancyHistoryExplanationSaved);
      api.vacancy_action_done.connect(onVacancyActionDone);
      api.hr_picker_loaded.connect(onHrPickerLoaded);
      api.company_picker_loaded.connect(onCompanyPickerLoaded);
      api.contacts_hr_list_loaded.connect(onContactsHrListLoaded);
      api.contacts_hr_detail_loaded.connect(onContactsHrDetailLoaded);
      api.contacts_hr_messages_loaded.connect(onContactsHrMessagesLoaded);
      api.contacts_hr_messages_arrived.connect(onContactsHrMessagesArrived);
      api.contacts_hr_action_done.connect(onContactsHrActionDone);
      api.contacts_hr_read_receipt.connect((p) => { try { onContactsHrReadReceipt(JSON.parse(p)); } catch {} });
      api.contacts_hr_vacancies_loaded.connect(onContactsHrVacanciesLoaded);
      api.contacts_hr_merge_picker_loaded.connect(onContactsHrMergePickerLoaded);
      api.contacts_company_list_loaded.connect(onContactsCompanyListLoaded);
      api.contacts_company_detail_loaded.connect(onContactsCompanyDetailLoaded);
      api.contacts_company_vacancies_loaded.connect(onContactsCompanyVacanciesLoaded);
      api.contacts_company_hrs_loaded.connect(onContactsCompanyHrsLoaded);
      api.contacts_company_action_done.connect(onContactsCompanyActionDone);
      api.contacts_company_merge_picker_loaded.connect(onContactsCompanyMergePickerLoaded);
      api.contacts_blacklist_list_loaded.connect(onContactsBlacklistListLoaded);
      api.contacts_blacklist_action_done.connect(onContactsBlacklistActionDone);
      api.contacts_blacklist_candidates_loaded.connect(onContactsBlacklistCandidatesLoaded);
      api.stats_kpi_loaded.connect(onStatsKpiLoaded);
      api.stats_status_breakdown_loaded.connect(onStatsStatusBreakdownLoaded);
      api.stats_hr_responses_loaded.connect(onStatsHrResponsesLoaded);
      api.stats_skills_loaded.connect(onStatsSkillsLoaded);
      api.stats_channels_pipeline_loaded.connect(onStatsChannelsPipelineLoaded);
      api.system_logs_loaded.connect(onSystemLogsLoaded);
      api.system_log_record_pushed.connect(onSystemLogRecordPushed);
      api.system_logs_cleared.connect(onSystemLogsCleared);
      api.system_settings_loaded.connect(onSystemSettingsLoaded);
      api.system_telegram_logout_done.connect(onSystemTelegramLogoutDone);
      api.llm_probe_done.connect(onLlmProbeDone);
      api.llm_models_listed.connect(onLlmModelsListed);
      api.settings_save_done.connect(onSettingsSaveDone);
      api.delete_all_data_done.connect(onDeleteAllDataDone);
      api.telegram_send_code_done.connect(onTelegramSendCodeDone);
      api.telegram_confirm_code_done.connect(onTelegramConfirmCodeDone);
      api.telegram_confirm_password_done.connect(onTelegramConfirmPasswordDone);
      api.contacts_channel_list_loaded.connect(onContactsChannelListLoaded);
      api.contacts_channel_detail_loaded.connect(onContactsChannelDetailLoaded);
      api.contacts_channel_vacancies_loaded.connect(onContactsChannelVacanciesLoaded);
      api.contacts_channel_action_done.connect(onContactsChannelActionDone);
      api.contacts_lists_changed.connect(onContactsListsChanged);
      api.vacancies_list_changed.connect(onVacanciesListChanged);
      api.contacts_channels_changed.connect(() => {
        if (appState.section === 'contacts' && appState.contacts.tab === 'channels') {
          requestContactsChannelList();
        } else {
          // Не на вкладке — просто пометим список как stale, перезапрос
          // случится при следующем открытии.
          appState.contacts.channels.loaded = false;
        }
      });
      api.unread_chats_loaded.connect((p) => { try { onUnreadChatsLoaded(JSON.parse(p)); } catch {} });
      api.request_initial();
      api.request_profile();
      // If the user navigated to vacancies before the bridge connected,
      // kick the request so the list isn't stuck on "Загрузка…".
      if (appState.section === 'vacancies' && !appState.vacancies.loaded) {
        api.request_vacancies(buildVacanciesQuery());
        if (appState.vacancies.selectedId != null) {
          appState.vacancies.detailLoading = true;
          api.request_vacancy_detail(appState.vacancies.selectedId);
        }
        startVacanciesRefreshTimer();
      }
      if (appState.section === 'contacts'
          && appState.contacts.tab === 'hr'
          && !appState.contacts.hr.loaded) {
        requestContactsHrList();
      }
    });
  }
</script>

</body>
</html>
