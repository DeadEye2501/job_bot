<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<!--
  CSP: документ загружается из file:// в QWebEngine, никаких внешних
  загрузок не делаем — заранее ограничиваем источники чтобы любой
  будущий «давайте подгрузим аватарку из Telegram CDN» не открывал
  XSS-вектор без явной правки этого мета-тега.
  data: разрешён для img, чтобы avatar'ы (приходят как data-URL'ы из
  bridge'а) рендерились. unsafe-inline для script — у нас весь JS
  inline в <script>; разделим на файлы — снимем.
-->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self' 'unsafe-inline' qrc://*; connect-src 'self' qrc://*;">
<meta http-equiv="X-Content-Type-Options" content="nosniff">
<title>Job Bot</title>
<link rel="stylesheet" href="vendor/flatpickr/flatpickr.min.css">
<link rel="stylesheet" href="vendor/flatpickr/dark.css">

<style>
  @font-face {
    font-family: 'Material Symbols Outlined';
    font-style: normal;
    font-weight: 300;
    src: url('fonts/material-symbols-outlined.ttf') format('truetype');
  }
  .material-symbols-outlined {
    font-family: 'Material Symbols Outlined';
    font-weight: normal;
    font-style: normal;
    line-height: 1;
    letter-spacing: normal;
    text-transform: none;
    display: inline-block;
    white-space: nowrap;
    word-wrap: normal;
    direction: ltr;
    font-variation-settings: 'wght' 350;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
  :root {
    --bg-primary: #1d1d1f;
    --bg-secondary: #2d2d2f;
    --bg-tertiary: #3d3d3f;
    --border: #424245;
    --text-primary: #f5f5f7;
    --text-secondary: #86868b;
    --text-tertiary: #636366;
    --accent: #64f20c;
    --selected-bg: rgba(100, 242, 12, 0.12);
    --ok: #34c759;
    --err: #ff453a;
    --warn: #ffd60a;

    --rail-w: 56px;
    --sidebar-w: var(--rail-w);
    --footer-h: 36px;
  }
  html { color-scheme: dark; }
  body {
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg-secondary);
    color: var(--text-primary);
    line-height: 1.5;
  }

  .app-frame {
    background: var(--bg-secondary);
    height: 100vh;
    width: 100vw;
    display: grid;
    grid-template-columns: var(--sidebar-w) 1fr;
    grid-template-rows: 1fr var(--footer-h);
    overflow: hidden;
    transition: grid-template-columns 0.15s ease-out;
  }
  .app-frame.sidebar-expanded { --sidebar-w: 160px; }

  /* === Sidebar ========================================================= */

  .sidebar {
    grid-column: 1; grid-row: 1;
    background: var(--bg-tertiary);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    padding: 6px 0;
  }

  .nav-group {
    display: flex;
    align-items: center;
    height: 36px;
    cursor: pointer;
    color: var(--text-secondary);
    font-size: 0.9rem;
    white-space: nowrap;
    position: relative;
    transition: color 0.1s, background 0.1s;
  }
  .nav-group:hover { color: var(--text-primary); }
  .nav-group.active {
    color: var(--text-primary);
    background: var(--selected-bg);
    /* inset shadow draws the lime left edge without shifting content */
    box-shadow: inset 2px 0 0 var(--accent);
  }
  .nav-group.active .nav-icon-rail .material-symbols-outlined { color: var(--text-primary); }

  /* The rail is always 56px wide regardless of sidebar state, so the icon
     X position is identical when collapsed and expanded. */
  .nav-icon-rail {
    width: var(--rail-w);
    flex-shrink: 0;
    height: 100%;
    display: flex; align-items: center; justify-content: center;
  }
  .nav-icon-rail .material-symbols-outlined {
    font-size: 20px;
    color: inherit;
  }
  .nav-label {
    padding-right: 14px;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .app-frame:not(.sidebar-expanded) .nav-label { display: none; }

  .sidebar-spacer { flex: 1; }

  .sidebar-toggle {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 36px;
    cursor: pointer;
    color: var(--text-tertiary);
    border-top: 1px solid var(--border);
    transition: color 0.1s;
  }
  .sidebar-toggle:hover { color: var(--text-primary); }
  .sidebar-toggle .material-symbols-outlined { font-size: 18px; }

  /* === Main slot ======================================================= */

  .main {
    grid-column: 2; grid-row: 1;
    background: var(--bg-primary);
    overflow: hidden;
    padding: 0;
    display: flex;
    flex-direction: column;
  }
  .section { display: flex; flex-direction: column; flex: 1; min-height: 0; }
  .section-body { flex: 1; overflow: auto; padding: 18px 24px; }
  .placeholder-content {
    display: flex; align-items: center; justify-content: center;
    height: 100%;
    color: var(--text-tertiary);
    font-size: 0.9rem;
  }

  /* Per-section top tabs */
  .top-tabs {
    height: 32px;
    border-bottom: 1px solid var(--border);
    background: var(--bg-secondary);
    display: flex; align-items: end; justify-content: center;
    padding: 0 12px; gap: 4px;
    flex-shrink: 0;
  }
  .top-tabs .tab {
    padding: 6px 14px;
    font-size: 0.82rem;
    color: var(--text-secondary);
    border-bottom: 2px solid transparent;
    cursor: pointer;
    transition: color 0.1s, border-color 0.1s;
    user-select: none;
  }
  .top-tabs .tab:hover { color: var(--text-primary); }
  .top-tabs .tab.active {
    color: var(--text-primary);
    border-bottom-color: var(--accent);
  }

  /* Profile / CV form */
  .page-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 14px;
  }
  .page-title { font-size: 1rem; color: var(--text-primary); font-weight: 500; }
  .updated-ts { font-size: 0.72rem; color: var(--text-tertiary); }

  .form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px 14px;
  }
  .form-grid .span-2 { grid-column: span 2; }

  .input, .textarea {
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    color: var(--text-primary);
    border-radius: 4px;
    padding: 6px 10px;
    font-size: 0.85rem;
    font-family: inherit;
    width: 100%;
  }
  .input:focus, .textarea:focus { outline: none; border-color: var(--accent); }
  .input::placeholder, .textarea::placeholder { color: var(--text-tertiary); }
  .textarea { min-height: 70px; resize: vertical; }

  /* Сегментный селектор для multi-select полей профиля (грейд, формат работы) */
  .seg-row {
    display: flex;
    border: 1px solid var(--border);
    border-radius: 5px;
    background: var(--bg-primary);
    overflow: hidden;
    width: 100%;
  }
  .seg {
    flex: 1;
    text-align: center;
    padding: 2px 12px;
    color: var(--text-secondary);
    font-size: 0.72rem;
    font-weight: 500;
    letter-spacing: 0.3px;
    cursor: pointer;
    user-select: none;
    border-right: 1px solid var(--border);
  }
  .seg:first-child { border-radius: 4px 0 0 4px; }
  .seg:last-child { border-right: none; border-radius: 0 4px 4px 0; }
  .seg:hover { background: rgba(255,255,255,0.04); color: var(--text-primary); }
  .seg.active {
    color: var(--text-primary);
    box-shadow: inset 0 0 0 1px var(--text-primary);
  }
  .seg.active:hover { background: rgba(255, 255, 255, 0.06); color: var(--text-primary); }

  /* Языки кандидата — список (язык + уровень CEFR/native + ×) с кнопкой добавить */
  .lang-list { display: flex; flex-direction: column; gap: 3px; }
  .lang-row {
    display: grid;
    grid-template-columns: 1fr 96px 20px;
    gap: 4px;
    align-items: center;
  }
  .lang-row .input { padding: 4px 8px; font-size: 0.82rem; }

  /* Универсальный кастомный <select> на div+button. Нативный <select>
     в QWebEngineView рендерит popup мимо frameless-окна (Qt-баг
     с popup z-order), плюс не поддаётся стилям. */
  .cdd { position: relative; width: 100%; }
  .cdd-btn {
    width: 100%;
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    color: var(--text-primary);
    border-radius: 4px;
    padding: 4px 8px;
    font-size: 0.82rem;
    font-family: inherit;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 4px;
  }
  .cdd-btn:hover { border-color: var(--accent); }
  .cdd.open .cdd-btn { border-color: var(--accent); }
  .cdd-btn .material-symbols-outlined {
    font-size: 16px; color: var(--text-tertiary);
  }
  .cdd-panel {
    display: none;
    position: absolute;
    top: calc(100% + 2px);
    left: 0;
    right: 0;
    min-width: 100%;
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: 4px;
    box-shadow: 0 6px 14px rgba(0, 0, 0, 0.45);
    z-index: 30;
    overflow: hidden;
  }
  .cdd.open .cdd-panel { display: block; }
  .cdd-option {
    padding: 4px 10px;
    font-size: 0.82rem;
    color: var(--text-secondary);
    cursor: pointer;
  }
  .cdd-option:hover { background: var(--selected-bg); color: var(--text-primary); }
  .cdd-option.active { color: var(--accent); }
  .lang-remove {
    color: var(--text-tertiary);
    cursor: pointer;
    text-align: center;
    font-size: 1.05rem;
    line-height: 1;
    user-select: none;
  }
  .lang-remove:hover { color: #ff6b61; }
  .lang-add {
    margin-top: 3px;
    font-size: 0.78rem;
    color: var(--text-secondary);
    cursor: pointer;
    align-self: flex-start;
    user-select: none;
  }
  .lang-add:hover { color: var(--accent); }

  .pdf-row {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 12px;
    background: var(--bg-secondary);
    border: 1px dashed var(--border);
    border-radius: 6px;
    margin-top: 14px;
  }
  .pdf-row > .material-symbols-outlined { color: #ff6b61; font-size: 28px; flex-shrink: 0; }
  .pdf-info { flex: 1; min-width: 0; }
  .pdf-name {
    color: var(--text-primary); font-size: 0.85rem;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .pdf-meta { color: var(--text-tertiary); font-size: 0.72rem; margin-top: 1px; }
  .pdf-actions { display: flex; gap: 4px; flex-shrink: 0; }

  .btn {
    padding: 5px 12px;
    border-radius: 4px;
    border: 1px solid var(--border);
    background: var(--bg-tertiary);
    color: var(--text-primary);
    font-size: 0.78rem;
    font-family: inherit;
    cursor: pointer;
    transition: border-color 0.1s, background 0.1s;
  }
  .btn:hover:not(:disabled) { border-color: var(--accent); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn.primary {
    background: var(--accent);
    color: var(--bg-primary);
    border-color: var(--accent);
    font-weight: 500;
  }
  .btn.primary:hover:not(:disabled) {
    background: rgba(100,242,12,0.85);
    border-color: rgba(100,242,12,0.85);
  }
  .btn-row {
    display: flex; justify-content: flex-end; gap: 6px;
    margin-top: 16px;
  }

  .save-status {
    color: var(--err);
    font-size: 0.78rem;
    margin-right: auto;
    align-self: center;
  }
  /* Тонкая полоска для ошибки автосохранения — кнопок Cancel/Save больше
     нет, поэтому ошибка отображается отдельной строкой над/под формой. */
  .autosave-error {
    margin-top: 12px;
    padding: 6px 10px;
    border: 1px solid rgba(255, 107, 97, 0.35);
    background: rgba(255, 107, 97, 0.08);
    border-radius: 4px;
    color: var(--err);
    font-size: 0.78rem;
  }
  .autosave-error .save-status { margin-right: 0; }

  /* === Skills tab ====================================================== */

  .page-head .page-title-meta {
    color: var(--text-tertiary);
    font-weight: 400;
    font-size: 0.85rem;
    margin-left: 6px;
  }

  .cat-section {
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: 6px;
    margin-bottom: 8px;
    overflow: hidden;
  }
  .cat-header {
    display: flex; align-items: center; gap: 4px;
    padding: 5px 6px 5px 4px;
    background: var(--bg-tertiary);
    user-select: none;
    min-width: 0;
  }
  .cat-header > .material-symbols-outlined {
    font-size: 18px; color: var(--text-secondary); cursor: pointer;
    transition: transform 0.12s;
  }
  .cat-section.collapsed .cat-header > .material-symbols-outlined {
    transform: rotate(-90deg);
  }
  .cat-name-input {
    background: transparent;
    border: 1px solid transparent;
    color: var(--text-primary);
    font-size: 0.85rem; font-weight: 500;
    text-transform: uppercase; letter-spacing: 0.4px;
    padding: 2px 6px;
    border-radius: 3px;
    flex: 0 1 auto;
    min-width: 80px;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    font-family: inherit;
  }
  .cat-name-input:hover { border-color: var(--border); }
  .cat-name-input:focus { outline: none; border-color: var(--accent); background: var(--bg-secondary); }
  .cat-spacer { flex: 1; }
  .cat-add {
    color: var(--text-secondary); font-size: 0.72rem;
    display: inline-flex; align-items: center; gap: 2px;
    padding: 2px 6px; border-radius: 4px; cursor: pointer;
  }
  .cat-add:hover { background: var(--border); color: var(--accent); }
  .cat-add .material-symbols-outlined { font-size: 14px; }
  .cat-delete { color: var(--text-tertiary); cursor: pointer; padding: 2px; border-radius: 4px; }
  .cat-delete:hover { color: #ff6b61; background: rgba(255,107,97,0.12); }
  .cat-delete .material-symbols-outlined { font-size: 16px; }

  .cat-section.collapsed .skill-row { display: none; }

  .skill-row {
    display: grid;
    grid-template-columns: 150px 130px 1fr auto;
    align-items: center;
    gap: 10px;
    padding: 4px 8px;
    border-top: 1px solid var(--border);
    font-size: 0.83rem;
  }
  .skill-row:hover { background: rgba(100,242,12,0.04); }
  .skill-name-input {
    background: transparent;
    border: 1px solid transparent;
    color: var(--text-primary);
    font-size: 0.85rem;
    padding: 3px 6px; border-radius: 3px; width: 100%;
    font-family: inherit;
  }
  .skill-name-input:hover { border-color: var(--border); }
  .skill-name-input:focus { outline: none; border-color: var(--accent); background: var(--bg-secondary); }

  .level { display: flex; align-items: center; gap: 6px; }
  .level-num {
    font-variant-numeric: tabular-nums;
    color: var(--text-secondary);
    font-size: 0.72rem;
    min-width: 32px; text-align: right;
  }
  input[type=range].slider {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 16px; background: transparent; cursor: pointer;
    padding: 0; margin: 0;
    background-image: linear-gradient(to right, var(--accent) var(--pct, 50%), var(--bg-tertiary) var(--pct, 50%));
    background-size: 100% 4px;
    background-position: center;
    background-repeat: no-repeat;
  }
  input[type=range].slider::-webkit-slider-runnable-track { height: 4px; background: transparent; border-radius: 2px; }
  input[type=range].slider::-moz-range-track { height: 4px; background: transparent; border-radius: 2px; }
  input[type=range].slider::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 12px; height: 12px;
    background: var(--accent);
    border-radius: 50%;
    margin-top: -4px;
    border: 0;
    opacity: 0;
    transition: opacity 0.12s;
  }
  input[type=range].slider::-moz-range-thumb {
    width: 12px; height: 12px;
    background: var(--accent);
    border-radius: 50%;
    border: 0;
    opacity: 0;
    transition: opacity 0.12s;
  }
  .skill-row:hover input[type=range].slider::-webkit-slider-thumb,
  input[type=range].slider:active::-webkit-slider-thumb { opacity: 1; }
  .skill-row:hover input[type=range].slider::-moz-range-thumb,
  input[type=range].slider:active::-moz-range-thumb { opacity: 1; }

  .aliases { display: flex; flex-wrap: wrap; gap: 3px; align-items: center; }
  .chip {
    display: inline-flex; align-items: center; gap: 2px;
    padding: 1px 6px 1px 8px;
    background: var(--bg-tertiary);
    border-radius: 10px;
    font-size: 0.7rem;
    color: var(--text-secondary);
    max-width: 180px;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
  }
  .chip .x { color: var(--text-tertiary); cursor: pointer; font-size: 0.85rem; line-height: 1; padding: 0 2px; }
  .chip:hover .x { color: #ff6b61; }
  .chip-add {
    color: var(--text-tertiary); font-size: 0.7rem;
    cursor: pointer; padding: 1px 8px;
    border: 1px dashed var(--border); border-radius: 10px;
    position: relative;
  }
  .chip-add:hover { border-color: var(--accent); color: var(--accent); }
  .chip-empty { color: var(--text-tertiary); font-size: 0.72rem; font-style: italic; }
  .chip-input {
    background: var(--bg-secondary);
    border: 1px solid var(--accent);
    color: var(--text-primary);
    font-size: 0.7rem;
    padding: 1px 6px;
    border-radius: 10px;
    font-family: inherit;
    width: 110px;
    outline: none;
  }

  .skill-actions { display: flex; gap: 2px; }
  .skill-actions button.icon-btn:hover {
    color: #ff6b61;
    background: rgba(255,107,97,0.12);
  }
  .skill-actions .icon-btn .material-symbols-outlined { font-size: 16px; }

  .new-cat, .new-exp {
    text-align: center;
    padding: 8px;
    color: var(--text-tertiary);
    font-size: 0.78rem;
    cursor: pointer;
    border: 1px dashed var(--border);
    border-radius: 6px;
    margin-top: 4px;
  }
  .new-cat:hover, .new-exp:hover { color: var(--accent); border-color: var(--accent); }

  /* === Experience tab ================================================== */

  .exp-card {
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: 6px;
    margin-bottom: 8px;
    overflow: hidden;
  }
  .exp-header {
    display: grid;
    grid-template-columns: 18px 1fr auto;
    align-items: center;
    gap: 8px;
    padding: 7px 10px;
    background: var(--bg-tertiary);
    user-select: none;
    cursor: pointer;
  }
  .exp-header > .material-symbols-outlined {
    font-size: 18px; color: var(--text-secondary);
    transition: transform 0.12s;
  }
  .exp-card.collapsed .exp-header > .material-symbols-outlined {
    transform: rotate(-90deg);
  }
  .exp-summary {
    display: flex; flex-wrap: nowrap; align-items: baseline;
    gap: 4px 8px;
    color: var(--text-primary);
    font-size: 0.85rem;
    min-width: 0;
    overflow: hidden;
  }
  /* Company name takes precedence — it identifies the row — but it caps
     at half the summary so role still gets visible space. Both truncate
     with ellipsis; period stays fixed on the right. */
  .exp-summary > strong {
    flex: 0 1 auto;
    max-width: 50%;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .exp-summary > .role {
    flex: 0 1 auto;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: var(--text-secondary);
  }
  .exp-summary .period {
    color: var(--text-tertiary);
    font-size: 0.75rem;
    font-variant-numeric: tabular-nums;
    flex-shrink: 0;
    margin-left: auto;
  }
  .exp-delete { color: var(--text-tertiary); cursor: pointer; padding: 2px; border-radius: 4px; }
  .exp-delete:hover { color: #ff6b61; background: rgba(255,107,97,0.12); }
  .exp-delete .material-symbols-outlined { font-size: 16px; }

  .exp-body {
    padding: 10px 12px 12px;
    border-top: 1px solid var(--border);
    display: flex; flex-direction: column; gap: 10px;
  }
  .exp-card.collapsed .exp-body { display: none; }

  .field-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px 12px;
  }
  .field { display: flex; flex-direction: column; gap: 3px; }
  .field-row .span-2,
  .field-row .input.span-2,
  .field-row .date-pair.span-2,
  .field-row .textarea.span-2 { grid-column: span 2; }
  .field-label {
    font-size: 0.7rem;
    text-transform: uppercase;
    color: var(--text-tertiary);
    letter-spacing: 0.4px;
  }
  .field-row .input {
    font-size: 0.83rem;
    padding: 5px 8px;
    border-radius: 3px;
  }

  .input-date {
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    color: var(--text-primary);
    border-radius: 3px;
    padding: 5px 8px;
    font-size: 0.83rem;
    font-family: inherit;
    color-scheme: dark;
  }
  .input-date:focus { outline: none; border-color: var(--accent); }

  .date-pair { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .date-pair .input-date,
  .date-pair .input-date-text { flex: 1; min-width: 110px; width: auto; }
  .date-current {
    display: inline-flex; align-items: center; gap: 4px;
    color: var(--text-secondary);
    font-size: 0.75rem;
    cursor: pointer;
  }
  .date-current input { accent-color: var(--accent); }

  .list-block .field-label {
    display: flex; justify-content: space-between; align-items: center;
  }
  .list-add {
    color: var(--text-secondary); font-size: 0.7rem;
    cursor: pointer;
    display: inline-flex; align-items: center; gap: 2px;
    text-transform: none; letter-spacing: 0;
  }
  .list-add:hover { color: var(--accent); }
  .list-add .material-symbols-outlined { font-size: 14px; }

  .list-item {
    display: flex; align-items: flex-start; gap: 4px;
    margin-top: 3px;
  }
  .list-bullet {
    color: var(--text-tertiary);
    font-size: 0.83rem;
    line-height: 1.4;
    padding-top: 4px;
    user-select: none;
  }
  .list-input {
    flex: 1;
    background: transparent;
    border: 1px solid transparent;
    color: var(--text-primary);
    font-size: 0.83rem;
    padding: 4px 6px;
    border-radius: 3px;
    font-family: inherit;
    resize: none;
    overflow: hidden;
    line-height: 1.4;
    min-height: 22px;
  }
  .list-input:hover { border-color: var(--border); }
  .list-input:focus { outline: none; border-color: var(--accent); background: var(--bg-secondary); }
  .list-item .icon-btn { opacity: 0; transition: opacity 0.1s; flex-shrink: 0; }
  .list-item .icon-btn .material-symbols-outlined { font-size: 14px; }
  .list-item:hover .icon-btn { opacity: 1; }
  .list-item button.icon-btn:hover {
    color: #ff6b61;
    background: rgba(255,107,97,0.12);
  }

  .skills-block {
    display: flex; flex-wrap: wrap; gap: 3px;
    align-items: center;
    margin-top: 3px;
    position: relative;
  }
  .skill-picker {
    position: absolute;
    bottom: calc(100% + 4px);
    left: 0;
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: 6px;
    width: 280px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.45);
    z-index: 10;
  }
  .skill-picker-search {
    padding: 6px 8px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 6px;
  }
  .skill-picker-search .material-symbols-outlined { font-size: 16px; color: var(--text-tertiary); }
  .skill-picker-search input {
    background: transparent; border: 0; outline: none;
    color: var(--text-primary); font-size: 0.8rem;
    flex: 1; font-family: inherit;
  }
  .skill-picker-list { overflow-y: auto; padding: 4px 0; max-height: 240px; }
  .skill-picker-cat {
    font-size: 0.65rem;
    text-transform: uppercase;
    color: var(--text-tertiary);
    letter-spacing: 0.4px;
    padding: 4px 10px 2px;
  }
  .skill-picker-item {
    padding: 4px 10px;
    color: var(--text-primary);
    font-size: 0.8rem;
    cursor: pointer;
    display: flex; align-items: center; justify-content: space-between;
    gap: 6px;
  }
  .skill-picker-item:hover { background: var(--selected-bg); }
  .skill-picker-item.disabled { color: var(--text-tertiary); cursor: default; }
  .skill-picker-item.disabled:hover { background: transparent; }
  .skill-picker-item .lvl {
    color: var(--text-tertiary);
    font-size: 0.7rem;
    font-variant-numeric: tabular-nums;
  }
  .skill-picker-empty {
    padding: 10px;
    color: var(--text-tertiary);
    font-size: 0.78rem;
    text-align: center;
    font-style: italic;
  }

  /* === Z-index ladder ===================================================
   * Растёт сверху вниз — большее значение перекрывает меньшее. Метки
   * сверены grep'ом по реальным селекторам в этом файле (главный CSS):
   *
   *      2 — `.vac-raw-modal .raw-copy-btn` (sticky кнопка копирования
   *          в raw-text модалке вакансии)
   *     10 — `.skill-picker` (выпадающий picker скиллов в профиле)
   *     20 — `.vac-sort-menu` / `.status-popover` (компактные popover'ы
   *          внутри карточки вакансии)
   *     25 — `.vac-filter-popover` (фильтры на listing'е вакансий)
   *     30 — `.cdd-panel` (custom-dropdown panel — generic компонент)
   *     35 — `.vac-filter-dropdown-panel` (вложенный список каналов/
   *          компаний внутри vac-filter-popover'а)
   *     50 — `.more-popover` (actions-menu в карточке вакансии)
   *     60 — `.sys-settings-login-backdrop` (settings re-auth fullscreen)
   *    100 — `.bl-combobox-dropdown` (blacklist combobox)
   *    900 — `.unread-popup-backdrop` (overlay-trap под unread-popup)
   *    901 — `.unread-popup` (popup непрочитанных HR'ов)
   *   1000 — `.modal-backdrop` (showModal-confirm/prompt fullscreen)
   *  10000 — `.app-toast` (всегда поверх любого модала)
   */

  /* === Custom modal (replaces native prompt/confirm) =================== */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.55);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
  }
  .modal-dialog {
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px 18px;
    min-width: 320px;
    max-width: 440px;
    box-shadow: 0 12px 36px rgba(0, 0, 0, 0.6);
    display: flex; flex-direction: column; gap: 12px;
  }
  .modal-message {
    color: var(--text-primary);
    font-size: 0.88rem;
    line-height: 1.4;
  }
  .modal-input {
    background: var(--bg-tertiary);
    border: 1px solid var(--border);
    color: var(--text-primary);
    border-radius: 4px;
    padding: 6px 10px;
    font-size: 0.85rem;
    font-family: inherit;
  }
  .modal-input:focus { outline: none; border-color: var(--accent); }
  .modal-actions {
    display: flex; justify-content: flex-end; gap: 6px;
  }
  .btn.danger {
    background: rgba(255, 69, 58, 0.07);
    color: #ff6359;
    border-color: #ff6359;
    font-weight: 500;
  }
  .btn.danger:hover:not(:disabled) {
    background: rgba(255, 69, 58, 0.16);
    border-color: #ff6359;
  }

  /* === Custom date input (replaces ugly native picker) ================ */
  .input-date-text {
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    color: var(--text-primary);
    border-radius: 3px;
    padding: 5px 8px;
    font-size: 0.83rem;
    font-family: ui-monospace, Consolas, monospace;
    width: 100%;
  }
  .input-date-text:focus { outline: none; border-color: var(--accent); }
  .input-date-text.invalid { border-color: var(--err); }
  .input-date-text:disabled { opacity: 0.5; }

  /* === flatpickr theme overrides — match the app palette ============== */
  .flatpickr-calendar {
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: 6px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.55);
    font-family: inherit;
    color: var(--text-primary);
  }
  .flatpickr-calendar.arrowTop:before,
  .flatpickr-calendar.arrowTop:after,
  .flatpickr-calendar.arrowBottom:before,
  .flatpickr-calendar.arrowBottom:after { display: none; }

  .flatpickr-months,
  .flatpickr-months .flatpickr-month {
    background: var(--bg-secondary);
    color: var(--text-primary);
    fill: var(--text-primary);
    overflow: visible;
  }
  .flatpickr-current-month {
    color: var(--text-primary);
    font-size: 0.95rem;
    font-weight: 500;
    padding: 6px 0 4px;
  }
  .flatpickr-current-month .cur-month { font-weight: 500; }
  .flatpickr-current-month input.cur-year {
    color: var(--text-primary);
    background: transparent;
    font-weight: 500;
  }
  .flatpickr-current-month .numInputWrapper:hover,
  .flatpickr-current-month .numInputWrapper { background: transparent; }
  .flatpickr-monthDropdown-months {
    background: var(--bg-secondary) !important;
    color: var(--text-primary) !important;
    font-family: inherit !important;
  }
  .flatpickr-monthDropdown-month {
    background: var(--bg-secondary);
    color: var(--text-primary);
  }

  .flatpickr-prev-month,
  .flatpickr-next-month {
    fill: var(--text-secondary);
    padding: 6px 8px;
  }
  .flatpickr-prev-month:hover svg,
  .flatpickr-next-month:hover svg { fill: var(--accent) !important; }
  .flatpickr-prev-month svg, .flatpickr-next-month svg { fill: var(--text-secondary); }

  .flatpickr-weekdays,
  .flatpickr-weekdaycontainer { background: var(--bg-tertiary) !important; }
  .flatpickr-weekday,
  span.flatpickr-weekday {
    background: var(--bg-tertiary) !important;
    color: var(--text-secondary) !important;
    font-family: inherit !important;
    font-weight: 500 !important;
    font-size: 0.72rem !important;
  }

  .flatpickr-days, .dayContainer { background: var(--bg-secondary); }
  .flatpickr-day {
    color: var(--text-primary);
    font-family: inherit;
    font-size: 0.82rem;
    border-radius: 4px;
    border-color: transparent;
  }
  /* Default dark.css uses high-specificity `.prevMonthDay:focus` etc.
     selectors with a blue (#646c8c) background — beat them with !important
     so any hover / focus state stays inside our lime palette. */
  .flatpickr-day:hover,
  .flatpickr-day:focus,
  .flatpickr-day.prevMonthDay:hover,
  .flatpickr-day.prevMonthDay:focus,
  .flatpickr-day.nextMonthDay:hover,
  .flatpickr-day.nextMonthDay:focus {
    background: var(--selected-bg) !important;
    border-color: transparent !important;
    color: var(--text-primary) !important;
  }
  .flatpickr-day.today {
    border-color: var(--accent) !important;
    color: var(--text-primary) !important;
    background: transparent;
  }
  .flatpickr-day.today:hover,
  .flatpickr-day.today:focus {
    background: var(--selected-bg) !important;
    border-color: var(--accent) !important;
    color: var(--text-primary) !important;
  }
  .flatpickr-day.selected,
  .flatpickr-day.selected:hover,
  .flatpickr-day.selected:focus,
  .flatpickr-day.startRange,
  .flatpickr-day.endRange,
  .flatpickr-day.selected.inRange,
  .flatpickr-day.startRange.inRange,
  .flatpickr-day.endRange.inRange {
    background: var(--accent) !important;
    color: var(--bg-primary) !important;
    border-color: var(--accent) !important;
    font-weight: 500;
    box-shadow: none !important;
  }
  .flatpickr-day.prevMonthDay,
  .flatpickr-day.nextMonthDay {
    color: var(--text-tertiary);
  }
  .flatpickr-day.flatpickr-disabled {
    color: var(--text-tertiary);
    opacity: 0.4;
  }
  span.flatpickr-day.startRange,
  span.flatpickr-day.endRange,
  span.flatpickr-day.inRange {
    background: var(--selected-bg);
    border-color: var(--accent);
    color: var(--text-primary);
  }

  /* === Bottom bar ====================================================== */

  .bottom-bar {
    grid-column: 1 / span 2; grid-row: 2;
    background: var(--bg-secondary);
    border-top: 1px solid var(--border);
    display: grid;
    grid-template-columns: 1fr 1fr;
    align-items: center;
    padding: 0 10px;
    font-size: 0.75rem;
    position: relative;
  }
  .bb-left   { display: flex; align-items: center; gap: 4px; }
  .bb-right  { display: flex; align-items: center; gap: 6px; justify-self: end; }
  /* Center cluster anchors its DIVIDER (between bars and caption) to the
     footer's geometric center via a zero-width absolute axis at left:50%.
     Bars hang to the left of that line, caption to the right — so the
     caption text changing length doesn't shift the bars. */
  .bb-center {
    position: absolute;
    left: 50%; top: 0; bottom: 0;
    width: 0;
    pointer-events: none;
  }
  .bb-center .progress-wrap {
    position: relative;
    height: 100%;
    width: 0;
    pointer-events: auto;
  }

  .health {
    display: flex; align-items: center; gap: 5px;
    color: var(--text-secondary);
    cursor: default;
  }
  .health .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--text-tertiary);
    box-shadow: none;
    transition: background 0.2s ease, box-shadow 0.2s ease;
  }
  /* LED-style glow (same visual language as .tl-item.current .tl-dot in
     the vacancy timeline). Core uses --accent so it matches the neon lime
     on the second screenshot; inner/outer halos stay soft — dot stays 8×8. */
  .health[data-state="ok"] .dot {
    background: var(--accent);
    box-shadow:
      0 0 0 2px rgba(100, 242, 12, 0.25),
      0 0 6px 1px rgba(100, 242, 12, 0.45);
  }
  .health[data-state="err"] .dot {
    background: var(--err);
    box-shadow:
      0 0 0 2px rgba(255, 69, 58, 0.28),
      0 0 6px 1px rgba(255, 69, 58, 0.4);
  }
  .health[data-state="warn"] .dot {
    background: var(--warn);
    box-shadow:
      0 0 0 2px rgba(255, 214, 10, 0.28),
      0 0 6px 1px rgba(255, 214, 10, 0.4);
  }
  .health-label {
    font-family: ui-monospace, Consolas, monospace;
    font-size: 0.7rem;
    letter-spacing: 0.3px;
  }

  .icon-btn {
    width: 26px; height: 26px;
    display: inline-flex; align-items: center; justify-content: center;
    color: var(--text-secondary);
    border: 0; background: transparent;
    border-radius: 4px;
    cursor: pointer;
    transition: color 0.1s, background 0.1s;
  }
  .icon-btn:hover:not(:disabled) { color: var(--text-primary); background: var(--bg-tertiary); }
  .icon-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .icon-btn.is-disabled { opacity: 0.4; cursor: not-allowed; }
  .icon-btn.is-disabled:hover { color: var(--text-secondary); background: transparent; }
  .icon-btn .material-symbols-outlined { font-size: 18px; }
  /* Local Material Symbols TTF doesn't carry the FILL axis, so both
     "play" and "stop" are drawn in pure CSS to get a solid filled look. */
  #refresh .material-symbols-outlined { display: none; }
  #refresh::before {
    content: '';
    display: block;
  }
  #refresh:not([data-running="true"])::before {
    width: 0; height: 0;
    border-style: solid;
    border-width: 8px 0 8px 13px;
    border-color: transparent transparent transparent var(--ok);
  }
  #refresh[data-running="true"]::before {
    width: 13px; height: 13px;
    background: var(--err);
    border-radius: 1px;
  }
  #refresh[data-running="true"]:hover {
    background: rgba(255,69,58,0.12);
  }

  /* Bars sit to the left of the centre axis, caption to the right; both
     anchored independently so each side changing size never moves the other. */
  .progress-bars {
    position: absolute;
    right: 8px;
    top: 50%;
    transform: translateY(-50%);
    display: flex; flex-direction: column;
    gap: 5px;
    width: 220px;
  }
  .progress-caption {
    position: absolute;
    left: 8px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-secondary);
    font-size: 0.72rem;
    line-height: 1.1;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .progress-bar {
    width: 100%;
    height: 3px;
    background: var(--bg-tertiary);
    border-radius: 2px;
    overflow: hidden;
    position: relative;
  }
  .progress-fill {
    height: 100%; width: 0%;
    background: var(--accent);
    border-radius: 2px;
    transition: width 0.2s ease-out;
  }
  .progress-bar[data-indeterminate="true"] .progress-fill {
    width: 30%;
    animation: slide 1.4s linear infinite;
  }
  @keyframes slide {
    from { transform: translateX(-100%); }
    to   { transform: translateX(330%); }
  }

  .badge-unread {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 2px 7px;
    border-radius: 10px;
    background: rgba(255,255,255,0.04);
    color: var(--text-tertiary);
    font-size: 0.7rem;
    border: 0;
    cursor: pointer;
    transition: background 0.1s, color 0.1s;
  }
  .badge-unread[data-has-unread="true"] {
    background: var(--selected-bg);
    color: var(--accent);
  }
  .badge-unread:hover { background: rgba(255,255,255,0.08); }
  .badge-unread[data-has-unread="true"]:hover { background: rgba(100,242,12,0.22); }
  .badge-unread .material-symbols-outlined { font-size: 13px; }

  /* Footer unread pop-up — anchored above the badge, click outside closes. */
  .unread-popup-backdrop {
    position: fixed; inset: 0; background: transparent; z-index: 900;
  }
  .unread-popup {
    position: fixed; right: 12px; bottom: 38px;
    width: 280px; max-height: 320px;
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: 6px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    display: flex; flex-direction: column;
    z-index: 901;
    overflow: hidden;
  }
  .unread-popup-empty {
    padding: 12px 14px;
    color: var(--text-tertiary);
    font-size: 0.78rem;
    text-align: center;
  }
  .unread-popup-list { overflow-y: auto; }
  .unread-popup-row {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 10px;
    cursor: pointer;
    color: var(--text-primary);
    border-bottom: 1px solid var(--border-subtle, rgba(255,255,255,0.04));
  }
  .unread-popup-row:last-child { border-bottom: 0; }
  .unread-popup-row:hover { background: rgba(255,255,255,0.04); }
  .unread-popup-name {
    flex: 1; min-width: 0;
    white-space: nowrap; text-overflow: ellipsis; overflow: hidden;
    font-size: 0.82rem;
  }
  .unread-popup-sub {
    font-size: 0.7rem; color: var(--text-tertiary);
  }
  .unread-popup-count {
    background: var(--selected-bg);
    color: var(--accent);
    font-size: 0.7rem;
    padding: 1px 6px;
    border-radius: 8px;
    min-width: 18px; text-align: center;
  }

  /* 3-position toggle: knob slides between Off (left) / DM Only (center) /
     Full (right) inside a fixed-width track. */
  .mode-control {
    display: inline-flex; align-items: center; gap: 8px;
    cursor: pointer;
    background: transparent; border: 0; padding: 0;
    font: inherit;
  }
  .mode-text {
    font-size: 0.72rem;
    color: var(--text-secondary);
    min-width: 56px;
    text-align: right;
    transition: color 0.15s;
  }
  .mode-track {
    position: relative;
    width: 44px; height: 16px;
    border-radius: 8px;
    background: var(--bg-tertiary);
    border: 1px solid var(--border);
    transition: border-color 0.15s;
  }
  .mode-knob {
    position: absolute;
    top: 1px;
    width: 12px; height: 12px;
    border-radius: 50%;
    background: var(--text-tertiary);
    transition: left 0.18s ease, background 0.18s;
  }
  .mode-control[data-mode="Off"]     .mode-knob { left: 1px;  background: var(--err); }
  .mode-control[data-mode="DM Only"] .mode-knob { left: 15px; background: var(--warn); }
  .mode-control[data-mode="Full"]    .mode-knob { left: 29px; background: var(--accent); }
  .mode-control[data-mode="Off"]     .mode-text  { color: var(--err); }
  .mode-control[data-mode="DM Only"] .mode-text  { color: var(--warn); }
  .mode-control[data-mode="Full"]    .mode-text  { color: var(--accent); }
  .mode-control[data-mode="Off"]     .mode-track { border-color: rgba(255,69,58,0.6);  }
  .mode-control[data-mode="DM Only"] .mode-track { border-color: rgba(255,214,10,0.6); }
  .mode-control[data-mode="Full"]    .mode-track { border-color: rgba(100,242,12,0.6); }
  .mode-control.is-disabled { opacity: 0.5; cursor: not-allowed; }

  .hidden { display: none !important; }

  /* === Vacancies section ============================================== */

  .vacancies-layout {
    display: grid;
    grid-template-columns: 275px 1fr;
    height: 100%;
    min-height: 0;
  }
  .vac-list-pane {
    border-right: 1px solid var(--border);
    background: var(--bg-secondary);
    display: flex; flex-direction: column;
    min-height: 0;
  }
  .vac-list-toolbar {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 8px;
    border-bottom: 1px solid var(--border);
    background: var(--bg-tertiary);
    position: relative;
  }
  .vac-search-box {
    flex: 1;
    min-width: 0;
    display: flex;
    align-items: center;
    gap: 6px;
    background: transparent;
    border: none;
    border-radius: 4px;
    padding: 4px 6px;
  }
  .vac-search-box .material-symbols-outlined {
    font-size: 14px;
    color: var(--text-tertiary);
  }
  .vac-search-box input {
    flex: 1;
    min-width: 0;
    border: none;
    background: transparent;
    color: var(--text-primary);
    font-size: 0.78rem;
    font-family: inherit;
  }
  .vac-search-box input:focus { outline: none; }
  .vac-search-clear {
    width: 18px;
    height: 18px;
    border: none;
    background: transparent;
    color: var(--text-tertiary);
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    padding: 0;
    flex-shrink: 0;
  }
  .vac-search-clear:hover {
    color: var(--text-secondary);
    background: rgba(255, 255, 255, 0.06);
  }
  .vac-search-clear .material-symbols-outlined { font-size: 14px; }
  .vac-toolbar-btn {
    width: 26px;
    height: 26px;
    border-radius: 4px;
    border: none;
    background: transparent;
    color: var(--text-secondary);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
  }
  .vac-toolbar-btn:hover { border-color: var(--accent); color: var(--text-primary); }
  .vac-toolbar-btn.active { color: var(--accent); background: rgba(100,242,12,0.12); }
  .vac-toolbar-btn .material-symbols-outlined { font-size: 16px; }
  .vac-sort-menu {
    position: absolute;
    top: calc(100% + 4px);
    right: 8px;
    width: 200px;
    background: var(--bg-secondary);
    border: 1px solid var(--border);

  .vac-sort-option {
    width: 100%;
    border: none;
    background: transparent;
    color: var(--text-primary);
    font-size: 0.78rem;
    padding: 5px 8px;
    border-radius: 4px;
    text-align: left;
    cursor: pointer;

  .vac-sort-option:hover { background: rgba(100, 242, 12, 0.08); }
  .vac-sort-option.active {
    background: rgba(100, 242, 12, 0.16);
    color: var(--accent);
  }
  .vac-filter-popover {
    position: absolute;
    top: calc(100% + 4px);
    left: 8px;
    width: 340px;
    max-height: 520px;
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: 6px;
    box-shadow: 0 8px 22px rgba(0, 0, 0, 0.55);
    z-index: 25;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .vac-filter-head {
    display: flex; align-items: center; gap: 6px;
    padding: 8px 10px;
    border-bottom: 1px solid var(--border);
    background: var(--bg-tertiary);
    color: var(--text-primary);
    font-size: 0.8rem;
  }
  .vac-filter-head .material-symbols-outlined { font-size: 16px; color: var(--text-secondary); }
  .vac-filter-head .title { font-weight: 500; flex: 1; }
  .vac-filter-head .meta { color: var(--text-tertiary); font-size: 0.72rem; }
  .vac-filter-close {
    width: 20px; height: 20px; border: none; background: transparent; color: var(--text-tertiary);
    display: inline-flex; align-items: center; justify-content: center; border-radius: 3px; cursor: pointer;
  }
  .vac-filter-close:hover { color: var(--text-primary); background: rgba(255,255,255,0.06); }
  .vac-filter-close .material-symbols-outlined { font-size: 15px; }
  .vac-filter-body { overflow-y: auto; min-height: 0; flex: 1; }
  .vac-filter-group { padding: 6px 10px; border-bottom: 1px solid var(--border); }
  .vac-filter-group:last-child { border-bottom: none; }
  .vac-filter-label { color: var(--text-tertiary); font-size: 0.66rem; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.3px; }
  .vac-filter-chips { display: flex; flex-wrap: wrap; gap: 4px; }
  .vac-filter-chip {
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-secondary);
    border-radius: 10px;
    font-size: 0.72rem;
    padding: 2px 8px;
    cursor: pointer;
  }
  .vac-filter-chip.selected { background: rgba(100,242,12,0.2); border-color: var(--accent); color: var(--accent); }
  .vac-filter-chip.more { color: var(--text-tertiary); }
  .vac-filter-chip.status-chip { display: inline-flex; align-items: center; gap: 4px; }
  .vac-filter-chip .status-dot { width: 7px; height: 7px; }
  .vac-filter-input-row { display: flex; gap: 6px; }
  .vac-filter-input-row input, .vac-filter-select, .vac-filter-companies-search, .vac-filter-channel-search {
    width: 100%;
    background: var(--bg-tertiary);
    border: 1px solid var(--border);
    color: var(--text-primary);

    padding: 4px 6px;
    font-size: 0.76rem;
    font-family: inherit;
  }
  .vac-filter-input-row input:focus, .vac-filter-select:focus, .vac-filter-companies-search:focus, .vac-filter-channel-search:focus {
    outline: none; border-color: var(--accent);
  }
  .vac-filter-footer {
    display: flex; align-items: center; justify-content: space-between; gap: 6px;
    padding: 8px 10px;
    border-top: 1px solid var(--border);
    background: var(--bg-tertiary);
  }
  .vac-filter-footer-right { display: inline-flex; gap: 6px; }
  .vac-filter-footer .btn { padding: 4px 10px; font-size: 0.76rem; }
  .vac-filter-radios { display: flex; flex-wrap: wrap; gap: 5px; }
  .vac-filter-date-range { display: flex; gap: 6px; margin-top: 6px; }
  .vac-filter-dropdown-wrap { position: relative; }
  .vac-filter-dropdown {
    width: 100%;
    background: var(--bg-tertiary);
    border: 1px solid var(--border);
    color: var(--text-primary);
    border-radius: 4px;
    padding: 4px 6px;
    font-size: 0.76rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
  }
  .vac-filter-dropdown .material-symbols-outlined { font-size: 14px; color: var(--text-tertiary); }
  .vac-filter-dropdown-panel {
    position: absolute;
    top: calc(100% + 4px);
    left: 0;
    right: 0;
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 6px;
    background: var(--bg-tertiary);
    box-shadow: 0 8px 18px rgba(0, 0, 0, 0.45);
    z-index: 35;
  }
  .vac-filter-channel-list { max-height: 140px; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; margin-top: 6px; }
  .vac-filter-channel-item { display: inline-flex; align-items: center; gap: 6px; font-size: 0.74rem; color: var(--text-secondary); }
  .vac-filter-channel-item input { accent-color: var(--accent); }
  .vac-list { flex: 1; overflow-y: auto; }

  .vac-row {
    padding: 8px 10px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    display: flex; flex-direction: column; gap: 4px;
  }
  .vac-row:hover { background: rgba(100,242,12,0.04); }
  .vac-row.selected {
    background: var(--selected-bg);
    border-left: 2px solid var(--accent);
    padding-left: 8px;
  }
  .vac-row-head { display: flex; align-items: center; gap: 6px; min-width: 0; }

  .status-dot {
    width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
  }
  .status-dot.new         { background: #ffffff; }
  .status-dot.applied     { background: #0a84ff; }
  .status-dot.answered    { background: #5ac8fa; }
  .status-dot.test        { background: #5ce6c0; }
  .status-dot.invitation  { background: #34c759; }
  .status-dot.in-progress { background: #64f20c; }
  .status-dot.offer       { background: #af52de; }
  .status-dot.decline     { background: #ff453a; }
  .status-dot.ghosting    { background: #ffd60a; }
  .status-dot.scam        { background: #ff9f0a; }
  .status-dot.not-fit     { background: #48484a; }

  .vac-score {
    font-variant-numeric: tabular-nums;
    font-size: 0.7rem;
    color: var(--text-tertiary);
    background: var(--bg-tertiary);
    padding: 0 5px;
    border-radius: 8px;
    flex-shrink: 0;
  }
  .vac-title {
    color: var(--text-primary);
    font-size: 0.83rem;
    font-weight: 500;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    flex: 1; min-width: 0;
  }
  .vac-meta {
    color: var(--text-secondary);
    font-size: 0.72rem;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .vac-meta .v-co { color: var(--text-primary); }
  .vac-meta .sep { color: var(--text-tertiary); margin: 0 3px; }
  .vac-meta .when { color: var(--text-tertiary); }

  .vac-stack {
    display: flex; gap: 3px; flex-wrap: nowrap; overflow: hidden;
  }
  .mini-chip {
    background: var(--bg-tertiary);
    color: var(--text-secondary);
    border-radius: 8px;
    padding: 0 5px;
    font-size: 0.65rem;
    white-space: nowrap;
  }
  .mini-chip.more { color: var(--text-tertiary); }
  .mini-chip.matched {
    background: rgba(100, 242, 12, 0.18);
    color: var(--accent);
  }

  .vac-detail-pane {
    background: var(--bg-primary);
    overflow-y: auto;
    padding: 14px 18px;
    min-height: 0;
  }
  .vac-detail-empty {
    display: flex; align-items: center; justify-content: center;
    height: 100%;
    color: var(--text-tertiary);
    font-size: 0.85rem;
    text-align: center;
  }

  .vac-list-empty {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 8px;
    height: 100%;
    padding: 24px;
    color: var(--text-tertiary);
    font-size: 0.82rem;
    text-align: center;
  }
  .vac-list-empty .material-symbols-outlined {
    font-size: 32px;
    opacity: 0.45;
  }

  /* Detail pane sections */
  .det-head {
    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: start;
    gap: 8px;
    margin-bottom: 10px;
    position: relative;
  }
  .status-wrap {
    position: relative;
    display: inline-flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 4px;
  }
  .status-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    /* Fixed width to prevent layout jump between "New"/"Answered"/
       "In Progress", but kept tight to the longest label. */
    width: 108px;
    box-sizing: border-box;
    padding: 3px 8px 3px 7px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--bg-secondary);
    color: var(--text-primary);
    font-size: 0.68rem;
    letter-spacing: 0.02em;
    cursor: pointer;
  }
  .status-badge .label {
    flex: 1;
    min-width: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    text-align: left;
  }
  .status-badge:hover { border-color: var(--accent); }
  .status-badge .material-symbols-outlined {
    font-size: 13px;
    color: #64f20c !important;
    transition: transform 0.15s ease;
  }
  /* При открытом status-popover крутим chevron на 180° — лёгкая анимация
     даёт визуальное подтверждение, что попап раскрыт. */
  .status-wrap.popover-open .status-badge .material-symbols-outlined {
    transform: rotate(180deg);
  }
  /* Поп-ап смены статуса — структурно повторяет docs/ui-mockups/04-vacancies.html
     (.popover.status-popover). Жёстко выравниваем шрифты/отступы под референс,
     иначе поп-ап «вытягивается» из-за внутренних паддингов. */
  .status-popover {
    position: absolute;
    top: calc(100% + 4px);
    left: 0;
    width: 240px;
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: 6px;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.45);
    padding: 8px 0 6px;
    z-index: 20;
    cursor: default;
  }
  .popover-title {
    padding: 0 10px 6px;
    font-size: 0.7rem;
    text-transform: uppercase;
    color: var(--text-tertiary);
    letter-spacing: 0.4px;
  }
  /* More-menu: match docs/ui-mockups/04-vacancies.html (.popover.more-popover + .menu-item) */
  .actions-menu {
    position: relative;
    justify-self: end;
  }
  .more-popover {
    position: absolute;
    top: calc(100% + 4px);
    right: 0;
    width: 250px;
    max-height: 70vh;
    overflow-y: auto;
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 4px 0;
    z-index: 50;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.45);
    cursor: default;
  }
  /* Референс: docs/ui-mockups/04-vacancies.html — .menu-item 0.78rem / 5px 12px. */
  button.menu-item {
    width: 100%;
    margin: 0;
    border: 0;
    background: transparent;
    font-family: inherit;
    font-size: 0.78rem;
    font-weight: inherit;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 5px 12px;
    border-radius: 3px;
    cursor: pointer;
    text-align: left;
    color: var(--text-primary);
    appearance: none;
    -webkit-appearance: none;
  }
  button.menu-item::-moz-focus-inner {
    padding: 0;
    border: 0;
  }
  .menu-item:hover:not(:disabled):not(.is-disabled) {
    background: var(--selected-bg);
  }
  .menu-item .material-symbols-outlined {
    font-size: 14px;
    color: var(--text-secondary);
    flex-shrink: 0;
  }
  .menu-item.is-disabled,
  .menu-item:disabled {
    opacity: 0.55;
    color: var(--text-tertiary);
    cursor: not-allowed;
  }
  .menu-item.is-disabled .material-symbols-outlined,
  .menu-item:disabled .material-symbols-outlined {
    color: var(--text-tertiary);
  }
  .menu-item.is-disabled:hover,
  .menu-item:disabled:hover {
    background: transparent;
  }
  .menu-divider {
    height: 1px;
    border: 0;
    background: var(--border);
    margin: 3px 0;
  }
  .menu-item.danger {
    color: #ff6b61;
  }
  .menu-item.danger .material-symbols-outlined {
    color: #ff6b61;
  }
  .menu-item.danger:hover:not(:disabled):not(.is-disabled) {
    background: rgba(255, 107, 97, 0.12);
    color: #ff8a82;
  }
  .menu-item.danger:hover:not(:disabled):not(.is-disabled) .material-symbols-outlined {
    color: #ff8a82;
  }
  .app-toast {
    position: fixed;
    bottom: 48px;
    left: 50%;
    transform: translateX(-50%) translateY(10px);
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    color: var(--text-primary);
    padding: 8px 14px;
    border-radius: 8px;
    font-size: 0.78rem;
    z-index: 10000;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease, transform 0.2s ease;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
    max-width: min(420px, 92vw);
    text-align: center;
  }
  .app-toast.visible {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
  .app-toast.danger {
    background: #3a1a18;
    border-color: #ff6b61;
    color: #ffb3ad;
  }
  /* Модалка исходного текста вакансии — docs/ui-mockups/04-vacancies.html */
  .vac-raw-modal {
    width: min(720px, 92vw);
    max-height: min(440px, 88vh);
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: 8px;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    padding: 0;
  }
  .vac-raw-modal .modal-head {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    border-bottom: 1px solid var(--border);
    background: var(--bg-tertiary);
  }
  .vac-raw-modal .modal-head > .material-symbols-outlined:first-of-type {
    font-size: 18px;
    color: var(--text-secondary);
    flex-shrink: 0;
  }
  .vac-raw-modal .modal-title {
    color: var(--text-primary);
    font-size: 0.85rem;
    font-weight: 500;
    flex: 1;
    min-width: 0;
  }
  .vac-raw-modal .modal-title-meta {
    color: var(--text-tertiary);
    font-size: 0.72rem;
    font-weight: 400;
    margin-left: 6px;
  }
  .vac-raw-modal button.modal-close {
    color: var(--text-tertiary);
    cursor: pointer;
    padding: 2px;
    border-radius: 3px;
    border: none;
    background: transparent;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .vac-raw-modal button.modal-close:hover {
    color: var(--text-primary);
    background: var(--border);
  }
  .vac-raw-modal button.modal-close .material-symbols-outlined {
    font-size: 16px;
  }
  .vac-raw-modal .modal-body {
    flex: 1;
    overflow-y: auto;
    min-height: 0;
    position: relative;
  }
  /* Иконка-копирование внутри текстового поля. Sticky + float держат её
     в правом верхнем углу видимой области даже при скролле длинного raw_text;
     полупрозрачная по дефолту, чтобы не перекрывала чтение. */
  .vac-raw-modal .raw-copy-btn {
    position: sticky;
    top: 8px;
    float: right;
    margin: 8px 8px -28px 0;
    width: 26px;
    height: 26px;
    z-index: 2;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: rgba(45, 45, 47, 0.55);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 0;
    cursor: pointer;
    color: var(--text-secondary);
    opacity: 0.55;
    transition: opacity 0.15s ease, background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
  }
  .vac-raw-modal .raw-copy-btn:hover {
    opacity: 1;
    background: var(--bg-tertiary);
    color: var(--text-primary);
    border-color: var(--accent);
  }
  .vac-raw-modal .raw-copy-btn:active { transform: scale(0.96); }
  .vac-raw-modal .raw-copy-btn .material-symbols-outlined {
    font-size: 16px;
    display: block;
  }
  .vac-raw-modal .modal-footer {
    display: flex;
    justify-content: flex-end;
    gap: 6px;
    flex-wrap: wrap;
    padding: 8px 12px;
    border-top: 1px solid var(--border);
    background: var(--bg-tertiary);
  }
  .vac-raw-modal .modal-footer .btn {
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .vac-raw-modal .modal-footer .btn .material-symbols-outlined {
    font-size: 14px;
  }
  .vac-raw-modal .raw-meta {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    padding: 6px 12px;
    background: var(--bg-tertiary);
    border-bottom: 1px solid var(--border);
    font-size: 0.7rem;
  }
  .vac-raw-modal .raw-meta-chip {
    background: var(--bg-secondary);
    color: var(--text-secondary);
    padding: 1px 6px;
    border-radius: 8px;
    display: inline-flex;
    align-items: center;
    gap: 3px;
  }
  .vac-raw-modal .raw-meta-chip .material-symbols-outlined {
    font-size: 12px;
  }
  .vac-raw-modal pre.raw-text {
    margin: 0;
    padding: 12px;
    color: var(--text-primary);
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 0.78rem;
    white-space: pre-wrap;
    line-height: 1.5;
    border: none;
    background: transparent;
  }
  /* Pickers «Связать с HR / компанией» (§5, §6). Reuses .modal-backdrop +
     .modal-head + .modal-footer from .vac-raw-modal so the chrome matches.
     Fixed height (а не max-height) — иначе при коротком списке (1-2
     элемента) окно ужимается и выглядит как тостер. На мелком экране
     ужимаемся до 88vh, чтобы не вылезать за пределы viewport. */
  .vac-picker-modal {
    width: min(480px, 92vw);
    height: min(420px, 88vh);
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: 8px;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    padding: 0;
  }
  .vac-picker-modal .modal-head {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    border-bottom: 1px solid var(--border);
    background: var(--bg-tertiary);
  }
  .vac-picker-modal .modal-head > .material-symbols-outlined:first-of-type {
    font-size: 18px;
    color: var(--text-secondary);
    flex-shrink: 0;
  }
  .vac-picker-modal .modal-title {
    color: var(--text-primary);
    font-size: 0.85rem;
    font-weight: 500;
    flex: 1;
    min-width: 0;
  }
  .vac-picker-modal button.modal-close {
    color: var(--text-tertiary);
    cursor: pointer;
    padding: 2px;
    border-radius: 3px;
    border: none;
    background: transparent;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .vac-picker-modal button.modal-close:hover {
    color: var(--text-primary);
    background: var(--border);
  }
  .vac-picker-modal button.modal-close .material-symbols-outlined {
    font-size: 16px;
  }
  .vac-picker-modal .picker-search-bar {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 10px;
    background: var(--bg-tertiary);
    border-bottom: 1px solid var(--border);
  }
  .vac-picker-modal .picker-search-bar .material-symbols-outlined {
    font-size: 14px;
    color: var(--text-tertiary);
  }
  .vac-picker-modal .picker-search-bar input {
    flex: 1;
    background: transparent;
    border: none;
    color: var(--text-primary);
    font-family: inherit;
    font-size: 0.82rem;
    padding: 2px 0;
    min-width: 0;
  }
  .vac-picker-modal .picker-search-bar input:focus { outline: none; }
  .vac-picker-modal .picker-list {
    flex: 1;
    overflow-y: auto;
    min-height: 0;
    padding: 4px;
  }
  .vac-picker-modal .picker-empty {
    padding: 16px 12px;
    color: var(--text-tertiary);
    font-size: 0.78rem;
    text-align: center;
    font-style: italic;
  }
  .vac-picker-modal .picker-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 8px;

  .vac-picker-modal .picker-row:hover {

  .vac-picker-modal .picker-row.selected {

  .vac-picker-modal .picker-row.current {

  .vac-picker-modal .picker-row.is-disabled {

  .vac-picker-modal .picker-row .hr-avatar {

  }
  .vac-picker-modal .picker-info {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 1px;
  }
  .vac-picker-modal .picker-name {
    color: var(--text-primary);
    font-size: 0.82rem;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .vac-picker-modal .picker-name .picker-current-mark {
    color: var(--text-tertiary);
    font-weight: 400;
    font-size: 0.72rem;
