  }
  .vac-picker-modal .picker-sub {
    color: var(--text-tertiary);
    font-size: 0.72rem;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .vac-picker-modal .picker-meta {
    flex-shrink: 0;
  }
  .vac-picker-modal .vac-count {
    background: var(--bg-tertiary);
    color: var(--text-secondary);
    border-radius: 10px;
    padding: 1px 8px;
    font-size: 0.7rem;
    font-variant-numeric: tabular-nums;
  }
  .vac-picker-modal .picker-create {
    border-top: 1px solid var(--border);
    background: var(--bg-tertiary);
  }
  .vac-picker-modal .picker-create-toggle {
    width: 100%;
    background: transparent;
    border: none;
    color: var(--text-secondary);
    font-family: inherit;
    font-size: 0.78rem;
    padding: 8px 12px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    text-align: left;
  }
  .vac-picker-modal .picker-create-toggle:hover { background: rgba(100, 242, 12, 0.06); color: var(--accent); }
  .vac-picker-modal .picker-create-toggle .material-symbols-outlined {
    font-size: 14px;
  }
  /* Create-mode: форма подменяет search + list + create-toggle. Окно
     поджимается по контенту (без фикс-высоты picker-режима) и сужается
     до ~380px — см. docs/ui-mockups/05-contacts-hr.html .add-modal. */
  .vac-picker-modal.creating {
    width: min(380px, 92vw);
    height: auto;
    max-height: 88vh;
  }
  .vac-picker-modal .picker-create-pane {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .vac-picker-modal .picker-create-pane input {
    background: var(--bg-tertiary);
    border: 1px solid var(--border);
    color: var(--text-primary);
    border-radius: 3px;
    padding: 6px 9px;
    font-size: 0.83rem;
    font-family: inherit;
  }
  .vac-picker-modal .picker-create-pane input::placeholder,
  .vac-picker-modal .picker-create-pane textarea::placeholder {
    color: var(--text-tertiary);
  }
  .vac-picker-modal .picker-create-pane input:focus {
    outline: none; border-color: var(--accent);
  }
  .vac-picker-modal .picker-create-pane textarea {
    background: var(--bg-tertiary);
    border: 1px solid var(--border);
    color: var(--text-primary);
    border-radius: 3px;
    padding: 6px 9px;
    font-size: 0.83rem;
    font-family: inherit;
    min-height: 50px;
    resize: vertical;
  }
  .vac-picker-modal .picker-create-pane textarea:focus {
    outline: none; border-color: var(--accent);
  }
  .vac-picker-modal .modal-footer {
    display: flex;
    justify-content: flex-end;
    gap: 6px;
    padding: 8px 12px;
    border-top: 1px solid var(--border);
    background: var(--bg-tertiary);
  }
  .vac-picker-modal .modal-footer .btn {
    padding: 4px 12px; font-size: 0.78rem;
  }
  .status-options {
    display: flex;
    flex-direction: column;
    padding: 0 4px 4px;
    overflow-y: auto;
  }
  .status-option {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 4px 8px;
    border-radius: 3px;
    color: var(--text-primary);
    font-size: 0.78rem;
    cursor: pointer;
  }
  .status-option:hover { background: var(--selected-bg); }
  .status-option input { accent-color: var(--accent); }
  .popover-comment {
    width: calc(100% - 16px);
    margin: 4px 8px;
    background: var(--bg-tertiary);
    border: 1px solid var(--border);
    color: var(--text-primary);
    font-size: 0.78rem;
    font-family: inherit;
    padding: 4px 6px;
    border-radius: 3px;
    resize: none;
    min-height: 40px;
    box-sizing: border-box;
    line-height: 1.35;
  }
  .popover-comment:focus { outline: none; border-color: var(--accent); }
  .popover-actions {
    display: flex;
    justify-content: flex-end;
    gap: 4px;
    padding: 6px 8px 4px;
  }
  .popover-actions .btn { padding: 4px 10px; font-size: 0.76rem; }
  .det-title {
    color: var(--text-primary);
    font-size: 1.05rem;
    font-weight: 500;
    line-height: 1.3;
    flex: 1;
    word-break: break-word;
  }
  .det-info {
    display: flex; flex-wrap: wrap; gap: 4px;
    margin-bottom: 10px;
  }
  .info-chip {
    background: var(--bg-tertiary);
    color: var(--text-secondary);
    border-radius: 10px;
    padding: 2px 8px;
    font-size: 0.72rem;
    display: inline-flex; align-items: center; gap: 4px;
  }
  .info-chip.score {
    background: var(--accent);
    color: var(--bg-primary);
    font-weight: 500;
  }
  .info-chip.score.score-warn {
    background: #f0c419;
    color: var(--bg-primary);
  }
  .info-chip.score.score-bad {
    background: #ff453a;
    color: var(--bg-primary);
  }
  .vac-score { color: var(--accent); }
  .vac-score.score-warn { color: #f0c419; }
  .vac-score.score-bad  { color: #ff453a; }
  .info-chip .material-symbols-outlined {
    font-size: 12px;
  }
  .det-section {
    margin-bottom: 10px;
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 8px 10px;
  }
  .det-section p {
    color: var(--text-secondary);
    font-size: 0.82rem;
    line-height: 1.45;
    white-space: pre-wrap;
    margin: 0;
  }
  .det-stack { display: flex; flex-wrap: wrap; gap: 3px; }
  .stack-chip {
    background: var(--bg-tertiary);
    color: var(--text-primary);
    border-radius: 10px;
    padding: 1px 8px;
    font-size: 0.72rem;
  }
  .stack-chip.matched {
    background: rgba(100, 242, 12, 0.18);
    color: var(--accent);
  }

  /* Contact pair (HR / Company) */
  .contact-pair {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .contact-block {
    display: flex; align-items: center; gap: 8px;
    min-width: 0;
  }
  .hr-avatar {
    width: 28px; height: 28px; border-radius: 50%;
    background: var(--bg-tertiary);
    display: inline-flex; align-items: center; justify-content: center;
    color: var(--text-secondary);
    font-size: 0.78rem;
    flex-shrink: 0;
    overflow: hidden;
  }
  .hr-avatar .material-symbols-outlined { font-size: 16px; }
  img.hr-avatar { object-fit: cover; }
  .hr-info { flex: 1; min-width: 0; }
  .hr-name {
    color: var(--text-primary);
    font-size: 0.83rem;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .hr-name.muted { color: var(--text-tertiary); }
  .hr-username {
    color: var(--text-tertiary);
    font-size: 0.72rem;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .icon-btn.inline { width: 18px; height: 18px; vertical-align: middle; }
  .icon-btn.inline .material-symbols-outlined { font-size: 14px; }
  .info-chip.linkable { cursor: pointer; }
  .info-chip.linkable:hover { background: var(--bg-secondary); color: var(--text-primary); }
  /* Кликабельные тексты в contact-block: имя HR/компании, @username,
     сайт компании. Курсор + ховер цвета акцента + подчёркивание — чтобы
     было ясно, что это интерактив, а не статичная подпись. */
  .hr-name.is-link, .hr-username.is-link {
    cursor: pointer;
  }
  .hr-name.is-link:hover, .hr-username.is-link:hover {
    color: var(--accent);
    text-decoration: underline;
  }

  /* Notes textarea (slice 5, §3.8) */
  .notes-area {
    width: 100%;
    min-height: 80px;
    resize: vertical;
    background: var(--bg-tertiary);
    color: var(--text-primary);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 6px 8px;
    font-family: inherit;
    font-size: 0.82rem;
    line-height: 1.4;
    outline: none;
    box-sizing: border-box;
    transition: border-color 0.4s ease, box-shadow 0.4s ease;
  }
  .notes-area:focus { border-color: rgba(100, 242, 12, 0.5); }
  /* .saved-flash must beat :focus. Two cases:
       - Textarea NOT focused → ``.notes-area.saved-flash`` (specificity 0,2,0)
         vs ``.notes-area:focus`` (0,2,0) — equal weight, source-order wins, so
         this rule MUST stay AFTER the ``:focus`` rule above.
       - Textarea focused → ``.notes-area.saved-flash:focus`` (0,3,0) wins on
         specificity alone, regardless of order.
     The accent-coloured box-shadow gives the flash a clearly visible green
     glow on top of the border-colour bump (which is otherwise hard to spot
     against the already-greenish focus border). */
  .notes-area.saved-flash,
  .notes-area.saved-flash:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 2px rgba(100, 242, 12, 0.35);
  }
  /* Timeline (§3.9): vacancy_status_history + vacancy_event merged DESC.
     Each .tl-item is a 3-column grid: dot / text / right-aligned timestamp. */
  .timeline {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .tl-item {
    display: grid;
    grid-template-columns: 14px 1fr auto;
    column-gap: 8px;
    align-items: baseline;
    font-size: 0.82rem;
    line-height: 1.4;
  }
  .tl-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    margin-top: 4px;
    background: var(--text-muted);
    border: 1px solid rgba(255, 255, 255, 0.22);
    justify-self: center;
    box-sizing: border-box;
  }
  /* Event dots use a neutral muted colour by default — only status-history
     items get a status-coloured dot (palette is identical to .status-dot in
     §2). The most-recent item gets the accent colour + glow regardless of
     its own status, to mark it as the current state of the row. */
  .tl-dot.new         { background: #ffffff; }
  .tl-dot.applied     { background: #0a84ff; }
  .tl-dot.answered    { background: #5ac8fa; }
  .tl-dot.test        { background: #5ce6c0; }
  .tl-dot.invitation  { background: #64f20c; }
  .tl-dot.in-progress { background: #34c759; }
  .tl-dot.offer       { background: #af52de; }
  .tl-dot.decline     { background: #ff453a; }
  .tl-dot.ghosting    { background: #ffd60a; }
  .tl-dot.scam        { background: #ff9f0a; }
  .tl-dot.not-fit     { background: #6a6a6d; }
  .tl-item.current .tl-dot {
    box-shadow: 0 0 0 2px rgba(140, 140, 145, 0.3);
  }
  .tl-item.current .tl-dot.new         { box-shadow: 0 0 0 2px rgba(190, 190, 190, 0.35); }
  .tl-item.current .tl-dot.applied     { box-shadow: 0 0 0 2px rgba(7, 90, 180, 0.36); }
  .tl-item.current .tl-dot.answered    { box-shadow: 0 0 0 2px rgba(52, 140, 185, 0.36); }
  .tl-item.current .tl-dot.test        { box-shadow: 0 0 0 2px rgba(36, 150, 128, 0.36); }
  .tl-item.current .tl-dot.invitation  { box-shadow: 0 0 0 2px rgba(24, 125, 62, 0.36); }
  .tl-item.current .tl-dot.in-progress { box-shadow: 0 0 0 2px rgba(58, 150, 8, 0.36); }
  .tl-item.current .tl-dot.offer       { box-shadow: 0 0 0 2px rgba(124, 55, 160, 0.36); }
  .tl-item.current .tl-dot.decline     { box-shadow: 0 0 0 2px rgba(168, 40, 33, 0.36); }
  .tl-item.current .tl-dot.ghosting    { box-shadow: 0 0 0 2px rgba(176, 146, 8, 0.36); }
  .tl-item.current .tl-dot.scam        { box-shadow: 0 0 0 2px rgba(176, 109, 8, 0.36); }
  .tl-item.current .tl-dot.not-fit     { box-shadow: 0 0 0 2px rgba(74, 74, 78, 0.45); }
  .tl-text {
    color: var(--text-primary);
    overflow-wrap: anywhere;
  }
  .tl-text .status-name {
    font-weight: 600;
    margin-right: 2px;
  }
  .tl-text .tl-event {
    color: var(--text-muted);
  }
  .tl-text .tl-skip {
    color: var(--text-muted);
  }
  .tl-when {
    color: var(--text-muted);
    font-size: 0.76rem;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  /* Inline-edit для history.explanation — паттерн .list-input из Experience:
     прозрачная рамка по умолчанию, серая на hover, accent + tertiary-фон
     на focus. Save через debounce 500мс + flush на blur. */
  .tl-history-row {
    display: flex;
    align-items: baseline;
    gap: 6px;
    width: 100%;
    flex-wrap: wrap;
  }
  .tl-history-row .status-name { flex: 0 0 auto; }
  /* Длинный .tl-event без явного `flex: 1` + `min-width: 0` считает
     свою hypothetical-size = ширине всего текста, не помещается на
     одной строке со status-name, срабатывает flex-wrap → весь span
     сваливается на следующую строку (так длинный «Decline: HR сообщает
     …» рендерился со status-name одиноко на верхней строке и
     explanation полностью под ним).
     `flex: 1` = `1 1 0%` (basis 0%, не auto) — браузер начинает с 0 и
     наращивает до оставшегося места, без споров с длиной content-size'а.
     `min-width: 0` снимает дефолтный min-content guard, чтобы текст
     мог wrap'аться по словам внутри ужатого блока. */
  .tl-history-row .tl-event { flex: 1; min-width: 0; }
  .tl-explanation-input {
    flex: 1;
    min-width: 120px;
    background: transparent;
    border: 1px solid transparent;
    color: var(--text-primary);
    font-size: 0.82rem;
    line-height: 1.4;
    font-family: inherit;
    padding: 2px 6px;
    border-radius: 3px;
    resize: none;
    overflow: hidden;
    box-sizing: border-box;
    min-height: calc(0.82rem * 1.4 + 6px);
  }
  .tl-explanation-input:hover { border-color: var(--border); }
  .tl-explanation-input:focus {
    outline: none;
    border-color: var(--accent);
    background: var(--bg-tertiary);
  }
  .tl-explanation-input::placeholder {
    color: var(--text-tertiary);
    font-style: italic;
  }
  .tl-explanation-input.saved-flash {
    border-color: var(--accent);
    transition: border-color 0.4s ease;
  }

  /* === Contacts / HR (05) === */
  .section-contacts.is-hr > .section-body { padding: 0; min-height: 0; overflow: hidden; }
  .cnt-layout {
    display: grid;
    grid-template-columns: 275px 1fr;
    height: 100%;
    min-height: 0;
  }
  .cnt-list-pane {
    border-right: 1px solid var(--border);
    background: var(--bg-secondary);
    display: flex; flex-direction: column;
    min-height: 0;
  }
  .cnt-list-toolbar {
    display: flex; align-items: center; gap: 6px;
    padding: 6px 8px;
    border-bottom: 1px solid var(--border);
    background: var(--bg-tertiary);
  }
  .cnt-search-box {
    flex: 1; min-width: 0;
    display: flex; align-items: center; gap: 6px;
    padding: 4px 6px;
  }
  .cnt-search-box .material-symbols-outlined { font-size: 14px; color: var(--text-tertiary); }
  .cnt-search-box input {
    flex: 1; min-width: 0;
    border: none; background: transparent;
    color: var(--text-primary);
    font-size: 0.78rem; font-family: inherit;
  }
  .cnt-search-box input:focus { outline: none; }
  .cnt-add-btn {
    width: 26px; height: 26px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text-secondary);
    cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .cnt-add-btn:hover { background: rgba(100,242,12,0.12); border-color: var(--accent); color: var(--accent); }
  .cnt-add-btn .material-symbols-outlined { font-size: 16px; }

  .cnt-list { flex: 1; overflow-y: auto; }
  .cnt-hr-row {
    padding: 8px 10px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    display: grid;
    grid-template-columns: 32px 1fr auto;
    gap: 8px;
    align-items: center;
  }
  .cnt-hr-row:hover { background: rgba(100,242,12,0.04); }
  .cnt-hr-row.selected { background: var(--selected-bg); border-left: 2px solid var(--accent); padding-left: 8px; }
  .cnt-avatar {
    width: 32px; height: 32px; border-radius: 50%;
    background: var(--bg-tertiary);
    display: inline-flex; align-items: center; justify-content: center;
    color: var(--text-secondary); font-size: 0.78rem;
    flex-shrink: 0;
    overflow: hidden;
  }
  img.cnt-avatar { object-fit: cover; }
  .cnt-hr-info { min-width: 0; }
  .cnt-hr-name {
    color: var(--text-primary); font-size: 0.83rem; font-weight: 500;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .cnt-hr-name.muted { color: var(--text-tertiary); font-style: italic; }
  .cnt-hr-sub {
    color: var(--text-tertiary); font-size: 0.72rem;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .cnt-hr-sub .sep { color: var(--text-tertiary); margin: 0 3px; }
  .cnt-hr-sub .company { color: var(--text-secondary); }
  .cnt-hr-sub .muted { color: var(--text-tertiary); font-style: italic; }
  .cnt-hr-sub .at { font-family: ui-monospace, monospace; color: var(--text-secondary); }

  /* Channels — detail-pane stats (slice 4) */
  .ch-stats-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }
  .ch-stat {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 2px;
  }
  .ch-stat-num {
    font-size: 1.4rem;
    color: var(--text-primary);
    font-weight: 500;
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }
  .ch-stat-num.fit      { color: var(--accent); }
  .ch-stat-num.apply    { color: #0a84ff; }
  .ch-stat-num.response { color: #5ac8fa; }
  .ch-stat-label {
    font-size: 0.65rem;
    color: var(--text-tertiary);
    text-transform: uppercase;
    letter-spacing: 0.4px;
  }
  .ch-bar {
    height: 8px;
    border-radius: 4px;
    overflow: hidden;
    display: flex;
    background: var(--bg-tertiary);
    margin-top: 12px;
  }
  .ch-bar-seg { height: 100%; }
  .ch-bar-legend {
    display: flex; flex-wrap: wrap; gap: 8px 12px;
    margin-top: 8px;
    font-size: 0.72rem;
    color: var(--text-secondary);
  }
  .ch-bar-legend .legend-item { display: inline-flex; align-items: center; gap: 4px; }
  .ch-bar-legend .legend-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .ch-stats-empty {
    color: var(--text-tertiary);
    font-size: 0.85rem;
    text-align: center;
    padding: 12px 0;
  }
  .ch-vacs-loading-more {
    text-align: center;
    color: var(--text-tertiary);
    font-size: 0.72rem;
    padding: 6px 0;
  }

  /* Pill-checkbox для on/off канала — используется в ряду и в тулбаре
     (master-toggle на все каналы разом). */
  .cnt-hr-row .toggle-cb,
  .cnt-list-toolbar .toggle-cb {
    appearance: none;
    -webkit-appearance: none;
    width: 28px; height: 14px;
    background: var(--bg-tertiary);
    border-radius: 7px;
    position: relative;
    cursor: pointer;
    transition: background 0.15s;
    margin: 0;
    flex-shrink: 0;
  }
  .cnt-hr-row .toggle-cb::after,
  .cnt-list-toolbar .toggle-cb::after {
    content: '';
    position: absolute;
    left: 2px; top: 2px;
    width: 10px; height: 10px;
    background: var(--text-tertiary);
    border-radius: 50%;
    transition: all 0.15s;
  }
  .cnt-hr-row .toggle-cb:checked,
  .cnt-list-toolbar .toggle-cb:checked { background: var(--accent); }
  .cnt-hr-row .toggle-cb:checked::after,
  .cnt-list-toolbar .toggle-cb:checked::after {
    left: calc(100% - 12px);
    background: #1d1d1f;
  }
  .cnt-hr-row .toggle-cb:disabled,
  .cnt-list-toolbar .toggle-cb:disabled { opacity: 0.5; cursor: wait; }
  /* Blacklist-lock — отдельный курсор: «нельзя», а не «жди». */
  .cnt-hr-row .toggle-cb.bl-locked:disabled { cursor: not-allowed; }
  .cnt-list-toolbar .toggle-cb { margin-left: 4px; }
  .cnt-hr-unread {
    min-width: 18px; height: 18px;
    background: var(--accent); color: #1d1d1f;
    border-radius: 9px;
    font-size: 0.65rem; font-weight: 600;
    display: inline-flex; align-items: center; justify-content: center;
    padding: 0 5px;
    flex-shrink: 0;
    font-variant-numeric: tabular-nums;
  }
  .cnt-hr-trailing { display: inline-flex; align-items: center; gap: 4px; }
  .cnt-hr-bl {
    color: #ff6b61;
    display: inline-flex; align-items: center;
  }
  .cnt-hr-bl .material-symbols-outlined { font-size: 14px; }
  .cnt-hr-row.blacklisted .cnt-hr-name { color: var(--text-tertiary); }

  .cnt-detail-pane {
    background: var(--bg-primary);
    overflow-y: auto;
    min-height: 0;
    padding: 16px 20px;
  }
  .cnt-detail-empty {
    color: var(--text-tertiary);
    text-align: center;
    padding: 60px 20px;
    font-size: 0.85rem;
  }
  .cnt-det-head {
    display: grid;
    grid-template-columns: 56px 1fr auto;
    gap: 12px;
    align-items: start;
    margin-bottom: 14px;
  }
  .cnt-det-avatar {
    align-self: center;
    width: 56px; height: 56px; border-radius: 50%;
    background: var(--bg-tertiary);
    display: inline-flex; align-items: center; justify-content: center;
    color: var(--text-secondary); font-size: 1.1rem; font-weight: 500;
    overflow: hidden;
  }
  img.cnt-det-avatar { object-fit: cover; }
  .cnt-det-name {
    color: var(--text-primary);
    font-size: 1.05rem;
    font-weight: 500;
  }
  .cnt-det-name.muted { color: var(--text-tertiary); font-style: italic; font-weight: 400; }
  .cnt-det-sub {
    color: var(--text-tertiary);
    font-size: 0.78rem;
    margin-top: 2px;
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
  }
  /* min-width:0 на детях — без него длинная company-link / tg-link
     считает свою ширину = ширине всего текста и при flex-wrap всё
     родителем переносится на новую строку (та же ловушка, что и в
     .tl-history-row). Сейчас в реальных данных не воспроизводится
     (HR-имя/компания обычно короткие), но превентивно. */
  .cnt-det-sub > * { min-width: 0; }
  .cnt-det-sub .tg-link {
    color: var(--text-tertiary);
    cursor: pointer;
    text-decoration: none;
  }
  .cnt-det-sub .tg-link:hover { color: var(--accent); text-decoration: underline; }
  .cnt-det-sub .tg-muted { color: var(--text-tertiary); }
  .cnt-det-sub .company-link {
    color: var(--text-tertiary);
    cursor: pointer;
  }
  .cnt-det-sub .company-link:hover { color: var(--accent); text-decoration: underline; }
  .cnt-det-meta-row {
    margin-top: 4px;
    display: flex; gap: 6px; align-items: center; flex-wrap: wrap;
    font-size: 0.72rem;
  }
  .cnt-det-meta-row > * { min-width: 0; }
  .cnt-det-meta-chip {
    display: inline-flex; align-items: center; gap: 4px;
    background: var(--bg-tertiary);
    color: var(--text-secondary);
    padding: 1px 7px;
    border-radius: 9px;
    font-variant-numeric: tabular-nums;
  }
  .cnt-det-meta-chip.unread {
    background: rgba(100,242,12,0.18);
    color: var(--accent);
  }
  .cnt-det-meta-chip.blacklist {
    background: rgba(255, 107, 97, 0.18);
    color: #ff6b61;
  }
  .cnt-det-meta-chip .material-symbols-outlined { font-size: 12px; }

  .cnt-form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px 14px;
    margin-bottom: 12px;
  }
  .cnt-input {
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    color: var(--text-primary);
    border-radius: 3px;
    padding: 5px 8px;
    font-size: 0.82rem;
    font-family: inherit;
  }
  .cnt-input:focus { outline: none; border-color: var(--accent); }
  .cnt-input::placeholder { color: var(--text-tertiary); }

  .cnt-det-section {
    margin-bottom: 10px;
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 8px 10px;
  }
  .cnt-vacs-empty {
    color: var(--text-tertiary); font-size: 0.78rem;
    padding: 4px 2px;
  }
  .vacs-mini { display: flex; flex-direction: column; }
  .vac-mini-row {
    display: grid;
    grid-template-columns: 14px auto 1fr auto;
    align-items: center;
    gap: 6px;
    padding: 4px 6px;
    margin: 0 -6px;
    font-size: 0.78rem;
    border-top: 1px solid var(--border);
    border-radius: 3px;
    cursor: pointer;
  }
  .vac-mini-row:first-child { border-top: 0; }
  .vac-mini-row:hover { background: var(--selected-bg); }
  .vac-mini-row:hover .vac-mini-title { color: var(--accent); }
  .vac-mini-score {
    color: var(--text-tertiary);
    font-size: 0.7rem;
    font-variant-numeric: tabular-nums;
    background: var(--bg-tertiary);
    padding: 0 5px;
    border-radius: 8px;
  }
  .vac-mini-title {
    color: var(--text-primary);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .vac-mini-when {
    color: var(--text-tertiary);
    font-size: 0.7rem;
    font-variant-numeric: tabular-nums;
  }

  /* HR mini-list inside Company detail (06). Mirrors .vac-mini-row but
     with avatar + name + meta layout. */
  .hrs-mini { display: flex; flex-direction: column; }
  .hr-mini-row {
    display: grid;
    grid-template-columns: 22px 1fr auto;
    align-items: center;
    gap: 8px;
    padding: 4px 6px;
    margin: 0 -6px;
    font-size: 0.78rem;
    border-top: 1px solid var(--border);
    cursor: pointer;
    border-radius: 3px;
  }
  .hr-mini-row:first-child { border-top: 0; }
  .hr-mini-row:hover { background: var(--selected-bg); }
  .hr-mini-row:hover .hr-mini-name { color: var(--accent); }
  .hr-mini-avatar {
    width: 22px; height: 22px; border-radius: 50%;
    background: var(--bg-tertiary);
    display: inline-flex; align-items: center; justify-content: center;
    color: var(--text-secondary); font-size: 0.65rem;
    overflow: hidden;
  }
  img.hr-mini-avatar { object-fit: cover; }
  .hr-mini-name { color: var(--text-primary); }
  .hr-mini-meta { color: var(--text-tertiary); font-size: 0.7rem; }

  /* Companies list trailing badge — mirrors .cnt-hr-unread shape. */
  .cnt-co-count {
    background: var(--bg-tertiary);
    color: var(--text-secondary);
    border-radius: 8px;
    padding: 1px 6px;
    font-size: 0.7rem;
    font-variant-numeric: tabular-nums;
    flex-shrink: 0;
  }

  /* Inline chat (slice 4) — bubbles + day-separators inside HR detail. */
  .cnt-chat-section {
    margin-bottom: 10px;
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: 5px;
    overflow: hidden;
  }
  .cnt-chat-body {
    padding: 8px 10px;
    display: flex; flex-direction: column; gap: 4px;
    max-height: 320px;
    overflow-y: auto;
    overflow-x: hidden;
    min-width: 0;
  }
  .cnt-chat-empty {
    padding: 16px 10px;
    color: var(--text-tertiary);
    font-size: 0.78rem;
    text-align: center;
  }
  .cnt-chat-day {
    align-self: center;
    font-size: 0.7rem; color: var(--text-tertiary);
    background: var(--bg-tertiary); padding: 1px 9px; border-radius: 10px;
    margin: 6px 0 2px;
  }
  .cnt-bubble {
    max-width: 75%;
    min-width: 0;
    padding: 5px 9px 4px;
    border-radius: 10px;
    font-size: 0.82rem;
    line-height: 1.35;
    display: flex; gap: 8px; align-items: flex-end;
  }
  .cnt-bubble.them {
    align-self: flex-start;
    background: var(--bg-tertiary);
    color: var(--text-primary);
    border-bottom-left-radius: 3px;
  }
  .cnt-bubble.me {
    align-self: flex-end;
    background: rgba(100,242,12,0.18);
    color: var(--text-primary);
    border-bottom-right-radius: 3px;
  }
  .cnt-bubble-content {
    flex: 1; min-width: 0;
    display: flex; flex-direction: column; gap: 4px;
  }
  .cnt-bubble-text {
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    word-break: break-word;
  }
  .cnt-bubble-photo { display: block; max-width: 100%; }
  .cnt-bubble-photo img {
    display: block; max-width: 100%; max-height: 240px;
    border-radius: 6px;
    object-fit: cover;
  }
  .cnt-bubble-doc {
    display: inline-flex; align-items: center; gap: 6px;
    color: var(--accent);
    text-decoration: none;
    background: rgba(255,255,255,0.04);
    padding: 4px 8px;
    border-radius: 6px;
    font-size: 0.78rem;
  }
  .cnt-bubble-doc:hover { background: rgba(255,255,255,0.08); }
  .cnt-bubble-doc .material-symbols-outlined { font-size: 16px; }
  .cnt-bubble-tick { margin-left: 3px; color: var(--text-tertiary); }
  .cnt-bubble-tick.read { color: var(--accent); }
  .cnt-bubble.me .cnt-bubble-tick { color: var(--text-tertiary); opacity: 0.7; }
  .cnt-bubble.me .cnt-bubble-tick.read { color: var(--accent); opacity: 1; }
  .cnt-chat-older {
    align-self: center;
    font-size: 0.72rem;
    color: var(--text-tertiary);
    padding: 4px 10px;
    cursor: pointer;
  }
  .cnt-chat-older:hover { color: var(--text-secondary); }
  .cnt-chat-attach {
    background: transparent; border: 0; color: var(--text-tertiary);
    cursor: pointer; padding: 4px;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .cnt-chat-attach:hover:not(:disabled) { color: var(--accent); }
  .cnt-chat-attach:disabled { opacity: 0.4; cursor: not-allowed; }
  .cnt-chat-attach .material-symbols-outlined { font-size: 18px; }
  .cnt-bubble-text.deleted { color: var(--text-secondary); font-style: italic; }
  .cnt-bubble-edited { color: var(--text-tertiary); font-size: 0.7rem; font-style: italic; }
  .cnt-bubble.deleted { opacity: 0.85; }
  .cnt-bubble-time {
    color: var(--text-tertiary);
    font-size: 0.66rem;
    flex-shrink: 0; padding-bottom: 1px;
    font-variant-numeric: tabular-nums;
  }
  .cnt-bubble.me .cnt-bubble-time { color: rgba(100,242,12,0.6); }

  .cnt-chat-input-area {
    border-top: 1px solid var(--border);
    padding: 6px 8px;
    background: var(--bg-tertiary);
    display: flex; align-items: flex-end; gap: 6px;
  }
  .cnt-chat-input {
    flex: 1;
    background: transparent;
    border: 0;
    color: var(--text-primary);
    font-size: 0.82rem;
    font-family: inherit;
    padding: 5px 9px;
    border-radius: 4px;
    resize: none;
    min-height: 30px;
    max-height: 120px;
    field-sizing: content;
  }
  .cnt-chat-input:focus { outline: none; }
  .cnt-chat-input::placeholder { color: var(--text-tertiary); }
  .cnt-chat-input:disabled { color: var(--text-tertiary); cursor: not-allowed; }
  .cnt-chat-send {
    width: 30px; height: 30px;
    background: transparent;
    color: var(--text-secondary);
    border: 0;
    cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    padding: 0;
  }
  .cnt-chat-send:hover:not(:disabled) { color: var(--accent); }
  .cnt-chat-send:disabled { color: var(--text-tertiary); cursor: not-allowed; }
  .cnt-chat-send .material-symbols-outlined { font-size: 22px; }
  .cnt-chat-disabled-hint {
    color: var(--text-tertiary);
    font-size: 0.7rem;
    padding: 4px 8px 0;
    text-align: center;
  }

  .cnt-list-empty {
    color: var(--text-tertiary);
    text-align: center;
    padding: 40px 16px;
    font-size: 0.78rem;
    line-height: 1.4;
  }

  /* Blacklist tab — flat table layout. Overflow + padding идут от
     .section-body, оборачивать ещё раз не нужно. */
  .bl-toolbar {
    display: flex; gap: 8px; align-items: center;
    margin-bottom: 10px;
    flex-wrap: wrap;
  }
  .bl-search-box {
    flex: 1; max-width: 380px;
    display: flex; align-items: center; gap: 6px;
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 4px 8px;
  }
  .bl-search-box .material-symbols-outlined { font-size: 14px; color: var(--text-tertiary); }
  .bl-search-box input {
    background: transparent; border: 0; outline: none;
    color: var(--text-primary); font-size: 0.78rem; flex: 1;
    font-family: inherit;
  }
  .bl-filter-pills { display: flex; gap: 3px; }
  .bl-filter-pill {
    padding: 3px 10px;
    border-radius: 12px;
    font-size: 0.72rem;
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    color: var(--text-secondary);
    cursor: pointer;
    display: inline-flex; align-items: center; gap: 4px;
  }
  .bl-filter-pill:hover { border-color: var(--accent); }
  .bl-filter-pill.active {
    background: var(--accent); color: #1d1d1f; border-color: var(--accent); font-weight: 500;
  }
  .bl-filter-pill .count { font-size: 0.68rem; opacity: 0.7; font-variant-numeric: tabular-nums; }
  .bl-add-btn {
    margin-left: auto;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-secondary);
    padding: 4px 11px;
    border-radius: 4px;
    font-size: 0.78rem;
    cursor: pointer;
    display: inline-flex; align-items: center; gap: 5px;
    flex-shrink: 0;
  }
  .bl-add-btn:hover { border-color: var(--accent); color: var(--accent); }
  .bl-add-btn .material-symbols-outlined { font-size: 14px; }

  .bl-table {
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
  }
  .bl-row {
    display: grid;
    grid-template-columns: 90px 1fr 1.4fr 100px 36px 26px;
    align-items: start;
    gap: 10px;
    padding: 5px 12px;
    border-bottom: 1px solid var(--border);
  }
  /* Голову-ряду оставляем center, остальные ряды — start, чтобы reason
     textarea растягивал ряд вниз, а value/chip оставались сверху. */
  .bl-row.head { align-items: center; }
  /* Шапка/тип/значение/дата центрируются по высоте первого визуального
     ряда (textarea задаёт min-height ≈ строка + padding). */
  .bl-row:not(.head) > .bl-kind-chip,
  .bl-row:not(.head) > .bl-input.value,
  .bl-row:not(.head) > .bl-when,
  .bl-row:not(.head) > .toggle-cb,
  .bl-row:not(.head) > .icon-btn {
    margin-top: 3px;
  }
  .bl-row button.icon-btn:hover {
    color: #ff6b61;
    background: rgba(255,107,97,0.12);
  }
  .bl-row:last-child { border-bottom: 0; }
  .bl-row.head {
    background: var(--bg-tertiary);
    color: var(--text-tertiary);
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    padding: 6px 12px;
  }
  .bl-row:hover:not(.head) { background: rgba(100,242,12,0.04); }

  .bl-kind-chip {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 1px 8px;
    border-radius: 10px;
    font-size: 0.72rem;
    font-weight: 500;
  }
  .bl-kind-chip.keyword { background: rgba(134,134,139,0.18); color: #d2d2d6; }
  .bl-kind-chip.hr      { background: rgba(10,132,255,0.2); color: #5ac8fa; }
  .bl-kind-chip.company { background: rgba(175,82,222,0.2); color: #d99eff; }
  .bl-kind-chip.channel { background: rgba(255,159,10,0.2); color: #ffd066; }

  /* Inline-edit inputs: прозрачная рамка по умолчанию, видна на hover,
     accent + tertiary-фон при focus. Сохранение через debounce 500мс. */
  .bl-input {
    background: transparent;
    border: 1px solid transparent;
    color: var(--text-primary);
    font-size: 0.83rem;
    font-family: inherit;
    padding: 3px 6px;
    border-radius: 3px;
    width: 100%;
    box-sizing: border-box;
  }
  .bl-input:hover { border-color: var(--border); }
  .bl-input:focus { outline: none; border-color: var(--accent); background: var(--bg-tertiary); }
  .bl-input.value { font-family: ui-monospace, monospace; font-size: 0.8rem; }
  .bl-input::placeholder { color: var(--text-tertiary); font-style: italic; }
  .bl-input.saved-flash { border-color: var(--accent); transition: border-color 0.4s ease; }
  /* Reason — textarea с авто-растяжкой. resize:none + overflow:hidden,
     высоту считаем по scrollHeight в JS на render/input. */
  textarea.bl-input.reason {
    resize: none;
    overflow: hidden;
    line-height: 1.4;
    min-height: 22px;
  }

  /* Kind-segmented control в add-модалке: 4 варианта в pill-row,
     каждый окрашивается в свой кайнд-цвет когда active. */
  .bl-kind-segmented {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 3px;
    background: var(--bg-tertiary);
    padding: 3px;
    border-radius: 5px;
  }
  .bl-kind-seg {
    text-align: center;
    padding: 5px 4px;
    border-radius: 3px;
    font-size: 0.74rem;
    color: var(--text-secondary);
    cursor: pointer;
    border: 0;
    background: transparent;
    font-family: inherit;
  }
  .bl-kind-seg:hover { background: rgba(255,255,255,0.04); color: var(--text-primary); }
  .bl-kind-seg.active.keyword { background: rgba(134,134,139,0.4); color: #f5f5f7; font-weight: 500; }
  .bl-kind-seg.active.hr      { background: rgba(10,132,255,0.5); color: #ffffff; font-weight: 500; }
  .bl-kind-seg.active.company { background: rgba(175,82,222,0.5); color: #ffffff; font-weight: 500; }
  .bl-kind-seg.active.channel { background: rgba(255,159,10,0.5); color: #ffffff; font-weight: 500; }

  /* Inputs в add-модалке (явная заливка bg-tertiary, в отличие от
     прозрачных inline-edit инпутов в таблице). */
  .bl-modal-input, .bl-modal-textarea {
    background: var(--bg-tertiary); border: 1px solid var(--border); color: var(--text-primary);
    border-radius: 3px; padding: 6px 9px; font-size: 0.83rem; font-family: inherit;
    width: 100%; box-sizing: border-box;
  }
  .bl-modal-input:focus, .bl-modal-textarea:focus { outline: none; border-color: var(--accent); }
  .bl-modal-input::placeholder, .bl-modal-textarea::placeholder { color: var(--text-tertiary); }
  .bl-modal-textarea {
    resize: vertical;
    min-height: calc(0.83rem * 1.4 * 3 + 14px);
    line-height: 1.4;
  }

  /* Combobox dropdown — для hr/company/channel: входит фильтрующимся
     списком существующих сущностей, кликабельные options. Чтобы dropdown
     рисовался ПОВЕРХ модалки (а не внутри scroll-контейнера), отключаем
     overflow:hidden/auto на родителях для bl-add-modal специфично. */
  .vac-picker-modal.bl-add-modal { overflow: visible; }
  .vac-picker-modal.bl-add-modal .picker-create-pane { overflow: visible; }
  .bl-combobox-wrap { position: relative; width: 100%; }
  .bl-combobox-dropdown {
    position: absolute;
    top: calc(100% + 2px);
    left: 0; right: 0;
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: 4px;
    max-height: 220px;
    overflow-y: auto;
    box-shadow: 0 6px 20px rgba(0,0,0,0.45);
    z-index: 100;
  }
  .bl-combobox-option {
    padding: 5px 9px;
    cursor: pointer;
    display: flex; flex-direction: column; gap: 1px;
    border-bottom: 1px solid var(--border);
    font-size: 0.82rem;
  }
  .bl-combobox-option:last-child { border-bottom: 0; }
  .bl-combobox-option:hover { background: var(--selected-bg); }
  .bl-combobox-option .opt-label { color: var(--text-primary); }
  .bl-combobox-option .opt-sub {
    color: var(--text-tertiary);
    font-size: 0.7rem;
    font-family: ui-monospace, monospace;
  }
  .bl-combobox-empty {
    padding: 8px 12px;
    color: var(--text-tertiary);
    font-size: 0.78rem;
    text-align: center;
  }
  .bl-when {
    color: var(--text-tertiary);
    font-size: 0.7rem;
    font-variant-numeric: tabular-nums;
  }
  .bl-row.disabled .bl-value,
  .bl-row.disabled .bl-reason {
    color: var(--text-tertiary);
    text-decoration: line-through;
    text-decoration-color: var(--text-tertiary);
  }

  /* Statistics screen */
  .stats-toolbar { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .stats-period-pill {
    padding: 3px 10px;
    border-radius: 12px;
    font-size: 0.74rem;
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    color: var(--text-secondary);
    cursor: pointer;
  }
  .stats-period-pill:hover { border-color: var(--accent); }
  .stats-period-pill.active { background: var(--accent); color: #1d1d1f; border-color: var(--accent); font-weight: 500; }
  .stats-refresh-btn {
    width: 24px; height: 24px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--bg-secondary);
    color: var(--text-secondary);
    display: inline-flex; align-items: center; justify-content: center;
    cursor: pointer;
    padding: 0;
    margin-left: 4px;
  }
  .stats-refresh-btn:hover { border-color: var(--accent); color: var(--accent); }
  .stats-refresh-btn .material-symbols-outlined { font-size: 14px; line-height: 1; }
  .stats-refresh-btn.spinning .material-symbols-outlined { animation: stats-refresh-spin 0.8s linear infinite; }
  @keyframes stats-refresh-spin { to { transform: rotate(360deg); } }
  .stats-grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 10px; }
  .stats-card {
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 12px 14px;
  }
  .stats-card-title {
    font-size: 0.7rem;
    text-transform: uppercase;
    color: var(--text-tertiary);
    letter-spacing: 0.4px;
    margin-bottom: 8px;
  }
  .stats-col-6 { grid-column: span 6; }
  .stats-col-12 { grid-column: span 12; }
  .stats-kpi-row .stats-card { display: flex; flex-direction: column; }
  .stats-kpi {
    display: flex;
    flex-direction: column;
    gap: 2px;
    flex: 1;
    min-height: 0;
  }
  .stats-kpi-num {
    font-size: 1.7rem;
    font-weight: 500;
    color: var(--text-primary);
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }
  .stats-kpi-num.accent { color: var(--accent); }
  .stats-kpi-num.purple { color: #af52de; }
  .stats-kpi-num.blue { color: #0a84ff; }
  .stats-kpi-num.red { color: #ff453a; }
  .stats-kpi-row {
    grid-column: span 12;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 10px;
  }
  .stats-kpi-label {
    font-size: 0.74rem;
    color: var(--text-tertiary);
  }
  .stats-kpi-delta {
    font-size: 0.72rem;
    font-variant-numeric: tabular-nums;
    margin-top: auto;     /* прижимает строку дельты к нижнему краю карточки */
    padding-top: 4px;
    color: var(--text-tertiary);
  }
  .stats-kpi-delta.up { color: #34c759; }
  .stats-loading { color: var(--text-tertiary); font-size: 0.85rem; padding: 24px 0; text-align: center; }

  /* Status counters grid */
  /* Statuses card — donut по центру, counters слева/справа.
     status-col — grid 12px/auto/auto (dot/name/num); status-sc-item
     прицепляется через subgrid, чтобы числа во всех строках одной стороны
     стояли в один столбец независимо от длины имени. */
  .stats-status-card {
    display: grid;
    /* Donut гибкий: ≤185px, ≥120px, в среднем ~35% карточки. При сужении
       карточки (узкое окно или Статусы рядом с другой col-6) donut
       уменьшается, освобождая место боковым колонкам со счётчиками. */
    grid-template-columns: 1fr clamp(120px, 35%, 185px) 1fr;
    align-items: center;
    gap: 14px;
  }
  .stats-status-col {
    display: grid;
    grid-template-columns: 12px auto auto;
    column-gap: 6px;
    row-gap: 3px;
    align-content: start;
    justify-content: start;
  }
  .stats-status-col.right { justify-content: end; }
  .stats-sc-item {
    display: grid;
    grid-template-columns: subgrid;
    grid-column: 1 / -1;
    align-items: center;
    column-gap: 6px;
    padding: 2px 4px;
    font-size: 0.78rem;
    border-radius: 3px;
    cursor: pointer;
  }
  .stats-sc-item:hover { background: var(--bg-tertiary); }
  .stats-sc-dot { width: 8px; height: 8px; border-radius: 50%; }
  .stats-sc-dot.new         { background: #ffffff; }
  .stats-sc-dot.applied     { background: #0a84ff; }
  .stats-sc-dot.answered    { background: #5ac8fa; }
  .stats-sc-dot.test        { background: #5ce6c0; }
  .stats-sc-dot.invitation  { background: #64f20c; }
  .stats-sc-dot.in-progress { background: #34c759; }
  .stats-sc-dot.offer       { background: #af52de; }
  .stats-sc-dot.decline     { background: #ff453a; }
  .stats-sc-dot.ghosting    { background: #ffd60a; }
  .stats-sc-dot.scam        { background: #ff9f0a; }
  .stats-sc-dot.not-fit     { background: #48484a; }
  .stats-sc-name { color: var(--text-secondary); }
  .stats-sc-num {
    color: var(--text-primary);
    font-variant-numeric: tabular-nums;
    font-weight: 500;
    justify-self: end;
  }
  .stats-donut-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 1;
    max-width: 185px;
    margin: 0 auto;
  }
  .stats-donut { width: 100%; height: 100%; }
  .stats-donut-center {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    pointer-events: none;
  }
  .stats-donut-total {
    font-size: 1.4rem;
    font-weight: 500;
    color: var(--text-primary);
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }
  .stats-donut-label {
    font-size: 0.66rem;
    color: var(--text-tertiary);
    margin-top: 3px;
    text-transform: uppercase;
    letter-spacing: 0.4px;
  }

  /* Channels pipeline — CSS-grid: имя канала и колонки конверсии — резиновые
     (1fr), числовые колонки — узкие auto, чтобы вся таблица влезала без
     горизонтального скролла даже на узкой карточке. Группы Ингест / Воронка /
     Конверсия отделены тонкой вертикальной линией. */
  .stats-ch-grid {
    display: grid;
    grid-template-columns:
      minmax(140px, 1.4fr)
      repeat(8, minmax(44px, auto))
      repeat(2, minmax(72px, 1fr));
    font-size: 0.76rem;
  }
  .stats-ch-grid > * {
    padding: 5px 6px;
    box-sizing: border-box;
    display: flex;
    align-items: center;
    justify-content: center;
    font-variant-numeric: tabular-nums;
    color: var(--text-secondary);
    border-bottom: 1px solid var(--border);
    min-width: 0;
  }
  .stats-ch-grid .stats-ch-group {
    text-transform: uppercase;
    color: var(--text-tertiary);
    font-size: 0.6rem;
    letter-spacing: 0.6px;
    padding: 6px 6px 0;
    border-bottom: 0;
  }
  .stats-ch-grid .stats-ch-group.ingest  { color: rgba(255,255,255,0.45); }
  .stats-ch-grid .stats-ch-group.funnel  { color: rgba(90,200,250,0.7); }
  .stats-ch-grid .stats-ch-group.outcome { color: rgba(100,242,12,0.75); }
  .stats-ch-grid .stats-ch-th {
    color: var(--text-tertiary);
    font-size: 0.62rem;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    padding: 4px 6px 8px;
    font-weight: 400;
  }
  .stats-ch-grid .stats-ch-name-cell {
    justify-content: flex-start;
    color: var(--text-primary);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    display: block;
    line-height: 1.4;
    padding-top: 6px;
    padding-bottom: 6px;
  }
  .stats-ch-grid .stats-ch-th-name { justify-content: flex-start; }
  .stats-ch-grid .stats-ch-sep-l { border-left: 1px solid var(--border); }
  .stats-ch-grid .stats-ch-conv {
    color: var(--text-primary);
    font-weight: 600;
    font-size: 0.82rem;
    justify-content: center;
    gap: 8px;
    padding-left: 10px;
    padding-right: 10px;
  }
  .stats-ch-grid .stats-ch-conv-meter {
    position: relative;
    width: 60px;
    flex-shrink: 0;
    height: 4px;
    background: var(--bg-tertiary);
    border-radius: 2px;
    overflow: hidden;
  }
  .stats-ch-grid .stats-ch-conv-meter-fill {
    position: absolute; inset: 0 auto 0 0;
    background: var(--accent);
    opacity: 0.85;
  }
  .stats-ch-grid .stats-ch-row { cursor: pointer; transition: background-color 0.12s; }
  .stats-ch-grid .stats-ch-row.is-hover { background: var(--bg-tertiary); }
  .stats-ch-grid .v-dim     { color: var(--text-tertiary); }
  .stats-ch-grid .v-fit     { color: var(--text-primary); font-weight: 500; }
  .stats-ch-grid .v-sent    { color: #0a84ff; }
  .stats-ch-grid .v-answ    { color: #5ac8fa; }
  .stats-ch-grid .v-invite  { color: var(--accent); }
  .stats-ch-grid .v-decline { color: #ff453a; opacity: 0.85; }
  .stats-ch-grid .stats-ch-last { border-bottom: 0; }

  /* Skills card — frequency bar chart, mine highlighted.
     Column-major fill: items идут сверху вниз в первом столбце, затем
     заполняют второй и третий. grid-template-rows + grid-auto-flow: column
     задаются inline в render-функции (rowsPerCol = ceil(N/3)). */
  .stats-skills-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    grid-auto-flow: column;
    gap: 4px 16px;
  }
  .stats-skill-row {
    display: grid;
    grid-template-columns: 14px 1fr 60px auto;
    align-items: center;
    gap: 8px;
    padding: 4px 0;
    font-size: 0.78rem;
    border-top: 1px solid var(--border);
  }
  .stats-skill-row.first-in-col { border-top: 0; }
  .stats-skill-check {
    color: var(--accent);
    font-size: 0.78rem;
    text-align: center;
    font-weight: 500;
    line-height: 1;
  }
  .stats-skill-name {
    font-size: 0.76rem;
    color: var(--text-primary);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .stats-skill-row:not(.mine) .stats-skill-name { color: var(--text-secondary); }
  .stats-skill-bar {
    height: 5px;
    background: var(--bg-tertiary);
    border-radius: 2px;
    overflow: hidden;
  }
  .stats-skill-bar-fill {
    height: 100%;
    transition: width .2s;
  }
  .stats-skill-row.mine .stats-skill-bar-fill { background: var(--accent); opacity: 0.85; }
  .stats-skill-row:not(.mine) .stats-skill-bar-fill { background: var(--text-tertiary); opacity: 0.5; }
  .stats-skill-num {
    color: var(--text-secondary);
    font-variant-numeric: tabular-nums;
    min-width: 28px;
    text-align: right;
    font-size: 0.74rem;
  }
  .stats-skills-legend {
    margin-top: 10px;
    padding-top: 8px;
    border-top: 1px solid var(--border);
    font-size: 0.7rem;
    color: var(--text-tertiary);
    display: flex;
    gap: 16px;
  }
  .stats-skills-legend span { display: inline-flex; align-items: center; gap: 5px; }
  .stats-skills-legend .leg-dot { width: 8px; height: 8px; border-radius: 2px; }
  .stats-skills-legend .leg-mine { background: var(--accent); }
  .stats-skills-legend .leg-other { background: var(--text-tertiary); opacity: 0.5; }

  /* HR responses card — bar chart по дням недели + 2 мини-метрики */
  .stats-resp-card { display: flex; flex-direction: column; gap: 14px; }
  .stats-resp-chart {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    align-items: end;
    gap: 6px;
    height: 120px;
    padding-top: 14px;
  }
  .stats-resp-bar-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    height: 100%;
    justify-content: flex-end;
  }
  .stats-resp-bar-num {
    font-size: 0.68rem;
    color: var(--text-secondary);
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }
  .stats-resp-bar {
    width: 100%;
    background: var(--accent);
    opacity: 0.85;
    border-radius: 2px 2px 0 0;
    min-height: 1px;
  }
  .stats-resp-bar.weekend { background: var(--text-tertiary); opacity: 0.5; }
  .stats-resp-bar-label {
    font-size: 0.66rem;
    color: var(--text-tertiary);
    font-variant-numeric: tabular-nums;
  }
  .stats-resp-stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    padding-top: 10px;
    border-top: 1px solid var(--border);
  }
  .stats-resp-stat-num {
    font-size: 1.3rem;
    font-weight: 500;
    color: var(--text-primary);
    font-variant-numeric: tabular-nums;
    line-height: 1.1;
  }
  .stats-resp-stat-num.dim { color: #ff9f0a; }
  .stats-resp-stat-label {
    font-size: 0.7rem;
    color: var(--text-tertiary);
    margin-top: 3px;
  }

  /* System / Логи screen */
  .sys-section { display: flex; flex-direction: column; min-height: 0; height: 100%; }

  .logs-toolbar {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 12px;
    flex-shrink: 0;
  }
  .logs-level-pills { display: flex; gap: 3px; }
  .logs-level-pill {
    padding: 3px 9px 3px 7px;
    border-radius: 12px;
    font-size: 0.72rem;
    font-family: ui-monospace, monospace;
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    color: var(--text-tertiary);
    cursor: pointer;
    display: inline-flex; align-items: center; gap: 4px;
    user-select: none;
  }
  .logs-level-pill .material-symbols-outlined { font-size: 14px; opacity: 0.7; }
  .logs-level-pill:hover { border-color: var(--accent); color: var(--text-secondary); }
  .logs-level-pill .count { color: var(--text-tertiary); font-size: 0.68rem; font-variant-numeric: tabular-nums; }
  .logs-level-pill.active .material-symbols-outlined { opacity: 1; }
  .logs-level-pill.active.error   { background: rgba(255,69,58,0.18); border-color: rgba(255,69,58,0.6); color: #ff6b61; font-weight: 500; }
  .logs-level-pill.active.warn    { background: rgba(255,159,10,0.18); border-color: rgba(255,159,10,0.6); color: #ffb547; font-weight: 500; }
  .logs-level-pill.active.info    { background: rgba(10,132,255,0.18); border-color: rgba(10,132,255,0.6); color: #5ac8fa; font-weight: 500; }
  .logs-level-pill.active.debug   { background: var(--bg-tertiary); border-color: var(--text-secondary); color: var(--text-primary); }
  .logs-level-pill.active .count  { color: inherit; opacity: 0.7; }

  .logs-list {
    flex: 1; overflow-y: auto;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 0.78rem;
    line-height: 1.5;
  }
  .logs-row {
    display: grid;
    grid-template-columns: 130px 60px 220px 1fr;
    gap: 12px;
    padding: 3px 14px;
    border-bottom: 1px solid var(--border);
    align-items: start;
    cursor: pointer;
  }
  .logs-row:hover { background: rgba(100,242,12,0.04); }
  .logs-row.expanded { background: var(--bg-secondary); }
  .logs-time { color: var(--text-tertiary); font-variant-numeric: tabular-nums; }
  .logs-level {
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    font-size: 0.72rem;
    align-self: center;
  }
  .logs-level.error { color: #ff6b61; }
  .logs-level.warn { color: #ffb547; }
  .logs-level.info { color: #5ac8fa; }
  .logs-level.debug { color: var(--text-tertiary); }
  .logs-source { color: var(--text-secondary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .logs-msg { color: var(--text-primary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .logs-row.expanded .logs-msg { white-space: normal; word-wrap: break-word; }
  .logs-details {
    grid-column: 1 / -1;
    margin-top: 6px;
    background: var(--bg-tertiary);
    border-radius: 4px;
    padding: 8px 10px;
    color: var(--text-secondary);
    white-space: pre-wrap;
    font-size: 0.74rem;
    line-height: 1.5;
  }
  .logs-empty { color: var(--text-tertiary); text-align: center; padding: 40px 16px; font-size: 0.85rem; }
  .logs-auto-refresh {
    display: inline-flex; align-items: center; gap: 5px;
    color: var(--text-secondary); font-size: 0.78rem;
    cursor: pointer; user-select: none;
  }
  .logs-auto-refresh input { accent-color: var(--accent); margin: 0; }

  /* System / Настройки screen */
  .sys-settings { overflow: auto; padding: 14px 20px; min-height: 0; flex: 1; }
  .sys-settings-inner { max-width: 720px; margin: 0 auto; }
  .sys-settings .section {
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 14px;
    margin-bottom: 10px;
  }
  .sys-settings .section-title {
    display: flex; align-items: center; gap: 6px;
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--text-primary);
    font-weight: 500;
    margin-bottom: 10px;
  }
  .sys-settings .section-title .material-symbols-outlined { font-size: 16px; color: var(--text-secondary); }
  .sys-settings .status-pill {
    margin-left: auto;
    font-size: 0.7rem;
    padding: 1px 8px;
    border-radius: 8px;
    font-weight: 400;
    letter-spacing: 0;
    text-transform: none;
  }
  .sys-settings .status-pill.ok  { background: rgba(52,199,89,0.18); color: #66e08a; }
  .sys-settings .status-pill.err { background: rgba(255,69,58,0.2);  color: #ff6b61; }
  .sys-settings .row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px 10px;
  }
  .sys-settings .row .span-2 { grid-column: span 2; }
  .sys-settings .input {
    background: var(--bg-tertiary); border: 1px solid var(--border); color: var(--text-primary);
    border-radius: 3px; padding: 5px 9px; font-size: 0.83rem; font-family: inherit;
    width: 100%;
  }
  .sys-settings .input.mono { font-family: ui-monospace, monospace; font-size: 0.8rem; }
  .sys-settings .input:focus { outline: none; border-color: var(--accent); }
  .sys-settings .input::placeholder { color: var(--text-tertiary); }
  .sys-settings .input[readonly] { color: var(--text-secondary); cursor: default; }
  .sys-settings .secret-input { display: flex; align-items: center; gap: 4px; }
  .sys-settings .secret-input .input { flex: 1; }
  .sys-settings .session-row {
    display: flex; justify-content: space-between; align-items: center; gap: 6px;
    padding-top: 4px;
    grid-column: span 2;
  }
  .sys-settings .session-info { color: var(--text-tertiary); font-size: 0.72rem; }
  .sys-settings .checkbox-row {
    display: inline-flex; align-items: center; gap: 6px;
    color: var(--text-secondary); font-size: 0.8rem;
    cursor: pointer; user-select: none;
  }
  .sys-settings .checkbox-row input { accent-color: var(--accent); margin: 0; }
  /* Pipeline-секция: компактная сетка. Ячейки выравниваем по верху,
     чтобы labels всех 3 полей были на одном уровне (slider и number-input
     имеют разную высоту контента). */
  .sys-settings .pipeline-row {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 4px 12px;
    align-items: start;
  }
  .sys-settings .pipeline-row > div {
    display: flex; flex-direction: column;
    min-width: 0;  /* иначе длинные лейблы распирают грид-ячейку */
  }
  .sys-settings .pipeline-toggle {
    appearance: none;
    -webkit-appearance: none;
    width: 42px; height: 21px;
    background: var(--bg-tertiary);
    border-radius: 11px;
    position: relative;
    cursor: pointer;
    transition: background 0.15s;
    margin: 0;
    flex-shrink: 0;
  }
  .sys-settings .pipeline-toggle::after {
    content: '';
    position: absolute;
    left: 3px; top: 3px;
    width: 15px; height: 15px;
    background: var(--text-tertiary);
    border-radius: 50%;
    transition: all 0.15s;
  }
  .sys-settings .pipeline-toggle:checked { background: var(--accent); }
  .sys-settings .pipeline-toggle:checked::after {
    left: calc(100% - 18px);
    background: #1d1d1f;
  }
  /* Container для toggle-cell: имитирует высоту .with-unit/.slider-row,
     чтобы тумблер встал на одну линию с числовыми инпутами рядом.
     justify-content: center — тумблер по центру своей колонки, как и
     остальные элементы пайплайна. */
  .sys-settings .with-toggle {
    display: flex; align-items: center; justify-content: center; height: 28px;
  }
  .sys-settings .pipeline-label {
    font-size: 0.7rem; color: var(--text-tertiary); margin-bottom: 2px;
    text-align: center;
  }
  .sys-settings .with-unit {
    display: flex; align-items: center; gap: 6px;
    justify-content: center;
  }
  /* Number-инпут в пайплайне фиксированной ширины — иначе при равных
     5 колонках инпут «50» и инпут «1800» расползались бы на всю ячейку
     с разной визуальной плотностью; центрирование внутри ячейки работает
     только при контентной ширине. */
  .sys-settings .with-unit .input { width: 72px; flex: 0 0 auto; }
  .sys-settings .with-unit .unit { color: var(--text-tertiary); font-size: 0.75rem; }
  .sys-settings .slider-row {
    display: grid; grid-template-columns: 1fr 32px; gap: 8px; align-items: center;
    /* Выравниваем по высоте с .with-unit-инпутами рядом, чтобы числа
       (slider-num и значения number-input'ов) стояли на одной линии. */
    height: 28px;
  }
  .sys-settings .slider-num {
    color: var(--text-secondary); font-size: 0.78rem;
    font-variant-numeric: tabular-nums; text-align: right;
  }
  /* Шарик слайдера — невидим в покое, появляется при наведении/active.
     Глобальные правила input[type=range].slider::-webkit-slider-thumb уже
     задали opacity: 0 + transition (см. ~L487). Здесь только триггер reveal. */
  .sys-settings .slider-row:hover input[type=range].slider::-webkit-slider-thumb,
  .sys-settings input[type=range].slider:active::-webkit-slider-thumb { opacity: 1; }
  .sys-settings .slider-row:hover input[type=range].slider::-moz-range-thumb,
  .sys-settings input[type=range].slider:active::-moz-range-thumb { opacity: 1; }

  /* Danger-секция: красноватая рамка + строка с описанием и узкой кнопкой. */
  .sys-settings .section.danger-section {
    background: rgba(255, 69, 58, 0.04);
    border-color: rgba(255, 69, 58, 0.3);
  }
  .sys-settings .section.danger-section .section-title { color: #ff6b61; }
  .sys-settings .section.danger-section .section-title .material-symbols-outlined { color: #ff6b61; }
  .sys-settings .danger-row {
    display: grid; grid-template-columns: 1fr 170px;
    align-items: center; gap: 12px;
    padding: 4px 0;
  }
  .sys-settings .danger-row .text { font-size: 0.82rem; }
  .sys-settings .danger-row .sub {
    font-size: 0.7rem; color: var(--text-tertiary); margin-top: 1px;
  }
  .sys-settings .danger-row .btn { width: 100%; justify-content: center; }
  /* Кнопки в настройках — повторяем мокап 1:1: компактнее, иконка 14px,
     gap между иконкой и текстом, hover красит border в accent.
     Danger в мокапе — это ТОЛЬКО красный цвет текста, всё остальное от .btn. */
  .sys-settings .btn {
    padding: 2px 10px 3px;
    border-radius: 4px;
    border: 1px solid var(--border);
    background: var(--bg-tertiary);
    color: var(--text-primary);
    font-family: inherit; /* без этого UA-фолбэк (Arial) делает текст «тяжелее» */
    font-size: 0.82rem;
    line-height: 1.2;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    white-space: nowrap;
    font-weight: 400;
  }
  .sys-settings .btn:hover:not(:disabled) { border-color: var(--accent); background: var(--bg-tertiary); }
  .sys-settings .btn .material-symbols-outlined { font-size: 14px; position: relative; top: 1px; }
  /* Глобальный .btn.danger красит фон в красный — здесь нейтрализуем
     обратно к bg-tertiary, чтобы получить outline-only стиль мокапа. */
  .sys-settings .btn.danger {
    background: var(--bg-tertiary);
    color: #ff6b61;
    border-color: var(--border);
    font-weight: 400;
  }
  .sys-settings .btn.danger:hover:not(:disabled) {
    background: var(--bg-tertiary);
    border-color: #ff6b61;
  }

  /* Re-auth модалка */
  .sys-settings-login-backdrop {
    position: fixed; inset: 0;
    background: rgba(0, 0, 0, 0.55);
    z-index: 60;
    display: flex; align-items: center; justify-content: center;
  }
  .sys-settings-login-modal {
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: 8px;
    width: 380px; max-width: 90vw;
    padding: 16px 18px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .sys-settings-login-modal .title {
    font-size: 0.95rem; color: var(--text-primary); font-weight: 500;
    display: flex; align-items: center; gap: 6px;
  }
  .sys-settings-login-modal .title .material-symbols-outlined { font-size: 18px; color: var(--text-secondary); }
  .sys-settings-login-modal .subtitle {
    font-size: 0.78rem; color: var(--text-secondary);
  }
  .sys-settings-login-modal input.input {
    background: var(--bg-tertiary); border: 1px solid var(--border);
    color: var(--text-primary); border-radius: 3px;
    padding: 6px 9px; font-size: 0.85rem; font-family: inherit;
    width: 100%;
  }
  .sys-settings-login-modal input.input:focus { outline: none; border-color: var(--accent); }
  .sys-settings-login-modal .err {
    color: #ff6b61; font-size: 0.78rem;
  }
  .sys-settings-login-modal .actions {
    display: flex; justify-content: flex-end; gap: 6px; margin-top: 4px;
  }

  /* Pill-toggle уже определён под .cnt-hr-row / .cnt-list-toolbar; добавим
     blacklist-row-вариант. */
  .bl-row .toggle-cb {
    appearance: none;
    -webkit-appearance: none;
    width: 28px; height: 14px;
    background: var(--bg-tertiary);
    border-radius: 7px;
    position: relative;
    cursor: pointer;
    transition: background 0.15s;
    margin: 0;
    justify-self: center;
  }
  .bl-row .toggle-cb::after {
    content: '';
    position: absolute;
    left: 2px; top: 2px;
    width: 10px; height: 10px;
    background: var(--text-tertiary);
    border-radius: 50%;
    transition: all 0.15s;
  }
  .bl-row .toggle-cb:checked { background: var(--accent); }
  .bl-row .toggle-cb:checked::after {
    left: calc(100% - 12px);
    background: #1d1d1f;
  }
  .bl-row .toggle-cb:disabled { opacity: 0.5; cursor: wait; }

  .cnt-add-error {
    color: #ff6b61;
    font-size: 0.75rem;
    padding: 4px 12px 0;
  }

  /* Add-channel modal hint — без браузерных дефолтов с курсивом и
     serif'ом (ребята, спасибо), просто муд-grey small sans-serif. */
  .cnt-add-hint {
    color: var(--text-tertiary);
    font-size: 0.75rem;
    font-style: normal;
    font-family: inherit;
    line-height: 1.3;
    margin-top: 4px;
  }
</style>
