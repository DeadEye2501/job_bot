            <label class="cnt-search-box">
              <span class="material-symbols-outlined">search</span>
              <input type="text" data-role="cnt-ch-search" placeholder="Поиск канала..." value="${escapeAttr(st.searchDraft || '')}">
              <button type="button" class="vac-search-clear${st.searchDraft ? '' : ' hidden'}" data-action="cnt-ch-search-clear" title="Очистить поиск">
                <span class="material-symbols-outlined">close</span>
              </button>
            </label>
            <button type="button" class="cnt-add-btn" data-action="cnt-ch-add-open" title="Добавить канал">
              <span class="material-symbols-outlined">add_circle</span>
            </button>
            ${(() => {
              // Blacklisted каналы исключаем из расчёта — bulk toggle их
              // не трогает (бэк фильтрует, UI зеркалит), и они НИКОГДА
              // не считаются «включёнными». Master = checked если все
              // не-забаненные включены.
              const togglable = st.list.filter(r => !r.blacklisted);
              const allActive = togglable.length > 0 && togglable.every(r => r.isActive);
              const tip = st.list.length === 0
                ? 'Пока нет каналов'
                : togglable.length === 0
                  ? 'Все каналы в blacklist'
                  : (allActive ? 'Выключить все каналы' : 'Включить все каналы');
              const disabled = togglable.length === 0 || st.togglingAll;
              return `<input type="checkbox" class="toggle-cb" data-action="cnt-ch-toggle-all" title="${escapeAttr(tip)}"${allActive ? ' checked' : ''}${disabled ? ' disabled' : ''}>`;
            })()}
          </div>
          <div class="cnt-list">${listContent}</div>
        </section>
        <section class="cnt-detail-pane">
          ${renderContactsChannelDetail()}
        </section>
      </div>
      ${renderContactsChannelAddModal()}
    `;
  }

  function submitAddChannel() {
    const st = appState.contacts.channels;
    const m = st.addModal;
    const value = String(m.draft.input || '').trim();
    if (!value || m.saving) return;
    m.saving = true;
    m.error = null;
    if (api) {
      api.request_create_channel(JSON.stringify({ input: value }));
    }
    renderSection();
  }

  function onContactsChannelActionDone(payload) {
    let p;
    try { p = JSON.parse(payload); } catch { return; }
    if (!p) return;
    const st = appState.contacts.channels;

    // ─── Master toggle: bulk on/off ────────────────────────────────────
    if (p.action === 'set_all_active') {
      st.togglingAll = false;
      if (!p.ok) {
        // Rollback из snapshot'а на каждом ряду.
        if (st.toggleAllRollback) {
          st.list.forEach(r => {
            if (st.toggleAllRollback.has(r.id)) {
              r.isActive = st.toggleAllRollback.get(r.id);
            }
          });
        }
        if (typeof showToast === 'function') {
          showToast(p.error || 'Не удалось переключить все каналы', { variant: 'danger' });
        }
      }
      st.toggleAllRollback = null;
      if (appState.section === 'contacts' && appState.contacts.tab === 'channels') {
        renderSection();
      }
      return;
    }

    // ─── Single-channel poll / cursor reset ────────────────────────────
    if (p.action === 'poll_now') {
      if (typeof showToast === 'function') {
        if (p.ok) {
          showToast('Канал прогнан');
        } else {
          showToast(p.error || 'Не удалось прогнать канал', { variant: 'danger' });
        }
      }
      return;
    }
    if (p.action === 'reset_cursor') {
      if (typeof showToast === 'function') {
        if (p.ok) {
          showToast('Курсор сброшен — следующий поллинг переразберёт последние сообщения');
        } else {
          showToast(p.error || 'Не удалось сбросить курсор', { variant: 'danger' });
        }
      }
      return;
    }

    // ─── Add / remove blacklist ────────────────────────────────────────
    if (p.action === 'blacklist' || p.action === 'unblacklist') {
      if (!p.ok) {
        if (typeof showToast === 'function') {
          showToast(p.error || 'Не удалось обновить blacklist', { variant: 'danger' });
        }
        return;
      }
      // Refetch detail для обновления blacklistValue (меняет вид more-menu)
      // и list для обновления blacklisted-флага в ряду.
      if (st.selectedId != null) requestContactsChannelDetail(st.selectedId);
      requestContactsChannelList();
      if (typeof showToast === 'function') {
        showToast(p.action === 'blacklist'
          ? (p.was_inactive ? 'Канал реактивирован в blacklist' : (p.existed ? 'Канал уже в blacklist' : 'Канал добавлен в blacklist'))
          : 'Канал убран из blacklist');
      }
      return;
    }

    // ─── Delete channel ────────────────────────────────────────────────
    if (p.action === 'delete') {
      if (!p.ok) {
        if (typeof showToast === 'function') {
          showToast(p.error || 'Не удалось удалить канал', { variant: 'danger' });
        }
        return;
      }
      // Удалили: чистим выбор + детали + список перезапрашиваем.
      if (st.selectedId === p.channel_id) {
        st.selectedId = null;
        st.detail = null;
        st.detailFor = null;
        st.vacancies = [];
        st.vacanciesFor = null;
      }
      requestContactsChannelList();
      const detached = p.detached_vacancies || 0;
      const msg = detached > 0
        ? `Канал удалён, ${detached} ${pluralRu(detached, 'вакансия отвязана', 'вакансии отвязаны', 'вакансий отвязано')}`
        : 'Канал удалён';
      if (typeof showToast === 'function') showToast(msg);
      if (appState.section === 'contacts' && appState.contacts.tab === 'channels') {
        renderSection();
      }
      return;
    }

    // ─── Add-channel flow ──────────────────────────────────────────────
    if (p.action === 'create') {
      const m = st.addModal;
      if (!p.ok) {
        m.saving = false;
        if (typeof showToast === 'function') {
          showToast(p.error || 'Не удалось добавить канал', { variant: 'danger' });
        }
      } else {
        m.open = false;
        m.saving = false;
        m.error = null;
        m.draft = { input: '' };
        // Select the new (or pre-existing) row so the detail-pane fills in
        // immediately. List re-fetch happens via on_channels_changed when
        // metadata sweep finishes; if the channel already existed, push
        // signal won't fire, so kick a list refresh manually.
        st.selectedId = p.channel_id;
        st.detail = null;
        st.detailFor = null;
        st.vacancies = [];
        st.vacanciesFor = null;
        if (!p.created && typeof showToast === 'function') {
          showToast('Этот канал уже был добавлен');
        }
        requestContactsChannelList();
      }
      if (appState.section === 'contacts' && appState.contacts.tab === 'channels') {
        renderSection();
      }
      return;
    }

    // ─── Toggle on/off flow ────────────────────────────────────────────
    if (p.channel_id == null) return;
    st.toggling.delete(p.channel_id);
    if (!p.ok) {
      // Rollback optimistic flip: server says it didn't happen, restore the
      // row to whatever the request asked NOT to be (i.e. the previous state).
      const row = st.list.find(r => r.id === p.channel_id);
      if (row) row.isActive = !p.is_active;
      if (typeof showToast === 'function') {
        showToast(p.error || 'Не удалось переключить канал', { variant: 'danger' });
      }
    }
    if (appState.section === 'contacts' && appState.contacts.tab === 'channels') {
      renderSection();
    }
  }

  function attachContactsChannelHandlers() {
    const st = appState.contacts.channels;
    const searchInput = mainSlot.querySelector('[data-role="cnt-ch-search"]');
    const clearBtn = mainSlot.querySelector('[data-action="cnt-ch-search-clear"]');

    // Row click → select. Skip when the click came from the toggle (which
    // stops propagation itself). morePopoverOpen сбрасывается явно — иначе
    // флаг переживает switch и popover «всплывает» на детали следующего
    // канала, как только тот загрузится.
    mainSlot.querySelectorAll('.cnt-hr-row[data-channel-id]').forEach(el => {
      el.addEventListener('click', () => {
        const id = parseInt(el.dataset.channelId, 10);
        if (!Number.isFinite(id)) return;
        if (st.selectedId === id) return;
        st.selectedId = id;
        st.detail = null;
        st.detailFor = null;
        st.vacancies = [];
        st.vacanciesFor = null;
        // vacanciesLoading сбрасываем тоже — иначе если предыдущий
        // запрос в полёте (или ушёл в stale-drop), флаг остаётся true и
        // гейт `!vacanciesLoading` в renderContacts блокирует новый
        // запрос для свежевыбранного канала.
        st.vacanciesLoading = false;
        st.vacanciesLoadingMore = false;
        st.vacanciesHasMore = false;
        st.morePopoverOpen = false;
        renderSection();
      });
    });

    // Mini-vacancy row click → deep-link to the Vacancies tab. Same shape
    // as `cnt-co-open-vacancy` (Companies detail), just a separate handler
    // attribute so the channels-only attach pass picks it up.
    mainSlot.querySelectorAll('[data-action="cnt-ch-open-vacancy"]').forEach(el => {
      el.addEventListener('click', () => {
        const id = parseInt(el.dataset.vacancyId, 10);
        if (!Number.isFinite(id)) return;
        appState.vacancies.selectedId = id;
        appState.vacancies.detail = null;
        appState.vacancies.detailLoading = true;
        if (api) api.request_vacancy_detail(id);
        setActiveSection('vacancies');
      });
    });

    // Infinite-scroll триггер на детальной панели: за ~150px до нижней
    // границы дозапрашиваем следующую страницу. Блокируется, пока летит
    // in-flight append, и прячется когда has_more=false. Тот же scroll-
    // слушатель повторно используется ниже для outside-click closer'а
    // более-popover'а — оба навешены на `.cnt-detail-pane`.
    const detailPaneScroll = mainSlot.querySelector('.cnt-detail-pane');
    if (detailPaneScroll) {
      detailPaneScroll.addEventListener('scroll', () => {
        if (!st.vacanciesHasMore || st.vacanciesLoadingMore) return;
        if (detailPaneScroll.scrollTop + detailPaneScroll.clientHeight < detailPaneScroll.scrollHeight - 150) return;
        if (st.detail) requestContactsChannelVacancies(st.detail.id, { mode: 'append' });
      });
    }

    // «Открыть в Telegram» — открывает t.me/{username} в системном браузере.
    // Тот же data-action, что использует HR/Companies — единый handler ниже
    // не нужно дублировать. Отдельно навешиваю здесь, потому что в HR-вкладке
    // handler привязан в её attach-функции; channels не наследуют тот scope.
    mainSlot.querySelectorAll('[data-action="cnt-open-tg"]').forEach(el => {
      el.addEventListener('click', (e) => {
        e.stopPropagation();
        const username = el.dataset.username;
        if (api && username) api.open_external_url('https://t.me/' + username);
      });
    });

    // «+» в тулбаре — открывает модалку.
    const addBtn = mainSlot.querySelector('[data-action="cnt-ch-add-open"]');
    if (addBtn) {
      addBtn.addEventListener('click', () => {
        const m = st.addModal;
        m.open = true;
        m.saving = false;
        m.error = null;
        m.draft = { input: '' };
        m.focus = true;
        renderSection();
      });
    }

    // Закрытие модалки — backdrop, Cancel, X. Чистим draft в каждом
    // close-path'е, чтобы состояние «модалка закрыта» однозначно
    // означало пустой draft.
    mainSlot.querySelectorAll('[data-action="cnt-ch-add-close"]').forEach(el => {
      el.addEventListener('click', () => {
        const m = st.addModal;
        if (m.saving) return;  // ждём ответ — не закрываем
        m.open = false;
        m.error = null;
        m.draft = { input: '' };
        renderSection();
      });
    });

    // Live-обновление draft + focus restore + Enter = submit.
    const addInput = mainSlot.querySelector('[data-role="cnt-ch-add-input"]');
    if (addInput) {
      if (st.addModal.focus) {
        addInput.focus();
        try { addInput.setSelectionRange(addInput.value.length, addInput.value.length); } catch (_) {}
        st.addModal.focus = false;
      }
      addInput.addEventListener('input', () => {
        st.addModal.draft.input = addInput.value;
        // Только переключаем кнопку, без re-render — иначе input теряет фокус.
        const submit = mainSlot.querySelector('[data-action="cnt-ch-add-submit"]');
        if (submit) {
          submit.disabled = st.addModal.saving || !addInput.value.trim();
        }
      });
      addInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !st.addModal.saving && addInput.value.trim()) {
          e.preventDefault();
          submitAddChannel();
        }
      });
    }

    const submitBtn = mainSlot.querySelector('[data-action="cnt-ch-add-submit"]');
    if (submitBtn) {
      submitBtn.addEventListener('click', () => submitAddChannel());
    }

    // Outside-click closer for the more-popover. Pane-level click handler,
    // skips clicks inside `.more-wrap` (they propagate to the menu items).
    const detailPane = mainSlot.querySelector('.cnt-detail-pane');
    if (detailPane) {
      detailPane.addEventListener('click', (e) => {
        if (!st.morePopoverOpen) return;
        if (e.target.closest('.more-wrap')) return;
        st.morePopoverOpen = false;
        renderSection();
      });
    }

    // More-vert toggle in detail head.
    mainSlot.querySelectorAll('[data-action="cnt-ch-more-toggle"]').forEach(el => {
      el.addEventListener('click', (e) => {
        e.stopPropagation();
        st.morePopoverOpen = !st.morePopoverOpen;
        renderSection();
      });
    });

    // «Прогнать сейчас» — single-channel poll. Toast про результат —
    // в action_done, потому что _dispatch ждёт завершения опроса
    // (это десятки секунд — минуты), и сообщать «успех» сразу было бы
    // обманом. Здоровье проверяем дважды: render-time (button disabled)
    // и тут на всякий случай — popover мог пережить health flip между
    // последним render'ом и кликом.
    mainSlot.querySelectorAll('[data-action="cnt-ch-poll-now"]').forEach(el => {
      el.addEventListener('click', () => {
        st.morePopoverOpen = false;
        renderSection();
        if (!st.detail || !api) return;
        if (!(healthInitialized && isAllHealthy())) {
          if (typeof showToast === 'function') showToast(buildHealthBlockedTip(), { variant: 'danger' });
          return;
        }
        api.request_channel_poll_now(st.detail.id);
      });
    });

    // «Сбросить курсор» — last_processed_msg_id → NULL.
    mainSlot.querySelectorAll('[data-action="cnt-ch-reset-cursor"]').forEach(el => {
      el.addEventListener('click', () => {
        st.morePopoverOpen = false;
        renderSection();
        if (!st.detail || !api) return;
        api.request_channel_reset_cursor(st.detail.id);
      });
    });

    // Add / remove blacklist для канала.
    mainSlot.querySelectorAll('[data-action="cnt-ch-blacklist"]').forEach(el => {
      el.addEventListener('click', () => {
        st.morePopoverOpen = false;
        renderSection();
        if (!st.detail || !api) return;
        api.contacts_add_channel_to_blacklist(st.detail.id);
      });
    });
    mainSlot.querySelectorAll('[data-action="cnt-ch-unblacklist"]').forEach(el => {
      el.addEventListener('click', () => {
        st.morePopoverOpen = false;
        renderSection();
        if (!st.detail || !api) return;
        api.contacts_remove_channel_from_blacklist(st.detail.id);
      });
    });

    // «Удалить канал» — confirm-модалка, потом запрос. Backend нулит
    // vacancy.source_channel_id у связанных вакансий, чтобы не терять
    // forensic-данные.
    mainSlot.querySelectorAll('[data-action="cnt-ch-delete"]').forEach(el => {
      el.addEventListener('click', async () => {
        st.morePopoverOpen = false;
        renderSection();
        if (!st.detail || !api) return;
        const id = st.detail.id;
        const label = st.detail.title || (st.detail.username ? '@' + st.detail.username : `канал #${id}`);
        const ok = await showModal({
          message: `Удалить «${label}»?\n\nСвязанные вакансии останутся, но без привязки к каналу. Действие необратимо.`,
          type: 'confirm',
          danger: true,
          okLabel: 'Удалить',
        });
        if (!ok) return;
        api.request_channel_delete(id);
      });
    });

    // Master-тоггл в тулбаре — bulk on/off для всех каналов сразу.
    // Optimistic-update + snapshot для отката при ошибке.
    mainSlot.querySelectorAll('[data-action="cnt-ch-toggle-all"]').forEach(el => {
      el.addEventListener('change', () => {
        if (st.togglingAll) return;
        const next = el.checked;
        // Blacklisted каналы исключаем из bulk-флипа — бэкенд их тоже
        // пропускает; без UI-зеркала optimistic-render рисует их как ON,
        // и пользователь видит запрещённое состояние до прихода refresh'а.
        st.toggleAllRollback = new Map(
          st.list.filter(r => !r.blacklisted).map(r => [r.id, r.isActive])
        );
        st.list.forEach(r => { if (!r.blacklisted) r.isActive = next; });
        st.togglingAll = true;
        if (api) {
          api.set_all_channels_active(JSON.stringify({ is_active: next }));
        }
        renderSection();
      });
    });

    // On/off toggle in a channel row — optimistic flip, rollback on error
    // signal. Click on the checkbox should NOT trigger the row-select, hence
    // stopPropagation.
    mainSlot.querySelectorAll('[data-action="cnt-ch-toggle"]').forEach(el => {
      el.addEventListener('click', (e) => e.stopPropagation());
      el.addEventListener('change', (e) => {
        const id = parseInt(el.dataset.channelId, 10);
        if (!Number.isFinite(id)) return;
        const row = st.list.find(r => r.id === id);
        if (!row) return;
        const next = el.checked;
        row.isActive = next;
        st.toggling.add(id);
        if (api) {
          api.set_channel_active(JSON.stringify({
            channel_id: id,
            is_active: next,
          }));
        }
        renderSection();
      });
    });
    if (searchInput) {
      if (st.searchFocus) {
        searchInput.focus();
        try {
          searchInput.setSelectionRange(st.searchFocus.start, st.searchFocus.end);
        } catch (_) { /* nbd */ }
        st.searchFocus = null;
      }
      searchInput.addEventListener('input', () => {
        st.searchDraft = searchInput.value;
        st.searchFocus = {
          start: searchInput.selectionStart,
          end: searchInput.selectionEnd,
        };
        if (clearBtn) clearBtn.classList.toggle('hidden', !searchInput.value);
        if (st.searchTimer) clearTimeout(st.searchTimer);
        st.searchTimer = setTimeout(() => {
          st.searchTimer = null;
          requestContactsChannelList();
        }, 200);
      });
    }
    if (clearBtn) {
      clearBtn.addEventListener('click', (e) => {
        e.preventDefault();
        st.searchDraft = '';
        // Сохраняем фокус и положение каретки на 0 — после re-render
        // (который случится из onContactsChannelListLoaded) attach снова
        // вернёт фокус инпуту.
        st.searchFocus = { start: 0, end: 0 };
        if (st.searchTimer) { clearTimeout(st.searchTimer); st.searchTimer = null; }
        const refocus = mainSlot.querySelector('[data-role="cnt-ch-search"]');
        if (refocus) {
          refocus.value = '';
          refocus.focus();
        }
        requestContactsChannelList();
        clearBtn.classList.add('hidden');
      });
    }
  }

  // === Contacts / Blacklist (08) — slice 1: live list ===================

  const BL_KIND_LABELS = {
    keyword: 'Ключевые слова',
    hr: 'HR',
    company: 'Компании',
    channel: 'Каналы',
  };
  const BL_KIND_ORDER = ['keyword', 'hr', 'company', 'channel'];

  function fmtBlacklistDate(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    if (isNaN(d.getTime())) return '';
    const sameYear = d.getFullYear() === new Date().getFullYear();
    const opts = sameYear
      ? { day: 'numeric', month: 'short' }
      : { day: 'numeric', month: 'short', year: 'numeric' };
    // Локаль ru-RU отдаёт «12 апр.» / «12 апр. 2024 г.» — точки и
    // 'г.' выкидываем, формат макета: «12 апр» / «12 апр 2024».
    return d.toLocaleDateString('ru-RU', opts).replace(/\sг\./, '').replace(/\./g, '');
  }

  function requestContactsBlacklistList() {
    if (!api) return;
    api.request_contacts_blacklist_list();
  }

  function onContactsBlacklistListLoaded(payload) {
    let p;
    try { p = JSON.parse(payload); } catch { return; }
    if (!p) return;
    const st = appState.contacts.blacklist;
    if (!p.ok) {
      st.loaded = true;
      return;
    }
    st.list = (p.items || []).map(it => ({
      id: it.id,
      kind: it.kind || 'keyword',
      value: it.value || '',
      reason: it.reason || '',
      active: !!it.active,
      createdAt: it.created_at,
    }));
    st.loaded = true;
    if (appState.section === 'contacts' && appState.contacts.tab === 'blacklist') {
      renderSection();
    }
  }

  function _blacklistFilteredList() {
    const st = appState.contacts.blacklist;
    const q = (st.searchDraft || '').trim().toLocaleLowerCase('ru-RU');
    const kf = st.kindFilter || 'all';
    return st.list.filter(r => {
      if (kf !== 'all' && r.kind !== kf) return false;
      if (q) {
        const v = (r.value || '').toLocaleLowerCase('ru-RU');
        const reason = (r.reason || '').toLocaleLowerCase('ru-RU');
        if (!v.includes(q) && !reason.includes(q)) return false;
      }
      return true;
    });
  }

  function renderContactsBlacklistRow(row) {
    const st = appState.contacts.blacklist;
    const kindClass = ['keyword', 'hr', 'company', 'channel'].includes(row.kind) ? row.kind : 'keyword';
    const inFlight = st.toggling && st.toggling.has(row.id);
    return `
      <div class="bl-row${row.active ? '' : ' disabled'}" data-bl-id="${row.id}">
        <span class="bl-kind-chip ${kindClass}">${escapeHtml(row.kind)}</span>
        <input class="bl-input value" type="text" data-role="cnt-bl-value-${row.id}" data-bl-id="${row.id}" data-bl-field="value" value="${escapeAttr(row.value || '')}" maxlength="500" placeholder="—">
        <textarea class="bl-input reason" data-role="cnt-bl-reason-${row.id}" data-bl-id="${row.id}" data-bl-field="reason" maxlength="500" rows="1" placeholder="Причина (опционально)">${escapeHtml(row.reason || '')}</textarea>
        <span class="bl-when">${escapeHtml(fmtBlacklistDate(row.createdAt))}</span>
        <input type="checkbox" class="toggle-cb" data-action="bl-toggle" data-bl-id="${row.id}"${row.active ? ' checked' : ''}${inFlight ? ' disabled' : ''}>
        <button class="icon-btn" data-action="bl-delete" data-bl-id="${row.id}" type="button" title="Удалить запись">
          <span class="material-symbols-outlined">delete</span>
        </button>
      </div>
    `;
  }

  function renderContactsBlacklist() {
    const st = appState.contacts.blacklist;
    const counts = { all: st.list.length };
    for (const k of BL_KIND_ORDER) counts[k] = 0;
    for (const r of st.list) {
      if (counts[r.kind] !== undefined) counts[r.kind] += 1;
    }
    const pills = [
      { id: 'all', label: 'Все' },
      ...BL_KIND_ORDER.map(k => ({ id: k, label: BL_KIND_LABELS[k] })),
    ].map(p => `
      <span class="bl-filter-pill${st.kindFilter === p.id ? ' active' : ''}" data-action="bl-filter" data-kind="${p.id}">
        ${escapeHtml(p.label)} <span class="count">${counts[p.id]}</span>
      </span>
    `).join('');

    let body;
    if (!st.loaded) {
      body = `<div class="cnt-list-empty">Загрузка…</div>`;
    } else {
      const rows = _blacklistFilteredList();
      if (!rows.length) {
        body = `<div class="cnt-list-empty">${st.list.length === 0 ? 'Blacklist пуст' : 'Ничего не найдено'}</div>`;
      } else {
        body = `
          <div class="bl-table">
            <div class="bl-row head">
              <span>Тип</span>
              <span>Значение</span>
              <span>Причина</span>
              <span>Добавлено</span>
              <span style="text-align: center">Активно</span>
              <span></span>
            </div>
            ${rows.map(renderContactsBlacklistRow).join('')}
          </div>
        `;
      }
    }

    return `
      <div>
        <div class="bl-toolbar">
          <label class="bl-search-box">
            <span class="material-symbols-outlined">search</span>
            <input type="text" data-role="cnt-bl-search" placeholder="Поиск по значению или причине..." value="${escapeAttr(st.searchDraft || '')}">
          </label>
          <div class="bl-filter-pills">${pills}</div>
          <button type="button" class="bl-add-btn" data-action="cnt-bl-add-open" title="Добавить в blacklist">
            <span class="material-symbols-outlined">add</span>Добавить
          </button>
        </div>
        ${body}
      </div>
      ${renderContactsBlacklistAddModal()}
    `;
  }

  function renderBlacklistValueField(draft, modalState) {
    const valueLabel = (
      draft.kind === 'keyword' ? 'Что блокировать (фрагмент текста вакансии)'
      : draft.kind === 'hr'    ? '@username HR или имя'
      : draft.kind === 'company' ? 'Название компании'
      : '@username канала или название'
    );
    const inputHtml = `<input class="bl-modal-input" type="text" data-role="cnt-bl-add-value" maxlength="500" placeholder="${escapeAttr(valueLabel)}" value="${escapeAttr(draft.value || '')}" autocomplete="off">`;
    if (draft.kind === 'keyword') {
      // Keyword — простой input, без dropdown'а.
      return inputHtml;
    }
    let dropdown = '';
    if (modalState.dropdownOpen) {
      const all = modalState.candidates[draft.kind] || [];
      // Сразу выкидываем уже забанённые value (case-insensitive по тому же
      // namespace=kind) — нечего предлагать дубль. Сравниваем по `value`,
      // т.к. backend dedup'ит ровно по нему.
      const taken = new Set(
        appState.contacts.blacklist.list
          .filter(r => r.kind === draft.kind)
          .map(r => (r.value || '').toLocaleLowerCase('ru-RU'))
      );
      const notTaken = all.filter(o => !taken.has((o.value || '').toLocaleLowerCase('ru-RU')));
      const q = (draft.value || '').trim().toLocaleLowerCase('ru-RU');
      const filtered = q
        ? notTaken.filter(o => (o.label || '').toLocaleLowerCase('ru-RU').includes(q)
                            || (o.value || '').toLocaleLowerCase('ru-RU').includes(q))
        : notTaken;
      const isLoaded = !!modalState.candidatesLoaded[draft.kind];
      const body = !isLoaded
        ? `<div class="bl-combobox-empty">Загрузка…</div>`
        : (filtered.length === 0
            ? `<div class="bl-combobox-empty">${
                all.length === 0
                  ? 'Нет существующих ' + draft.kind
                  : (notTaken.length === 0 ? 'Все уже в blacklist' : 'Ничего не найдено')
              }</div>`
            : filtered.map(o => `
                <div class="bl-combobox-option" data-action="cnt-bl-add-pick" data-value="${escapeAttr(o.value)}">
                  <span class="opt-label">${escapeHtml(o.label)}</span>
                  ${o.sub ? `<span class="opt-sub">${escapeHtml(o.sub)}</span>` : ''}
                </div>
              `).join(''));
      dropdown = `<div class="bl-combobox-dropdown">${body}</div>`;
    }
    return `<div class="bl-combobox-wrap">${inputHtml}${dropdown}</div>`;
  }

  function renderContactsBlacklistAddModal() {
    const m = appState.contacts.blacklist.addModal;
    if (!m.open) return '';
    const d = m.draft;
    const segs = ['keyword', 'hr', 'company', 'channel'].map(k => `
      <button type="button" class="bl-kind-seg ${k}${d.kind === k ? ' active' : ''}" data-action="bl-kind-pick" data-kind="${k}">${k}</button>
    `).join('');
    const saveDisabled = m.saving || !String(d.value || '').trim();
    return `
      <div class="modal-backdrop" data-action="cnt-bl-add-close">
        <div class="vac-picker-modal creating bl-add-modal" onclick="event.stopPropagation()">
          <div class="modal-head">
            <span class="material-symbols-outlined">block</span>
            <div class="modal-title">Добавить в blacklist</div>
            <button type="button" class="modal-close" data-action="cnt-bl-add-close" title="Закрыть" aria-label="Закрыть">
              <span class="material-symbols-outlined">close</span>
            </button>
          </div>
          <div class="picker-create-pane">
            <div class="bl-kind-segmented">${segs}</div>
            ${renderBlacklistValueField(d, m)}
            <textarea class="bl-modal-textarea" data-role="cnt-bl-add-reason" maxlength="500" rows="3" placeholder="Причина (опционально)">${escapeHtml(d.reason || '')}</textarea>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn" data-action="cnt-bl-add-close">Отмена</button>
            <button type="button" class="btn primary" data-action="cnt-bl-add-submit"${saveDisabled ? ' disabled' : ''}>${m.saving ? 'Добавляю…' : 'Добавить'}</button>
          </div>
        </div>
      </div>
    `;
  }

  // Hoisted ref + detach/attach для outside-click closer'а combobox-
  // dropdown'а. Слушаем `click` на самой модалке (а не на document):
  // у `.bl-add-modal` стоит inline `onclick="event.stopPropagation()"`,
  // чтобы клики внутри не закрывали backdrop, — поэтому document-listener
  // НЕ ловит внутримодальные клики. На модалке в bubble-фазе мы успеваем
  // отстрелять ПОСЛЕ handler'ов кнопок (Добавить/Отмена/Kind) — они
  // отрабатывают первыми, мы только закрываем dropdown.
  let _blComboboxCloser = null;
  let _blComboboxCloserEl = null;
  function detachBlComboboxCloser() {
    if (_blComboboxCloser && _blComboboxCloserEl) {
      _blComboboxCloserEl.removeEventListener('click', _blComboboxCloser, false);
    }
    _blComboboxCloser = null;
    _blComboboxCloserEl = null;
  }
  function attachBlComboboxCloser() {
    detachBlComboboxCloser();
    const modalEl = mainSlot.querySelector('.bl-add-modal');
    if (!modalEl) return;
    _blComboboxCloserEl = modalEl;
    _blComboboxCloser = (e) => {
      // Гарды: closer мог пережить tab/section-switch (attach handler
      // не дёргается на чужих табах) — игнорим клики если modal/tab уже
      // не активен, и заодно отцепляемся.
      const onTab = appState.section === 'contacts'
        && appState.contacts.tab === 'blacklist'
        && appState.contacts.blacklist.addModal.open;
      if (!onTab) {
        detachBlComboboxCloser();
        return;
      }
      if (e.target.closest('.bl-combobox-wrap')) return;
      appState.contacts.blacklist.addModal.dropdownOpen = false;
      // Снимаем фокус с value-input, иначе focus-handler при следующем
      // re-render'е (например, на push-сигнале) увидит сфокусированный
      // input + dropdownOpen=false и снова откроет dropdown.
      const vi = mainSlot.querySelector('[data-role="cnt-bl-add-value"]');
      if (vi) vi.blur();
      detachBlComboboxCloser();
      renderSection();
    };
    modalEl.addEventListener('click', _blComboboxCloser, false);
  }

  function openBlacklistComboboxDropdown() {
    const m = appState.contacts.blacklist.addModal;
    const k = m.draft.kind;
    if (k === 'keyword') return;
    m.dropdownOpen = true;
    if (!m.candidatesLoaded[k] && api) {
      api.request_blacklist_candidates(k);
    }
    renderSection();
  }

  function onContactsBlacklistCandidatesLoaded(payload) {
    let p;
    try { p = JSON.parse(payload); } catch { return; }
    if (!p || !p.ok) return;
    const m = appState.contacts.blacklist.addModal;
    const k = p.kind;
    if (!['hr', 'company', 'channel'].includes(k)) return;
    m.candidates[k] = Array.isArray(p.items) ? p.items : [];
    m.candidatesLoaded[k] = true;
    // Перерисуем только если модалка открыта на этом kind'е.
    if (appState.section === 'contacts'
        && appState.contacts.tab === 'blacklist'
        && m.open
        && m.draft.kind === k) {
      renderSection();
    }
  }

  // Auto-grow reason-textarea: высота := scrollHeight + бордеры.
  // Минимум подперт CSS'ом (min-height:22px), так что rows=1 → 22px floor;
  // на длинном reason'е растёт до полного контента, скролла нет
  // (overflow:hidden в CSS).
  function autosizeBlReasonTextarea(el) {
    if (!el) return;
    el.style.height = 'auto';
    el.style.height = el.scrollHeight + 'px';
  }

  function _clearBlacklistEditTimers(st, id) {
    if (!st.editTimers) return;
    const prefix = `${id}:`;
    for (const [key, t] of st.editTimers) {
      if (key.startsWith(prefix)) {
        clearTimeout(t);
        st.editTimers.delete(key);
      }
    }
  }

  function submitBlacklistAdd() {
    const m = appState.contacts.blacklist.addModal;
    const d = m.draft;
    const value = String(d.value || '').trim();
    if (!value || m.saving) return;
    m.saving = true;
    if (api) {
      api.request_create_blacklist(JSON.stringify({
        kind: d.kind,
        value,
        reason: String(d.reason || '').trim(),
      }));
    }
    renderSection();
  }

  function onContactsBlacklistActionDone(payload) {
    let p;
    try { p = JSON.parse(payload); } catch { return; }
    if (!p) return;
    const st = appState.contacts.blacklist;

    if (p.action === 'set_active') {
      if (p.id == null) return;
      st.toggling.delete(p.id);
      if (!p.ok) {
        // Rollback: server says it didn't happen — restore opposite.
        const row = st.list.find(r => r.id === p.id);
        if (row) row.active = !p.active;
        if (typeof showToast === 'function') {
          showToast(p.error || 'Не удалось переключить запись', { variant: 'danger' });
        }
      }
      if (appState.section === 'contacts' && appState.contacts.tab === 'blacklist') {
        renderSection();
      }
      return;
    }

    if (p.action === 'create') {
      const m = st.addModal;
      if (!p.ok) {
        m.saving = false;
        if (typeof showToast === 'function') {
          showToast(p.error || 'Не удалось добавить', { variant: 'danger' });
        }
        if (appState.section === 'contacts' && appState.contacts.tab === 'blacklist') {
          renderSection();
        }
        return;
      }
      // Закрываем модалку, чистим draft, перезапрашиваем list (вместо
      // optimistic insert: проще не поддерживать сортировку клиентом).
      m.open = false;
      m.saving = false;
      m.dropdownOpen = false;
      m.draft = { kind: 'keyword', value: '', reason: '' };
      if (typeof showToast === 'function') {
        // created=false когда ряд уже был — мог быть active или inactive
        // (бэк реактивирует второй случай). Не различаем чтобы не врать.
        showToast(p.created ? 'Запись добавлена' : 'Запись уже была в списке');
      }
      requestContactsBlacklistList();
      return;
    }

    if (p.action === 'update') {
      if (p.id == null) return;
      if (!p.ok) {
        if (typeof showToast === 'function') {
          showToast(p.error || 'Не удалось сохранить', { variant: 'danger' });
        }
        // Optimistic mutation в row[field] оставила local-state с
        // невалидным значением — рефетчим, чтобы вернуть UI к канонике.
        // Заодно выкидываем pending editTimers того id, чтобы повторный
        // save с теми же данными снова не упал.
        _clearBlacklistEditTimers(st, p.id);
        requestContactsBlacklistList();
        return;
      }
      // Зелёный flash на сохранённых полях. Не апдейтим row.value/reason
      // из ответа: пользователь мог продолжить печатать пока запрос летел,
      // local-state — то, что в инпуте, server's echo может быть устаревшим.
      const fields = Array.isArray(p.fields) ? p.fields : [];
      for (const f of fields) {
        const sel = `[data-role="cnt-bl-${f}-${p.id}"]`;
        const el = mainSlot.querySelector(sel);
        if (el) {
          el.classList.add('saved-flash');
          setTimeout(() => el.classList.remove('saved-flash'), 400);
        }
      }
      return;
    }

    if (p.action === 'delete') {
      if (!p.ok) {
        if (typeof showToast === 'function') {
          showToast(p.error || 'Не удалось удалить запись', { variant: 'danger' });
        }
        return;
      }
      // Удалили на сервере — выкидываем из локального списка без round-trip'а
      // на refresh. Кросс-таб refresh для HR/Companies (где `is_blacklisted`
      // запечён в ряды) уходит push-сигналом `contacts_lists_changed` из
      // bridge.delete_blacklist.
      st.list = st.list.filter(r => r.id !== p.id);
      // Чистим pending edit-таймеры удалённого ряда — иначе через 500мс
      // они отправят update_blacklist по уже несуществующему id и юзер
      // увидит «Запись не найдена» toast после собственного удаления.
      _clearBlacklistEditTimers(st, p.id);
      if (typeof showToast === 'function') showToast('Запись удалена');
      if (appState.section === 'contacts' && appState.contacts.tab === 'blacklist') {
        renderSection();
      }
      return;
    }
  }

  function attachContactsBlacklistHandlers() {
    const st = appState.contacts.blacklist;

    // Фильтр-пиллсы.
    mainSlot.querySelectorAll('[data-action="bl-filter"]').forEach(el => {
      el.addEventListener('click', () => {
        const k = el.dataset.kind || 'all';
        if (st.kindFilter === k) return;
        st.kindFilter = k;
        renderSection();
      });
    });

    // Поиск с дебаунсом 200мс. Локальный фильтр — без bridge round-trip.
    const searchInput = mainSlot.querySelector('[data-role="cnt-bl-search"]');
    if (searchInput) {
      searchInput.addEventListener('input', () => {
        st.searchDraft = searchInput.value;
        if (st.searchTimer) clearTimeout(st.searchTimer);
        st.searchTimer = setTimeout(() => {
          st.searchTimer = null;
          renderSection();
        }, 200);
      });
    }

    // Toggle в ряду — optimistic flip + rollback на ошибке.
    mainSlot.querySelectorAll('[data-action="bl-toggle"]').forEach(el => {
      el.addEventListener('change', () => {
        const id = parseInt(el.dataset.blId, 10);
        if (!Number.isFinite(id)) return;
        const row = st.list.find(r => r.id === id);
        if (!row) return;
        const next = el.checked;
        row.active = next;
        st.toggling.add(id);
        if (api) {
          api.set_blacklist_active(JSON.stringify({ id, active: next }));
        }
        renderSection();
      });
    });

    // Inline edit value/reason: дебаунс 500мс, после простоя — save.
    // row.value/row.reason обновляем сразу (optimistic), на ошибке —
    // toast, без rollback'а: пользователь может продолжать печатать.
    // Если re-render отслоит el.value, optimistic-mutation уже отразил
    // изменение в row[field] — следующий render пересоздаст инпут с
    // нужным значением.
    mainSlot.querySelectorAll('.bl-input[data-bl-field]').forEach(el => {
      el.addEventListener('input', () => {
        const id = parseInt(el.dataset.blId, 10);
        if (!Number.isFinite(id)) return;
        const field = el.dataset.blField;
        if (field !== 'value' && field !== 'reason') return;
        const row = st.list.find(r => r.id === id);
        if (row) row[field] = el.value;
        if (el.tagName === 'TEXTAREA') autosizeBlReasonTextarea(el);
        const key = `${id}:${field}`;
        const prev = st.editTimers.get(key);
        if (prev) clearTimeout(prev);
        st.editTimers.set(key, setTimeout(() => {
          st.editTimers.delete(key);
          if (api) {
            api.update_blacklist(JSON.stringify({ id, [field]: el.value }));
          }
        }, 500));
      });
    });
    // На render — выставляем высоту reason-textarea'ы под их content,
    // иначе rows=1 даст одну строку даже для длинных reason'ов.
    mainSlot.querySelectorAll('textarea.bl-input.reason').forEach(autosizeBlReasonTextarea);

    // Add modal — open / close (close блокируется пока saving) / kind-pick /
    // submit. Inputs пишут draft на keystroke, без debounce — submit'ится
    // только по нажатию «Добавить».
    const addBtn = mainSlot.querySelector('[data-action="cnt-bl-add-open"]');
    if (addBtn) {
      addBtn.addEventListener('click', () => {
        const m = st.addModal;
        m.open = true;
        m.saving = false;
        m.draft = { kind: 'keyword', value: '', reason: '' };
        m.dropdownOpen = false;
        // Invalidate combobox-кэш — между открытиями модалки могли
        // добавиться новые HR/Company/Channel; perепросим при первом
        // выборе типа.
        m.candidatesLoaded = { keyword: true, hr: false, company: false, channel: false };
        renderSection();
      });
    }
    mainSlot.querySelectorAll('[data-action="cnt-bl-add-close"]').forEach(el => {
      el.addEventListener('click', () => {
        const m = st.addModal;
        if (m.saving) return;
        m.open = false;
        m.dropdownOpen = false;
        m.draft = { kind: 'keyword', value: '', reason: '' };
        renderSection();
      });
    });
    mainSlot.querySelectorAll('[data-action="bl-kind-pick"]').forEach(el => {
      el.addEventListener('click', () => {
        const m = st.addModal;
        const k = el.dataset.kind;
        if (!['keyword', 'hr', 'company', 'channel'].includes(k)) return;
        if (m.draft.kind === k) return;
        m.draft.kind = k;
        // Сменили тип — старое value уже не валидно (другой namespace),
        // dropdown закрываем. Автофокус намеренно не делаем —
        // юзер сам кликает в поле, чтобы избежать «прыжка» каретки.
        m.draft.value = '';
        m.dropdownOpen = false;
        renderSection();
      });
    });

    // Combobox: focus on value-input → fetch candidates + open dropdown
    // (для kind != keyword); click on option → fill input; click outside →
    // close (с задержкой 150мс чтобы option-click успел отработать до blur).
    mainSlot.querySelectorAll('[data-action="cnt-bl-add-pick"]').forEach(el => {
      el.addEventListener('mousedown', (e) => {
        // mousedown ловим вместо click чтобы успеть до input.blur'а.
        e.preventDefault();
        const m = st.addModal;
        const v = el.dataset.value || '';
        m.draft.value = v;
        m.dropdownOpen = false;
        // Снимаем фокус с input ДО renderSection — иначе savedContactsFocus
        // снапшотит cnt-bl-add-value, после re-render восстановит фокус,
        // focus-handler сработает и снова откроет dropdown.
        const vi = mainSlot.querySelector('[data-role="cnt-bl-add-value"]');
        if (vi) vi.blur();
        renderSection();
      });
    });
    const valueInput = mainSlot.querySelector('[data-role="cnt-bl-add-value"]');
    if (valueInput) {
      valueInput.addEventListener('focus', () => {
        if (st.addModal.draft.kind !== 'keyword' && !st.addModal.dropdownOpen) {
          openBlacklistComboboxDropdown();
        }
      });
      valueInput.addEventListener('input', () => {
        st.addModal.draft.value = valueInput.value;
        const submit = mainSlot.querySelector('[data-action="cnt-bl-add-submit"]');
        if (submit) submit.disabled = st.addModal.saving || !valueInput.value.trim();
        // Перерисовываем dropdown с обновлённым фильтром (только для combobox).
        if (st.addModal.draft.kind !== 'keyword' && st.addModal.dropdownOpen) {
          // Сохраняем фокус — `savedContactsFocus` снапшотит cnt-bl-add-value
          // и вернёт каретку через restore-pass.
          renderSection();
        }
      });
      valueInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !st.addModal.saving && valueInput.value.trim()) {
          e.preventDefault();
          st.addModal.dropdownOpen = false;
          submitBlacklistAdd();
        } else if (e.key === 'Escape' && st.addModal.dropdownOpen) {
          // Esc сначала закрывает dropdown, иначе прокидываем общему
          // Esc-handler'у на закрытие модалки.
          e.stopPropagation();
          st.addModal.dropdownOpen = false;
          renderSection();
        }
      });
    }

    // Outside-click closer — attach/detach через hoisted ref (см. выше),
    // чтобы не плодить duplicate-listener'ы на каждый renderSection.
    if (st.addModal.dropdownOpen) {
      attachBlComboboxCloser();
    } else {
      detachBlComboboxCloser();
    }
    const reasonInput = mainSlot.querySelector('[data-role="cnt-bl-add-reason"]');
    if (reasonInput) {
      reasonInput.addEventListener('input', () => {
        st.addModal.draft.reason = reasonInput.value;
      });
      // Textarea: Enter — перенос строки (multi-line). Ctrl/⌘+Enter — submit.
      reasonInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)
            && !st.addModal.saving && st.addModal.draft.value.trim()) {
          e.preventDefault();
          submitBlacklistAdd();
        }
      });
    }
    const submitBtn = mainSlot.querySelector('[data-action="cnt-bl-add-submit"]');
    if (submitBtn) {
      submitBtn.addEventListener('click', () => submitBlacklistAdd());
    }

    // Delete: confirm-модалка показывает kind+value, чтобы пользователь
    // не удалил случайно чужую запись.
    mainSlot.querySelectorAll('[data-action="bl-delete"]').forEach(el => {
      el.addEventListener('click', async () => {
        const id = parseInt(el.dataset.blId, 10);
        if (!Number.isFinite(id) || !api) return;
        const row = st.list.find(r => r.id === id);
        const label = row
          ? `«${row.value || '—'}»` + (row.kind ? ` (${row.kind})` : '')
          : `запись #${id}`;
        const ok = await showModal({
          message: `Удалить ${label} из blacklist?\n\nДействие необратимо.`,
          type: 'confirm',
          danger: true,
          okLabel: 'Удалить',
        });
        if (!ok) return;
        api.delete_blacklist(id);
      });
    });
  }

  // Toggle the «Создать» disabled state without re-rendering the modal —
  // re-rendering would blur the input the user is typing into.
  function reRenderAddSaveBtn() {
    const m = appState.contacts.hr.addModal;
    const d = m.draft;
    const disabled = m.saving
      || (!String(d.name || '').trim()
          && !String(d.telegram_username || '').trim()
          && !String(d.telegram_user_id || '').trim());
    const btn = mainSlot.querySelector('[data-action="cnt-add-save"]');
    if (btn) btn.disabled = disabled;
  }

  // === System / Логи (10) ================================================

  const SYS_TABS = [
    { id: 'settings', label: 'Настройки' },
    { id: 'logs',     label: 'Логи' },
  ];
  // Мульти-выбор уровней. id — что хранится в selectedLevels Set;
  // для 'ERROR' матчим также 'CRITICAL' (см. _matchLevel).
  const LOGS_LEVELS = [
    { id: 'ERROR',   label: 'ERROR', cls: 'error', icon: 'error' },
    { id: 'WARNING', label: 'WARN',  cls: 'warn',  icon: 'warning' },
    { id: 'INFO',    label: 'INFO',  cls: 'info',  icon: 'info' },
    { id: 'DEBUG',   label: 'DEBUG', cls: 'debug', icon: 'bug_report' },
  ];

  function fmtLogTime(epochSec) {
    if (epochSec == null) return '';
    const d = new Date(epochSec * 1000);
    const hh = String(d.getHours()).padStart(2, '0');
    const mm = String(d.getMinutes()).padStart(2, '0');
    const ss = String(d.getSeconds()).padStart(2, '0');
    const ms = String(d.getMilliseconds()).padStart(3, '0');
    return `${hh}:${mm}:${ss}.${ms}`;
  }

  function _logsLevelClass(level) {
    if (level === 'ERROR' || level === 'CRITICAL') return 'error';
    if (level === 'WARNING') return 'warn';
    if (level === 'INFO') return 'info';
    return 'debug';
  }

  function _matchLevel(recordLevel, selectedLevels) {
    // CRITICAL рендерится как ERROR — пилюля 'ERROR' покрывает оба.
    if (recordLevel === 'CRITICAL') return selectedLevels.has('ERROR');
    return selectedLevels.has(recordLevel);
  }

  let _logsRefreshTimer = null;

  function _syncLogsSubscription() {
    // Bridge gating: backend дропает push-сигналы когда мы не подписаны.
    // Подписываемся пока юзер на logs-табе — auto-refresh всегда включен.
    if (!api || !api.set_logs_subscribed) return;
    const want = appState.section === 'system' && appState.system.tab === 'logs';
    api.set_logs_subscribed(want);
  }

  function requestSystemLogs() {
    // Бэкенд всегда отдаёт все записи; фильтр уровней — на фронте,
    // чтобы счётчики в пилюлях отражали полный буфер вне зависимости
    // от текущего выбора.
    if (!api) return;
    api.request_system_logs(JSON.stringify({ limit: 1000 }));
  }

  function onSystemLogsLoaded(payload) {
    let p;
    try { p = JSON.parse(payload); } catch { return; }
    if (!p || !p.ok) {
      appState.system.logs.loaded = true;
      return;
    }
    const st = appState.system.logs;
    st.records = p.records || [];
    st.levelCounts = p.level_counts || {};
    st.total = p.total || 0;
    st.loaded = true;
    // Чистим expanded от ID'ов которые выпали из buffer'а (rollover) —
    // иначе Set растёт навсегда.
    if (st.expanded.size > 0) {
      const present = new Set(st.records.map(r => r.id));
      for (const id of st.expanded) {
        if (!present.has(id)) st.expanded.delete(id);
      }
    }
    if (appState.section === 'system' && appState.system.tab === 'logs') {
      renderSection();
    }
  }

  function onSystemLogRecordPushed(payload) {
    // Каждый push triggers refetch (через debounce 200мс, чтобы burst
    // в 100 records/сек схлопнуть в один round-trip). Backend гейтит
    // emit на _logs_subscribed flag'е; defense-in-depth — тоже проверяем.
    if (appState.section !== 'system' || appState.system.tab !== 'logs') return;
    if (!appState.system.logs.autoRefresh) return;
    if (_logsRefreshTimer) clearTimeout(_logsRefreshTimer);
    _logsRefreshTimer = setTimeout(() => {
      _logsRefreshTimer = null;
      requestSystemLogs();
    }, 200);
  }

  function onSystemLogsCleared(payload) {
    let p;
    try { p = JSON.parse(payload); } catch { return; }
    if (!p || !p.ok) {
      if (typeof showToast === 'function') {
        showToast(p.error || 'Не удалось очистить логи', { variant: 'danger' });
      }
      return;
    }
    appState.system.logs.records = [];
    appState.system.logs.expanded = new Set();
    appState.system.logs.total = 0;
    appState.system.logs.levelCounts = {};
    if (appState.section === 'system' && appState.system.tab === 'logs') {
      renderSection();
    }
    if (typeof showToast === 'function') showToast(`Очищено ${p.cleared} записей`);
  }

  function renderSystemLogs() {
    const st = appState.system.logs;
    const pills = LOGS_LEVELS.map(l => {
      const isActive = st.selectedLevels.has(l.id);
      const count = st.levelCounts[l.id] || 0;
      return `<span class="logs-level-pill${isActive ? ' active ' + l.cls : ''}" data-action="logs-level" data-level="${l.id}">`
        + `<span class="material-symbols-outlined">${l.icon}</span>`
        + `${escapeHtml(l.label)} <span class="count">${count}</span>`
        + `</span>`;
    }).join('');

    const filtered = st.records.filter(r => _matchLevel(r.level, st.selectedLevels));

    let body;
    if (!st.loaded) {
      body = `<div class="logs-empty">Загрузка…</div>`;
    } else if (!filtered.length) {
      body = `<div class="logs-empty">${st.total === 0 ? 'Логов пока нет' : 'Ничего не найдено'}</div>`;
    } else {
      body = filtered.map(r => {
        const lvlCls = _logsLevelClass(r.level);
        const expanded = st.expanded.has(r.id);
        const detailsHtml = expanded && r.details
          ? `<div class="logs-details">${escapeHtml(r.details)}</div>`
          : '';
        return `<div class="logs-row${expanded ? ' expanded' : ''}" data-action="logs-toggle" data-log-id="${r.id}">
          <span class="logs-time">${escapeHtml(fmtLogTime(r.ts))}</span>
          <span class="logs-level ${lvlCls}">${escapeHtml(r.level)}</span>
          <span class="logs-source">${escapeHtml(r.source || '')}</span>
          <span class="logs-msg">${escapeHtml(r.msg || '')}</span>
          ${detailsHtml}
        </div>`;
      }).join('');
    }

    return `
      <div class="logs-toolbar">
        <div class="logs-level-pills">${pills}</div>
        <div style="flex: 1"></div>
        <label class="logs-auto-refresh"><input type="checkbox" data-action="logs-autorefresh"${st.autoRefresh ? ' checked' : ''}>Авто-обновление</label>
        <button class="icon-btn" data-action="logs-clear" type="button" title="Очистить логи"><span class="material-symbols-outlined">cleaning_services</span></button>
      </div>
      <div class="logs-list">${body}</div>
    `;
  }

  function renderSystem() {
    const sys = appState.system;
    const tabs = SYS_TABS.map(t => `<div class="tab${sys.tab === t.id ? ' active' : ''}" data-tab="${t.id}">${escapeHtml(t.label)}</div>`).join('');
    let body;
    if (sys.tab === 'logs') {
      if (api && !sys.logs.loaded) requestSystemLogs();
      body = renderSystemLogs();
    } else if (sys.tab === 'settings') {
      if (api && !sys.settings.loaded) requestSystemSettings();
      body = renderSystemSettings();
    } else {
      const label = SYS_TABS.find(t => t.id === sys.tab)?.label || sys.tab;
      body = `<div class="placeholder-content">Раздел «Система / ${escapeHtml(label)}» — экран ещё не реализован</div>`;
    }
    mainSlot.innerHTML = `
      <div class="sys-section">
        <nav class="top-tabs">${tabs}</nav>
        ${body}
      </div>
    `;
    mainSlot.querySelectorAll('.top-tabs .tab').forEach(el => {
      el.addEventListener('click', () => {
        sys.tab = el.dataset.tab;
        renderSection();
      });
    });
    if (sys.tab === 'logs') attachSystemLogsHandlers();
    if (sys.tab === 'settings') attachSystemSettingsHandlers();
  }

  // === System / Настройки (12) ===========================================

  function requestSystemSettings() {
    if (!api) return;
    api.request_system_settings();
  }

  function _llmCredsChanged(prev, next) {
    if (!prev || !next) return true;
    return prev.base_url !== next.base_url
        || prev.model    !== next.model
        || prev.api_key  !== next.api_key;
  }

  function onSystemSettingsLoaded(payload) {
    let p;
    try { p = JSON.parse(payload); } catch { return; }
    if (!p || !p.ok) return;
    const st = appState.system.settings;
    st.tg = p.tg || null;
    // Если creds провайдера поменялись (refetch после save / другого окна) —
    // сбрасываем probe-state, чтобы зелёная плашка не лгала про latency
    // на старых значениях.
    const newChat = p.chat || null;
    if (_llmCredsChanged(st.chat, newChat)) {
      st.chatProbe = { status: 'idle', model: '', latencyMs: 0, error: '' };
    }
    st.chat = newChat;
    const newEmbed = p.embed || null;
    if (_llmCredsChanged(st.embed, newEmbed)) {
      st.embedProbe = { status: 'idle', model: '', latencyMs: 0, error: '' };
    }
    st.embed = newEmbed;
    // Дериватив: считаем «те же креды что у чата», если они побайтно
    // совпадают. После wizard'а это обычно так — он копирует creds.
    if (newChat && newEmbed) {
      st.embedSameAsChat = newChat.base_url === newEmbed.base_url
                        && newChat.api_key  === newEmbed.api_key;
    } else {
      st.embedSameAsChat = true; // дефолт по мокапу
    }
    st.pipeline = p.pipeline || null;
    st.loaded = true;
    if (appState.section === 'system' && appState.system.tab === 'settings') {
      renderSection();
    }
  }

  // Кеш «последний запрошенный набор creds» по kind, чтобы blur-фетч
  // не дёргал /v1/models повторно с теми же параметрами.
  const _llmModelsLastFetch = { chat: '', embed: '' };

  function _llmReadCreds(kind) {
    // Для embed при same_as_chat читаем base_url/api_key из инпутов чата.
    const st = appState.system.settings;
    const sourceKind = (kind === 'embed' && st.embedSameAsChat) ? 'chat' : kind;
    const baseInp = mainSlot.querySelector(`[data-field="${sourceKind}.base_url"]`);
    const keyInp  = mainSlot.querySelector(`[data-field="${sourceKind}.api_key"]`);
    return {
      base_url: baseInp ? baseInp.value.trim() : '',
      api_key:  keyInp  ? keyInp.value         : '',
    };
  }

  function _llmFetchModels(kind) {
    const { base_url, api_key } = _llmReadCreds(kind);
    if (!base_url) return;
    const sig = base_url + '\0' + api_key;
    if (_llmModelsLastFetch[kind] === sig) return;
    _llmModelsLastFetch[kind] = sig;
    api.request_llm_models(JSON.stringify({ kind, base_url, api_key }));
  }

  // === Autosave для секций Settings =====================================
  // Текстовые поля сохраняем на blur (а не на каждый keystroke), чтобы
  // не насиловать БД промежуточным мусором. Slider / checkbox — на change.

  function _readChatFromDom() {
    const baseInp = mainSlot.querySelector('[data-field="chat.base_url"]');
    const keyInp  = mainSlot.querySelector('[data-field="chat.api_key"]');
    const modelInp = mainSlot.querySelector('[data-field="chat.model"]');
    return {
      base_url: baseInp ? baseInp.value.trim() : '',
      api_key:  keyInp  ? keyInp.value         : '',
      model:    modelInp ? modelInp.value.trim() : '',
    };
  }

  function _readEmbedFromDom() {
    const st = appState.system.settings;
    // same_as_chat → копируем creds чата, отдельно сохраняем только модель.
    if (st.embedSameAsChat) {
      const chatCreds = _readChatFromDom();
      const modelInp = mainSlot.querySelector('[data-field="embed.model"]');
      return {
        base_url: chatCreds.base_url,
        api_key:  chatCreds.api_key,
        model:    modelInp ? modelInp.value.trim() : '',
      };
    }
    const baseInp = mainSlot.querySelector('[data-field="embed.base_url"]');
    const keyInp  = mainSlot.querySelector('[data-field="embed.api_key"]');
    const modelInp = mainSlot.querySelector('[data-field="embed.model"]');
    return {
      base_url: baseInp ? baseInp.value.trim() : '',
      api_key:  keyInp  ? keyInp.value         : '',
      model:    modelInp ? modelInp.value.trim() : '',
    };
  }

  function _saveSettings(patch) {
    if (!patch || !Object.keys(patch).length) return;
    // Синхронно отражаем patch в appState, чтобы следующий renderSection
    // (который может прийти от любого триггера) не воскресил старое
    // значение из state.
    const st = appState.system.settings;
    if (patch.chat)  st.chat  = { ...(st.chat  || {}), ...patch.chat };
    if (patch.embed) st.embed = { ...(st.embed || {}), ...patch.embed };
    if (patch.app) {
      if (!st.pipeline) st.pipeline = {};
      for (const [k, v] of Object.entries(patch.app)) {
        // app-значения в state — типизированные числа ИЛИ bool'ы (для
        // toggle-полей вроде send_locked). Bool пропускаем как есть:
        // Number(true) === 1, Number.isFinite(1) === true → без guard'а
        // bool превращался бы в число и `p.send_locked !== false`-чек
        // в рендере перестал бы корректно отличать включённое от выключенного.
        if (typeof v === 'boolean') {
          st.pipeline[k] = v;
        } else {
          const n = Number(v);
          st.pipeline[k] = Number.isFinite(n) ? n : v;
        }
      }
    }
    if (!api) return;
    api.save_settings(JSON.stringify(patch));
  }

  function onDeleteAllDataDone(payload) {
    let p; try { p = JSON.parse(payload); } catch { return; }
    if (!p || !p.ok) {
      if (typeof showToast === 'function') {
        showToast(p && p.error ? p.error : 'Удаление прошло с ошибками — приложение всё равно закроется', { variant: 'danger' });
      }
    }
    // Bridge сразу после emit'а зовёт QApplication.quit() — UI больше
    // ничего отображать не должен.
  }

  function onSettingsSaveDone(payload) {
    let p; try { p = JSON.parse(payload); } catch { return; }
    if (!p || !p.ok) {
      if (typeof showToast === 'function') {
        showToast(p && p.error ? p.error : 'Не удалось сохранить', { variant: 'danger' });
      }
    }
  }

  function onLlmModelsListed(payload) {
    let p; try { p = JSON.parse(payload); } catch { return; }
    if (!p) return;
    const st = appState.system.settings;
    const kind = p.kind;
    if (kind !== 'chat' && kind !== 'embed') return;
    const modelsKey = kind + 'Models';
    if (p.ok && Array.isArray(p.models)) {
      st[modelsKey] = p.models;
    } else {
      // Сбрасываем кеш — иначе следующий blur не пойдёт в сеть, и
      // юзер не увидит обновлённый список после старта LM Studio.
      _llmModelsLastFetch[kind] = '';
    }
    if (appState.section !== 'system' || appState.system.tab !== 'settings') return;
    // Если юзер сейчас редактирует поле в этом блоке, полный renderSection
    // сбросит фокус и каретку. Точечно обновляем только <datalist>.
    const active = document.activeElement;
    const inThisBlock = active
      && active.dataset
      && new RegExp('^' + kind + '\\.').test(active.dataset.field || '');
    if (inThisBlock) {
      const dl = mainSlot.querySelector('#' + kind + '-model-presets');
      if (dl) {
        dl.innerHTML = st[modelsKey]
          .map(m => `<option value="${escapeAttr(m)}"></option>`)
          .join('');
      }
      return;
    }
    renderSection();
  }

  function onLlmProbeDone(payload) {
    let p;
    try { p = JSON.parse(payload); } catch { return; }
    if (!p) return;
    const st = appState.system.settings;
    // Принимаем ответ только если соответствующий probe сейчас busy.
    // Если юзер сбросил state, отредактировав поле, status уже 'idle' —
    // игнорим ответ, чтобы не воскресить плашку.
    // На kind="" (payload-validation error) расцепим тот, что busy.
    let probe = null;
    if (p.kind === 'chat' && st.chatProbe.status === 'busy') {
      probe = st.chatProbe;
    } else if (p.kind === 'embed' && st.embedProbe.status === 'busy') {
      probe = st.embedProbe;
    } else if (!p.kind) {
      if (st.chatProbe.status === 'busy') probe = st.chatProbe;
      else if (st.embedProbe.status === 'busy') probe = st.embedProbe;
    }
    if (!probe) return;
    if (p.ok) {
      probe.status = 'ok';
      probe.model = p.model || '';
      probe.latencyMs = p.latency_ms || 0;
      probe.error = '';
    } else {
      probe.status = 'err';
      probe.error = p.error || 'Не удалось проверить';
    }
    if (appState.section === 'system' && appState.system.tab === 'settings') {
      renderSection();
    }
  }

  function _renderTgLoginModal() {
